<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AOMERA Academy コース詳細">
  <link rel="icon" type="image/svg+xml" href="aomera-logo-mark-navy.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="aomera-logo-mark-white.svg" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="192x192" href="aomera-favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="aomera-apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <title>コース詳細 | AOMERA Academy</title>
  <style>
    :root { --ink:#071226; --muted:#526076; --line:#dfe5ed; --blue:#0068ff; --blue-soft:#eaf3ff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,-apple-system,sans-serif; font-synthesis:none; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    img { display:block; max-width:100%; }
    button { font:inherit; }
    .wrap { width:min(930px,calc(100% - 48px)); margin-inline:auto; }
    .breadcrumb { display:flex; align-items:center; gap:9px; min-height:53px; margin:0; color:#526076; font-size:11px; font-weight:500; }
    .breadcrumb a { transition:color .18s ease; }
    .breadcrumb a:hover { color:var(--blue); }
    .breadcrumb svg { width:9px; height:9px; color:#97a3b3; }
    .course-hero { display:grid; grid-template-columns:380px minmax(0,1fr); gap:42px; align-items:center; }
    .course-cover { height:219px; display:grid; position:relative; overflow:hidden; place-items:center; border-radius:8px; box-shadow:0 3px 9px rgba(7,18,38,.14); }
    .course-cover::after { content:""; position:absolute; inset:0; border:1px solid rgba(7,18,38,.12); border-radius:inherit; pointer-events:none; }
    .course-cover[data-course="aws"] { background:#00142d url("assets/course-bg-aws.svg") center/100% 100% no-repeat; }
    .course-cover[data-course="terraform"] { background:#f0edff url("assets/course-bg-terraform.svg") center/100% 100% no-repeat; }
    .course-cover[data-course="docker"],.course-cover[data-course="kubernetes"] { background:#e7f4ff url("assets/course-bg-ice.svg") center/100% 100% no-repeat; }
    .course-cover[data-course="gpt"] { background:#000; }
    .course-cover img { width:100px; height:100px; position:relative; z-index:1; object-fit:contain; }
    .course-cover[data-course="aws"] img { width:118px; filter:brightness(0) invert(1); transform:translateX(-78px); }
    .course-cover[data-course="terraform"] img { transform:translateX(-47px); }
    .course-cover[data-course="docker"] img { transform:translateX(-18px); }
    .course-cover[data-course="kubernetes"] img { transform:translateX(-14px); }
    .course-cover[data-course="gpt"] img { width:100%; height:100%; object-fit:cover; }
    .course-summary { align-self:center; padding:4px 0; }
    h1 { margin:0 0 12px; font-size:28px; line-height:1.28; letter-spacing:-.5px; }
    .description { max-width:550px; margin:0; color:#263248; font-size:13px; line-height:1.8; }
    .course-facts { display:flex; flex-wrap:wrap; gap:8px 18px; margin:14px 0 0; }
    .course-fact { display:flex; align-items:center; gap:7px; margin:0; font-size:11px; }
    .course-fact dt { color:var(--muted); }
    .course-fact dd { margin:0; font-weight:700; }
    .course-fact:first-child dd { padding:2px 7px; border:1px solid #9fc8ff; border-radius:4px; color:var(--blue); background:#f7fbff; }
    .start-button { min-width:130px; min-height:42px; display:inline-flex; align-items:center; justify-content:center; margin-top:22px; padding:0 22px; border:0; border-radius:5px; color:#fff; background:linear-gradient(135deg,#0878ff,#005ce9); box-shadow:0 7px 16px rgba(0,104,255,.2); font-size:13px; font-weight:700; cursor:pointer; transition:transform .18s ease,box-shadow .18s ease; }
    .start-button:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(0,104,255,.26); }
    .start-button:focus-visible { outline:3px solid rgba(0,104,255,.28); outline-offset:3px; }
    .curriculum { margin-top:29px; padding-bottom:42px; }
    .curriculum h2 { margin:0 0 13px; font-size:17px; line-height:1.5; }
    .lesson-list { overflow:hidden; border:1px solid var(--line); border-radius:5px; }
    .lesson { min-height:42px; display:grid; grid-template-columns:34px 34px 1fr; align-items:center; padding:0 18px 0 13px; border-bottom:1px solid var(--line); background:#fff; font-size:12px; }
    .lesson:last-child { border-bottom:0; }
    .lesson:first-child { background:var(--blue-soft); }
    .lesson-play { width:17px; height:17px; display:grid; place-items:center; border:1.5px solid #536177; border-radius:50%; color:#536177; }
    .lesson-play svg { width:7px; height:7px; margin-left:1px; }
    .lesson:first-child .lesson-play { border-color:var(--blue); color:var(--blue); }
    .lesson-number { color:#36445a; font-variant-numeric:tabular-nums; }
    .lesson-title { font-weight:600; }
    .lesson:first-child .lesson-number,.lesson:first-child .lesson-title { color:#005fe8; font-weight:700; }
    .not-found { margin-top:50px; padding:40px; text-align:center; border:1px solid var(--line); border-radius:8px; background:#f8faff; }
    .not-found h1 { font-size:24px; }
    .not-found p { color:var(--muted); }
    @media (max-width:760px) {
      .wrap { width:min(100% - 30px,930px); }
      .breadcrumb { min-height:46px; }
      .course-hero { grid-template-columns:1fr; gap:24px; }
      .course-cover { height:auto; aspect-ratio:1.73/1; }
      .course-summary { padding:0; }
      h1 { font-size:25px; }
      .curriculum { margin-top:27px; }
      .lesson { grid-template-columns:30px 30px minmax(0,1fr); min-height:45px; padding-inline:10px; }
      .lesson-title { padding-right:8px; }
    }
    @media (max-width:420px) {
      .start-button { width:100%; }
      .lesson { grid-template-columns:27px 26px minmax(0,1fr); }
    }
    @media (prefers-reduced-motion:reduce) { .start-button { transition:none; } }
  </style>
</head>
<body>
  <main class="wrap" id="coursePage">
    <nav class="breadcrumb" aria-label="パンくずリスト">
      <a href="index.html">ホーム</a>
      <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3.5 2 3 3-3 3"/></svg>
      <a href="index.html#courses">Academy</a>
      <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3.5 2 3 3-3 3"/></svg>
      <span id="breadcrumbTitle" aria-current="page"></span>
    </nav>
    <section class="course-hero" aria-labelledby="courseTitle">
      <div class="course-cover" id="courseCover">
        <img id="courseLogo" alt="">
      </div>
      <div class="course-summary">
        <h1 id="courseTitle"></h1>
        <p class="description" id="courseDescription"></p>
        <dl class="course-facts">
          <div class="course-fact"><dt>学習段階</dt><dd id="courseLevel"></dd></div>
          <div class="course-fact"><dt>前提知識</dt><dd id="coursePrerequisites"></dd></div>
        </dl>
        <a class="start-button" id="startButton">学習を始める</a>
      </div>
    </section>
    <section class="curriculum" aria-labelledby="curriculumTitle">
      <h2 id="curriculumTitle">コース内容</h2>
      <div class="lesson-list" id="lessonList"></div>
    </section>
  </main>
  <script src="assets/course-data.js" defer></script>
  <script src="assets/course-detail.js" defer></script>
</body>
</html>
