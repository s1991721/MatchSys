<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Label Tool</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: #fffaf2;
      --border: #d5c6ad;
      --text: #2f261b;
      --muted: #7b6a57;
      --accent: #ba6f2d;
      --accent-strong: #8f4d12;
      --danger: #b8423a;
      --success: #2f7d57;
      --button: #efe1cb;
      --button-active: #2f261b;
      --button-active-text: #fffaf2;
      --shadow: 0 18px 45px rgba(70, 45, 18, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(186, 111, 45, 0.16), transparent 28%),
        linear-gradient(180deg, #f7f2ea 0%, var(--bg) 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      max-width: 1480px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(186, 111, 45, 0.12), rgba(255, 250, 242, 0.9));
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.03em;
    }

    .subtext {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .content {
      padding: 20px 28px 28px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .toolbar-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-wrap: wrap;
      flex: 1 1 auto;
      min-width: 280px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    button.active {
      background: var(--button-active);
      color: var(--button-active-text);
      border-color: var(--button-active);
    }

    .ghost {
      background: transparent;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .record {
      display: grid;
      gap: 14px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 0.9fr) minmax(540px, 1.5fr);
      gap: 16px;
      align-items: start;
    }

    .left-column,
    .right-column {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .field {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.55);
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .value {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: 16px;
    }

    .id-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      background: #fffdf8;
      outline: none;
    }

    .id-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(186, 111, 45, 0.12);
    }

    .value.subject {
      font-weight: 700;
      font-size: 28px;
      line-height: 1.35;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 4px;
    }

    .classify-btn {
      min-width: 132px;
      padding: 14px 20px;
      font-size: 18px;
    }

    .progress {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
      white-space: nowrap;
    }

    .empty {
      padding: 32px 0 10px;
      color: var(--muted);
      font-size: 16px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .body-preview {
      max-height: calc(100vh - 290px);
      min-height: 520px;
      overflow: auto;
      padding-right: 6px;
      font-size: 14px;
      line-height: 1.5;
    }

    .body-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    .subject-compact {
      font-size: 26px;
      line-height: 1.4;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .header,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .button-group button,
      .toolbar-row button {
        width: 100%;
      }

      .toolbar-meta {
        min-width: 0;
        justify-content: flex-start;
      }

      .header-top {
        align-items: stretch;
      }

      .meta-grid {
        grid-template-columns: 1fr;
      }

      .classify-btn {
        min-width: 0;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .body-preview {
        min-height: 0;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="header-top">
        <h1>CSV 标注工具</h1>
        <div class="toolbar-row">
          <button id="pick-file-btn" class="ghost">手动选择 CSV</button>
        </div>
      </div>
      <div class="subtext">
        手动选择 CSV 后展示 <code>id</code>、<code>Subject</code>、<code>Body</code> 三列。
        点击分类按钮后会写入 <code>label</code>，并自动跳到下一条记录。
      </div>
      <div class="toolbar-meta">
        <div id="status" class="status">请选择 CSV 文件。</div>
        <div id="progress" class="progress"></div>
      </div>
    </section>

    <section class="content">
      <div id="record" class="record" hidden>
        <div class="workspace">
          <div class="left-column">
            <div class="meta-grid">
              <div class="field">
                <span class="label">ID</span>
                <input id="id-input" class="id-input" type="number" min="1" step="1">
              </div>
              <div class="field">
                <span class="label">Label</span>
                <div class="button-group">
                  <button class="classify-btn" data-label="0">案件 (A)</button>
                  <button class="classify-btn" data-label="1">技术者 (S)</button>
                  <button class="classify-btn" data-label="-1">其他 (D)</button>
                  <button class="classify-btn" data-wrong="1">错误数据 (W)</button>
                </div>
                <div class="hint">快捷键：A = 案件，S = 技术者，D = 其他，W = 错误数据。</div>
              </div>
            </div>
            <div class="field">
              <span class="label">Subject</span>
              <div id="subject-value" class="value subject subject-compact"></div>
            </div>
          </div>
          <div class="right-column">
            <div class="field">
              <span class="label">Body</span>
              <div id="body-value" class="value body-preview"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="empty" class="empty">暂无可展示内容。</div>
    </section>
  </main>

  <script>
    const state = {
      rows: [],
      headers: [],
      currentIndex: -1,
      fileHandle: null,
      fileName: "data.csv",
      sourceText: ""
    };

    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const recordEl = document.getElementById("record");
    const emptyEl = document.getElementById("empty");
    const idInput = document.getElementById("id-input");
    const subjectEl = document.getElementById("subject-value");
    const bodyEl = document.getElementById("body-value");
    const labelButtons = Array.from(document.querySelectorAll("[data-label]"));
    const wrongButtons = Array.from(document.querySelectorAll("[data-wrong]"));
    const pickFileBtn = document.getElementById("pick-file-btn");

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function detectUnsupportedSpreadsheet(text) {
      return text.startsWith("PK\u0003\u0004");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;
      let i = 0;
      const normalized = text.replace(/^\uFEFF/, "");

      while (i < normalized.length) {
        const char = normalized[i];
        const next = normalized[i + 1];

        if (inQuotes) {
          if (char === "\"") {
            if (next === "\"") {
              value += "\"";
              i += 2;
              continue;
            }
            inQuotes = false;
            i += 1;
            continue;
          }
          value += char;
          i += 1;
          continue;
        }

        if (char === "\"") {
          inQuotes = true;
          i += 1;
          continue;
        }

        if (char === ",") {
          row.push(value);
          value = "";
          i += 1;
          continue;
        }

        if (char === "\r") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          i += next === "\n" ? 2 : 1;
          continue;
        }

        if (char === "\n") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          i += 1;
          continue;
        }

        value += char;
        i += 1;
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;
    }

    function stringifyCsv(table) {
      return "\uFEFF" + table.map((row) => row.map((cell) => {
        const value = String(cell ?? "");
        if (/[",\r\n]/.test(value)) {
          return "\"" + value.replace(/"/g, "\"\"") + "\"";
        }
        return value;
      }).join(",")).join("\r\n");
    }

    function normalizeRows(table) {
      if (!table.length) {
        throw new Error("CSV 为空。");
      }

      const headers = table[0].map((header) => String(header || "").trim());
      const headerSet = new Set(headers);
      const required = ["id", "Subject", "Body", "label"];

      for (const key of required) {
        if (!headerSet.has(key)) {
          throw new Error("CSV 缺少列：" + key);
        }
      }

      if (!headerSet.has("wrong")) {
        headers.push("wrong");
      }

      const rows = table.slice(1).map((values) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] ?? "";
        });
        return item;
      });

      rows.sort((a, b) => Number(a.id) - Number(b.id));
      return { headers, rows };
    }

    function getCurrentRow() {
      return state.rows[state.currentIndex] || null;
    }

    function getStorageKey() {
      return "label-tool-current-id:" + (state.fileName || "data.csv");
    }

    function saveCurrentId() {
      const row = getCurrentRow();
      if (!row) {
        return;
      }
      try {
        localStorage.setItem(getStorageKey(), String(row.id || ""));
      } catch (error) {
        console.error(error);
      }
    }

    function findIndexById(targetId) {
      return state.rows.findIndex((row) => Number(row.id) === Number(targetId));
    }

    function jumpToId(targetId) {
      const index = findIndexById(targetId);
      if (index === -1) {
        setStatus("未找到 id = " + targetId + " 的记录。", "error");
        const row = getCurrentRow();
        idInput.value = row ? row.id || "" : "";
        return false;
      }

      state.currentIndex = index;
      render();
      setStatus("已跳转到 id = " + targetId + "。", "success");
      return true;
    }

    function getNextIndex(fromIndex) {
      if (fromIndex < 0 || fromIndex >= state.rows.length - 1) {
        return -1;
      }
      return fromIndex + 1;
    }

    function render() {
      const row = getCurrentRow();

      if (!row) {
        recordEl.hidden = true;
        emptyEl.hidden = false;
        progressEl.textContent = state.rows.length
          ? "全部记录已处理完。"
          : "";
        labelButtons.forEach((button) => button.classList.remove("active"));
        wrongButtons.forEach((button) => button.classList.remove("active"));
        return;
      }

      recordEl.hidden = false;
      emptyEl.hidden = true;
      idInput.value = row.id || "";
      subjectEl.textContent = row.Subject || "";
      bodyEl.textContent = row.Body || "";
      bodyEl.scrollTop = 0;
      saveCurrentId();

      labelButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.label === String(row.label ?? ""));
      });

      wrongButtons.forEach((button) => {
        button.classList.toggle("active", String(row.wrong ?? "") === String(button.dataset.wrong));
      });

      progressEl.textContent = "第 " + (state.currentIndex + 1) + " / " + state.rows.length + " 条，当前 id = " + row.id;
    }

    function rebuildCsvText() {
      const table = [state.headers];
      for (const row of state.rows) {
        table.push(state.headers.map((header) => row[header] ?? ""));
      }
      return stringifyCsv(table);
    }

    async function writeToHandle(content) {
      if (!state.fileHandle) {
        return false;
      }

      const permission = await state.fileHandle.requestPermission({ mode: "readwrite" });
      if (permission !== "granted") {
        return false;
      }

      const writable = await state.fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      return true;
    }

    function downloadCsv(content) {
      const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = state.fileName || "data.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function saveCsv(showSuccess = true) {
      if (!state.rows.length) {
        setStatus("没有可保存的数据。", "error");
        return;
      }

      const content = rebuildCsvText();
      state.sourceText = content;

      try {
        const written = await writeToHandle(content);
        if (written) {
          if (showSuccess) {
            setStatus("已写回原始 CSV 文件。", "success");
          }
          return;
        }

        downloadCsv(content);
        if (showSuccess) {
          setStatus("当前浏览器无法直接覆盖原文件，已下载更新后的 CSV。", "success");
        }
      } catch (error) {
        console.error(error);
        setStatus("保存失败：" + error.message, "error");
      }
    }

    function locateStartIndex() {
      let storedId = "";
      try {
        storedId = localStorage.getItem(getStorageKey()) || "";
      } catch (error) {
        console.error(error);
      }

      const storedIndex = storedId ? findIndexById(storedId) : -1;
      if (storedIndex >= 0) {
        state.currentIndex = storedIndex;
        return;
      }

      const index = state.rows.findIndex((row) => Number(row.id) === 1);
      state.currentIndex = index >= 0 ? index : (state.rows.length ? 0 : -1);
    }

    async function loadFromText(text, fileHandle = null, fileName = "data.csv") {
      if (detectUnsupportedSpreadsheet(text)) {
        throw new Error("所选文件实际是 Excel 文件，不是 CSV。请改选真正的 CSV 文件，例如 ai/data.csv。");
      }

      const table = parseCsv(text);
      const normalized = normalizeRows(table);
      state.headers = normalized.headers;
      state.rows = normalized.rows;
      state.fileHandle = fileHandle;
      state.fileName = fileName;
      state.sourceText = text;
      locateStartIndex();
      render();
      setStatus("CSV 已加载，共 " + state.rows.length + " 条记录。", "success");
    }

    async function loadDefaultCsv() {
      try {
        const response = await fetch("./data.csv", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("无法读取 ./data.csv");
        }
        const text = await response.text();
        await loadFromText(text, null, "data.csv");
        setStatus("已从同目录读取 data.csv。若需直接覆盖原文件，请点击“手动选择 CSV”。", "success");
      } catch (error) {
        console.error(error);
        setStatus("读取同目录 data.csv 失败。若是直接双击打开 HTML，请改用本地静态服务，或点击“手动选择 CSV”。", "error");
      }
    }

    async function pickCsvFile() {
      try {
        if (!window.showOpenFilePicker) {
          throw new Error("当前浏览器不支持文件选择 API。");
        }

        const [fileHandle] = await window.showOpenFilePicker({
          types: [{
            description: "CSV Files",
            accept: { "text/csv": [".csv"] }
          }],
          multiple: false
        });

        const file = await fileHandle.getFile();
        const text = await file.text();
        await loadFromText(text, fileHandle, file.name);
        setStatus("已加载并绑定文件：" + file.name + "。之后点击标签会直接写回该文件。", "success");
      } catch (error) {
        if (error && error.name === "AbortError") {
          return;
        }
        console.error(error);
        setStatus("选择文件失败：" + error.message, "error");
      }
    }

    async function handleLabelClick(labelValue) {
      const row = getCurrentRow();
      if (!row) {
        return;
      }

      row.label = String(labelValue);
      row.wrong = "";
      render();
      await saveCsv(false);

      const nextIndex = getNextIndex(state.currentIndex);
      state.currentIndex = nextIndex;
      render();

      if (nextIndex === -1) {
        setStatus("当前记录已标注，且已经到最后一条。", "success");
      } else {
        setStatus("已写入 label = " + labelValue + "，并跳转到下一条。", "success");
      }
    }

    async function handleWrongClick() {
      const row = getCurrentRow();
      if (!row) {
        return;
      }

      row.wrong = "1";
      render();
      await saveCsv(false);

      const nextIndex = getNextIndex(state.currentIndex);
      state.currentIndex = nextIndex;
      render();

      if (nextIndex === -1) {
        setStatus("当前记录已标记为错误数据，且已经到最后一条。", "success");
      } else {
        setStatus("已写入 wrong = 1，并跳转到下一条。", "success");
      }
    }

    labelButtons.forEach((button) => {
      button.addEventListener("click", () => {
        handleLabelClick(button.dataset.label);
      });
    });

    wrongButtons.forEach((button) => {
      button.addEventListener("click", () => {
        handleWrongClick();
      });
    });

    idInput.addEventListener("change", () => {
      const value = idInput.value.trim();
      if (!value) {
        const row = getCurrentRow();
        idInput.value = row ? row.id || "" : "";
        return;
      }
      jumpToId(value);
    });

    idInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        const value = idInput.value.trim();
        if (value) {
          jumpToId(value);
        }
      }
    });

    document.addEventListener("keydown", (event) => {
      const target = event.target;
      const tagName = target && target.tagName ? target.tagName.toLowerCase() : "";
      if (tagName === "input" || tagName === "textarea" || target?.isContentEditable) {
        return;
      }

      const key = event.key.toLowerCase();
      if (key === "a") {
        event.preventDefault();
        handleLabelClick("0");
      } else if (key === "s") {
        event.preventDefault();
        handleLabelClick("1");
      } else if (key === "w") {
        event.preventDefault();
        handleWrongClick();
      } else if (key === "d") {
        event.preventDefault();
        handleLabelClick("-1");
      }
    });

    pickFileBtn.addEventListener("click", pickCsvFile);
  </script>
</body>
</html>
