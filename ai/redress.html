<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Redress Tool</title>
  <style>
    :root {
      --bg: #f4f6f2;
      --panel: #fbfdf8;
      --border: #c6d2bd;
      --text: #20291f;
      --muted: #64705d;
      --accent: #3f7f5f;
      --accent-strong: #276045;
      --danger: #b8423a;
      --success: #2f7d57;
      --button: #e4ecdd;
      --button-active: #253627;
      --button-active-text: #fbfdf8;
      --field: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 45px rgba(40, 69, 44, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(63, 127, 95, 0.14), transparent 30%),
        linear-gradient(180deg, #f8faf4 0%, var(--bg) 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      max-width: 1480px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(63, 127, 95, 0.11), rgba(251, 253, 248, 0.92));
    }

    .header-top,
    .toolbar-row,
    .toolbar-meta,
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-top {
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtext {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .toolbar-meta {
      justify-content: flex-end;
      margin-top: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button.primary {
      background: var(--button-active);
      color: var(--button-active-text);
      border-color: var(--button-active);
    }

    button.ghost {
      background: transparent;
    }

    .content {
      padding: 20px 28px 28px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(460px, 0.9fr);
      gap: 16px;
      align-items: start;
    }

    .column {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .field {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--field);
    }

    .field.fill {
      min-height: calc(100vh - 260px);
      display: flex;
      flex-direction: column;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .value {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: 15px;
    }

    .subject {
      font-size: 24px;
      line-height: 1.4;
      font-weight: 700;
    }

    .body-preview {
      max-height: calc(100vh - 390px);
      min-height: 340px;
      overflow: auto;
      padding-right: 6px;
    }

    .body-preview .skill-highlight {
      background: #ffe59e;
      color: #8a4b00;
      padding: 0 4px;
      border-radius: 6px;
      box-shadow: 0 0 0 1px #f3c763 inset;
    }

    .result-input {
      width: 100%;
      min-height: 360px;
      flex: 1 1 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      resize: vertical;
      color: var(--text);
      background: #fffefb;
      font: inherit;
      line-height: 1.7;
      outline: none;
    }

    .result-panel {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 360px;
    }

    .result-panel .result-input {
      min-height: 100%;
    }

    .analysis-loading {
      position: absolute;
      inset: 1px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-radius: 12px;
      background: rgba(251, 253, 248, 0.82);
      color: var(--accent-strong);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
    }

    .analysis-loading[hidden] {
      display: none;
    }

    .analysis-loading::before {
      content: "";
      width: 22px;
      height: 22px;
      margin-bottom: 10px;
      border: 3px solid rgba(63, 127, 95, 0.22);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .analysis-loading-inner {
      display: grid;
      justify-items: center;
      gap: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-input:focus,
    .id-input:focus,
    .filter-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(63, 127, 95, 0.14);
    }

    .id-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr;
      gap: 14px;
    }

    .id-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      background: #fffefb;
      outline: none;
    }

    .filter-select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      background: #fffefb;
      outline: none;
    }

    .id-panel {
      display: grid;
      gap: 14px;
    }

    .status,
    .progress,
    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .hint {
      font-size: 13px;
      margin-top: 10px;
    }

    .empty {
      padding: 32px 0 10px;
      color: var(--muted);
      font-size: 16px;
    }

    @media (max-width: 820px) {
      body {
        padding: 12px;
      }

      .header,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .workspace,
      .id-row {
        grid-template-columns: 1fr;
      }

      .field.fill {
        min-height: 0;
      }

      .body-preview {
        max-height: none;
        min-height: 240px;
      }

      .toolbar-row button,
      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="header-top">
        <h1>CSV AI 结果校正工具</h1>
        <div class="toolbar-row">
          <button id="pick-file-btn" class="ghost">手动选择 CSV</button>
        </div>
      </div>
      <div class="subtext">
        读取 CSV 后展示 <code>id</code>、<code>Subject</code>、<code>Body</code>，可按 <code>label</code> 过滤，并把可编辑结果写回 <code>ai_result</code> 列。
        当 <code>ai_result</code> 为空时，会根据 <code>label</code> 自动分析正文：<code>0</code> 调案件分析，<code>1</code> 调技术者分析。
      </div>
      <div class="toolbar-meta">
        <div id="status" class="status">请选择 CSV 文件。</div>
        <div id="progress" class="progress"></div>
      </div>
    </section>

    <section class="content">
      <div id="record" hidden>
        <div class="workspace">
          <div class="column">
            <div class="id-row">
              <div class="field id-panel">
                <div>
                  <span class="label">ID</span>
                  <input id="id-input" class="id-input" type="number" min="1" step="1">
                </div>
                <div>
                  <span class="label">Label</span>
                  <select id="label-filter" class="filter-select">
                    <option value="all">全部</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                  </select>
                </div>
              </div>
              <div class="field">
                <span class="label">Subject</span>
                <div id="subject-value" class="value subject"></div>
              </div>
            </div>
            <div class="field">
              <span class="label">Body</span>
              <div id="body-value" class="value body-preview"></div>
            </div>
          </div>

          <div class="column">
            <div class="field fill">
              <span class="label">AI Result</span>
              <div class="result-panel">
                <textarea id="ai-result-input" class="result-input" spellcheck="false"></textarea>
                <div id="analysis-loading" class="analysis-loading" hidden>
                  <div class="analysis-loading-inner">
                    <span id="analysis-loading-text">AI 分析中，请稍候...</span>
                  </div>
                </div>
              </div>
              <div class="hint">切换到结果为空的记录时会自动分析正文；已有结果和人工编辑内容不会被覆盖。</div>
            </div>
            <div class="actions">
              <button id="prev-btn" class="ghost">上一条</button>
              <button id="save-btn">保存当前</button>
              <button id="save-next-btn" class="primary">保存并下一条</button>
              <button id="next-btn" class="ghost">下一条</button>
            </div>
          </div>
        </div>
      </div>
      <div id="empty" class="empty">暂无可展示内容。</div>
    </section>
  </main>

  <script>
    const state = {
      allRows: [],
      rows: [],
      headers: [],
      currentIndex: -1,
      labelFilter: "all",
      fileHandle: null,
      fileName: "data.csv",
      sourceText: "",
      analysisSeq: 0,
      loginPromise: null
    };

    const API_BASE = "";
    const LOGIN_ENDPOINT = API_BASE + "/api/login";
    const ANALYZE_ENDPOINT = API_BASE + "/api/redress/analyze";
    const MOCK_LOGIN_USER = "admin";
    const MOCK_LOGIN_PASSWORD = "admin";

    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const recordEl = document.getElementById("record");
    const emptyEl = document.getElementById("empty");
    const idInput = document.getElementById("id-input");
    const labelFilterEl = document.getElementById("label-filter");
    const subjectEl = document.getElementById("subject-value");
    const bodyEl = document.getElementById("body-value");
    const aiResultInput = document.getElementById("ai-result-input");
    const analysisLoadingEl = document.getElementById("analysis-loading");
    const analysisLoadingTextEl = document.getElementById("analysis-loading-text");
    const pickFileBtn = document.getElementById("pick-file-btn");
    const prevBtn = document.getElementById("prev-btn");
    const saveBtn = document.getElementById("save-btn");
    const saveNextBtn = document.getElementById("save-next-btn");
    const nextBtn = document.getElementById("next-btn");

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function sanitize(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeRegExp(str = "") {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function setAnalysisLoading(isLoading, message = "AI 分析中，请稍候...") {
      if (!analysisLoadingEl) {
        return;
      }
      if (analysisLoadingTextEl) {
        analysisLoadingTextEl.textContent = message;
      }
      analysisLoadingEl.hidden = !isLoading;
    }

    function detectUnsupportedSpreadsheet(text) {
      return text.startsWith("PK\u0003\u0004");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;
      let i = 0;
      const normalized = text.replace(/^\uFEFF/, "");

      while (i < normalized.length) {
        const char = normalized[i];
        const next = normalized[i + 1];

        if (inQuotes) {
          if (char === "\"") {
            if (next === "\"") {
              value += "\"";
              i += 2;
              continue;
            }
            inQuotes = false;
            i += 1;
            continue;
          }
          value += char;
          i += 1;
          continue;
        }

        if (char === "\"") {
          inQuotes = true;
          i += 1;
          continue;
        }

        if (char === ",") {
          row.push(value);
          value = "";
          i += 1;
          continue;
        }

        if (char === "\r") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          i += next === "\n" ? 2 : 1;
          continue;
        }

        if (char === "\n") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          i += 1;
          continue;
        }

        value += char;
        i += 1;
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;
    }

    function stringifyCsv(table) {
      return "\uFEFF" + table.map((row) => row.map((cell) => {
        const value = String(cell ?? "");
        if (/[",\r\n]/.test(value)) {
          return "\"" + value.replace(/"/g, "\"\"") + "\"";
        }
        return value;
      }).join(",")).join("\r\n");
    }

    function normalizeRows(table) {
      if (!table.length) {
        throw new Error("CSV 为空。");
      }

      const headers = table[0].map((header) => String(header || "").trim());
      const headerSet = new Set(headers);
      const required = ["id", "Subject", "Body"];

      for (const key of required) {
        if (!headerSet.has(key)) {
          throw new Error("CSV 缺少列：" + key);
        }
      }

      if (!headerSet.has("ai_result")) {
        headers.push("ai_result");
      }

      const rows = table.slice(1).map((values) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] ?? "";
        });
        return item;
      });

      rows.sort((a, b) => Number(a.id) - Number(b.id));
      return { headers, rows };
    }

    function getCurrentRow() {
      return state.rows[state.currentIndex] || null;
    }

    function applyLabelFilter() {
      if (state.labelFilter === "all") {
        state.rows = state.allRows;
        return;
      }

      state.rows = state.allRows.filter((row) => (
        String(row.label || "").trim() === state.labelFilter
      ));
    }

    function getAiResultStats(rows = state.rows) {
      return {
        total: rows.length,
        completed: rows.filter((row) => String(row.ai_result || "").trim()).length
      };
    }

    function getFilterLabelText() {
      return state.labelFilter === "all" ? "全部" : state.labelFilter;
    }

    function updateProgressText() {
      const row = getCurrentRow();
      const stats = getAiResultStats();

      if (!row) {
        progressEl.textContent = state.allRows.length
          ? "当前 Label = " + getFilterLabelText() + "，已存在 AI Result：" + stats.completed + " / " + stats.total
          : "";
        return;
      }

      progressEl.textContent = "第 " + (state.currentIndex + 1) + " / " + state.rows.length
        + " 条，当前 id = " + row.id
        + "，Label = " + getFilterLabelText()
        + "，已存在 AI Result：" + stats.completed + " / " + stats.total;
    }

    function updateEmptyText() {
      emptyEl.textContent = state.allRows.length
        ? "当前 Label 条件下暂无可展示内容。"
        : "暂无可展示内容。";
    }

    function getStorageKey() {
      return "redress-tool-current-id:" + (state.fileName || "data.csv");
    }

    function saveCurrentId() {
      const row = getCurrentRow();
      if (!row) {
        return;
      }
      try {
        localStorage.setItem(getStorageKey(), String(row.id || ""));
      } catch (error) {
        console.error(error);
      }
    }

    function findIndexById(targetId) {
      return state.rows.findIndex((row) => Number(row.id) === Number(targetId));
    }

    function updateNavButtons() {
      prevBtn.disabled = state.currentIndex <= 0;
      nextBtn.disabled = state.currentIndex < 0 || state.currentIndex >= state.rows.length - 1;
      saveBtn.disabled = state.currentIndex < 0;
      saveNextBtn.disabled = state.currentIndex < 0;
    }

    function getAnalysisType(label) {
      if (String(label) === "0") {
        return "案件";
      }
      if (String(label) === "1") {
        return "技术者";
      }
      return "";
    }

    function normalizeSkillList(skills) {
      return Array.from(new Set(
        (Array.isArray(skills) ? skills : [])
          .map((skill) => String(skill || "").trim())
          .filter(Boolean)
      ));
    }

    function extractSkillsFromPartialJson(text) {
      const skillsMatch = String(text || "").match(/"skills"\s*:\s*\[([\s\S]*?)(?:\]|$)/);
      if (!skillsMatch) {
        return [];
      }

      const skills = [];
      const skillText = skillsMatch[1] || "";
      const stringRegex = /"((?:\\.|[^"\\])*)"/g;
      let match = stringRegex.exec(skillText);
      while (match) {
        try {
          skills.push(JSON.parse("\"" + match[1] + "\""));
        } catch (error) {
          skills.push(match[1]);
        }
        match = stringRegex.exec(skillText);
      }
      return normalizeSkillList(skills);
    }

    function extractSkillsFromAiResult(value) {
      const text = String(value || "").trim();
      if (!text) {
        return [];
      }

      try {
        const parsed = JSON.parse(text);
        const skills = Array.isArray(parsed && parsed.skills) ? parsed.skills : [];
        return normalizeSkillList(skills);
      } catch (error) {
        return extractSkillsFromPartialJson(text);
      }
    }

    function renderBody(text = "", skills = []) {
      const escapedSkills = (Array.isArray(skills) ? skills : [])
        .filter(Boolean)
        .sort((a, b) => String(b).length - String(a).length)
        .map((skill) => escapeRegExp(sanitize(skill)));
      const highlightRegex = escapedSkills.length
        ? new RegExp("(" + escapedSkills.join("|") + ")", "gi")
        : null;
      const safeBody = sanitize(text || "").replace(/\r\n/g, "\n");
      const highlightedBody = highlightRegex
        ? safeBody.replace(highlightRegex, '<mark class="skill-highlight">$1</mark>')
        : safeBody;
      bodyEl.innerHTML = highlightedBody.replace(/\n/g, "<br>");
    }

    function renderBodyForCurrentRow() {
      const row = getCurrentRow();
      if (!row) {
        bodyEl.textContent = "";
        return;
      }
      renderBody(row.Body || "", extractSkillsFromAiResult(row.ai_result || ""));
    }

    function formatJsonForDisplay(value) {
      const text = String(value || "").trim();
      if (!text) {
        return "";
      }

      try {
        return JSON.stringify(JSON.parse(text), null, 2);
      } catch (error) {
        return value;
      }
    }

    async function ensureBackendLogin() {
      if (state.loginPromise) {
        return state.loginPromise;
      }

      state.loginPromise = (async () => {
        const response = await fetch(LOGIN_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            user_name: MOCK_LOGIN_USER,
            password: MOCK_LOGIN_PASSWORD
          })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || "模拟登录失败。");
        }
        return payload.data || {};
      })();

      try {
        return await state.loginPromise;
      } catch (error) {
        state.loginPromise = null;
        throw error;
      }
    }

    async function requestAnalysis(payload, retryOnUnauthorized = true) {
      await ensureBackendLogin();
      const response = await fetch(ANALYZE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401 && retryOnUnauthorized) {
        state.loginPromise = null;
        return requestAnalysis(payload, false);
      }
      return { response, data };
    }

    async function analyzeRowIfNeeded(row) {
      if (!row || String(row.ai_result || "").trim() || row._analysisRequested || row._analysisSkipped) {
        return;
      }

      const label = String(row.label || "").trim();
      const analysisType = getAnalysisType(label);
      if (!analysisType) {
        row._analysisSkipped = true;
        setStatus("当前 label 不需要 AI 分析。", "success");
        return;
      }

      const body = String(row.Body || "").trim();
      if (!body) {
        row._analysisSkipped = true;
        setStatus("当前记录 Body 为空，无法分析。", "error");
        return;
      }

      row._analysisRequested = true;
      row._analysisPending = true;
      const seq = ++state.analysisSeq;
      const targetId = String(row.id || "");
      setStatus("正在分析当前正文（" + analysisType + "）...", "");
      setAnalysisLoading(true, "AI 正在分析当前正文（" + analysisType + "），请稍候...");

      try {
        const { response, data: payload } = await requestAnalysis({
          id: targetId,
          label,
          body
        });
        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || "AI 分析请求失败。");
        }

        const data = payload.data || {};
        if (data.skipped) {
          row._analysisSkipped = true;
          row._analysisPending = false;
          setAnalysisLoading(false);
          setStatus("当前 label 不需要 AI 分析。", "success");
          return;
        }

        const result = String(data.ai_result || "").trim();
        if (!result) {
          row._analysisPending = false;
          setAnalysisLoading(false);
          setStatus("AI 未返回可用结果。", "error");
          return;
        }

        const currentRow = getCurrentRow();
        if (seq !== state.analysisSeq || currentRow !== row || String(currentRow.id || "") !== targetId) {
          row._analysisPending = false;
          return;
        }
        row._analysisPending = false;
        setAnalysisLoading(false);
        if (row._manualEdited || String(row.ai_result || "").trim()) {
          return;
        }

        row.ai_result = formatJsonForDisplay(result);
        aiResultInput.value = row.ai_result;
        renderBodyForCurrentRow();
        updateProgressText();
        setStatus("AI 分析完成，可人工校正后保存。", "success");
      } catch (error) {
        console.error(error);
        row._analysisRequested = false;
        row._analysisPending = false;
        setAnalysisLoading(false);
        setStatus("AI 分析失败：" + error.message, "error");
      }
    }

    function render() {
      const row = getCurrentRow();
      labelFilterEl.value = state.labelFilter;

      if (!row) {
        setAnalysisLoading(false);
        recordEl.hidden = true;
        emptyEl.hidden = false;
        updateEmptyText();
        updateProgressText();
        updateNavButtons();
        return;
      }

      recordEl.hidden = false;
      emptyEl.hidden = true;
      idInput.value = row.id || "";
      subjectEl.textContent = row.Subject || "";
      row.ai_result = formatJsonForDisplay(row.ai_result || "");
      aiResultInput.value = row.ai_result;
      renderBodyForCurrentRow();
      bodyEl.scrollTop = 0;
      setAnalysisLoading(Boolean(row._analysisPending));
      saveCurrentId();
      updateNavButtons();

      updateProgressText();
      analyzeRowIfNeeded(row);
    }

    function persistEditorToRow() {
      const row = getCurrentRow();
      if (!row) {
        return false;
      }
      row.ai_result = aiResultInput.value;
      return true;
    }

    function rebuildCsvText() {
      const table = [state.headers];
      for (const row of state.allRows) {
        table.push(state.headers.map((header) => row[header] ?? ""));
      }
      return stringifyCsv(table);
    }

    async function writeToHandle(content) {
      if (!state.fileHandle) {
        return false;
      }

      const permission = await state.fileHandle.requestPermission({ mode: "readwrite" });
      if (permission !== "granted") {
        return false;
      }

      const writable = await state.fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      return true;
    }

    function downloadCsv(content) {
      const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = state.fileName || "data.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function saveCsv(showSuccess = true) {
      if (!state.allRows.length) {
        setStatus("没有可保存的数据。", "error");
        return false;
      }

      persistEditorToRow();
      const content = rebuildCsvText();
      state.sourceText = content;

      try {
        const written = await writeToHandle(content);
        if (written) {
          if (showSuccess) {
            setStatus("已写回原始 CSV 文件。", "success");
          }
          return true;
        }

        downloadCsv(content);
        if (showSuccess) {
          setStatus("当前浏览器无法直接覆盖原文件，已下载更新后的 CSV。", "success");
        }
        return true;
      } catch (error) {
        console.error(error);
        setStatus("保存失败：" + error.message, "error");
        return false;
      }
    }

    function locateStartIndex() {
      let storedId = "";
      try {
        storedId = localStorage.getItem(getStorageKey()) || "";
      } catch (error) {
        console.error(error);
      }

      const storedIndex = storedId ? findIndexById(storedId) : -1;
      if (storedIndex >= 0) {
        state.currentIndex = storedIndex;
        return;
      }

      const index = state.rows.findIndex((row) => Number(row.id) === 1);
      state.currentIndex = index >= 0 ? index : (state.rows.length ? 0 : -1);
    }

    function changeLabelFilter(nextFilter) {
      const currentRow = getCurrentRow();
      const currentId = currentRow ? currentRow.id : "";
      persistEditorToRow();
      state.labelFilter = nextFilter;
      applyLabelFilter();

      const currentIndex = currentId ? findIndexById(currentId) : -1;
      if (currentIndex >= 0) {
        state.currentIndex = currentIndex;
      } else {
        locateStartIndex();
      }

      render();
      setStatus("已切换 Label 过滤条件：" + getFilterLabelText() + "。", "success");
    }

    function jumpToIndex(index) {
      if (index < 0 || index >= state.rows.length) {
        return false;
      }
      persistEditorToRow();
      state.currentIndex = index;
      render();
      return true;
    }

    function jumpToId(targetId) {
      const index = findIndexById(targetId);
      if (index === -1) {
        setStatus("未找到 id = " + targetId + " 的记录。", "error");
        const row = getCurrentRow();
        idInput.value = row ? row.id || "" : "";
        return false;
      }

      jumpToIndex(index);
      setStatus("已跳转到 id = " + targetId + "。", "success");
      return true;
    }

    async function saveAndMove(nextIndex) {
      const saved = await saveCsv(false);
      if (!saved) {
        return;
      }

      if (nextIndex < 0 || nextIndex >= state.rows.length) {
        setStatus("当前记录已保存，已经到边界。", "success");
        render();
        return;
      }

      state.currentIndex = nextIndex;
      render();
      setStatus("已保存并切换记录。", "success");
    }

    async function loadFromText(text, fileHandle = null, fileName = "data.csv") {
      if (detectUnsupportedSpreadsheet(text)) {
        throw new Error("所选文件实际是 Excel 文件，不是 CSV。请改选真正的 CSV 文件。");
      }

      const table = parseCsv(text);
      const normalized = normalizeRows(table);
      state.headers = normalized.headers;
      state.allRows = normalized.rows;
      applyLabelFilter();
      state.fileHandle = fileHandle;
      state.fileName = fileName;
      state.sourceText = text;
      locateStartIndex();
      render();
      setStatus("CSV 已加载，共 " + state.allRows.length + " 条记录。", "success");
    }

    async function pickCsvFile() {
      try {
        if (!window.showOpenFilePicker) {
          throw new Error("当前浏览器不支持文件选择 API。请使用支持该 API 的 Chromium 浏览器。");
        }

        const [fileHandle] = await window.showOpenFilePicker({
          types: [{
            description: "CSV Files",
            accept: { "text/csv": [".csv"] }
          }],
          multiple: false
        });

        const file = await fileHandle.getFile();
        const text = await file.text();
        await loadFromText(text, fileHandle, file.name);
        setStatus("已加载并绑定文件：" + file.name + "。保存时会尝试直接写回该文件。", "success");
      } catch (error) {
        if (error && error.name === "AbortError") {
          return;
        }
        console.error(error);
        setStatus("选择文件失败：" + error.message, "error");
      }
    }

    pickFileBtn.addEventListener("click", pickCsvFile);

    labelFilterEl.addEventListener("change", () => {
      changeLabelFilter(labelFilterEl.value);
    });

    saveBtn.addEventListener("click", async () => {
      await saveCsv(true);
      render();
    });

    saveNextBtn.addEventListener("click", async () => {
      await saveAndMove(state.currentIndex + 1);
    });

    aiResultInput.addEventListener("input", () => {
      const row = getCurrentRow();
      if (!row) {
        return;
      }
      row.ai_result = aiResultInput.value;
      row._manualEdited = true;
      renderBodyForCurrentRow();
      updateProgressText();
    });

    prevBtn.addEventListener("click", () => {
      if (jumpToIndex(state.currentIndex - 1)) {
        setStatus("已切换到上一条，当前编辑内容已暂存在页面状态。", "success");
      }
    });

    nextBtn.addEventListener("click", () => {
      if (jumpToIndex(state.currentIndex + 1)) {
        setStatus("已切换到下一条，当前编辑内容已暂存在页面状态。", "success");
      }
    });

    idInput.addEventListener("change", () => {
      const value = idInput.value.trim();
      if (!value) {
        const row = getCurrentRow();
        idInput.value = row ? row.id || "" : "";
        return;
      }
      jumpToId(value);
    });

    idInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        const value = idInput.value.trim();
        if (value) {
          jumpToId(value);
        }
      }
    });

    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        saveBtn.click();
        return;
      }

      const target = event.target;
      const tagName = target && target.tagName ? target.tagName.toLowerCase() : "";
      if (tagName === "input" || tagName === "textarea" || target?.isContentEditable) {
        return;
      }

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        prevBtn.click();
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        nextBtn.click();
      }
    });
  </script>
</body>
</html>
