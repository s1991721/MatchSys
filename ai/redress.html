<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Reclamation Tool</title>
  <style>
    :root {
      --bg: #f4f6f2;
      --panel: #fbfdf8;
      --border: #c6d2bd;
      --text: #20291f;
      --muted: #64705d;
      --accent: #3f7f5f;
      --accent-strong: #276045;
      --danger: #b8423a;
      --success: #2f7d57;
      --button: #e4ecdd;
      --button-active: #253627;
      --button-active-text: #fbfdf8;
      --field: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 45px rgba(40, 69, 44, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(63, 127, 95, 0.14), transparent 30%),
        linear-gradient(180deg, #f8faf4 0%, var(--bg) 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      max-width: 1480px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(63, 127, 95, 0.11), rgba(251, 253, 248, 0.92));
    }

    .header-top,
    .toolbar-row,
    .toolbar-meta,
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-top {
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtext {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .toolbar-meta {
      justify-content: flex-end;
      margin-top: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button.primary {
      background: var(--button-active);
      color: var(--button-active-text);
      border-color: var(--button-active);
    }

    button.ghost {
      background: transparent;
    }

    .content {
      padding: 20px 28px 28px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(460px, 0.9fr);
      gap: 16px;
      align-items: start;
    }

    .column {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .field {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--field);
    }

    .field.fill {
      min-height: calc(100vh - 260px);
      display: flex;
      flex-direction: column;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .value {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: 15px;
    }

    .subject {
      font-size: 24px;
      line-height: 1.4;
      font-weight: 700;
    }

    .body-preview {
      max-height: calc(100vh - 390px);
      min-height: 340px;
      overflow: auto;
      padding-right: 6px;
    }

    .result-input {
      width: 100%;
      min-height: 360px;
      flex: 1 1 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      resize: vertical;
      color: var(--text);
      background: #fffefb;
      font: inherit;
      line-height: 1.7;
      outline: none;
    }

    .result-input:focus,
    .id-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(63, 127, 95, 0.14);
    }

    .id-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr;
      gap: 14px;
    }

    .id-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      background: #fffefb;
      outline: none;
    }

    .id-panel {
      display: grid;
      gap: 14px;
    }

    .label-value {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      background: #fffefb;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .label-value.empty-value {
      color: var(--muted);
      font-weight: 600;
    }

    .status,
    .progress,
    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .hint {
      font-size: 13px;
      margin-top: 10px;
    }

    .empty {
      padding: 32px 0 10px;
      color: var(--muted);
      font-size: 16px;
    }

    @media (max-width: 820px) {
      body {
        padding: 12px;
      }

      .header,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .workspace,
      .id-row {
        grid-template-columns: 1fr;
      }

      .field.fill {
        min-height: 0;
      }

      .body-preview {
        max-height: none;
        min-height: 240px;
      }

      .toolbar-row button,
      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="header-top">
        <h1>CSV AI 结果校正工具</h1>
        <div class="toolbar-row">
          <button id="pick-file-btn" class="ghost">手动选择 CSV</button>
        </div>
      </div>
      <div class="subtext">
        读取 CSV 后展示 <code>id</code>、<code>Subject</code>、<code>Body</code>，并把可编辑结果写回 <code>ai_result</code> 列。
        当前版本不调用 AI 接口，空结果会自动填入临时占位分析。
      </div>
      <div class="toolbar-meta">
        <div id="status" class="status">请选择 CSV 文件。</div>
        <div id="progress" class="progress"></div>
      </div>
    </section>

    <section class="content">
      <div id="record" hidden>
        <div class="workspace">
          <div class="column">
            <div class="id-row">
              <div class="field id-panel">
                <div>
                  <span class="label">ID</span>
                  <input id="id-input" class="id-input" type="number" min="1" step="1">
                </div>
                <div>
                  <span class="label">Label</span>
                  <div id="label-value" class="label-value empty-value"></div>
                </div>
              </div>
              <div class="field">
                <span class="label">Subject</span>
                <div id="subject-value" class="value subject"></div>
              </div>
            </div>
            <div class="field">
              <span class="label">Body</span>
              <div id="body-value" class="value body-preview"></div>
            </div>
          </div>

          <div class="column">
            <div class="field fill">
              <span class="label">AI Result</span>
              <textarea id="ai-result-input" class="result-input" spellcheck="false"></textarea>
              <div class="hint">切换到结果为空的记录时会自动填入占位分析；已有结果不会被覆盖。</div>
            </div>
            <div class="actions">
              <button id="prev-btn" class="ghost">上一条</button>
              <button id="save-btn">保存当前</button>
              <button id="save-next-btn" class="primary">保存并下一条</button>
              <button id="next-btn" class="ghost">下一条</button>
            </div>
          </div>
        </div>
      </div>
      <div id="empty" class="empty">暂无可展示内容。</div>
    </section>
  </main>

  <script>
    const state = {
      rows: [],
      headers: [],
      currentIndex: -1,
      fileHandle: null,
      fileName: "data.csv",
      sourceText: ""
    };

    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const recordEl = document.getElementById("record");
    const emptyEl = document.getElementById("empty");
    const idInput = document.getElementById("id-input");
    const labelValueEl = document.getElementById("label-value");
    const subjectEl = document.getElementById("subject-value");
    const bodyEl = document.getElementById("body-value");
    const aiResultInput = document.getElementById("ai-result-input");
    const pickFileBtn = document.getElementById("pick-file-btn");
    const prevBtn = document.getElementById("prev-btn");
    const saveBtn = document.getElementById("save-btn");
    const saveNextBtn = document.getElementById("save-next-btn");
    const nextBtn = document.getElementById("next-btn");

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function detectUnsupportedSpreadsheet(text) {
      return text.startsWith("PK\u0003\u0004");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;
      let i = 0;
      const normalized = text.replace(/^\uFEFF/, "");

      while (i < normalized.length) {
        const char = normalized[i];
        const next = normalized[i + 1];

        if (inQuotes) {
          if (char === "\"") {
            if (next === "\"") {
              value += "\"";
              i += 2;
              continue;
            }
            inQuotes = false;
            i += 1;
            continue;
          }
          value += char;
          i += 1;
          continue;
        }

        if (char === "\"") {
          inQuotes = true;
          i += 1;
          continue;
        }

        if (char === ",") {
          row.push(value);
          value = "";
          i += 1;
          continue;
        }

        if (char === "\r") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          i += next === "\n" ? 2 : 1;
          continue;
        }

        if (char === "\n") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          i += 1;
          continue;
        }

        value += char;
        i += 1;
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;
    }

    function stringifyCsv(table) {
      return "\uFEFF" + table.map((row) => row.map((cell) => {
        const value = String(cell ?? "");
        if (/[",\r\n]/.test(value)) {
          return "\"" + value.replace(/"/g, "\"\"") + "\"";
        }
        return value;
      }).join(",")).join("\r\n");
    }

    function normalizeRows(table) {
      if (!table.length) {
        throw new Error("CSV 为空。");
      }

      const headers = table[0].map((header) => String(header || "").trim());
      const headerSet = new Set(headers);
      const required = ["id", "Subject", "Body"];

      for (const key of required) {
        if (!headerSet.has(key)) {
          throw new Error("CSV 缺少列：" + key);
        }
      }

      if (!headerSet.has("ai_result")) {
        headers.push("ai_result");
      }

      const rows = table.slice(1).map((values) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] ?? "";
        });
        return item;
      });

      rows.sort((a, b) => Number(a.id) - Number(b.id));
      return { headers, rows };
    }

    function getCurrentRow() {
      return state.rows[state.currentIndex] || null;
    }

    function getStorageKey() {
      return "reclamation-tool-current-id:" + (state.fileName || "data.csv");
    }

    function saveCurrentId() {
      const row = getCurrentRow();
      if (!row) {
        return;
      }
      try {
        localStorage.setItem(getStorageKey(), String(row.id || ""));
      } catch (error) {
        console.error(error);
      }
    }

    function findIndexById(targetId) {
      return state.rows.findIndex((row) => Number(row.id) === Number(targetId));
    }

    function buildMockAnalysis(row) {
      const subject = String(row.Subject || "").trim();
      const body = String(row.Body || "").trim();
      const bodyPreview = body.length > 420 ? body.slice(0, 420) + "..." : body;
      return [
        "【临时AI分析结果】",
        "id: " + (row.id || ""),
        "subject: " + subject,
        "",
        "summary:",
        bodyPreview || "暂无正文内容。",
        "",
        "note: 当前版本未接入AI接口，请在此处人工校正后保存。"
      ].join("\n");
    }

    function ensureAiResult(row) {
      if (!String(row.ai_result || "").trim()) {
        row.ai_result = buildMockAnalysis(row);
      }
    }

    function updateNavButtons() {
      prevBtn.disabled = state.currentIndex <= 0;
      nextBtn.disabled = state.currentIndex < 0 || state.currentIndex >= state.rows.length - 1;
      saveBtn.disabled = state.currentIndex < 0;
      saveNextBtn.disabled = state.currentIndex < 0;
    }

    function render() {
      const row = getCurrentRow();

      if (!row) {
        recordEl.hidden = true;
        emptyEl.hidden = false;
        progressEl.textContent = state.rows.length ? "全部记录已处理完。" : "";
        updateNavButtons();
        return;
      }

      ensureAiResult(row);
      recordEl.hidden = false;
      emptyEl.hidden = true;
      idInput.value = row.id || "";
      labelValueEl.textContent = row.label || "-";
      labelValueEl.classList.toggle("empty-value", !String(row.label || "").trim());
      subjectEl.textContent = row.Subject || "";
      bodyEl.textContent = row.Body || "";
      bodyEl.scrollTop = 0;
      aiResultInput.value = row.ai_result || "";
      saveCurrentId();
      updateNavButtons();

      progressEl.textContent = "第 " + (state.currentIndex + 1) + " / " + state.rows.length + " 条，当前 id = " + row.id;
    }

    function persistEditorToRow() {
      const row = getCurrentRow();
      if (!row) {
        return false;
      }
      row.ai_result = aiResultInput.value;
      return true;
    }

    function rebuildCsvText() {
      const table = [state.headers];
      for (const row of state.rows) {
        table.push(state.headers.map((header) => row[header] ?? ""));
      }
      return stringifyCsv(table);
    }

    async function writeToHandle(content) {
      if (!state.fileHandle) {
        return false;
      }

      const permission = await state.fileHandle.requestPermission({ mode: "readwrite" });
      if (permission !== "granted") {
        return false;
      }

      const writable = await state.fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      return true;
    }

    function downloadCsv(content) {
      const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = state.fileName || "data.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function saveCsv(showSuccess = true) {
      if (!state.rows.length) {
        setStatus("没有可保存的数据。", "error");
        return false;
      }

      persistEditorToRow();
      const content = rebuildCsvText();
      state.sourceText = content;

      try {
        const written = await writeToHandle(content);
        if (written) {
          if (showSuccess) {
            setStatus("已写回原始 CSV 文件。", "success");
          }
          return true;
        }

        downloadCsv(content);
        if (showSuccess) {
          setStatus("当前浏览器无法直接覆盖原文件，已下载更新后的 CSV。", "success");
        }
        return true;
      } catch (error) {
        console.error(error);
        setStatus("保存失败：" + error.message, "error");
        return false;
      }
    }

    function locateStartIndex() {
      let storedId = "";
      try {
        storedId = localStorage.getItem(getStorageKey()) || "";
      } catch (error) {
        console.error(error);
      }

      const storedIndex = storedId ? findIndexById(storedId) : -1;
      if (storedIndex >= 0) {
        state.currentIndex = storedIndex;
        return;
      }

      const index = state.rows.findIndex((row) => Number(row.id) === 1);
      state.currentIndex = index >= 0 ? index : (state.rows.length ? 0 : -1);
    }

    function jumpToIndex(index) {
      if (index < 0 || index >= state.rows.length) {
        return false;
      }
      persistEditorToRow();
      state.currentIndex = index;
      render();
      return true;
    }

    function jumpToId(targetId) {
      const index = findIndexById(targetId);
      if (index === -1) {
        setStatus("未找到 id = " + targetId + " 的记录。", "error");
        const row = getCurrentRow();
        idInput.value = row ? row.id || "" : "";
        return false;
      }

      jumpToIndex(index);
      setStatus("已跳转到 id = " + targetId + "。", "success");
      return true;
    }

    async function saveAndMove(nextIndex) {
      const saved = await saveCsv(false);
      if (!saved) {
        return;
      }

      if (nextIndex < 0 || nextIndex >= state.rows.length) {
        setStatus("当前记录已保存，已经到边界。", "success");
        render();
        return;
      }

      state.currentIndex = nextIndex;
      render();
      setStatus("已保存并切换记录。", "success");
    }

    async function loadFromText(text, fileHandle = null, fileName = "data.csv") {
      if (detectUnsupportedSpreadsheet(text)) {
        throw new Error("所选文件实际是 Excel 文件，不是 CSV。请改选真正的 CSV 文件。");
      }

      const table = parseCsv(text);
      const normalized = normalizeRows(table);
      state.headers = normalized.headers;
      state.rows = normalized.rows;
      state.fileHandle = fileHandle;
      state.fileName = fileName;
      state.sourceText = text;
      locateStartIndex();
      render();
      setStatus("CSV 已加载，共 " + state.rows.length + " 条记录。", "success");
    }

    async function pickCsvFile() {
      try {
        if (!window.showOpenFilePicker) {
          throw new Error("当前浏览器不支持文件选择 API。请使用支持该 API 的 Chromium 浏览器。");
        }

        const [fileHandle] = await window.showOpenFilePicker({
          types: [{
            description: "CSV Files",
            accept: { "text/csv": [".csv"] }
          }],
          multiple: false
        });

        const file = await fileHandle.getFile();
        const text = await file.text();
        await loadFromText(text, fileHandle, file.name);
        setStatus("已加载并绑定文件：" + file.name + "。保存时会尝试直接写回该文件。", "success");
      } catch (error) {
        if (error && error.name === "AbortError") {
          return;
        }
        console.error(error);
        setStatus("选择文件失败：" + error.message, "error");
      }
    }

    pickFileBtn.addEventListener("click", pickCsvFile);

    saveBtn.addEventListener("click", async () => {
      await saveCsv(true);
      render();
    });

    saveNextBtn.addEventListener("click", async () => {
      await saveAndMove(state.currentIndex + 1);
    });

    prevBtn.addEventListener("click", () => {
      if (jumpToIndex(state.currentIndex - 1)) {
        setStatus("已切换到上一条，当前编辑内容已暂存在页面状态。", "success");
      }
    });

    nextBtn.addEventListener("click", () => {
      if (jumpToIndex(state.currentIndex + 1)) {
        setStatus("已切换到下一条，当前编辑内容已暂存在页面状态。", "success");
      }
    });

    idInput.addEventListener("change", () => {
      const value = idInput.value.trim();
      if (!value) {
        const row = getCurrentRow();
        idInput.value = row ? row.id || "" : "";
        return;
      }
      jumpToId(value);
    });

    idInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        const value = idInput.value.trim();
        if (value) {
          jumpToId(value);
        }
      }
    });

    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        saveBtn.click();
        return;
      }

      const target = event.target;
      const tagName = target && target.tagName ? target.tagName.toLowerCase() : "";
      if (tagName === "input" || tagName === "textarea" || target?.isContentEditable) {
        return;
      }

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        prevBtn.click();
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        nextBtn.click();
      }
    });
  </script>
</body>
</html>
