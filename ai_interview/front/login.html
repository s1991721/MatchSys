<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020814" />
    <meta name="description" content="AOMERA AI面接官のログインページです。" />
    <title>AOMERA AI面接官 — ログイン</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-background" aria-hidden="true">
      <div class="grid"></div>
      <div class="halo halo-one"></div>
      <div class="halo halo-two"></div>
      <div class="orbit"><i></i></div>
      <div class="stars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <header class="login-header">
      <a class="login-brand" href="index.html" aria-label="AOMERA AI面接官の紹介ページへ戻る">
        <strong>AOMERA</strong>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-product" data-copy="productName">AI面接官</span>
      </a>
      <div class="language-switch" role="group" aria-label="Language">
        <button class="active" type="button" data-lang="ja" aria-pressed="true">日本語</button>
        <button type="button" data-lang="zh-CN" aria-pressed="false">中文</button>
      </div>
    </header>

    <main class="login-main">
      <section class="login-intro" aria-labelledby="intro-title">
        <p class="intro-kicker">AOMERA AI INTERVIEW</p>
        <h1 id="intro-title" data-copy="heroTitle">AIが見抜く。<br />可能性を、確信に変える。</h1>
        <p class="intro-copy" data-copy="heroCopy">対話から人材の思考と行動を理解し、<br />次の選考につながる評価へ。</p>
        <div class="intro-flow" aria-hidden="true">
          <span>INTERVIEW DESIGN</span><i></i><span>ANALYSIS</span><i></i><span>REPORT</span>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="panel-glow" aria-hidden="true"></div>
        <div class="panel-heading">
          <p>AOMERA SECURE ACCESS</p>
          <h2 id="login-title" data-copy="loginTitle">ログイン</h2>
          <span data-copy="loginCopy">AOMERA AI面接官へログインしてください。</span>
        </div>

        <form id="loginForm" novalidate>
          <label class="login-field" for="userName">
            <span data-copy="accountLabel">アカウント</span>
            <input id="userName" name="user_name" type="text" autocomplete="username" data-placeholder="accountPlaceholder" placeholder="アカウント名を入力" required />
          </label>
          <label class="login-field" for="password">
            <span data-copy="passwordLabel">パスワード</span>
            <span class="password-control">
              <input id="password" name="password" type="password" autocomplete="current-password" data-placeholder="passwordPlaceholder" placeholder="パスワードを入力" required />
              <button id="passwordToggle" class="password-toggle" type="button" aria-label="パスワードを表示">表示</button>
            </span>
          </label>
          <button id="submitBtn" class="login-submit" type="submit" disabled>
            <span class="submit-label">ログインする</span>
            <span class="submit-arrow" aria-hidden="true">→</span>
            <span class="submit-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </section>
    </main>

    <footer class="login-footer">
      <a href="index.html"><span aria-hidden="true">←</span><span data-copy="backLink">AI面接官の紹介に戻る</span></a>
      <span>© 2026 AOMERA Inc.</span>
    </footer>

    <script src="login.js"></script>
  </body>
</html>
