services:
  db:
    image: jef4267/matchsys-mysql:3.1
    container_name: matchsys-mysql
    restart: unless-stopped
    # 容器内存上限（8G机器建议先给 6G）
    mem_limit: 3g
    ports:
      - "6033:3306"
    environment:
      MYSQL_DATABASE: matchSys
      MYSQL_ROOT_PASSWORD: YourStrongPassword:123!
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - matchsys-net

  web:
    image: jef4267/matchsys-web:3.1
    container_name: matchsys-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    depends_on:
      - db
      - ollama
    networks:
      - matchsys-net
    environment:
      DB_NAME: matchSys
      DB_USER: bpmatch_user
      DB_PASSWORD: bpmatch_user_AbCdEfG
      DB_HOST: db
      DB_PORT: 3306
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - web_upload:/app/upload
      - web_logs:/app/logs

  ai_interview:
    image: jef4267/ai-interview:1.0
    container_name: matchsys-ai-interview
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 3 --timeout 120"
    depends_on:
      - db
    expose:
      - "8001"
    networks:
      - matchsys-net
    environment:
      AI_INTERVIEW_SECRET_KEY: ${AI_INTERVIEW_SECRET_KEY:?AI_INTERVIEW_SECRET_KEY is required}
      AI_INTERVIEW_DEBUG: "false"
      AI_INTERVIEW_ALLOWED_HOSTS: aomera.co.jp,www.aomera.co.jp,ai_interview
      AI_INTERVIEW_DB_NAME: ai_interview
      AI_INTERVIEW_DB_USER: ai_interview_user
      AI_INTERVIEW_DB_PASSWORD: ${AI_INTERVIEW_DB_PASSWORD:?AI_INTERVIEW_DB_PASSWORD is required}
      AI_INTERVIEW_DB_HOST: db
      AI_INTERVIEW_DB_PORT: 3306
    volumes:
      - ai_interview_media:/app/media

  nginx:
    image: jef4267/matchsys-nginx:3.2
    container_name: matchsys-nginx
    restart: unless-stopped
    depends_on:
      - web
      - ai_interview
    ports:
      - "80:80"
      - "443:443"
    networks:
      - matchsys-net
    volumes:
      - /srv/aomera/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_THREADS: "8"
      OLLAMA_NUM_PARALLEL: "4"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - matchsys-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &

        until ollama list > /dev/null 2>&1; do
          sleep 1
        done

        ollama pull llama3.2:3b-instruct-q4_K_M

        wait

volumes:
  mysql_data:
  ollama_data:
  web_upload:
  web_logs:
  ai_interview_media:

networks:
  matchsys-net:
    name: matchsys-net
