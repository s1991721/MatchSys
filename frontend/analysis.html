<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon-48.png" type="image/png" sizes="48x48">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title data-i18n="menu.15.name">数据分析</title>
</head>
<body>
  <div class="page">
    <div class="c-card-grid content-spaced">
        <section class="c-card c-card-fixed">
          <div class="c-card-header">
            <div class="c-panel-title" data-i18n="analysis.card.monthly">当前最挣钱的员工</div>
            <span class="c-tag c-tag-info" data-i18n="analysis.tag.current">当前</span>
          </div>
          <div class="c-table-wrapper">
            <table class="c-table c-table-compact c-table-center c-table-compact-last">
              <thead>
                <tr>
                  <th data-i18n="analysis.table.rank">排名</th>
                  <th data-i18n="analysis.table.employee">员工</th>
                  <th data-i18n="analysis.table.diff">差额</th>
                </tr>
              </thead>
              <tbody id="analysis-current-top"></tbody>
            </table>
          </div>
        </section>
        <section class="c-card c-card-fixed">
          <div class="c-card-header">
            <div class="c-panel-title" data-i18n="analysis.card.yearly">当年最挣钱的员工</div>
            <span class="c-tag c-tag-neutral" data-i18n="analysis.tag.year">年累计</span>
          </div>
          <div class="c-table-wrapper">
            <table class="c-table c-table-compact c-table-center c-table-compact-last">
              <thead>
                <tr>
                  <th data-i18n="analysis.table.rank">排名</th>
                  <th data-i18n="analysis.table.employee">员工</th>
                  <th data-i18n="common.field.amount">金额</th>
                </tr>
              </thead>
              <tbody id="analysis-yearly-top"></tbody>
            </table>
          </div>
        </section>
        <section class="c-card c-card-fixed">
          <div class="c-card-header">
            <div class="c-panel-title" data-i18n="analysis.card.customer_profit">最挣钱的客户</div>
            <span class="c-tag c-tag-success" data-i18n="analysis.tag.year">年累计</span>
          </div>
          <div class="c-table-wrapper">
            <table class="c-table c-table-compact c-table-center c-table-compact-last">
              <thead>
                <tr>
                  <th data-i18n="analysis.table.rank">排名</th>
                  <th data-i18n="analysis.table.customer">客户</th>
                  <th data-i18n="common.field.amount">金额</th>
                </tr>
              </thead>
              <tbody id="analysis-top-customers"></tbody>
            </table>
          </div>
        </section>
        <section class="c-card c-card-fixed">
          <div class="c-card-header">
            <div class="c-panel-title" data-i18n="analysis.card.customer_volume">单最多的客户</div>
            <span class="c-tag c-tag-warn" data-i18n="analysis.tag.year">年累计</span>
          </div>
          <div class="c-table-wrapper">
            <table class="c-table c-table-compact c-table-center c-table-compact-last">
              <thead>
                <tr>
                  <th data-i18n="analysis.table.rank">排名</th>
                  <th data-i18n="analysis.table.customer">客户</th>
                  <th data-i18n="analysis.table.orders">订单数</th>
                </tr>
              </thead>
              <tbody id="analysis-top-order-customers"></tbody>
            </table>
          </div>
        </section>
        <section class="c-card c-card-fixed">
          <div class="c-card-header">
            <div class="c-panel-title" data-i18n="analysis.card.low_profit_employees">当前利润较低员工</div>
            <span class="c-tag c-tag-info" data-i18n="analysis.tag.current">当前</span>
          </div>
          <div class="c-table-wrapper">
            <table class="c-table c-table-compact c-table-center c-table-compact-last">
              <thead>
                <tr>
                  <th data-i18n="analysis.table.rank">排名</th>
                  <th data-i18n="analysis.table.employee">员工</th>
                  <th data-i18n="analysis.table.diff">差额</th>
                </tr>
              </thead>
              <tbody id="analysis-current-low"></tbody>
            </table>
          </div>
        </section>
        <section class="c-card c-card-fixed">
          <div class="c-card-header">
            <div class="c-panel-title" data-i18n="analysis.card.monthly_order_volume">当月营业成单数</div>
            <span class="c-tag c-tag-info" data-i18n="analysis.tag.month">本月</span>
          </div>
          <div class="c-table-wrapper">
            <table class="c-table c-table-compact c-table-center c-table-compact-last">
              <thead>
                <tr>
                  <th data-i18n="analysis.table.rank">排名</th>
                  <th data-i18n="analysis.table.employee">员工</th>
                  <th data-i18n="analysis.table.orders">订单数</th>
                </tr>
              </thead>
              <tbody id="analysis-monthly-orders"></tbody>
            </table>
          </div>
        </section>
        <section class="c-card c-card-fixed">
          <div class="c-card-header">
            <div class="c-panel-title" data-i18n="analysis.card.current_profit">当前营业利润</div>
            <span class="c-tag c-tag-info" data-i18n="analysis.tag.month">本月</span>
          </div>
          <div class="c-table-wrapper">
            <table class="c-table c-table-compact c-table-center c-table-compact-last">
              <thead>
                <tr>
                  <th data-i18n="analysis.table.rank">排名</th>
                  <th data-i18n="analysis.table.employee">员工</th>
                  <th data-i18n="common.field.amount">金额</th>
                  <th data-i18n="analysis.table.orders">订单数</th>
                </tr>
              </thead>
              <tbody id="analysis-monthly-profit"></tbody>
            </table>
          </div>
        </section>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script>
    if (window.I18N) {
      window.I18N.init();
      window.I18N.apply();
    }
  </script>
  <script>
    const formatCount = (value) => {
      if (typeof value !== "number") return "-";
      return value.toLocaleString("en-US");
    };

    const formatMoney = (value) => {
      const numberValue = Number(value);
      if (!Number.isFinite(numberValue)) return "-";
      return `¥${numberValue.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}`;
    };

    const fillTable = (tbodyId, rows) => {
      const tbody = document.getElementById(tbodyId);
      if (!tbody) return;
      tbody.innerHTML = "";
      rows.forEach((cells) => {
        const tr = document.createElement("tr");
        cells.forEach((cell) => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    };

    const renderAnalysis = (data) => {
      fillTable(
        "analysis-current-top",
        (data?.current_top_profit_employees || []).map((item) => [
          item.rank ?? "-",
          item.employee_name || "-",
          formatMoney(item.amount),
        ])
      );

      fillTable(
        "analysis-yearly-top",
        (data?.yearly_top_profit_employees || []).map((item) => [
          item.rank ?? "-",
          item.employee_name || "-",
          formatMoney(item.amount),
        ])
      );

      fillTable(
        "analysis-top-customers",
        (data?.top_profit_customers || []).map((item) => [
          item.rank ?? "-",
          item.customer_name || "-",
          formatMoney(item.amount),
        ])
      );

      fillTable(
        "analysis-top-order-customers",
        (data?.top_order_customers || []).map((item) => [
          item.rank ?? "-",
          item.customer_name || "-",
          formatCount(item.order_count),
        ])
      );

      fillTable(
        "analysis-current-low",
        (data?.current_low_profit_employees || []).map((item) => [
          item.rank ?? "-",
          item.employee_name || "-",
          formatMoney(item.amount),
        ])
      );

      fillTable(
        "analysis-monthly-orders",
        (data?.monthly_order_volume || []).map((item) => [
          item.rank ?? "-",
          item.employee_name || "-",
          formatCount(item.order_count),
        ])
      );

      fillTable(
        "analysis-monthly-profit",
        (data?.monthly_sales_profit || []).map((item) => [
          item.rank ?? "-",
          item.employee_name || "-",
          formatMoney(item.amount),
          formatCount(item.order_count),
        ])
      );
    };

    const loadAnalysis = async () => {
      try {
        const payload = await window.requestJson("/api/analysis/stats", { method: "GET" });
        if (payload && (payload.status === "ok" || payload.success === true)) {
          renderAnalysis(payload.data || {});
        }
      } catch (error) {
        console.error("Failed to load analysis stats", error);
      }
    };

    loadAnalysis();
  </script>
</body>
</html>
