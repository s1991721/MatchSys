<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="customer.bulk.title">群发邮件</title>
</head>
<body class="c-form-page bulk-email-page">
<div class="page">
    <section class="c-card c-bulk-dialog bulk-email-shell">
        <div class="modal" role="main" aria-label="群发邮件" data-i18n-aria="customer.bulk.title">
            <div class="modal-header">
                <div class="modal-title" data-i18n="customer.bulk.title">群发邮件</div>
            </div>
            <div class="modal-body">
                <section class="mail-editor">
                    <div class="form-item">
                        <div class="form-label" data-i18n="customer.bulk.subject">邮件主题</div>
                        <input class="input" id="bulk-mail-subject" type="text" placeholder="请输入邮件主题"
                               data-i18n-placeholder="customer.bulk.subject_placeholder"/>
                    </div>
                    <div class="form-item">
                        <div class="bulk-mail-type-head">
                            <div class="form-label" data-i18n="customer.bulk.mail_type">送信类型</div>
                            <button
                                    id="bulk-mail-template-edit"
                                    class="songxin-template-trigger hidden"
                                    type="button"
                                    aria-label="编辑直接送信模板"
                                    data-i18n-aria="customer.bulk.template.action.edit"
                                    title="编辑直接送信模板"
                                    data-i18n-title="customer.bulk.template.action.edit"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M6 2h8l5 5v4.25a1 1 0 1 1-2 0V8h-4V4H6v16h5.25a1 1 0 1 1 0 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm9 3.41V7h1.59L15 5.41zm-2.04 9.33 4.83-4.83 2.12 2.12-4.83 4.83-2.54.42.42-2.54zm6.24-6.24.71-.71a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1 0 1.41l-.71.71-2.12-2.12z"/>
                                </svg>
                            </button>
                        </div>
                        <select class="input" id="bulk-mail-type">
                            <option value="-1" data-i18n="customer.bulk.mail_type.other">其他</option>
                            <option value="0">BP</option>
                            <option value="1" data-i18n="customer.bulk.mail_type.technician">技术者送信</option>
                            <option value="2" data-i18n="customer.bulk.mail_type.project">案件送信</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <div class="form-label" data-i18n="customer.bulk.body">邮件内容</div>
                        <div class="bulk-body-hint"
                             data-i18n="customer.bulk.body_hint">
                            当前编辑的是通用正文。系统发送时会按收件人逐封发送，并自动补全各自抬头；实际发送结果请到【送信历史】查看。
                        </div>
                        <div class="mail-body-wrap">
                            <textarea class="textarea" id="bulk-mail-body" rows="10" placeholder="请输入邮件内容"
                                      data-i18n-placeholder="customer.bulk.body_placeholder"></textarea>
                            <div class="mail-body-mask" id="bulk-mail-body-mask"
                                 data-i18n="customer.bulk.status.body_processing">邮件内容处理中，请稍候...
                            </div>
                        </div>
                    </div>
                    <div class="bulk-mail-footer">
                        <div class="bulk-mail-footer-main">
                            <div class="form-item">
                                <div class="form-label" data-i18n="customer.bulk.cc">抄送（可选）</div>
                                <input class="input bulk-cc-input" id="bulk-mail-cc" type="email"
                                       placeholder="cc@example.com"/>
                            </div>
                            <div class="form-item">
                                <div class="form-label" data-i18n="customer.bulk.attachments">上传附件</div>
                                <div class="bulk-upload-bar">
                                    <input class="bulk-attachment-input" id="bulk-attachment-file" type="file"
                                           accept=".pdf,.doc,.docx,.jpg,.png,.jpeg,.xls,.xlsx" multiple/>
                                    <div class="bulk-attachment-hint" data-i18n="customer.bulk.attachment_hint">
                                        支持多文件，建议单个不超过10MB
                                    </div>
                                </div>
                                <div id="bulk-attachment-source" class="bulk-attachment-list"></div>
                            </div>
                        </div>
                        <div class="mail-submit-row">
                            <button class="btn btn-primary" id="bulk-mail-send" type="button">
                                <span class="bulk-send-text" data-i18n="customer.bulk.send">发送</span>
                                <svg class="bulk-send-icon" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M3 2.5L13 8L3 13.5V9.25L8.25 8L3 6.75V2.5Z" fill="currentColor"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </section>
                <div class="modal-divider" aria-hidden="true"></div>
                <aside class="recipients">
                    <div class="recipients-header">
                        <div class="recipients-title">
                            <span class="recipients-title-bar" aria-hidden="true"></span>
                            <span class="recipients-title-text" data-i18n="customer.bulk.recipients">收件人</span>
                        </div>
                        <div class="recipients-header-actions">
                            <button class="c-btn c-btn-secondary c-btn-sm" id="bulk-recipient-select-all" type="button"
                                    data-i18n="customer.bulk.select_all">全选</button>
                            <div class="recipients-meta" id="bulk-mail-selected">已选 0 个客户</div>
                        </div>
                    </div>
                    <div class="recipients-filter">
                        <input class="input" id="bulk-recipient-filter" type="search" placeholder="按公司名过滤"
                               data-i18n-placeholder="customer.bulk.filter_placeholder"/>
                    </div>
                    <div class="recipients-list" id="bulk-mail-recipients"></div>
                    <div class="pagination c-pagination hidden" id="bulk-recipient-pagination">
                        <div class="pagination-summary" id="bulk-recipient-pagination-summary">共 0 条 · 第 1/1 页</div>
                        <div class="pagination-pages" id="bulk-recipient-pagination-pages"></div>
                    </div>
                </aside>
            </div>
        </div>
    </section>
</div>

<dialog id="bulk-mail-template-dialog" class="c-dialog songxin-template-dialog">
    <div class="c-dialog-header">
        <div class="songxin-template-header-text">
            <h3 data-i18n="customer.bulk.template.dialog.title">编辑直接送信模板</h3>
            <p id="bulk-mail-template-subtitle" class="c-card-subtitle songxin-template-subtitle"></p>
        </div>
        <button class="c-dialog-close" type="button" aria-label="关闭" data-i18n-aria="common.close" data-dialog-close>×</button>
    </div>
    <div class="c-dialog-body">
        <textarea
                id="bulk-mail-template-content"
                class="songxin-template-textarea"
                rows="14"
                placeholder="请输入直接送信模板"
                data-i18n-placeholder="customer.bulk.template.placeholder"
        ></textarea>
    </div>
    <div class="c-dialog-actions">
        <button class="c-btn c-btn-ghost" type="button" data-dialog-close data-i18n="common.cancel">取消</button>
        <button id="bulk-mail-template-save" class="c-btn c-btn-primary" type="button" data-i18n="common.save">保存</button>
    </div>
</dialog>
<script src="i18n.js"></script>
<script src="error_code.js"></script>
<script src="common.js"></script>
<script>
    const i18n = window.I18N;
    if (i18n) {
        i18n.init();
        i18n.apply();
    }
    const t = (key) => (i18n ? i18n.t(key) : key);
    const format = (key, vars) => (i18n ? i18n.format(key, vars) : key);

    const bulkMailSubject = document.getElementById("bulk-mail-subject");
    const bulkMailBody = document.getElementById("bulk-mail-body");
    const bulkMailType = document.getElementById("bulk-mail-type");
    const bulkMailRecipients = document.getElementById("bulk-mail-recipients");
    const bulkMailSelected = document.getElementById("bulk-mail-selected");
    const bulkRecipientSelectAll = document.getElementById("bulk-recipient-select-all");
    const bulkRecipientFilter = document.getElementById("bulk-recipient-filter");
    const bulkMailBodyMask = document.getElementById("bulk-mail-body-mask");
    const bulkMailSend = document.getElementById("bulk-mail-send");
    const bulkMailCc = document.getElementById("bulk-mail-cc");
    const bulkAttachmentFile = document.getElementById("bulk-attachment-file");
    const bulkAttachmentSource = document.getElementById("bulk-attachment-source");
    const bulkMailSendText = bulkMailSend ? bulkMailSend.querySelector(".bulk-send-text") : null;
    const bulkRecipientPagination = document.getElementById("bulk-recipient-pagination");
    const bulkRecipientPaginationPages = document.getElementById("bulk-recipient-pagination-pages");
    const bulkRecipientPaginationSummary = document.getElementById("bulk-recipient-pagination-summary");
    const bulkMailTemplateEdit = document.getElementById("bulk-mail-template-edit");
    const bulkMailTemplateDialog = document.getElementById("bulk-mail-template-dialog");
    const bulkMailTemplateSubtitle = document.getElementById("bulk-mail-template-subtitle");
    const bulkMailTemplateContent = document.getElementById("bulk-mail-template-content");
    const bulkMailTemplateSave = document.getElementById("bulk-mail-template-save");

    const CONTEXT_KEY = "bulkMailContext";
    const PREFILL_KEY = "bulkMailPrefill";
    const CUSTOMER_PAGE_SIZE = 10;

    let selectedCustomerIdSet = new Set();
    let recipientSourceItems = [];
    let recipientOptionMap = new Map();
    let selectedRecipientMap = new Map();
    let prefill = null;
    let bulkAttachments = [];
    let isSendingBulkMail = false;
    let isSelectingAllRecipients = false;
    let allRecipientSelectionKeySet = new Set();
    let isAllRecipientScopeSelected = false;
    let templateBodyRequestSequence = 0;
    const directMailTemplateNames = {
        "1": "direct_technician",
        "2": "direct_project",
    };
    let customerPagination = {
        page: 1,
        totalPages: 1,
        totalCount: 0,
    };

    const debounce = (fn, delay = 250) => {
        let timer = null;
        return (...args) => {
            window.clearTimeout(timer);
            timer = window.setTimeout(() => fn(...args), delay);
        };
    };

    const getDirectTemplateName = (mailType = bulkMailType?.value) => directMailTemplateNames[String(mailType)] || "";

    const updateTemplateEditState = () => {
        if (!bulkMailTemplateEdit) return;
        bulkMailTemplateEdit.classList.toggle("hidden", !getDirectTemplateName());
    };

    const loadDirectMailTemplate = async ({applyToBody = false, forceRefresh = false} = {}) => {
        const templateName = getDirectTemplateName();
        const mailType = String(bulkMailType?.value || "");
        const requestSequence = applyToBody ? ++templateBodyRequestSequence : 0;
        if (!templateName) return "";
        if (applyToBody) {
            setBodyBusyState({
                busy: true,
                message: t("customer.bulk.template.status.loading"),
                disableSend: true,
            });
        }
        try {
            const payload = await window.requestJson(`/api/mail-templates/${encodeURIComponent(templateName)}`, {
                method: "GET",
                cache: forceRefresh ? "no-store" : "default",
            }, {
                fallbackMessage: t("customer.bulk.template.alert.load_failed"),
            });
            const template = typeof payload.data?.template === "string" ? payload.data.template : "";
            if (applyToBody && requestSequence === templateBodyRequestSequence && String(bulkMailType?.value || "") === mailType) {
                bulkMailBody.value = template;
            }
            return template;
        } finally {
            if (applyToBody && requestSequence === templateBodyRequestSequence) {
                setBodyBusyState({
                    busy: false,
                    message: t("customer.bulk.status.body_processing"),
                    disableSend: false,
                });
            }
        }
    };

    const renderDirectTemplateSubtitle = () => {
        if (!bulkMailTemplateSubtitle) return;
        bulkMailTemplateSubtitle.textContent = String(bulkMailType?.value) === "1"
            ? t("customer.bulk.template.subtitle.technician")
            : t("customer.bulk.template.subtitle.project");
    };

    bulkMailType.addEventListener("change", async () => {
        updateTemplateEditState();
        if (!getDirectTemplateName()) return;
        try {
            await loadDirectMailTemplate({applyToBody: true});
        } catch (error) {
            console.error("load direct mail template failed", error);
            alert(error.message || t("customer.bulk.template.alert.load_failed"));
        }
    });

    bulkMailTemplateEdit.addEventListener("click", async () => {
        if (!getDirectTemplateName()) return;
        bulkMailTemplateEdit.disabled = true;
        try {
            bulkMailTemplateContent.value = await loadDirectMailTemplate({forceRefresh: true});
            renderDirectTemplateSubtitle();
            bulkMailTemplateDialog.showModal();
        } catch (error) {
            console.error("load direct mail template failed", error);
            alert(error.message || t("customer.bulk.template.alert.load_failed"));
        } finally {
            bulkMailTemplateEdit.disabled = false;
        }
    });

    bulkMailTemplateSave.addEventListener("click", async () => {
        const templateName = getDirectTemplateName();
        if (!templateName) return;
        bulkMailTemplateSave.disabled = true;
        try {
            const template = String(bulkMailTemplateContent.value || "").replace(/\r\n/g, "\n");
            await window.requestJson(`/api/mail-templates/${encodeURIComponent(templateName)}`, {
                body: JSON.stringify({template}),
            }, {
                fallbackMessage: t("customer.bulk.template.alert.save_failed"),
            });
            bulkMailBody.value = template;
            bulkMailTemplateDialog.close();
        } catch (error) {
            console.error("save direct mail template failed", error);
            alert(error.message || t("customer.bulk.template.alert.save_failed"));
        } finally {
            bulkMailTemplateSave.disabled = false;
            bulkMailBody.focus();
        }
    });

    if (window.initDialogCloseBehavior) {
        window.initDialogCloseBehavior({dialogs: [bulkMailTemplateDialog]});
    }

    const getRecipientFilterKeyword = () => String(bulkRecipientFilter ? bulkRecipientFilter.value.trim() : "");

    const reloadDefaultRecipientsFromFilter = () => {
        loadCustomers(1)
            .catch((error) => {
                console.error("load customers failed", error);
                recipientSourceItems = [];
                renderFilteredRecipients();
                setRecipientPaginationVisible(false);
            });
    };

    const debouncedReloadDefaultRecipientsFromFilter = debounce(reloadDefaultRecipientsFromFilter);

    bulkMailRecipients.addEventListener("change", (event) => {
        if (event.target.matches(".company-check, .contact-check")) {
            const isCompany = event.target.matches(".company-check");
            const targetKey = isCompany
                ? String(event.target.dataset.company || "")
                : String(event.target.dataset.contactKey || "");
            if (targetKey) {
                const selectionKey = `${isCompany ? "company" : "contact"}:${targetKey}`;
                if (event.target.checked) {
                    const recipient = recipientOptionMap.get(selectionKey);
                    if (recipient) {
                        selectedRecipientMap.set(selectionKey, recipient);
                    }
                } else {
                    selectedRecipientMap.delete(selectionKey);
                }
            }
            updateBulkSelected();
        }
    });

    bulkRecipientFilter.addEventListener("input", () => {
        if (selectedCustomerIdSet.size) {
            renderFilteredRecipients();
            return;
        }
        debouncedReloadDefaultRecipientsFromFilter();
    });

    bulkRecipientSelectAll.addEventListener("click", async () => {
        if (isSelectingAllRecipients) return;
        if (isAllRecipientScopeSelected) {
            selectedRecipientMap.clear();
            isAllRecipientScopeSelected = false;
            renderFilteredRecipients();
            updateSelectAllButtonState();
            return;
        }
        setSelectAllState(true);
        try {
            const items = selectedCustomerIdSet.size
                ? await fetchSelectedCustomers()
                : await fetchAllCustomers();
            selectRecipientsFromItems(items);
            renderFilteredRecipients();
        } catch (error) {
            console.error("select all recipients failed", error);
            alert(error.message || t("customer.bulk.alert.select_all_failed"));
        } finally {
            setSelectAllState(false);
            updateSelectAllButtonState();
        }
    });

    bulkAttachmentSource.addEventListener("click", (event) => {
        const target = event.target.closest('[data-action="remove-attachment"]');
        if (!target) {
            return;
        }
        const row = target.closest("[data-attachment-id]");
        const attachmentId = row ? String(row.dataset.attachmentId || "") : "";
        bulkAttachments = bulkAttachments.filter((attachment) => String(attachment.id || "") !== attachmentId);
        renderAttachmentSource();
    });

    bulkMailSend.addEventListener("click", async () => {
        if (isSendingBulkMail) {
            return;
        }
        const recipients = readSelectedRecipients();
        const subject = bulkMailSubject.value.trim();
        const body = bulkMailBody.value.trim();
        const mailType = bulkMailType ? bulkMailType.value : "";
        const cc = bulkMailCc ? bulkMailCc.value.trim() : "";

        if (!recipients.length) {
            alert(t("customer.bulk.alert.recipient_required"));
            return;
        }
        if (!subject) {
            alert(t("customer.bulk.alert.subject_required"));
            return;
        }
        if (!body) {
            alert(t("customer.bulk.alert.body_required"));
            return;
        }

        setBulkSendingState(true);
        try {
            const attachmentsPayload = await Promise.all(
                bulkAttachments.map(async (attachment) => {
                    if (attachment.source === "manual" && attachment.file) {
                        return {
                            filename: attachment.filename || "attachment",
                            content_type: attachment.file.type || "application/octet-stream",
                            content: await readFileAsBase64(attachment.file),
                        };
                    }
                    return {
                        filename: attachment.filename || "attachment",
                        path: attachment.path || "",
                        content_type: attachment.content_type || "application/octet-stream",
                    };
                })
            );
            const payload = await window.requestJson("/api/send-bulk-mail", {
                body: JSON.stringify({
                    subject,
                    body,
                    cc,
                    mail_type: mailType,
                    recipients,
                    attachments: attachmentsPayload,
                }),
            });
            if (!payload.success) {
                throw new Error(payload.message || t("customer.bulk.alert.send_failed"));
            }
            window.top.postMessage({
                type: "topbar-badges:refresh",
                send_tasks_count: Number(payload.data && payload.data.pending_count) ||
                    Number(payload.data && payload.data.queued_count) || 0,
            }, "*");
            alert(t("customer.bulk.alert.queued"));
            window.MatchSys.clearStoredKey(CONTEXT_KEY);
            window.MatchSys.clearStoredKey(PREFILL_KEY);
            window.navigateAppRoute("customer.html");
        } catch (error) {
            alert(error.message || t("customer.bulk.alert.send_failed"));
        } finally {
            setBulkSendingState(false);
        }
    });

    bulkAttachmentFile.addEventListener("change", () => {
        const files = Array.from(bulkAttachmentFile.files || []);
        files.forEach((file, index) => {
            bulkAttachments.push({
                id: `manual-${Date.now()}-${index}-${file.name}`,
                source: "manual",
                filename: file.name || "attachment",
                file,
            });
        });
        renderAttachmentSource();
        bulkAttachmentFile.value = "";
    });

    window.bindPagination(bulkRecipientPagination, (value) => {
        if (selectedCustomerIdSet.size) return;
        let nextPage = customerPagination.page;
        if (value === "prev") {
            nextPage = Math.max(1, customerPagination.page - 1);
        } else if (value === "next") {
            nextPage = Math.min(customerPagination.totalPages, customerPagination.page + 1);
        } else {
            nextPage = Number(value) || customerPagination.page;
        }
        if (nextPage === customerPagination.page) return;
        loadCustomers(nextPage)
            .catch((error) => {
                console.error("load customers failed", error);
                recipientSourceItems = [];
                renderFilteredRecipients();
                setRecipientPaginationVisible(false);
            });
    });

    const setBulkSendingState = (isSending) => {
        isSendingBulkMail = Boolean(isSending);
        setBodyBusyState({
            busy: isSending,
            message: t("customer.bulk.status.sending"),
            disableSend: isSending,
        });
        if (bulkMailSendText) {
            bulkMailSendText.textContent = isSending
                ? t("customer.bulk.status.sending_short")
                : t("customer.bulk.send");
        }
    };

    const setSelectAllState = (isSelecting) => {
        isSelectingAllRecipients = Boolean(isSelecting);
        if (!bulkRecipientSelectAll) return;
        bulkRecipientSelectAll.disabled = isSelectingAllRecipients;
        bulkRecipientSelectAll.textContent = isSelectingAllRecipients
            ? t("customer.bulk.status.selecting")
            : getSelectAllButtonLabel();
    };

    const getSelectAllButtonLabel = () => isAllRecipientScopeSelected
        ? t("customer.bulk.clear_all")
        : t("customer.bulk.select_all");

    const updateSelectAllButtonState = () => {
        if (!bulkRecipientSelectAll || isSelectingAllRecipients) return;
        isAllRecipientScopeSelected = allRecipientSelectionKeySet.size > 0
            && Array.from(allRecipientSelectionKeySet).every((key) => selectedRecipientMap.has(key));
        bulkRecipientSelectAll.textContent = getSelectAllButtonLabel();
    };

    const extractRecipients = (items) => {
        const groups = [];
        items.forEach((item) => {
            const companyEmail = String(item.company_email || "").trim();
            const contacts = [];
            const entries = [
                {index: 1, name: item.contact1_name, email: item.contact1_email},
                {index: 2, name: item.contact2_name, email: item.contact2_email},
                {index: 3, name: item.contact3_name, email: item.contact3_email},
            ];
            entries.forEach((entry) => {
                const email = (entry.email || "").trim();
                if (!email) return;
                const name = (entry.name || "").trim();
                const label = name
                    ? format("customer.bulk.contact", {index: entry.index, name})
                    : format("customer.bulk.contact_fallback", {index: entry.index, email});
                contacts.push({
                    key: `${String(item.id || "")}:contact:${entry.index}`,
                    label,
                    email,
                    recipient: {
                        email,
                        customer_id: item.id || "",
                        company_name: item.company_name || "",
                        contact_name: name,
                        recipient_type: "contact",
                    },
                });
            });

            groups.push({
                id: String(item.id || ""),
                company: item.company_name || t("customer.bulk.unnamed"),
                companyEmail,
                companyRecipient: companyEmail ? {
                    email: companyEmail,
                    customer_id: item.id || "",
                    company_name: item.company_name || "",
                    contact_name: "",
                    recipient_type: "company",
                } : null,
                contacts,
            });
        });
        return groups;
    };

    const updateBulkSelected = () => {
        bulkMailSelected.textContent = format("customer.bulk.selected", {count: selectedRecipientMap.size});
        updateSelectAllButtonState();
    };

    const selectRecipientsFromItems = (items) => {
        const entries = getRecipientSelectionEntries(items);
        allRecipientSelectionKeySet = new Set(entries.map((entry) => entry.key));
        entries.forEach((entry) => {
            selectedRecipientMap.set(entry.key, entry.recipient);
        });
        updateBulkSelected();
    };

    const getRecipientSelectionEntries = (items) => {
        const entries = [];
        const groups = extractRecipients(items);
        groups.forEach((group) => {
            if (group.companyRecipient?.email) {
                entries.push({
                    key: `company:${group.id}`,
                    recipient: group.companyRecipient,
                });
            }
            group.contacts.forEach((contact) => {
                if (contact.recipient?.email) {
                    entries.push({
                        key: `contact:${contact.key}`,
                        recipient: contact.recipient,
                    });
                }
            });
        });
        return entries;
    };

    const renderBulkRecipients = (items) => {
        const groups = extractRecipients(items);
        recipientOptionMap = new Map();
        groups.forEach((group) => {
            if (group.companyRecipient?.email) {
                recipientOptionMap.set(`company:${group.id}`, group.companyRecipient);
            }
            group.contacts.forEach((contact) => {
                if (contact.recipient?.email) {
                    recipientOptionMap.set(`contact:${contact.key}`, contact.recipient);
                }
            });
        });
        if (!groups.length) {
            bulkMailRecipients.innerHTML = `<div class="c-empty">${t("customer.bulk.empty")}</div>`;
            updateBulkSelected();
            return;
        }
        bulkMailRecipients.innerHTML = groups
            .map((group) => {
                const companyChecked = selectedRecipientMap.has(`company:${group.id}`) ? " checked" : "";
                const companyCheckDisabled = group.companyEmail ? "" : " disabled";
                const contactsHtml = group.contacts
                    .map(
                        (contact) => `
                        <label class="contact-row">
                            <input class="contact-check" type="checkbox" data-contact-key="${contact.key}"${selectedRecipientMap.has(`contact:${contact.key}`) ? " checked" : ""}>
                            <div class="contact-info">
                                <div class="contact-name">${contact.label}</div>
                                <div class="contact-email">${contact.email}</div>
                            </div>
                        </label>
                    `
                    )
                    .join("");
                const emptyContactHtml = `<div class="contact-row"><div></div><div class="contact-email">${t("customer.bulk.contact_empty")}</div></div>`;
                return `
                        <div class="group-card" data-group-id="${group.id}">
                            <div class="group-header">
                                <div class="group-header-main">
                                    <label class="group-company-check" title="${group.companyEmail || t("customer.bulk.company_email_empty")}">
                                    <input class="company-check" type="checkbox" data-company="${group.id}"${companyChecked}${companyCheckDisabled}>
                                </label>
                                <div class="group-title-wrap">
                                    <div class="group-name">${group.company}</div>
                                    <div class="group-company-email">${group.companyEmail || t("customer.bulk.company_email_empty")}</div>
                                </div>
                            </div>
                        </div>
                        <div class="group-body">
                            ${contactsHtml || emptyContactHtml}
                        </div>
                    </div>
                `;
            })
            .join("");
        updateBulkSelected();
    };

    const readSelectedRecipients = () => {
        const recipients = [];
        const seen = new Set();
        selectedRecipientMap.forEach((recipient) => {
            if (!recipient?.email) return;
            const key = `${recipient.recipient_type || "recipient"}:${String(recipient.email).toLowerCase()}`;
            if (seen.has(key)) return;
            seen.add(key);
            recipients.push(recipient);
        });
        return recipients;
    };

    const renderFilteredRecipients = () => {
        const keyword = getRecipientFilterKeyword().toLowerCase();
        const items = keyword
            ? recipientSourceItems.filter((item) => String(item.company_name || "").toLowerCase().includes(keyword))
            : recipientSourceItems;
        renderBulkRecipients(items);
    };

    const consumeStoredSessionPayload = (key) => {
        const payload = window.MatchSys.readJSONFromSessionStorage(key);
        window.MatchSys.clearStoredKey(key);
        return payload;
    };

    const setRecipientPaginationVisible = (visible) => {
        bulkRecipientPagination.classList.toggle("hidden", !visible);
    };

    const fetchCustomersPage = async (page = 1) => {
        const params = window.createParams([
            ["page", String(page)],
            ["page_size", String(CUSTOMER_PAGE_SIZE)],
            ["company_name", getRecipientFilterKeyword()],
        ]);
        const payload = await window.requestJson(window.buildUrl("/api/customers", params), {method: "GET"});
        if (!payload.success) {
            throw new Error(payload.message || t("common.load_failed"));
        }
        const items = Array.isArray(payload.data?.items) ? payload.data.items : [];
        const meta = payload.meta || {};
        customerPagination = {
            page: Number(meta.page || page) || 1,
            totalPages: Number(meta.total_pages || 1) || 1,
            totalCount: Number(meta.total || items.length) || 0,
        };
        return items;
    };

    const fetchCustomersAllPage = async (page = 1) => {
        const params = window.createParams([
            ["page", String(page)],
            ["page_size", "100"],
        ]);
        const payload = await window.requestJson(window.buildUrl("/api/customers", params), {method: "GET"});
        if (!payload.success) {
            throw new Error(payload.message || t("common.load_failed"));
        }
        return {
            items: Array.isArray(payload.data?.items) ? payload.data.items : [],
            meta: payload.meta || {},
        };
    };

    const fetchAllCustomers = async () => {
        const firstPage = await fetchCustomersAllPage(1);
        const items = [...firstPage.items];
        const totalPages = Number(firstPage.meta.total_pages || 1) || 1;
        for (let page = 2; page <= totalPages; page += 1) {
            const payload = await fetchCustomersAllPage(page);
            items.push(...payload.items);
        }
        return items;
    };

    const escapeHtml = window.escapeHtml;

    const readFileAsBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const result = reader.result || "";
            const base64 = typeof result === "string" && result.includes(",")
                ? result.split(",").pop()
                : result;
            resolve(base64);
        };
        reader.onerror = () => reject(reader.error || new Error(t("customer.bulk.error.file_read_failed")));
        reader.readAsDataURL(file);
    });

    const buildAttachmentPreviewUrl = (attachment) => {
        const path = String(attachment?.path || "").trim();
        if (!path) {
            return "";
        }
        return `/api/ss/${encodeURIComponent(path)}`;
    };


    const renderRecipientPagination = () => {
        if (!bulkRecipientPagination || !window.renderPagination) return;
        setRecipientPaginationVisible(!selectedCustomerIdSet.size);
        if (bulkRecipientPaginationSummary) {
            bulkRecipientPaginationSummary.textContent = `共 ${customerPagination.totalCount} 条 · 第 ${customerPagination.page}/${customerPagination.totalPages} 页`;
        }
        window.renderPagination(
            bulkRecipientPagination,
            bulkRecipientPaginationPages,
            customerPagination.page,
            customerPagination.totalPages
        );
    };


    const fetchSelectedCustomers = async () => {
        const ids = Array.from(selectedCustomerIdSet);
        const items = await Promise.all(ids.map(async (id) => {
            const payload = await window.requestJson(`/api/customers/${encodeURIComponent(id)}`, {method: "GET"});
            if (!payload.success) {
                throw new Error(payload.message || t("common.load_failed"));
            }
            return payload.data?.item || null;
        }));
        return items.filter(Boolean);
    };

    const setBodyBusyState = ({busy, message, disableSend}) => {
        if (bulkMailBodyMask) {
            bulkMailBodyMask.textContent = message || t("customer.bulk.status.body_processing");
            bulkMailBodyMask.classList.toggle("show", Boolean(busy));
        }
        if (bulkMailBody) {
            bulkMailBody.classList.toggle("is-processing", Boolean(busy));
        }
        if (bulkMailSend && disableSend !== undefined) {
            bulkMailSend.disabled = Boolean(disableSend);
        }
    };

    const applyContextAndPrefill = () => {
        const contextRaw = consumeStoredSessionPayload(CONTEXT_KEY);
        const prefillRaw = consumeStoredSessionPayload(PREFILL_KEY);

        const context = Boolean(contextRaw && contextRaw.source === "customer") ? contextRaw : null;
        const prefillCandidate = Boolean(prefillRaw && typeof prefillRaw === "object") ? prefillRaw : null;

        if (context && Array.isArray(context.selected_ids)) {
            selectedCustomerIdSet = new Set(context.selected_ids.map((id) => String(id)));
        }

        if (prefillCandidate) {
            prefill = {
                subject: String(prefillCandidate.subject || ""),
                body: String(prefillCandidate.body || ""),
                mailType: String(prefillCandidate.mail_type || "-1"),
                source: String(prefillCandidate.source || ""),
                intro: String(prefillCandidate.intro || ""),
            };
            const attachments = Array.isArray(prefillCandidate.attachments) ? prefillCandidate.attachments : [];
            bulkAttachments = attachments.map((attachment, index) => ({
                ...attachment,
                source: "prefill",
                id: `prefill-${index}-${String(attachment.filename || "attachment")}`,
            }));
        }
    };

    const loadCustomers = async (page = 1) => {
        if (selectedCustomerIdSet.size) {
            recipientSourceItems = await fetchSelectedCustomers();
            customerPagination = {
                page: 1,
                totalPages: 1,
                totalCount: recipientSourceItems.length,
            };
            setRecipientPaginationVisible(false);
        } else {
            recipientSourceItems = await fetchCustomersPage(page);
            renderRecipientPagination();
        }
        renderFilteredRecipients();
    };

    const applyPrefillToForm = () => {
        if (!prefill) {
            bulkMailSubject.value = "";
            bulkMailBody.value = "";
            if (bulkMailType) bulkMailType.value = "-1";
        } else {
            bulkMailSubject.value = prefill.subject || "";
            bulkMailBody.value = prefill.body || "";
            if (bulkMailType) bulkMailType.value = prefill.mailType || "-1";
        }
        bulkAttachmentFile.value = "";
        updateTemplateEditState();
    };

    const renderAttachmentSource = () => {
        if (!bulkAttachments.length) {
            bulkAttachmentSource.innerHTML = `<div class="bulk-attachment-empty">${t("common.empty.attachments")}</div>`;
            return;
        }
        bulkAttachmentSource.innerHTML = bulkAttachments.map((attachment) => {
            const safeName = escapeHtml(attachment.filename || "attachment");
            const previewUrl = buildAttachmentPreviewUrl(attachment);
            const sourceLabel = attachment.source === "prefill"
                ? t("customer.bulk.attachment_source.prefill")
                : t("customer.bulk.attachment_source.manual");
            const previewHtml = previewUrl
                ? `<a class="bulk-attachment-link" href="${escapeHtml(previewUrl)}" target="_blank" rel="noopener noreferrer">${t("common.preview")}</a>`
                : "";
            return `
                <div class="bulk-attachment-item" data-attachment-id="${escapeHtml(attachment.id || "")}">
                    <div class="bulk-attachment-main">
                        <div class="bulk-attachment-name">${safeName}</div>
                    </div>
                    <div class="bulk-attachment-actions">
                        <span class="bulk-attachment-origin">${sourceLabel}</span>
                        ${previewHtml}
                        <button type="button" class="bulk-attachment-remove" data-action="remove-attachment">${t("common.remove")}</button>
                    </div>
                </div>
            `;
        }).join("");
    };

    applyContextAndPrefill();

    const initializeBulkMailPage = async () => {
        try {
            await loadCustomers(1);
        } catch (error) {
            console.error("load customers failed", error);
            recipientSourceItems = [];
            renderFilteredRecipients();
            setRecipientPaginationVisible(false);
        }
        applyPrefillToForm();
        renderAttachmentSource();
        if (getDirectTemplateName()) {
            try {
                await loadDirectMailTemplate({applyToBody: true});
            } catch (error) {
                console.error("load direct mail template failed", error);
                alert(error.message || t("customer.bulk.template.alert.load_failed"));
            }
        }
    };

    initializeBulkMailPage();
</script>
</body>
</html>
