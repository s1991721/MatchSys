<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="customer.bulk.title">群发邮件</title>
    <style>
        .bulk-email-page .page {
            padding: 16px 18px 20px;
        }

        .bulk-email-page .bulk-email-shell {
            width: 100%;
            max-width: none;
            padding: 0;
            overflow: hidden;
            min-height: calc(100vh - 46px);
        }

        .bulk-email-page .modal {
            height: 100%;
            min-height: calc(100vh - 46px);
            border-radius: 0;
        }

        .bulk-email-page .modal-body {
            flex: 1 1 auto;
            grid-template-columns: minmax(0, 3fr) auto minmax(0, 7fr);
            align-items: stretch;
        }

        .bulk-email-page .recipients {
            order: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .bulk-email-page .modal-divider {
            order: 2;
        }

        .bulk-email-page .mail-editor {
            order: 3;
            align-content: start;
        }

        .bulk-email-page .mail-submit-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .bulk-email-page .bulk-mail-footer {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: end;
            margin-top: 8px;
        }

        .bulk-email-page .bulk-mail-footer .form-item {
            margin: 0;
        }

        .bulk-email-page .bulk-mail-footer .mail-submit-row {
            margin: 0;
            align-self: end;
        }

        .bulk-email-page #bulk-mail-send:disabled {
            cursor: not-allowed;
            opacity: 0.72;
            background: #8fb2f7;
            border-color: #8fb2f7;
            box-shadow: none;
            transform: none;
        }

        .bulk-email-page #bulk-mail-send:disabled:hover,
        .bulk-email-page #bulk-mail-send:disabled:active {
            transform: none;
            box-shadow: none;
        }

        .bulk-email-page .mail-body-wrap {
            position: relative;
        }

        .bulk-email-page .mail-body-mask {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(22, 32, 55, 0.52);
            border: 1px solid #d8dfec;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 2;
        }

        .bulk-email-page .mail-body-mask.show {
            opacity: 1;
            pointer-events: auto;
        }

        .bulk-email-page .mail-body-mask::before {
            content: "";
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            animation: bulk-email-spin 0.8s linear infinite;
        }

        .bulk-email-page #bulk-mail-body.is-processing {
            filter: blur(0.5px);
        }

        @keyframes bulk-email-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .bulk-email-page #bulk-mail-body {
            min-height: 420px;
        }

        .bulk-email-page .recipients-list {
            max-height: none;
            flex: 1 1 auto;
            min-height: 0;
        }

        .bulk-email-page .recipients-filter {
            margin-bottom: 12px;
        }

        .bulk-email-page .group-header-main {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 auto;
        }

        .bulk-email-page .group-title-wrap {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 auto;
        }

        .bulk-email-page .group-company-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .bulk-email-page .group-company-check input {
            margin: 0;
        }

        .bulk-email-page .group-company-email {
            color: #63708a;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
        }

        .bulk-email-page .bulk-attachment-hint {
            margin-top: 8px;
            color: #5f6f8f;
            font-size: 14px;
            line-height: 1.6;
        }

        .bulk-email-page .bulk-attachment-input {
            margin-top: 4px;
        }

        @media (max-width: 1200px) {
            .bulk-email-page .modal-body {
                grid-template-columns: minmax(0, 4fr) auto minmax(0, 6fr);
            }
        }

        @media (max-width: 920px) {
            .bulk-email-page .bulk-email-shell {
                min-height: auto;
            }

            .bulk-email-page .modal {
                min-height: auto;
            }

            .bulk-email-page .bulk-mail-footer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="c-form-page bulk-email-page">
<div class="page">
    <section class="c-card c-bulk-dialog bulk-email-shell">
        <div class="modal" role="main" aria-label="群发邮件">
            <div class="modal-header">
                <div class="modal-title" data-i18n="customer.bulk.title">群发邮件</div>
            </div>
            <div class="modal-body">
                <section class="mail-editor">
                    <div class="form-item">
                        <div class="form-label" data-i18n="customer.bulk.subject">邮件主题</div>
                        <input class="input" id="bulk-mail-subject" type="text" placeholder="请输入邮件主题"
                               data-i18n-placeholder="customer.bulk.subject_placeholder"/>
                    </div>
                    <div class="form-item">
                        <div class="form-label">送信类型</div>
                        <select class="input" id="bulk-mail-type">
                            <option value="-1">其他</option>
                            <option value="0">BP</option>
                            <option value="1">技术者送信</option>
                            <option value="2">案件送信</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <div class="form-label" data-i18n="customer.bulk.body">邮件内容</div>
                        <div style="margin: 0 0 8px; color: #63708a; font-size: 13px; line-height: 1.5;">
                            当前编辑的是通用正文。系统发送时会按收件人逐封发送，并自动补全各自抬头；实际发送结果请到【送信历史】查看。
                        </div>
                        <div class="mail-body-wrap">
                            <textarea class="textarea" id="bulk-mail-body" rows="10" placeholder="请输入邮件内容"
                                      data-i18n-placeholder="customer.bulk.body_placeholder"></textarea>
                            <div class="mail-body-mask" id="bulk-mail-body-mask">邮件内容处理中，请稍候...</div>
                        </div>
                    </div>
                    <div class="bulk-mail-footer">
                        <div class="form-item">
                            <div class="form-label">附件</div>
                            <input class="input bulk-attachment-input" id="bulk-attachment-file" type="file" accept=".pdf,.doc,.docx,.jpg,.png,.jpeg,.xls,.xlsx"/>
                            <div id="bulk-attachment-source" class="hint bulk-attachment-hint" hidden></div>
                        </div>
                        <div class="mail-submit-row">
                            <button class="btn btn-primary" id="bulk-mail-send" type="button" data-i18n="customer.bulk.send">
                                发送
                            </button>
                        </div>
                    </div>
                </section>
                <div class="modal-divider" aria-hidden="true"></div>
                <aside class="recipients">
                    <div class="recipients-header">
                        <div class="recipients-title">
                            <span class="recipients-title-bar" aria-hidden="true"></span>
                            <span class="recipients-title-text" data-i18n="customer.bulk.recipients">收件人</span>
                        </div>
                        <div class="recipients-meta" id="bulk-mail-selected">已选 0 个客户</div>
                    </div>
                    <div class="recipients-filter">
                        <input class="input" id="bulk-recipient-filter" type="search" placeholder="按公司名过滤"/>
                    </div>
                    <div class="recipients-list" id="bulk-mail-recipients"></div>
                </aside>
            </div>
        </div>
    </section>
</div>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
    const i18n = window.I18N;
    if (i18n) {
        i18n.init();
        i18n.apply();
    }
    const t = (key) => (i18n ? i18n.t(key) : key);
    const format = (key, vars) => (i18n ? i18n.format(key, vars) : key);

    const bulkMailSubject = document.getElementById("bulk-mail-subject");
    const bulkMailBody = document.getElementById("bulk-mail-body");
    const bulkMailType = document.getElementById("bulk-mail-type");
    const bulkMailRecipients = document.getElementById("bulk-mail-recipients");
    const bulkMailSelected = document.getElementById("bulk-mail-selected");
    const bulkRecipientFilter = document.getElementById("bulk-recipient-filter");
    const bulkMailBodyMask = document.getElementById("bulk-mail-body-mask");
    const bulkMailSend = document.getElementById("bulk-mail-send");
    let bulkAttachmentFile = document.getElementById("bulk-attachment-file");
    const bulkAttachmentSource = document.getElementById("bulk-attachment-source");
    const bulkMailSendText = bulkMailSend ? bulkMailSend.textContent : "";

    const CONTEXT_KEY = "bulkMailContext";
    const PREFILL_KEY = "bulkMailPrefill";
    const TEMPLATE_SECTION = "mail-template";

    let customers = [];
    let selectedCustomerIdSet = new Set();
    let selectedCustomersSnapshot = [];
    let recipientSourceItems = [];
    let selectedCompanyIdSet = new Set();
    let selectedContactKeySet = new Set();
    let prefill = null;
    let prefillSource = "";
    let prefillIntro = "";
    let prefillAttachments = [];
    let currentAttachment = null;
    let templateSettingsCache = null;
    let isSendingBulkMail = false;

    const extractRecipients = (items) => {
        const groups = [];
        items.forEach((item) => {
            const companyEmail = String(item.company_email || "").trim();
            const contacts = [];
            const entries = [
                {index: 1, name: item.contact1_name, email: item.contact1_email},
                {index: 2, name: item.contact2_name, email: item.contact2_email},
                {index: 3, name: item.contact3_name, email: item.contact3_email},
            ];
            entries.forEach((entry) => {
                const email = (entry.email || "").trim();
                if (!email) return;
                const name = (entry.name || "").trim();
                const label = name
                    ? format("customer.bulk.contact", {index: entry.index, name})
                    : format("customer.bulk.contact_fallback", {index: entry.index, email});
                contacts.push({
                    key: `${String(item.id || "")}:contact:${entry.index}`,
                    label,
                    email,
                    recipient: {
                        email,
                        customer_id: item.id || "",
                        company_name: item.company_name || "",
                        contact_name: name,
                        recipient_type: "contact",
                    },
                });
            });

            groups.push({
                id: String(item.id || ""),
                company: item.company_name || t("customer.bulk.unnamed"),
                companyEmail,
                companyRecipient: companyEmail ? {
                    email: companyEmail,
                    customer_id: item.id || "",
                    company_name: item.company_name || "",
                    contact_name: "",
                    recipient_type: "company",
                } : null,
                contacts,
            });
        });
        return groups;
    };

    const updateBulkSelected = () => {
        const totalSelected = selectedCompanyIdSet.size + selectedContactKeySet.size;
        bulkMailSelected.textContent = format("customer.bulk.selected", {count: totalSelected});
    };

    const renderBulkRecipients = (items) => {
        const groups = extractRecipients(items);
        if (!groups.length) {
            bulkMailRecipients.innerHTML = `<div class="c-empty">${t("customer.bulk.empty")}</div>`;
            updateBulkSelected();
            return;
        }
        bulkMailRecipients.innerHTML = groups
            .map((group) => {
                const companyChecked = selectedCompanyIdSet.has(group.id) ? " checked" : "";
                const companyCheckDisabled = group.companyEmail ? "" : " disabled";
                const contactsHtml = group.contacts
                    .map(
                        (contact) => `
                        <label class="contact-row">
                            <input class="contact-check" type="checkbox" data-email="${contact.email}" data-company="${group.id}" data-contact-key="${contact.key}"${selectedContactKeySet.has(contact.key) ? " checked" : ""}>
                            <div class="contact-info">
                                <div class="contact-name">${contact.label}</div>
                                <div class="contact-email">${contact.email}</div>
                            </div>
                        </label>
                    `
                    )
                    .join("");
                const emptyContactHtml = `<div class="contact-row"><div></div><div class="contact-email">无可用邮箱联系人</div></div>`;
                return `
                        <div class="group-card" data-group-id="${group.id}">
                            <div class="group-header">
                                <div class="group-header-main">
                                    <label class="group-company-check" title="${group.companyEmail || t("customer.bulk.company_email_empty")}">
                                    <input class="company-check" type="checkbox" data-email="${group.companyEmail}" data-company="${group.id}"${companyChecked}${companyCheckDisabled}>
                                </label>
                                <div class="group-title-wrap">
                                    <div class="group-name">${group.company}</div>
                                    <div class="group-company-email">${group.companyEmail || t("customer.bulk.company_email_empty")}</div>
                                </div>
                            </div>
                        </div>
                        <div class="group-body">
                            ${contactsHtml || emptyContactHtml}
                        </div>
                    </div>
                `;
            })
            .join("");
        updateBulkSelected();
    };

    const readSelectedRecipients = () => {
        const recipients = [];
        const seen = new Set();
        extractRecipients(recipientSourceItems).forEach((group) => {
            if (selectedCompanyIdSet.has(group.id) && group.companyRecipient?.email) {
                const key = `company:${group.companyRecipient.email.toLowerCase()}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    recipients.push(group.companyRecipient);
                }
            }
            group.contacts.forEach((contact) => {
                if (selectedContactKeySet.has(contact.key) && contact.recipient?.email) {
                    const key = `contact:${contact.key}:${contact.recipient.email.toLowerCase()}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        recipients.push(contact.recipient);
                    }
                }
            });
        });
        return recipients;
    };

    const normalizeText = (value) => String(value || "").toLowerCase();

    const renderFilteredRecipients = () => {
        const keyword = normalizeText(bulkRecipientFilter ? bulkRecipientFilter.value.trim() : "");
        const items = keyword
            ? recipientSourceItems.filter((item) => normalizeText(item.company_name || item.company).includes(keyword))
            : recipientSourceItems;
        renderBulkRecipients(items);
    };

    const readJSONFromStorage = (key) => {
        try {
            const fromSession = sessionStorage.getItem(key);
            if (fromSession) return JSON.parse(fromSession);
            return JSON.parse(localStorage.getItem(key) || "null");
        } catch {
            return null;
        }
    };

    const isFreshPayload = (payload, maxAgeMs = 30 * 60 * 1000) => {
        if (!payload || typeof payload !== "object") return false;
        const ts = Number(payload.updatedAt);
        if (!Number.isFinite(ts)) return false;
        return Math.abs(Date.now() - ts) <= maxAgeMs;
    };

    const clearStoredPayloads = () => {
        sessionStorage.removeItem(CONTEXT_KEY);
        sessionStorage.removeItem(PREFILL_KEY);
        localStorage.removeItem(CONTEXT_KEY);
        localStorage.removeItem(PREFILL_KEY);
    };

    const clearStoredKey = (key) => {
        sessionStorage.removeItem(key);
        localStorage.removeItem(key);
    };

    const applyContextAndPrefill = () => {
        const contextRaw = readJSONFromStorage(CONTEXT_KEY);
        const prefillRaw = readJSONFromStorage(PREFILL_KEY);

        const hasFreshCustomerContext = Boolean(
            contextRaw
            && contextRaw.source === "customer"
            && isFreshPayload(contextRaw)
        );
        const hasFreshPrefill = Boolean(
            prefillRaw
            && typeof prefillRaw === "object"
            && isFreshPayload(prefillRaw)
        );

        if (contextRaw && !hasFreshCustomerContext) {
            clearStoredKey(CONTEXT_KEY);
        }
        if (prefillRaw && !hasFreshPrefill) {
            clearStoredKey(PREFILL_KEY);
        }

        const context = hasFreshCustomerContext ? contextRaw : null;
        const prefillCandidate = hasFreshPrefill ? prefillRaw : null;

        if (context && Array.isArray(context.selected_ids)) {
            selectedCustomerIdSet = new Set(context.selected_ids.map((id) => String(id)));
        }
        if (context && Array.isArray(context.selected_items)) {
            selectedCustomersSnapshot = context.selected_items;
        }

        // customer 入口不应继承其他入口的邮件内容
        if (context && prefillCandidate && String(prefillCandidate.source || "") !== "customer") {
            clearStoredKey(PREFILL_KEY);
            prefill = null;
            prefillSource = "";
            prefillIntro = "";
            prefillAttachments = [];
            return;
        }

        // 带 prefill 的入口（people / bpmatch）不应继承 customer 的收件人筛选上下文
        if (!context && prefillCandidate) {
            clearStoredKey(CONTEXT_KEY);
        }

        if (prefillCandidate) {
            prefillSource = String(prefillCandidate.source || "");
            prefill = {
                subject: String(prefillCandidate.subject || ""),
                body: String(prefillCandidate.body || ""),
                mailType: String(prefillCandidate.mail_type || "-1"),
            };
            prefillIntro = String(prefillCandidate.intro || "");
            prefillAttachments = Array.isArray(prefillCandidate.attachments) ? prefillCandidate.attachments : [];
            currentAttachment = prefillAttachments.length ? { ...prefillAttachments[0], source: "prefill" } : null;
            return;
        }

        prefill = null;
        prefillSource = "";
        prefillIntro = "";
        prefillAttachments = [];
        currentAttachment = null;
    };

    const fetchAllCustomers = async () => {
        const firstRes = await fetchWithAuth("/api/customers?page=1&page_size=200", {method: "GET"});
        const firstData = await firstRes.json();
        const firstPayload = normalizeApiResponse(firstData);
        if (!firstPayload.success) throw new Error(firstPayload.message || t("match.failed"));

        const firstItems = Array.isArray(firstPayload.data?.items) ? firstPayload.data.items : [];
        const totalPages = Number(firstPayload.meta?.total_pages || 1);
        if (totalPages <= 1) {
            return firstItems;
        }

        const all = [...firstItems];
        for (let page = 2; page <= totalPages; page += 1) {
            const res = await fetchWithAuth(`/api/customers?page=${page}&page_size=200`, {method: "GET"});
            const data = await res.json();
            const payload = normalizeApiResponse(data);
            if (!payload.success) continue;
            const items = Array.isArray(payload.data?.items) ? payload.data.items : [];
            all.push(...items);
        }
        return all;
    };

    const pickRenderCustomers = () => {
        if (Array.isArray(selectedCustomersSnapshot) && selectedCustomersSnapshot.length > 0) {
            return selectedCustomersSnapshot;
        }
        if (!selectedCustomerIdSet.size) return customers;
        return customers.filter((item) => selectedCustomerIdSet.has(String(item.id)));
    };

    const applyPrefillToForm = () => {
        if (!prefill) {
            bulkMailSubject.value = "";
            bulkMailBody.value = "";
            if (bulkMailType) bulkMailType.value = "-1";
            resetAttachmentInput();
            return;
        }
        bulkMailSubject.value = prefill.subject || "";
        bulkMailBody.value = prefill.body || "";
        if (bulkMailType) bulkMailType.value = prefill.mailType || "-1";
        if (bulkAttachmentFile && currentAttachment?.source !== "manual") {
            resetAttachmentInput();
        }
    };

    const escapeHtml = (value) => String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const readFileAsBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const result = reader.result || "";
            const base64 = typeof result === "string" && result.includes(",")
                ? result.split(",").pop()
                : result;
            resolve(base64);
        };
        reader.onerror = () => reject(reader.error || new Error("文件读取失败"));
        reader.readAsDataURL(file);
    });

    const getAttachmentPickerTextEl = () => {
        if (!bulkAttachmentFile) {
            return null;
        }
        if (bulkAttachmentFile.__localizedFileTextEl) {
            return bulkAttachmentFile.__localizedFileTextEl;
        }
        const picker = bulkAttachmentFile.parentElement
            ? bulkAttachmentFile.parentElement.querySelector("[data-file-i18n-wrapper='1'] .c-file-picker-name")
            : null;
        if (picker) {
            bulkAttachmentFile.__localizedFileTextEl = picker;
        }
        return picker;
    };

    const syncAttachmentPickerLabel = () => {
        const pickerText = getAttachmentPickerTextEl();
        if (!pickerText) {
            return;
        }
        const file = bulkAttachmentFile && bulkAttachmentFile.files && bulkAttachmentFile.files[0]
            ? bulkAttachmentFile.files[0]
            : null;
        pickerText.textContent = file && file.name ? file.name : "未选择文件";
    };

    const bindAttachmentInput = () => {
        if (!bulkAttachmentFile) {
            return;
        }
        bulkAttachmentFile.addEventListener("change", () => {
            const file = bulkAttachmentFile.files && bulkAttachmentFile.files[0]
                ? bulkAttachmentFile.files[0]
                : null;
            currentAttachment = file ? {
                source: "manual",
                filename: file.name || "attachment",
                file,
            } : null;
            renderAttachmentSource();
            syncAttachmentPickerLabel();
        });
    };

    const resetAttachmentInput = () => {
        if (!bulkAttachmentFile) {
            return;
        }
        bulkAttachmentFile.value = "";
        syncAttachmentPickerLabel();
    };

    const getActiveAttachment = () => currentAttachment;

    const buildAttachmentPreviewUrl = (attachment) => {
        const path = String(attachment?.path || "").trim();
        if (!path) {
            return "";
        }
        return `/api/ss/${encodeURIComponent(path)}`;
    };

    const renderAttachmentSource = () => {
        if (!bulkAttachmentSource) {
            return;
        }
        const activeAttachment = getActiveAttachment();
        if (!activeAttachment) {
            bulkAttachmentSource.hidden = true;
            bulkAttachmentSource.innerHTML = "";
            return;
        }
        const safeName = escapeHtml(activeAttachment.filename || "attachment");
        bulkAttachmentSource.hidden = false;
        if (activeAttachment.source === "manual") {
            bulkAttachmentSource.innerHTML = `当前附件：${safeName}（手动选择） <button type="button" class="c-btn-link" data-action="remove-attachment">移除</button>`;
            return;
        }
        const previewUrl = buildAttachmentPreviewUrl(activeAttachment);
        if (previewUrl) {
            bulkAttachmentSource.innerHTML = `当前简历：${safeName}（来自人员页） <a href="${escapeHtml(previewUrl)}" target="_blank" rel="noopener noreferrer">预览</a> <button type="button" class="c-btn-link" data-action="remove-attachment">移除</button>`;
            return;
        }
        bulkAttachmentSource.innerHTML = `当前简历：${safeName}（来自人员页） <button type="button" class="c-btn-link" data-action="remove-attachment">移除</button>`;
    };

    const setBodyBusyState = ({ busy, message, disableSend }) => {
        if (bulkMailBodyMask) {
            bulkMailBodyMask.textContent = message || "邮件内容处理中，请稍候...";
            bulkMailBodyMask.classList.toggle("show", Boolean(busy));
        }
        if (bulkMailBody) {
            bulkMailBody.classList.toggle("is-processing", Boolean(busy));
        }
        if (bulkMailSend && disableSend !== undefined) {
            bulkMailSend.disabled = Boolean(disableSend);
        }
    };

    const setBulkSendingState = (isSending) => {
        isSendingBulkMail = Boolean(isSending);
        setBodyBusyState({
            busy: isSending,
            message: "邮件发送中，请稍候...",
            disableSend: isSending,
        });
        if (bulkMailSend) {
            bulkMailSend.textContent = isSending ? "发送中..." : bulkMailSendText;
        }
    };

    const getTemplateNameByMailType = (mailType) => {
        const normalized = String(mailType || "").trim();
        if (normalized === "1") return "technician";
        if (normalized === "2") return "anjian";
        return "";
    };

    const loadTemplateSettings = async () => {
        if (templateSettingsCache) {
            return templateSettingsCache;
        }
        const res = await fetchWithAuth(`/api/sys-settings/${TEMPLATE_SECTION}`, {
            method: "GET",
            credentials: "include",
        });
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json().catch(() => ({}));
        const payload = normalizeApiResponse(data);
        if (!payload.success) {
            throw new Error(payload.message || "加载模板失败");
        }
        templateSettingsCache = payload.data && typeof payload.data.settings === "object" && payload.data.settings
            ? payload.data.settings
            : {};
        return templateSettingsCache;
    };

    const applyInitialTemplateByMailType = async () => {
        if (!bulkMailBody || bulkMailBody.value.trim()) {
            return;
        }
        const templateName = getTemplateNameByMailType(bulkMailType ? bulkMailType.value : "");
        if (!templateName) {
            return;
        }
        setBodyBusyState({
            busy: true,
            message: "邮件模板加载中，请稍候...",
            disableSend: true,
        });
        try {
            const settingsPayload = await loadTemplateSettings();
            const templateContent = String(settingsPayload[templateName] || "").trim();
            if (templateContent && !bulkMailBody.value.trim()) {
                bulkMailBody.value = templateContent;
            }
        } catch (error) {
            console.error("load bulk mail template failed", error);
        } finally {
            setBodyBusyState({
                busy: false,
                message: "邮件内容处理中，请稍候...",
                disableSend: false,
            });
        }
    };

    const enrichPrefillFromProjectDetail = async () => {
        if (!prefill) return;
        const extractApiBySource = {
            bpmatch: "/api/extract-project-detail",
            people: "/api/extract-technician-detail",
        };
        const extractApi = extractApiBySource[prefillSource];
        if (!extractApi) return;
        const sourceText = prefillSource === "people"
            ? String(prefillIntro || "").trim()
            : String(prefill.body || "").trim();
        if (!sourceText) return;
        const requestBody = prefillSource === "people"
            ? {
                selection: {
                    person: {
                        intro: sourceText,
                    },
                },
            }
            : {
                selection: {
                    job: {
                        detail: sourceText,
                    },
                },
            };
        setBodyBusyState({
            busy: true,
            message: "邮件内容处理中，请稍候...",
            disableSend: true,
        });
        try {
            const res = await fetchWithAuth(extractApi, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(requestBody),
            });
            const data = await res.json().catch(() => ({}));
            const payload = normalizeApiResponse(data);
            if (!payload.success) return;
            const formatted = String(payload.data?.body || "").trim();
            if (!formatted) return;
            prefill.body = formatted;
            applyPrefillToForm();
        } catch (error) {
            console.error("extract prefill detail failed", error);
        } finally {
            setBodyBusyState({
                busy: false,
                message: "邮件内容处理中，请稍候...",
                disableSend: false,
            });
        }
    };

    bulkMailRecipients.addEventListener("change", (event) => {
        if (event.target.matches(".company-check, .contact-check")) {
            const isCompany = event.target.matches(".company-check");
            const targetKey = isCompany
                ? String(event.target.dataset.company || "")
                : String(event.target.dataset.contactKey || "");
            if (targetKey) {
                const targetSet = isCompany
                    ? selectedCompanyIdSet
                    : selectedContactKeySet;
                if (event.target.checked) {
                    targetSet.add(targetKey);
                } else {
                    targetSet.delete(targetKey);
                }
            }
            updateBulkSelected();
        }
    });

    if (bulkRecipientFilter) {
        bulkRecipientFilter.addEventListener("input", () => {
            renderFilteredRecipients();
        });
    }

    if (bulkAttachmentSource) {
        bulkAttachmentSource.addEventListener("click", (event) => {
            const target = event.target.closest('[data-action="remove-attachment"]');
            if (!target) {
                return;
            }
            currentAttachment = null;
            prefillAttachments = [];
            resetAttachmentInput();
            renderAttachmentSource();
        });
    }

    bindAttachmentInput();

    bulkMailSend.addEventListener("click", async () => {
        if (isSendingBulkMail) {
            return;
        }
        const recipients = readSelectedRecipients();
        const subject = bulkMailSubject.value.trim();
        const body = bulkMailBody.value.trim();
        const mailType = bulkMailType ? bulkMailType.value : "";

        if (!recipients.length) {
            alert(t("customer.bulk.alert.recipient_required"));
            return;
        }
        if (!subject) {
            alert(t("customer.bulk.alert.subject_required"));
            return;
        }
        if (!body) {
            alert(t("customer.bulk.alert.body_required"));
            return;
        }

        setBulkSendingState(true);
        try {
            const activeAttachment = getActiveAttachment();
            const attachmentsPayload = activeAttachment
                ? activeAttachment.source === "manual"
                    ? [{
                        filename: activeAttachment.filename || "attachment",
                        content_type: activeAttachment.file.type || "application/octet-stream",
                        content: await readFileAsBase64(activeAttachment.file),
                    }]
                    : [{
                        filename: activeAttachment.filename || "attachment",
                        path: activeAttachment.path || "",
                        content_type: activeAttachment.content_type || "application/octet-stream",
                    }]
                : [];
            const response = await fetchWithAuth("/api/send-bulk-mail", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    subject,
                    body,
                    mail_type: mailType,
                    recipients,
                    attachments: attachmentsPayload,
                }),
            });
            const data = await response.json().catch(() => ({}));
            const payload = normalizeApiResponse(data);
            if (!response.ok || !payload.success) {
                throw new Error(payload.message || t("customer.bulk.alert.send_failed"));
            }
            alert(t("customer.bulk.alert.sent"));
            clearStoredPayloads();
            window.location.href = "customer.html";
        } catch (error) {
            alert(error.message || t("customer.bulk.alert.send_failed"));
        } finally {
            setBulkSendingState(false);
        }
    });

    applyContextAndPrefill();
    if (selectedCustomersSnapshot.length > 0) {
        recipientSourceItems = selectedCustomersSnapshot;
        renderFilteredRecipients();
        applyPrefillToForm();
        renderAttachmentSource();
    }
    fetchAllCustomers()
        .then((items) => {
            customers = Array.isArray(items) ? items : [];
            recipientSourceItems = pickRenderCustomers();
            renderFilteredRecipients();
            applyPrefillToForm();
            renderAttachmentSource();
        })
        .catch((error) => {
            console.error("load customers failed", error);
            customers = [];
            recipientSourceItems = [];
            renderFilteredRecipients();
            applyPrefillToForm();
            renderAttachmentSource();
        });
    Promise.resolve()
        .then(() => enrichPrefillFromProjectDetail())
        .then(() => applyInitialTemplateByMailType());
</script>
</body>
</html>
