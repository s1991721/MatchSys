<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title>案件一覧</title>
  <style>
    :root {
      --exhibit-ink: #172033;
      --exhibit-muted: #647084;
      --exhibit-line: #e0e6ef;
      --exhibit-panel: #ffffff;
      --exhibit-accent: #1d4ed8;
      --exhibit-accent-soft: #eaf2ff;
      --exhibit-blue: #2563eb;
    }

    body {
      background: #f3f6fa;
      color: var(--exhibit-ink);
    }

    .case-exhibit-page {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(120deg, rgba(28, 123, 255, 0.12), transparent 36%),
        linear-gradient(180deg, #ffffff 0%, #f3f6fa 100%);
    }

    .case-wrap {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    .case-focus-area {
      min-height: min(650px, 88vh);
      display: grid;
      gap: 18px;
      padding: 74px 0 48px;
      align-content: center;
    }

    .case-focus-area > .case-section-head {
      display: none;
    }

    .case-section-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
    }

    .case-section-label {
      display: block;
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .case-section-head h1,
    .case-section-head h2 {
      margin: 6px 0 0;
      letter-spacing: 0;
      line-height: 1.12;
    }

    .case-section-head h1 {
      font-size: clamp(30px, 5vw, 54px);
    }

    .case-section-head h2 {
      font-size: 28px;
    }

    .case-section-copy {
      max-width: 650px;
      margin: 8px 0 0;
      color: #405066;
      line-height: 1.75;
      font-size: 15px;
    }

    .case-count {
      flex: 0 0 auto;
      color: var(--exhibit-muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .case-carousel {
      position: relative;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .case-carousel-viewport {
      overflow: visible;
      margin: 0;
      padding: 0;
    }

    .case-carousel-track {
      display: block;
    }

    .case-slide {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(310px, 0.72fr);
      gap: 40px;
      padding: 0;
      align-items: center;
      background: transparent;
      animation: case-slide-in 0.54s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .case-summary-wrap {
      position: relative;
      max-width: 760px;
      margin-top: 20px;
    }

    .case-detail-toggle {
      display: none;
      min-height: 34px;
      margin-top: 8px;
      padding: 8px 13px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: var(--exhibit-blue);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(23, 32, 51, 0.1);
    }

    .case-summary-wrap.has-overflow:not(.is-expanded) .case-summary {
      -webkit-mask-image: linear-gradient(180deg, #000 54%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 54%, transparent 100%);
    }

    .case-summary-wrap.has-overflow:not(.is-expanded) .case-detail-toggle {
      display: inline-flex;
      align-items: center;
    }

    .case-carousel::before,
    .case-carousel::after {
      display: none;
    }

    .case-slide-main {
      display: grid;
      align-content: start;
      min-width: 0;
    }

    .case-kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .case-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 6px 10px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
    }

    .case-pill.is-status {
      color: var(--exhibit-accent);
      background: var(--exhibit-accent-soft);
      border-color: rgba(28, 123, 255, 0.22);
    }

    .case-pill.is-urgent {
      color: #7c2d12;
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .case-slide h2 {
      margin: 0;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .case-summary {
      margin: 0;
      color: #405066;
      font-size: 18px;
      line-height: 1.75;
    }

    .case-summary-wrap:not(.is-expanded) .case-summary {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .case-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .case-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 34px;
    }

    .case-metric {
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: #fff;
    }

    .case-metric span,
    .case-fact span,
    .case-card-foot span {
      display: block;
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .case-metric strong,
    .case-fact strong {
      display: block;
      margin-top: 8px;
      line-height: 1.35;
    }

    .case-metric strong {
      font-size: 20px;
    }

    .case-judge-panel {
      display: grid;
      min-width: 0;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 44px rgba(23, 32, 51, 0.08);
      overflow: hidden;
    }

    .case-judge-head {
      padding: 20px 22px;
      border-bottom: 1px solid var(--exhibit-line);
    }

    .case-judge-head h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .case-facts {
      display: grid;
    }

    .case-fact {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--exhibit-line);
      align-items: start;
    }

    .case-fact:last-child {
      border-bottom: 0;
    }

    .case-judge-tags {
      display: grid;
      gap: 10px;
      padding: 16px 22px 20px;
      border-top: 1px solid var(--exhibit-line);
      background: #f8fafc;
    }

    .case-judge-tags span {
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .case-judge-tags div {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .case-judge-tags strong {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 6px 9px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font-size: 12px;
      line-height: 1;
    }

    .case-carousel-bar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      margin-top: 22px;
      padding: 0;
      border-top: 0;
      background: transparent;
    }

    .case-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .case-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(23, 32, 51, 0.05);
    }

    .case-tab.is-active {
      color: var(--exhibit-accent);
      background: var(--exhibit-accent-soft);
      border-color: rgba(28, 123, 255, 0.22);
    }

    .case-carousel-controls {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .case-icon-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #243247;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(23, 32, 51, 0.05);
    }

    .case-other-area {
      padding: 38px 0 54px;
      border-top: 1px solid var(--exhibit-line);
      background: rgba(255, 255, 255, 0.68);
    }

    .case-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .case-public-card {
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 12px;
      min-height: 286px;
      padding: 18px;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: var(--exhibit-panel);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.05);
    }

    .case-public-card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .case-public-card p {
      margin: 0;
      color: #405066;
      font-size: 14px;
      line-height: 1.72;
    }

    .case-card-topline,
    .case-card-meta,
    .case-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .case-card-topline span,
    .case-card-meta span,
    .case-card-tags span {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 6px 9px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
    }

    .case-card-topline .is-open {
      color: #7c2d12;
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .case-card-foot {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding-top: 2px;
    }

    .case-compact-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .case-compact-item {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 14px;
      align-items: center;
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: #344258;
      font-size: 13px;
    }

    .case-compact-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 800;
      color: var(--exhibit-ink);
    }

    .case-compact-status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 5px 8px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font-size: 12px;
      line-height: 1;
    }

    .case-compact-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .case-compact-meta {
      white-space: nowrap;
      color: #405066;
      font-weight: 700;
    }

    .case-footer {
      border-top: 1px solid var(--exhibit-line);
      background: #fff;
    }

    .case-footer-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 28px 0;
    }

    .case-footer h2 {
      margin: 0;
      font-size: 22px;
    }

    .case-footer p {
      margin: 8px 0 0;
      color: var(--exhibit-muted);
      line-height: 1.7;
    }

    .case-toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      max-width: min(360px, calc(100vw - 40px));
      padding: 12px 14px;
      border-radius: 8px;
      background: #172033;
      color: #fff;
      box-shadow: 0 16px 36px rgba(23, 32, 51, 0.18);
      font-size: 13px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .case-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes case-slide-in {
      from {
        opacity: 0;
        transform: translateX(18px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @media (max-width: 980px) {
      .case-focus-area {
        min-height: auto;
        padding: 34px 0 30px;
      }

      .case-slide {
        grid-template-columns: 1fr;
        min-height: 760px;
        padding: 0;
      }

      .case-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .case-wrap {
        width: min(100% - 24px, 1180px);
      }

      .case-carousel::before,
      .case-carousel::after {
        display: none;
      }

      .case-section-head,
      .case-carousel-bar,
      .case-footer-inner {
        align-items: start;
        flex-direction: column;
      }

      .case-section-head,
      .case-footer-inner {
        display: flex;
      }

      .case-slide h2 {
        font-size: 34px;
      }

      .case-summary {
        font-size: 16px;
      }

      .case-metrics,
      .case-card-grid {
        grid-template-columns: 1fr;
      }

      .case-compact-item {
        grid-template-columns: 1fr;
        gap: 8px;
        align-items: start;
      }

      .case-compact-title {
        align-items: start;
      }

      .case-fact {
        grid-template-columns: 92px minmax(0, 1fr);
        padding: 14px 16px;
      }

      .case-actions,
      .case-actions .c-btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .case-carousel-track,
      .case-slide {
        transition: none;
      }
    }
  </style>
</head>
<body>
<main class="case-exhibit-page">
  <section class="case-focus-area case-wrap" aria-labelledby="focusCasesTitle">
    <div class="case-section-head">
      <div>
        <span class="case-section-label">PRIORITY CASES</span>
        <h1 id="focusCasesTitle">重点推薦案件</h1>
        <p class="case-section-copy">現在優先的に進めており、早めに候補者のご提案をいただきたい案件を掲載しています。各スライドは独立した案件として、推薦重点を素早く確認できます。</p>
      </div>
      <span class="case-count" id="focusCaseCount"></span>
    </div>

    <div class="case-carousel" aria-roledescription="carousel">
      <div class="case-carousel-viewport">
        <div class="case-carousel-track" id="focusTrack"></div>
      </div>
      <div class="case-carousel-bar">
        <div class="case-tabs" id="focusTabs" aria-label="注目案件の選択"></div>
        <div class="case-carousel-controls" aria-label="カルーセル操作">
          <button class="case-icon-btn" type="button" id="prevCaseBtn" aria-label="前の案件">‹</button>
          <button class="case-icon-btn" type="button" id="nextCaseBtn" aria-label="次の案件">›</button>
        </div>
      </div>
    </div>
  </section>

  <section class="case-other-area" aria-labelledby="otherCasesTitle">
    <div class="case-wrap">
      <div class="case-section-head">
        <div>
          <span class="case-section-label">FOCUS CASES</span>
          <h2 id="otherCasesTitle">注力案件</h2>
          <p class="case-section-copy">以下の案件も候補者推薦を受け付けています。正式推薦の前に、顧客、商流、単価、参画条件を改めて確認します。</p>
        </div>
        <span class="case-count" id="otherCaseCount"></span>
      </div>
      <div class="case-card-grid" id="otherCaseGrid"></div>
      <div class="case-compact-list" id="otherCaseList" aria-label="注力案件の簡易一覧"></div>
    </div>
  </section>

  <section class="case-footer">
    <div class="case-footer-inner case-wrap">
      <div>
        <h2>候補者が案件に合うか確認しますか？</h2>
        <p>候補者概要、希望単価、参画可能時期を添えてご連絡ください。公開条件をもとに、まずマッチ度を確認します。</p>
      </div>
      <div class="case-actions">
        <a class="c-btn c-btn-primary" id="recommendContact" href="#">候補者を推薦</a>
        <button class="c-btn c-btn-ghost" type="button" id="copyContactBtn">連絡文をコピー</button>
      </div>
    </div>
  </section>
</main>

<div class="case-toast" id="caseToast" role="status" aria-live="polite"></div>

    {
      type: CASE_TYPES.summary,
      title: "会計周辺バッチ改修案件9",
      status: "候補確認中",
      unitPrice: "54万〜66万円",
      location: "東京 週1出社",
      startAt: "2026年8月下旬"
    }
  ];

  const getCasesByType = (type) => caseList.filter((item) => item.type === type);
  const focusCases = getCasesByType(CASE_TYPES.priority);
  const otherCases = getCasesByType(CASE_TYPES.focus);
  const summaryCases = getCasesByType(CASE_TYPES.summary);

  const escapeHtml = (value) => String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  let activeCaseIndex = 0;
  let autoTimer = null;
  const expandedSummaries = new Set();

  const renderFocusSlide = (item) => `
      <article class="case-slide">
        <div class="case-slide-main">
          <div class="case-kicker">
            <span class="case-pill ${item.status === "急募" ? "is-urgent" : "is-status"}">${escapeHtml(item.status)}</span>
            <span class="case-pill">更新日 ${escapeHtml(item.updatedAt)}</span>
          </div>
          <h2>${escapeHtml(item.title)}</h2>
          <div class="case-summary-wrap ${expandedSummaries.has(activeCaseIndex) ? "is-expanded" : ""}">
            <p class="case-summary">${escapeHtml(item.summary)}</p>
            <button class="case-detail-toggle" type="button" data-expand-summary>詳細</button>
          </div>
          <div class="case-actions">
            <a class="c-btn c-btn-primary c-btn-lg" href="mailto:${contactEmail}?subject=${encodeURIComponent(item.title + " についての問い合わせ")}">案件を問い合わせる</a>
            <button class="c-btn c-btn-ghost c-btn-lg" type="button" data-copy-summary="${escapeHtml(item.title)}">概要をコピー</button>
          </div>
          <div class="case-metrics">
            <div class="case-metric"><span>単価</span><strong>${escapeHtml(item.unitPrice)}</strong></div>
            <div class="case-metric"><span>場所</span><strong>${escapeHtml(item.location)}</strong></div>
            <div class="case-metric"><span>開始時期</span><strong>${escapeHtml(item.startAt)}</strong></div>
            <div class="case-metric"><span>面談</span><strong>${escapeHtml(item.interview)}</strong></div>
          </div>
        </div>
        <aside class="case-judge-panel" aria-label="${escapeHtml(item.title)} 条件概要">
          <div class="case-judge-head">
            <h3>条件概要</h3>
          </div>
          <div class="case-facts">
            ${item.facts.map((fact) => `
              <div class="case-fact">
                <span>${escapeHtml(fact.label)}</span>
                <strong>${escapeHtml(fact.value)}</strong>
              </div>
            `).join("")}
          </div>
          <div class="case-judge-tags">
            <span>キーワード</span>
            <div>
              ${(item.tags || []).map((tag) => `<strong>${escapeHtml(tag)}</strong>`).join("")}
            </div>
          </div>
        </aside>
      </article>
    `;

  const renderFocusSlides = () => {
    document.getElementById("focusTrack").innerHTML = renderFocusSlide(focusCases[activeCaseIndex]);
    window.requestAnimationFrame(updateFocusOverflow);
  };

  const normalizeCaseIndex = (index) => (index + focusCases.length) % focusCases.length;

  const updateFocusOverflow = () => {
    const summaryWrap = document.querySelector("#focusTrack .case-summary-wrap");
    const summary = summaryWrap?.querySelector(".case-summary");
    if (!summaryWrap || !summary || summaryWrap.classList.contains("is-expanded")) return;
    summaryWrap.classList.toggle("has-overflow", summary.scrollHeight > summary.clientHeight + 1);
  };

  const renderTabs = () => {
    document.getElementById("focusTabs").innerHTML = focusCases.map((item, index) => `
      <button class="case-tab ${index === activeCaseIndex ? "is-active" : ""}" type="button" data-index="${index}">
        ${index + 1}. ${escapeHtml(item.title)}
      </button>
    `).join("");
  };

  const renderOtherCards = () => {
    document.getElementById("otherCaseGrid").innerHTML = otherCases.map((item) => `
      <article class="case-public-card">
        <div class="case-card-topline">
          <span class="${item.status === "急募" ? "is-open" : ""}">${escapeHtml(item.status)}</span>
        </div>
        <h3>${escapeHtml(item.title)}</h3>
        <p>${escapeHtml(item.summary)}</p>
        <div class="case-card-meta">
          <span>${escapeHtml(item.unitPrice)}</span>
          <span>${escapeHtml(item.location)}</span>
          <span>${escapeHtml(item.startAt)}</span>
        </div>
        <div class="case-card-tags">
          ${(item.tags || []).map((tag) => `<span>${escapeHtml(tag)}</span>`).join("")}
        </div>
        <div class="case-card-foot">
          <span>更新日 ${escapeHtml(item.updatedAt)}</span>
          <span>注力案件</span>
        </div>
      </article>
    `).join("");
  };

  const renderOtherList = () => {
    document.getElementById("otherCaseList").innerHTML = summaryCases.map((item) => `
      <article class="case-compact-item">
        <div class="case-compact-title">
          <span class="case-compact-status">${escapeHtml(item.status)}</span>
          <strong>${escapeHtml(item.title)}</strong>
        </div>
        <span class="case-compact-meta">${escapeHtml(item.unitPrice)}</span>
        <span class="case-compact-meta">${escapeHtml(item.location)}</span>
        <span class="case-compact-meta">${escapeHtml(item.startAt)}</span>
      </article>
    `).join("");
  };

  const setActiveCase = (index, mode = "absolute") => {
    activeCaseIndex = normalizeCaseIndex(mode === "relative" ? activeCaseIndex + index : index);
    renderFocusSlides();
    renderTabs();
  };

  const buildSummaryText = (item) => [
    `【案件】${item.title}`,
    `【概要】${item.summary}`,
    `【単価】${item.unitPrice}`,
    `【場所】${item.location}`,
    `【開始時期】${item.startAt}`,
    `【キーワード】${item.tags.join(" / ")}`
  ].join("\n");

  const showToast = (message) => {
    const toast = document.getElementById("caseToast");
    toast.textContent = message;
    toast.classList.add("is-visible");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => {
      toast.classList.remove("is-visible");
    }, 2200);
  };

  const copyText = async (text, successMessage) => {
    try {
      await navigator.clipboard.writeText(text);
      showToast(successMessage);
    } catch (err) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "readonly");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      showToast(successMessage);
    }
  };

  const buildContactText = () => [
    `${focusCases[activeCaseIndex].title} について候補者を推薦します。`,
    "",
    "候補者概要：",
    "希望単価：",
    "稼働開始：",
    "出社可否：",
    "日本語：",
    "",
    "ご確認よろしくお願いいたします。"
  ].join("\n");

  const startAutoPlay = () => {
    window.clearInterval(autoTimer);
    autoTimer = window.setInterval(() => setActiveCase(1, "relative"), 5200);
  };

  document.getElementById("focusCaseCount").textContent = `${focusCases.length}件の重点推薦`;
  document.getElementById("otherCaseCount").textContent = `${caseList.length}件`;
  document.getElementById("recommendContact").href = `mailto:${contactEmail}?subject=${encodeURIComponent("候補者推薦")}`;

  setActiveCase(0);
  renderOtherCards();
  renderOtherList();
  startAutoPlay();

  document.getElementById("focusTabs").addEventListener("click", (event) => {
    const button = event.target.closest("[data-index]");
    if (!button) return;
    setActiveCase(Number(button.dataset.index), "absolute");
    startAutoPlay();
  });

  document.getElementById("prevCaseBtn").addEventListener("click", () => {
    setActiveCase(-1, "relative");
    startAutoPlay();
  });

  document.getElementById("nextCaseBtn").addEventListener("click", () => {
    setActiveCase(1, "relative");
    startAutoPlay();
  });

  document.getElementById("focusTrack").addEventListener("click", (event) => {
    const expandButton = event.target.closest("[data-expand-summary]");
    if (expandButton) {
      expandedSummaries.add(activeCaseIndex);
      window.clearInterval(autoTimer);
      renderFocusSlides();
      return;
    }

    const button = event.target.closest("[data-copy-summary]");
    if (!button) return;
    copyText(buildSummaryText(focusCases[activeCaseIndex]), "案件概要をコピーしました");
  });

  window.addEventListener("resize", updateFocusOverflow);

  document.getElementById("copyContactBtn").addEventListener("click", () => {
    copyText(buildContactText(), "連絡文テンプレートをコピーしました");
  });
</script>
