<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title>案件一覧</title>
  <style>
    :root {
      --exhibit-ink: #172033;
      --exhibit-muted: #647084;
      --exhibit-line: #e0e6ef;
      --exhibit-panel: #ffffff;
      --exhibit-accent: #1d4ed8;
      --exhibit-accent-soft: #eaf2ff;
      --exhibit-blue: #2563eb;
    }

    body {
      background: #f3f6fa;
      color: var(--exhibit-ink);
    }

    .case-exhibit-page {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(120deg, rgba(28, 123, 255, 0.12), transparent 36%),
        linear-gradient(180deg, #ffffff 0%, #f3f6fa 100%);
    }

    .case-wrap {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    .case-focus-area {
      min-height: min(650px, 88vh);
      display: grid;
      gap: 18px;
      padding: 74px 0 48px;
      align-content: center;
    }

    .case-focus-area > .case-section-head {
      display: none;
    }

    .case-section-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
    }

    .case-section-label {
      display: block;
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .case-section-head h1,
    .case-section-head h2 {
      margin: 6px 0 0;
      letter-spacing: 0;
      line-height: 1.12;
    }

    .case-section-head h1 {
      font-size: clamp(30px, 5vw, 54px);
    }

    .case-section-head h2 {
      font-size: 28px;
    }

    .case-section-copy {
      max-width: 650px;
      margin: 8px 0 0;
      color: #405066;
      line-height: 1.75;
      font-size: 15px;
    }

    .case-count {
      flex: 0 0 auto;
      color: var(--exhibit-muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .case-carousel {
      position: relative;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
      min-width: 0;
    }

    .case-carousel-viewport {
      overflow: visible;
      margin: 0;
      padding: 0;
      min-width: 0;
    }

    .case-carousel-track {
      display: block;
      min-width: 0;
    }

    .case-slide {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(310px, 0.72fr);
      gap: 40px;
      padding: 0;
      align-items: center;
      background: transparent;
      animation: case-slide-in 0.54s cubic-bezier(0.22, 1, 0.36, 1);
      min-width: 0;
    }

    .case-summary-wrap {
      position: relative;
      max-width: 760px;
      margin-top: 20px;
      min-width: 0;
    }

    .case-detail-toggle {
      display: none;
      min-height: 34px;
      margin-top: 8px;
      padding: 8px 13px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: var(--exhibit-blue);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(23, 32, 51, 0.1);
    }

    .case-summary-wrap.has-overflow:not(.is-expanded) .case-summary {
      -webkit-mask-image: linear-gradient(180deg, #000 54%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 54%, transparent 100%);
    }

    .case-summary-wrap.has-overflow:not(.is-expanded) .case-detail-toggle {
      display: inline-flex;
      align-items: center;
    }

    .case-carousel::before,
    .case-carousel::after {
      display: none;
    }

    .case-slide-main {
      display: grid;
      align-content: start;
      min-width: 0;
    }

    .case-kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .case-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 6px 10px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .case-pill.is-status {
      color: var(--exhibit-accent);
      background: var(--exhibit-accent-soft);
      border-color: rgba(28, 123, 255, 0.22);
    }

    .case-pill.is-urgent {
      color: #7c2d12;
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .case-slide h2 {
      margin: 0;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .case-summary {
      margin: 0;
      color: #405066;
      font-size: 18px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .case-summary-wrap:not(.is-expanded) .case-summary {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .case-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
      min-width: 0;
    }

    .case-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 34px;
    }

    .case-metric {
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: #fff;
    }

    .case-metric span,
    .case-fact span,
    .case-card-foot span {
      display: block;
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .case-metric strong,
    .case-fact strong {
      display: block;
      margin-top: 8px;
      line-height: 1.35;
    }

    .case-metric strong {
      font-size: 20px;
    }

    .case-judge-panel {
      display: grid;
      min-width: 0;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 44px rgba(23, 32, 51, 0.08);
      overflow: hidden;
    }

    .case-judge-head {
      padding: 20px 22px;
      border-bottom: 1px solid var(--exhibit-line);
    }

    .case-judge-head h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .case-facts {
      display: grid;
    }

    .case-fact {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--exhibit-line);
      align-items: start;
    }

    .case-fact:last-child {
      border-bottom: 0;
    }

    .case-judge-tags {
      display: grid;
      gap: 10px;
      padding: 16px 22px 20px;
      border-top: 1px solid var(--exhibit-line);
      background: #f8fafc;
    }

    .case-judge-tags span {
      color: var(--exhibit-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .case-judge-tags div {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .case-judge-tags strong {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 6px 9px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font-size: 12px;
      line-height: 1;
    }

    .case-carousel-bar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      margin-top: 22px;
      padding: 0;
      border-top: 0;
      background: transparent;
    }

    .case-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .case-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(23, 32, 51, 0.05);
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .case-tab.is-active {
      color: var(--exhibit-accent);
      background: var(--exhibit-accent-soft);
      border-color: rgba(28, 123, 255, 0.22);
    }

    .case-carousel-controls {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .case-icon-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #243247;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(23, 32, 51, 0.05);
    }

    .case-other-area {
      padding: 38px 0 54px;
      border-top: 1px solid var(--exhibit-line);
      background: rgba(255, 255, 255, 0.68);
    }

    .case-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .case-public-card {
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 12px;
      min-height: 286px;
      padding: 18px;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: var(--exhibit-panel);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.05);
    }

    .case-public-card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .case-public-card p {
      margin: 0;
      color: #405066;
      font-size: 14px;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    .case-card-topline,
    .case-card-meta,
    .case-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .case-card-topline span,
    .case-card-meta span,
    .case-card-tags span {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 6px 9px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .case-card-topline .is-open {
      color: #7c2d12;
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .case-card-foot {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding-top: 2px;
    }

    .case-compact-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .case-compact-item {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 14px;
      align-items: center;
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid var(--exhibit-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: #344258;
      font-size: 13px;
    }

    .case-compact-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 800;
      color: var(--exhibit-ink);
    }

    .case-compact-status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 5px 8px;
      border: 1px solid var(--exhibit-line);
      border-radius: 999px;
      background: #fff;
      color: #344258;
      font-size: 12px;
      line-height: 1;
    }

    .case-compact-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .case-compact-meta {
      white-space: nowrap;
      color: #405066;
      font-weight: 700;
    }

    .case-footer {
      border-top: 1px solid var(--exhibit-line);
      background: #fff;
    }

    .case-footer-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 28px 0;
    }

    .case-footer h2 {
      margin: 0;
      font-size: 22px;
    }

    .case-footer p {
      margin: 8px 0 0;
      color: var(--exhibit-muted);
      line-height: 1.7;
    }

    .case-toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      max-width: min(360px, calc(100vw - 40px));
      padding: 12px 14px;
      border-radius: 8px;
      background: #172033;
      color: #fff;
      box-shadow: 0 16px 36px rgba(23, 32, 51, 0.18);
      font-size: 13px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .case-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .case-mobile-page {
      display: none;
    }

    .case-mobile-sheet {
      display: none;
    }

    @keyframes case-slide-in {
      from {
        opacity: 0;
        transform: translateX(18px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @media (max-width: 980px) {
      .case-focus-area {
        min-height: auto;
        padding: 34px 0 30px;
      }

      .case-slide {
        grid-template-columns: 1fr;
        gap: 22px;
        min-height: 0;
        padding: 0;
        width: 100%;
        max-width: 100%;
      }

      .case-slide h2 {
        font-size: clamp(34px, 7vw, 48px);
      }

      .case-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .case-focus-area,
      .case-other-area,
      .case-footer {
        display: none;
      }

      .case-wrap {
        width: min(100% - 24px, 1180px);
      }

      .case-exhibit-page {
        background: #f3f6fa;
      }

      .case-mobile-page {
        display: block;
        min-height: 100vh;
        padding: 18px 14px 28px;
      }

      .case-mobile-head {
        display: grid;
        margin-bottom: 6px;
      }

      .case-mobile-title-row {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
      }

      .case-mobile-brand {
        display: inline-flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
        width: fit-content;
        max-width: 100%;
        color: var(--exhibit-ink);
        text-decoration: none;
        white-space: nowrap;
      }

      .case-mobile-brand-mark {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 36px;
        height: 36px;
      }

      .case-mobile-brand-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .case-mobile-brand-name {
        display: inline-flex;
        gap: 4px;
        align-items: baseline;
        min-width: 0;
        overflow: hidden;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .case-mobile-brand-name strong {
        font: 700 13px/1 "Sora", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.035em;
      }

      .case-mobile-brand-name span {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .case-mobile-head h1 {
        flex: 0 0 auto;
        margin: 0;
        color: #2b374b;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .case-mobile-segments {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin: 0 -14px 14px;
        padding: 10px 14px;
        background: rgba(243, 246, 250, 0.94);
        backdrop-filter: blur(12px);
      }

      .case-mobile-segment {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 40px;
        border: 1px solid var(--exhibit-line);
        border-radius: 999px;
        background: #fff;
        color: #344258;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }

      .case-mobile-segment-count {
        font-size: 10px;
        font-weight: 500;
        line-height: 1;
        opacity: 0.7;
      }

      .case-mobile-segment.is-active {
        border-color: rgba(29, 78, 216, 0.24);
        background: var(--exhibit-accent-soft);
        color: var(--exhibit-accent);
      }

      .case-mobile-list {
        display: grid;
        gap: 12px;
      }

      .case-mobile-empty {
        padding: 22px 16px;
        border: 1px solid var(--exhibit-line);
        border-radius: 8px;
        background: #fff;
        color: var(--exhibit-muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .case-mobile-card {
        display: grid;
        gap: 12px;
        width: 100%;
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--exhibit-line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 22px rgba(23, 32, 51, 0.06);
        text-align: left;
      }

      .case-mobile-card-top,
      .case-mobile-card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .case-mobile-badge,
      .case-mobile-date,
      .case-mobile-tag {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        min-height: 26px;
        padding: 6px 9px;
        border: 1px solid var(--exhibit-line);
        border-radius: 999px;
        background: #fff;
        color: #344258;
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
        overflow-wrap: anywhere;
      }

      .case-mobile-badge {
        border-color: rgba(28, 123, 255, 0.22);
        background: var(--exhibit-accent-soft);
        color: var(--exhibit-accent);
      }

      .case-mobile-badge.is-urgent {
        border-color: #fed7aa;
        background: #fff7ed;
        color: #7c2d12;
      }

      .case-mobile-date {
        color: var(--exhibit-muted);
      }

      .case-mobile-card h2 {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        color: var(--exhibit-ink);
        font-size: 20px;
        line-height: 1.35;
        letter-spacing: 0;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow-wrap: anywhere;
      }

      .case-mobile-card p {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        color: #405066;
        font-size: 14px;
        line-height: 1.68;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow-wrap: anywhere;
      }

      .case-mobile-metrics {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .case-mobile-metric {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid #edf1f7;
        border-radius: 8px;
        background: #f8fafc;
      }

      .case-mobile-metric span {
        color: var(--exhibit-muted);
        font-size: 11px;
        font-weight: 800;
      }

      .case-mobile-metric strong {
        color: var(--exhibit-ink);
        font-size: 15px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .case-mobile-card-action {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .case-mobile-contact {
        min-width: 0;
        min-height: 44px;
        padding: 11px 14px;
        border-radius: 8px;
        font-weight: 800;
        white-space: normal;
      }

      .case-mobile-detail-link {
        min-height: 44px;
        border: 0;
        background: transparent;
        color: var(--exhibit-accent);
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }

      .case-mobile-sheet {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        align-items: end;
        pointer-events: none;
        visibility: hidden;
      }

      .case-mobile-sheet.is-open {
        pointer-events: auto;
        visibility: visible;
      }

      .case-mobile-sheet-backdrop {
        position: absolute;
        inset: 0;
        border: 0;
        background: rgba(15, 23, 42, 0.42);
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      .case-mobile-sheet.is-open .case-mobile-sheet-backdrop {
        opacity: 1;
      }

      .case-mobile-sheet-panel {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        max-height: min(86vh, 760px);
        border-radius: 16px 16px 0 0;
        background: #fff;
        box-shadow: 0 -18px 46px rgba(15, 23, 42, 0.2);
        overflow: hidden;
        transform: translateY(100%);
        transition: transform 0.22s ease;
      }

      .case-mobile-sheet.is-open .case-mobile-sheet-panel {
        transform: translateY(0);
      }

      .case-mobile-sheet-head {
        display: grid;

    }
    row.push(cell);
    if (row.some((value) => String(value).trim() !== "")) rows.push(row);
    if (!rows.length) return [];
    const headers = rows[0];
    return rows.slice(1).map((values) => headers.reduce((item, header, index) => {
      item[header] = values[index] || "";
      return item;
    }, {}));
  };

  const parseJsonList = (value) => {
    try {
      const parsed = JSON.parse(value || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  };

  const mapCsvRowToCase = (row) => ({
    type: row.type || "",
    title: row.title || row.sourceTitle || "",
    status: row.status || "",
    updatedAt: row.updatedAt || "",
    summary: row.summary || "",
    unitPrice: row.unitPrice || "",
    location: row.location || "",
    startAt: row.startAt || "",
    interview: row.interview || "",
    facts: parseJsonList(row.facts),
    tags: parseJsonList(row.tags)
  });

  const loadCasesFromCsv = async () => {
    try {
      const response = await fetch("case_exhibits.csv");
      if (!response.ok) return;
      const items = parseCsvText(await response.text())
        .map(mapCsvRowToCase)
        .filter((item) => item.type && item.title);
      caseList = items;
    } catch (err) {
      // Keep the built-in sample list if the CSV has not been published yet.
    }
  };

  const refreshCaseGroups = () => {
    focusCases = getCasesByType(CASE_TYPES.priority);
    otherCases = getCasesByType(CASE_TYPES.focus);
    summaryCases = getCasesByType(CASE_TYPES.summary);
    activeCaseIndex = 0;
    expandedSummaries.clear();
  };

	  let activeCaseIndex = 0;
	  let autoTimer = null;
	  const expandedSummaries = new Set();
	  let activeMobileMode = CASE_TYPES.priority;
	  let activeMobileCases = [];

  const renderFocusSlide = (item) => `
      <article class="case-slide">
        <div class="case-slide-main">
          <div class="case-kicker">
            <span class="case-pill ${item.status === "急募" ? "is-urgent" : "is-status"}">${escapeHtml(item.status)}</span>
            <span class="case-pill">更新日 ${escapeHtml(item.updatedAt)}</span>
          </div>
          <h2>${escapeHtml(item.title)}</h2>
          <div class="case-summary-wrap ${expandedSummaries.has(activeCaseIndex) ? "is-expanded" : ""}">
            <p class="case-summary">${escapeHtml(item.summary)}</p>
            <button class="case-detail-toggle" type="button" data-expand-summary>詳細</button>
          </div>
          <div class="case-actions">
            <a class="c-btn c-btn-primary c-btn-lg" href="mailto:${contactEmail}?subject=${encodeURIComponent(item.title + " についての問い合わせ")}">案件を問い合わせる</a>
            <button class="c-btn c-btn-ghost c-btn-lg" type="button" data-copy-summary="${escapeHtml(item.title)}">概要をコピー</button>
          </div>
          <div class="case-metrics">
            <div class="case-metric"><span>単価</span><strong>${escapeHtml(item.unitPrice)}</strong></div>
            <div class="case-metric"><span>場所</span><strong>${escapeHtml(item.location)}</strong></div>
            <div class="case-metric"><span>開始時期</span><strong>${escapeHtml(item.startAt)}</strong></div>
            <div class="case-metric"><span>面談</span><strong>${escapeHtml(item.interview)}</strong></div>
          </div>
        </div>
        <aside class="case-judge-panel" aria-label="${escapeHtml(item.title)} 条件概要">
          <div class="case-judge-head">
            <h3>条件概要</h3>
          </div>
          <div class="case-facts">
            ${(item.facts || []).map((fact) => `
              <div class="case-fact">
                <span>${escapeHtml(fact.label)}</span>
                <strong>${escapeHtml(fact.value)}</strong>
              </div>
            `).join("")}
          </div>
          <div class="case-judge-tags">
            <span>キーワード</span>
            <div>
              ${(item.tags || []).map((tag) => `<strong>${escapeHtml(tag)}</strong>`).join("")}
            </div>
          </div>
        </aside>
      </article>
    `;

  const renderFocusSlides = () => {
    if (!focusCases.length) {
      document.getElementById("focusTrack").innerHTML = '<article class="case-slide"><div class="case-slide-main"><h2>掲載案件は準備中です</h2><div class="case-summary-wrap"><p class="case-summary">最新の案件情報は担当営業までお問い合わせください。</p></div></div></article>';
      return;
    }
    document.getElementById("focusTrack").innerHTML = renderFocusSlide(focusCases[activeCaseIndex]);
    window.requestAnimationFrame(updateFocusOverflow);
  };

  const normalizeCaseIndex = (index) => focusCases.length ? (index + focusCases.length) % focusCases.length : 0;

  const updateFocusOverflow = () => {
    const summaryWrap = document.querySelector("#focusTrack .case-summary-wrap");
    const summary = summaryWrap?.querySelector(".case-summary");
    if (!summaryWrap || !summary || summaryWrap.classList.contains("is-expanded")) return;
    summaryWrap.classList.toggle("has-overflow", summary.scrollHeight > summary.clientHeight + 1);
  };

  const renderTabs = () => {
    document.getElementById("focusTabs").innerHTML = focusCases.map((item, index) => `
      <button class="case-tab ${index === activeCaseIndex ? "is-active" : ""}" type="button" data-index="${index}">
        ${index + 1}. ${escapeHtml(item.title)}
      </button>
    `).join("");
  };

  const renderOtherCards = () => {
    document.getElementById("otherCaseGrid").innerHTML = otherCases.map((item) => `
      <article class="case-public-card">
        <div class="case-card-topline">
          <span class="${item.status === "急募" ? "is-open" : ""}">${escapeHtml(item.status)}</span>
        </div>
        <h3>${escapeHtml(item.title)}</h3>
        <p>${escapeHtml(item.summary)}</p>
        <div class="case-card-meta">
          <span>${escapeHtml(item.unitPrice)}</span>
          <span>${escapeHtml(item.location)}</span>
          <span>${escapeHtml(item.startAt)}</span>
        </div>
        <div class="case-card-tags">
          ${(item.tags || []).map((tag) => `<span>${escapeHtml(tag)}</span>`).join("")}
        </div>
        <div class="case-card-foot">
          <span>更新日 ${escapeHtml(item.updatedAt)}</span>
          <span>注力案件</span>
        </div>
      </article>
    `).join("");
  };

	  const renderOtherList = () => {
	    document.getElementById("otherCaseList").innerHTML = summaryCases.map((item) => `
	      <article class="case-compact-item">
        <div class="case-compact-title">
          <span class="case-compact-status">${escapeHtml(item.status)}</span>
          <strong>${escapeHtml(item.title)}</strong>
        </div>
        <span class="case-compact-meta">${escapeHtml(item.unitPrice)}</span>
        <span class="case-compact-meta">${escapeHtml(item.location)}</span>
        <span class="case-compact-meta">${escapeHtml(item.startAt)}</span>
      </article>
	    `).join("");
	  };

	  const getMobileCases = () => {
	    if (activeMobileMode === CASE_TYPES.priority) return focusCases;
	    if (activeMobileMode === CASE_TYPES.focus) return otherCases;
	    return summaryCases;
	  };

	  const renderMobileCounts = () => {
	    document.getElementById("mobilePriorityCount").textContent = `${focusCases.length}件`;
	    document.getElementById("mobileFocusCount").textContent = `${otherCases.length}件`;
	    document.getElementById("mobileSummaryCount").textContent = `${summaryCases.length}件`;
	  };

	  const renderMobileTags = (item) => {
	    const tags = item.tags || [];
	    if (!tags.length) return "";
	    const visibleTags = tags.slice(0, 3);
	    const hiddenCount = tags.length - visibleTags.length;
	    return `
	      <div class="case-mobile-card-tags">
	        ${visibleTags.map((tag) => `<span class="case-mobile-tag">${escapeHtml(tag)}</span>`).join("")}
	        ${hiddenCount > 0 ? `<span class="case-mobile-tag">+${hiddenCount}</span>` : ""}
	      </div>
	    `;
	  };

	  const renderMobileCard = (item, index) => `
	    <article class="case-mobile-card" data-mobile-index="${index}" tabindex="0">
	      <div class="case-mobile-card-top">
	        <span class="case-mobile-badge ${item.status === "急募" ? "is-urgent" : ""}">${escapeHtml(item.status || "掲載中")}</span>
	        ${item.updatedAt ? `<span class="case-mobile-date">更新日 ${escapeHtml(item.updatedAt)}</span>` : ""}
	      </div>
	      <h2>${escapeHtml(item.title)}</h2>
	      <p>${escapeHtml(item.summary || "詳細条件は担当営業までお問い合わせください。")}</p>
	      <div class="case-mobile-metrics">
	        <div class="case-mobile-metric"><span>単価</span><strong>${escapeHtml(item.unitPrice || "-")}</strong></div>
	        <div class="case-mobile-metric"><span>場所</span><strong>${escapeHtml(item.location || "-")}</strong></div>
	        <div class="case-mobile-metric"><span>開始時期</span><strong>${escapeHtml(item.startAt || "-")}</strong></div>
	      </div>
	      ${renderMobileTags(item)}
	      <div class="case-mobile-card-action">
	        <a class="c-btn c-btn-primary case-mobile-contact" href="mailto:${contactEmail}?subject=${encodeURIComponent(item.title + " についての問い合わせ")}" data-mobile-contact>問い合わせ</a>
	        <button class="case-mobile-detail-link" type="button" data-mobile-detail="${index}">詳細</button>
	      </div>
	    </article>
	  `;

	  const renderMobileCases = () => {
	    activeMobileCases = getMobileCases();
	    let activeTabId = "";
	    document.querySelectorAll(".case-mobile-segment").forEach((button) => {
	      const isActive = button.dataset.mobileMode === activeMobileMode;
	      button.classList.toggle("is-active", isActive);
	      button.setAttribute("aria-selected", String(isActive));
	      if (isActive) activeTabId = button.id;
	    });
	    const mobileCaseList = document.getElementById("mobileCaseList");
	    mobileCaseList.setAttribute("aria-labelledby", activeTabId);
	    mobileCaseList.innerHTML = activeMobileCases.length
	      ? activeMobileCases.map(renderMobileCard).join("")
	      : '<div class="case-mobile-empty">掲載案件は準備中です。最新の案件情報は担当営業までお問い合わせください。</div>';
	  };

	  const buildMobileMetricRows = (item) => [
	    ["単価", item.unitPrice],
	    ["場所", item.location],
	    ["開始時期", item.startAt],
	    ["面談", item.interview]
	  ].filter((row) => row[1]).map(([label, value]) => `
	    <div class="case-mobile-detail-row">
	      <span>${escapeHtml(label)}</span>
	      <strong>${escapeHtml(value)}</strong>
	    </div>
	  `).join("");

	  const buildMobileFactRows = (item) => (item.facts || []).map((fact) => `
	    <div class="case-mobile-detail-row">
	      <span>${escapeHtml(fact.label)}</span>
	      <strong>${escapeHtml(fact.value)}</strong>
	    </div>
	  `).join("");

	  const openMobileSheet = (item) => {
	    if (!item) return;
	    document.getElementById("mobileSheetHead").innerHTML = `
	      <div class="case-mobile-card-top">
	        <span class="case-mobile-badge ${item.status === "急募" ? "is-urgent" : ""}">${escapeHtml(item.status || "掲載中")}</span>
	        ${item.updatedAt ? `<span class="case-mobile-date">更新日 ${escapeHtml(item.updatedAt)}</span>` : ""}
	      </div>
	      <h2 id="mobileSheetTitle">${escapeHtml(item.title)}</h2>
	    `;
	    document.getElementById("mobileSheetBody").innerHTML = `
	      <section class="case-mobile-sheet-section">
	        <h3>案件概要</h3>
	        <p class="case-mobile-sheet-summary">${escapeHtml(item.summary || "詳細条件は担当営業までお問い合わせください。")}</p>
	      </section>
	      <section class="case-mobile-sheet-section">
	        <h3>基本条件</h3>
	        <div class="case-mobile-detail-grid">${buildMobileMetricRows(item)}</div>
	      </section>
	      ${(item.facts || []).length ? `
	        <section class="case-mobile-sheet-section">
	          <h3>条件概要</h3>
	          <div class="case-mobile-detail-grid">${buildMobileFactRows(item)}</div>
	        </section>
	      ` : ""}
	      ${(item.tags || []).length ? `
	        <section class="case-mobile-sheet-section">
	          <h3>キーワード</h3>
	          <div class="case-mobile-card-tags">${(item.tags || []).map((tag) => `<span class="case-mobile-tag">${escapeHtml(tag)}</span>`).join("")}</div>
	        </section>
	      ` : ""}
	    `;
	    document.getElementById("mobileSheetActions").innerHTML = `
	      <a class="c-btn c-btn-primary" href="mailto:${contactEmail}?subject=${encodeURIComponent(item.title + " についての問い合わせ")}">問い合わせ</a>
	      <button class="c-btn c-btn-ghost" type="button" data-copy-mobile-detail>コピー</button>
	    `;
	    document.querySelector("[data-copy-mobile-detail]").addEventListener("click", () => {
	      copyText(buildSummaryText(item), "案件概要をコピーしました");
	    });
	    const sheet = document.getElementById("mobileCaseSheet");
	    sheet.classList.add("is-open");
	    sheet.setAttribute("aria-hidden", "false");
	    document.body.style.overflow = "hidden";
	  };

	  const closeMobileSheet = () => {
	    const sheet = document.getElementById("mobileCaseSheet");
	    sheet.classList.remove("is-open");
	    sheet.setAttribute("aria-hidden", "true");
	    document.body.style.overflow = "";
	  };

	  const setActiveCase = (index, mode = "absolute") => {
    if (!focusCases.length) return;
    activeCaseIndex = normalizeCaseIndex(mode === "relative" ? activeCaseIndex + index : index);
    renderFocusSlides();
    renderTabs();
  };

  const buildSummaryText = (item) => [
    `【案件】${item.title}`,
    `【概要】${item.summary}`,
    `【単価】${item.unitPrice}`,
    `【場所】${item.location}`,
    `【開始時期】${item.startAt}`,
    `【キーワード】${(item.tags || []).join(" / ")}`
  ].join("\n");

  const showToast = (message) => {
    const toast = document.getElementById("caseToast");
    toast.textContent = message;
    toast.classList.add("is-visible");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => {
      toast.classList.remove("is-visible");
    }, 2200);
  };

  const copyText = async (text, successMessage) => {
    try {
      await navigator.clipboard.writeText(text);
      showToast(successMessage);
    } catch (err) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "readonly");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      showToast(successMessage);
    }
  };

  const buildContactText = () => [
    `${focusCases[activeCaseIndex]?.title || "掲載案件"} について候補者を推薦します。`,
    "",
    "候補者概要：",
    "希望単価：",
    "稼働開始：",
    "出社可否：",
    "日本語：",
    "",
    "ご確認よろしくお願いいたします。"
  ].join("\n");

  const startAutoPlay = () => {
    window.clearInterval(autoTimer);
    autoTimer = window.setInterval(() => setActiveCase(1, "relative"), 5200);
  };

  const initializePage = async () => {
    await loadCasesFromCsv();
    refreshCaseGroups();
    document.getElementById("focusCaseCount").textContent = `${focusCases.length}件の重点推薦`;
    document.getElementById("otherCaseCount").textContent = `${caseList.length}件`;
    document.getElementById("recommendContact").href = `mailto:${contactEmail}?subject=${encodeURIComponent("候補者推薦")}`;

    renderFocusSlides();
	    renderTabs();
	    renderOtherCards();
	    renderOtherList();
	    renderMobileCounts();
	    renderMobileCases();
	    startAutoPlay();
	  };

  document.getElementById("focusTabs").addEventListener("click", (event) => {
    const button = event.target.closest("[data-index]");
    if (!button) return;
    setActiveCase(Number(button.dataset.index), "absolute");
    startAutoPlay();
  });

  document.getElementById("prevCaseBtn").addEventListener("click", () => {
    setActiveCase(-1, "relative");
    startAutoPlay();
  });

  document.getElementById("nextCaseBtn").addEventListener("click", () => {
    setActiveCase(1, "relative");
    startAutoPlay();
  });

	  document.getElementById("focusTrack").addEventListener("click", (event) => {
    const expandButton = event.target.closest("[data-expand-summary]");
    if (expandButton) {
      expandedSummaries.add(activeCaseIndex);
      window.clearInterval(autoTimer);
      renderFocusSlides();
      return;
    }

    const button = event.target.closest("[data-copy-summary]");
    if (!button) return;
    if (!focusCases[activeCaseIndex]) return;
    copyText(buildSummaryText(focusCases[activeCaseIndex]), "案件概要をコピーしました");
  });

	  window.addEventListener("resize", updateFocusOverflow);

	  document.querySelector(".case-mobile-segments").addEventListener("click", (event) => {
	    const button = event.target.closest("[data-mobile-mode]");
	    if (!button) return;
	    activeMobileMode = button.dataset.mobileMode;
	    renderMobileCases();
	  });

	  document.getElementById("mobileCaseList").addEventListener("click", (event) => {
	    if (event.target.closest("[data-mobile-contact]")) return;
	    const detailButton = event.target.closest("[data-mobile-detail]");
	    const card = event.target.closest("[data-mobile-index]");
	    const index = Number(detailButton?.dataset.mobileDetail ?? card?.dataset.mobileIndex);
	    if (!Number.isInteger(index)) return;
	    openMobileSheet(activeMobileCases[index]);
	  });

	  document.getElementById("mobileCaseList").addEventListener("keydown", (event) => {
	    if (event.key !== "Enter" && event.key !== " ") return;
	    const card = event.target.closest("[data-mobile-index]");
	    if (!card) return;
	    event.preventDefault();
	    openMobileSheet(activeMobileCases[Number(card.dataset.mobileIndex)]);
	  });

	  document.getElementById("mobileCaseSheet").addEventListener("click", (event) => {
	    if (!event.target.closest("[data-close-mobile-sheet]")) return;
	    closeMobileSheet();
	  });

	  window.addEventListener("keydown", (event) => {
	    if (event.key === "Escape") closeMobileSheet();
	  });

	  document.getElementById("copyContactBtn").addEventListener("click", () => {
    copyText(buildContactText(), "連絡文テンプレートをコピーしました");
  });

  initializePage();
</script>
</body>
</html>
