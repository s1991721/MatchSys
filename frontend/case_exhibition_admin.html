<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon-48.png" type="image/png" sizes="48x48">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title>案件展示</title>
  <style>
    body {
      background: transparent;
    }

    .exhibit-page {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      padding: 8px 6px;
    }

    .exhibit-shell {
      min-height: 0;
      display: grid;
      grid-template-columns: 380px minmax(420px, 1fr) 380px;
      gap: 8px;
    }

    .exhibit-panel {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .exhibit-panel-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .exhibit-panel-head h2 {
      margin: 0;
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
    }

    .exhibit-page-link {
      color: #1c7bff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .exhibit-page-link:hover {
      color: #0f5fd7;
    }

    .exhibit-add-btn {
      min-width: 92px;
      height: 32px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .exhibit-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .exhibit-filters {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .exhibit-list,
    .exhibit-editor {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .exhibit-list {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .exhibit-filters .c-chip-row {
      flex-wrap: nowrap;
      gap: 6px;
    }

    .exhibit-filters .c-chip {
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .exhibit-pagination {
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
    }

    .exhibit-pagination .pagination-summary {
      flex: 1 0 100%;
      margin: 0;
      text-align: center;
    }

    .exhibit-item {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      display: grid;
      gap: 8px;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .exhibit-item-time {
      justify-self: end;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .exhibit-item:hover,
    .exhibit-item.is-active {
      border-color: #1d4ed8;
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.18), 0 12px 24px rgba(31, 53, 90, 0.12);
      transform: translateY(-1px);
    }

    .exhibit-item.is-active::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: #1d4ed8;
    }

    .exhibit-item strong {
      font-size: 14px;
      line-height: 1.35;
    }

    .exhibit-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .exhibit-empty {
      padding: 18px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: #f8fafc;
    }

    .exhibit-editor {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 16px;
      background: #f6f8fb;
    }

    .exhibit-editor-workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 0.42fr) minmax(420px, 0.58fr);
      background: #f6f8fb;
      overflow: hidden;
    }

    .source-panel {
      min-height: 0;
      overflow: hidden;
      padding: 14px 10px 14px 16px;
      border-right: 1px solid #e3e9f2;
      background: #f6f8fb;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }

    .source-block {
      min-height: 0;
      display: grid;
      gap: 7px;
    }

    .source-block:last-child {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .source-block h3 {
      margin: 0;
      color: #475569;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
    }

    .source-title,
    .source-detail {
      border: 1px solid #dfe7f2;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .source-title {
      max-height: 96px;
      overflow: auto;
      padding: 10px 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .source-detail {
      min-height: 0;
      height: 100%;
      overflow: auto;
      margin: 0;
      padding: 12px;
      font-size: 13px;
    }

    .source-detail .skill-highlight {
      background: #ffe59e;
      color: #8a4b00;
      padding: 0 4px;
      border-radius: 6px;
      box-shadow: 0 0 0 1px #f3c763 inset;
    }

    .exhibit-field {
      display: grid;
      gap: 6px;
    }

    .exhibit-field label {
      color: #475569;
      font-size: 11px;
      font-weight: 800;
    }

    .exhibit-field input,
    .exhibit-field textarea,
    .exhibit-field select {
      width: 100%;
      border: 1px solid #dfe7f2;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 10px 12px;
      outline: none;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
    }

    .exhibit-field input,
    .exhibit-field select {
      height: 44px;
    }

    .exhibit-field textarea {
      resize: vertical;
      min-height: 76px;
      line-height: 1.55;
    }

    .exhibit-field input::placeholder,
    .exhibit-field textarea::placeholder {
      color: #94a3b8;
    }

    .exhibit-field input:focus,
    .exhibit-field textarea:focus,
    .exhibit-field select:focus {
      border-color: rgba(28, 123, 255, 0.45);
      box-shadow: 0 0 0 4px rgba(28, 123, 255, 0.1);
    }

    .exhibit-field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }

    .exhibit-title-row {
      grid-template-columns: minmax(0, 1.7fr) minmax(170px, 0.8fr);
    }

    .exhibit-editor-actions {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .exhibit-save-btn {
      min-width: 112px;
      height: 42px;
      border-radius: 8px;
      font-weight: 800;
    }

    .exhibit-form-message {
      min-width: 0;
      flex: 1 1 auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: right;
    }

    .exhibit-form-message.is-error {
      color: #b42318;
    }

    .exhibit-form-message.is-success {
      color: #166534;
    }

    .exhibit-field input.is-invalid,
    .exhibit-field textarea.is-invalid,
    .exhibit-field select.is-invalid {
      border-color: #f04438;
      box-shadow: 0 0 0 4px rgba(240, 68, 56, 0.1);
    }

    .display-list-wrap {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background: #f8fafc;
    }

    .display-group {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .display-group:last-child {
      margin-bottom: 0;
    }

    .display-group-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .display-group-head h3 {
      margin: 0;
      color: #0f172a;
      font-size: 14px;
    }

    .display-group-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .display-card {
      position: relative;
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      min-height: 56px;
      align-items: center;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      box-shadow: none;
      cursor: grab;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .display-card:hover,
    .display-card:focus-visible,
    .display-card.is-active {
      border-color: #1d4ed8;
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.18), 0 12px 24px rgba(31, 53, 90, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .display-card:active {
      cursor: grabbing;
    }

    .display-card.is-dragging {
      opacity: 0.45;
      transform: scale(0.99);
    }

    .display-card.is-drop-before {
      box-shadow: 0 -3px 0 #1d4ed8, 0 12px 24px rgba(31, 53, 90, 0.12);
    }

    .display-card.is-drop-after {
      box-shadow: 0 3px 0 #1d4ed8, 0 12px 24px rgba(31, 53, 90, 0.12);
    }

    .display-card.is-active::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: #1d4ed8;
    }

    .display-card-drag {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1;
      text-align: center;
      user-select: none;
    }

    .display-card h4 {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .display-card-remove {
      width: 44px;
      height: 32px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #b42318;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .display-card-remove:hover,
    .display-card-remove:focus-visible {
      background: #fff1f0;
      outline: none;
    }

    .display-empty {
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1220px) {
      .exhibit-shell {
        grid-template-columns: 340px minmax(360px, 1fr);
      }

      .display-panel {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .exhibit-page {
        height: auto;
        min-height: 100vh;
        padding: 8px;
      }

      .exhibit-shell {
        display: grid;
        grid-template-columns: 1fr;
      }

      .exhibit-panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .exhibit-filters .c-chip-row {
        flex-wrap: wrap;
      }

      .exhibit-field-row,
      .exhibit-editor-workspace {
        grid-template-columns: 1fr;
      }

      .source-panel {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <main class="exhibit-page">
    <section class="exhibit-shell">
      <aside class="c-card exhibit-panel">
        <div class="exhibit-panel-head">
          <h2>系统内案件列表</h2>
          <div class="exhibit-filters">
            <div class="c-chip-row">
              <button class="c-chip" data-range="all" type="button">全部</button>
              <button class="c-chip" data-range="yesterday" type="button">昨天</button>
              <button class="c-chip active" data-range="today" type="button">今天</button>
            </div>
          </div>
        </div>
        <div class="exhibit-list" id="caseList"></div>
        <div class="pagination c-pagination exhibit-pagination" id="casePagination">
          <div class="pagination-summary">
            <span id="casePageSummary">第 1 页</span>
          </div>
          <div class="pagination-pages" id="casePaginationPages"></div>
        </div>
      </aside>

      <section class="c-card exhibit-panel">
        <div class="exhibit-panel-head">
          <h2>案件编辑区</h2>
        </div>
        <div class="exhibit-editor-workspace">
          <aside class="source-panel">
            <div class="source-block">
              <h3>原标题</h3>
              <div class="source-title" id="sourceTitle">--</div>
            </div>
            <div class="source-block">
              <h3>案件原文</h3>
              <pre class="source-detail" id="sourceDetail">--</pre>
            </div>
          </aside>
          <form class="exhibit-editor" id="editorForm">
            <div class="exhibit-field-row exhibit-title-row">
              <div class="exhibit-field">
                <label for="titleInput">案件标题</label>
                <input id="titleInput" name="title" autocomplete="off">
              </div>
              <div class="exhibit-field">
                <label for="typeInput">展示分组</label>
                <select id="typeInput" name="type">
                  <option value="">请选择</option>
                  <option value="priority">重点推荐</option>
                  <option value="focus">注力案件</option>
                  <option value="summary">简易列表</option>
                </select>
              </div>
            </div>
            <div class="exhibit-field">
              <label for="summaryInput">案件概要</label>
              <textarea id="summaryInput" name="summary"></textarea>
            </div>
            <div class="exhibit-field-row">
              <div class="exhibit-field">
                <label for="statusInput">募集状态</label>
                <input id="statusInput" name="status" autocomplete="off" placeholder="例：募集中">
              </div>
              <div class="exhibit-field">
                <label for="unitPriceInput">单价</label>
                <input id="unitPriceInput" name="unitPrice" autocomplete="off" placeholder="例：65万〜78万円 / 月">
              </div>
            </div>
            <div class="exhibit-field-row">
              <div class="exhibit-field">
                <label for="locationInput">地点</label>
                <input id="locationInput" name="location" autocomplete="off" placeholder="例：東京 週2出社 + リモート">
              </div>
              <div class="exhibit-field">
                <label for="startAtInput">开始时期</label>
                <input id="startAtInput" name="startAt" autocomplete="off" placeholder="例：2026年8月随時">
              </div>
            </div>
            <div class="exhibit-field-row">
              <div class="exhibit-field">
                <label for="interviewInput">面谈</label>
                <input id="interviewInput" name="interview" autocomplete="off" placeholder="例：1〜2回">
              </div>
              <div class="exhibit-field">
                <label for="tagsInput">关键词</label>
                <input id="tagsInput" name="tags" autocomplete="off" placeholder="PHP/Laravel/MySQL/EC">
              </div>
            </div>
            <div class="exhibit-field">
              <label for="factsInput">条件概要</label>
              <textarea id="factsInput" name="facts" placeholder="契约形态｜準委任&#10;募集人数｜1〜2名&#10;期间｜6か月以上&#10;日本语｜要件确认 N2 以上&#10;商流｜所属または一社先優先&#10;外国籍｜可、業務コミュニケーション必須"></textarea>
            </div>
            <div class="exhibit-editor-actions">
              <div class="exhibit-form-message" id="editorMessage" role="status" aria-live="polite"></div>
              <button class="c-btn c-btn-primary exhibit-save-btn" type="button" id="saveExhibitBtn">保存</button>
            </div>
          </form>
        </div>
      </section>

      <section class="c-card exhibit-panel display-panel">
        <div class="exhibit-panel-head">
          <h2>展示列表数据</h2>
          <div class="exhibit-head-actions">
            <button class="c-btn c-btn-ghost exhibit-add-btn" type="button" id="addManualDisplayBtn">+ 手动添加</button>
            <a class="exhibit-page-link" href="case_exhibit.html" target="_blank" rel="noopener noreferrer" id="openExhibitPageLink">打开展示页</a>
          </div>
        </div>
        <div class="display-list-wrap" id="displayList"></div>
      </section>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="error_code.js"></script>
  <script src="common.js"></script>
  <script>
    let cases = [];
    let displayCases = [];

    let activeCase = null;
    const CASE_PAGE_SIZE = 10;
    const filters = {
      range: "today"
    };
    let currentPage = 1;
    let totalPages = 1;
    let totalCount = 0;
    let hasNextPage = false;
    let caseRequestSeq = 0;

    const caseList = document.getElementById("caseList");
    const dateButtons = Array.from(document.querySelectorAll(".c-chip[data-range]"));
    const casePagination = document.getElementById("casePagination");
    const casePaginationPages = document.getElementById("casePaginationPages");
    const casePageSummary = document.getElementById("casePageSummary");
    const displayList = document.getElementById("displayList");
    const addManualDisplayBtn = document.getElementById("addManualDisplayBtn");
    const openExhibitPageLink = document.getElementById("openExhibitPageLink");
    const editorForm = document.getElementById("editorForm");
    const sourceTitle = document.getElementById("sourceTitle");
    const sourceDetail = document.getElementById("sourceDetail");
    const titleInput = document.getElementById("titleInput");
    const summaryInput = document.getElementById("summaryInput");
    const typeInput = document.getElementById("typeInput");
    const statusInput = document.getElementById("statusInput");
    const unitPriceInput = document.getElementById("unitPriceInput");
    const locationInput = document.getElementById("locationInput");
    const startAtInput = document.getElementById("startAtInput");
    const interviewInput = document.getElementById("interviewInput");
    const tagsInput = document.getElementById("tagsInput");
    const factsInput = document.getElementById("factsInput");
    const saveExhibitBtn = document.getElementById("saveExhibitBtn");
    const editorMessage = document.getElementById("editorMessage");
    const editorInputs = [titleInput, summaryInput, typeInput, statusInput, unitPriceInput, locationInput, startAtInput, interviewInput, tagsInput, factsInput];
    const caseExhibitApiBase = String(window.CASE_EXHIBIT_API_BASE || localStorage.getItem("caseExhibitApiBase") || "").replace(/\/$/, "");
    const caseExhibitPublicUrl = String(window.CASE_EXHIBIT_PUBLIC_URL || localStorage.getItem("caseExhibitPublicUrl") || "case_exhibit.html");
    const caseExhibitsCsvApi = `${caseExhibitApiBase}/api/case-exhibits-csv`;
    let displayKeySeq = 0;
    let draggedDisplayKey = "";
    let dragDropPosition = "after";
    let suppressDisplayClick = false;
    openExhibitPageLink.href = caseExhibitPublicUrl;

    const escapeHtml = (value) => String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const parseTags = (value) => String(value || "")
      .split(/[、,，/]+/)
      .map((tag) => tag.trim())
      .filter(Boolean);

    const parseFacts = (value) => String(value || "")
      .split(/\n+/)
      .map((row) => row.trim())
      .filter(Boolean)
      .map((row) => {
        const parts = row.split("｜");
        return {
          label: (parts.length > 1 ? parts.shift() : "条件").trim(),
          value: (parts.join("｜") || row).trim()
        };
      });

    const createDisplayKey = () => `display:${Date.now()}:${displayKeySeq += 1}`;

    const createManualSourceId = () => {
      const date = new Date();
      const parts = [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0"),
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ];
      return `manual:${parts.join("")}:${displayKeySeq += 1}`;
    };

    const getSourceId = (item) => String((item && (item.sourceId || item.id)) || "");

    const isManualSourceId = (sourceId) => String(sourceId || "").startsWith("manual:");

    const ensureDisplayKey = (item) => {
      if (!item) return "";
      if (!item.__displayKey) {
        item.__displayKey = getSourceId(item) || createDisplayKey();
      }
      return item.__displayKey;
    };

    const normalizeDisplayCase = (item) => {
      const sourceId = String(item.sourceId || "");
      const normalized = {
        sourceId,
        id: sourceId,
        type: item.type || "",
        title: item.title || "",
        sourceTitle: item.sourceTitle || "",
        status: item.status || "",
        updatedAt: item.updatedAt || "",
        summary: item.summary || "",
        unitPrice: item.unitPrice || "",
        location: item.location || "",
        startAt: item.startAt || "",
        interview: item.interview || "",
        tags: Array.isArray(item.tags) ? item.tags : [],
        facts: Array.isArray(item.facts) ? item.facts : [],
        sourceDetail: item.sourceDetail || "",
        sourceAddress: item.sourceAddress || ""
      };
      ensureDisplayKey(normalized);
      return normalized;
    };

    const loadDisplayCasesFromCsv = async () => {
      try {
        const payload = await window.requestJson(caseExhibitsCsvApi, {method: "GET"}, {
          fallbackMessage: "展示 CSV 读取失败"
        });
        displayCases = (((payload.data || {}).items) || []).map(normalizeDisplayCase);
        renderDisplayList();
      } catch (err) {
        displayCases = [];
      }
    };

    const persistDisplayCases = async () => {
      const payload = await window.requestJson(caseExhibitsCsvApi, {
        method: "PUT",
        body: JSON.stringify({items: displayCases})
      }, {
        fallbackMessage: "展示 CSV 保存失败"
      });
      return payload.data || {};
    };

    const deleteDisplayCaseOnServer = async (sourceId) => {
      await window.requestJson(caseExhibitsCsvApi, {
        method: "DELETE",
        body: JSON.stringify({sourceId})
      }, {
        fallbackMessage: "展示 CSV 删除失败"
      });
    };

    const setEditorMessage = (message = "", type = "") => {
      editorMessage.textContent = message;
      editorMessage.classList.toggle("is-error", type === "error");
      editorMessage.classList.toggle("is-success", type === "success");
    };

    const clearInvalidFields = () => {
      editorInputs.forEach((input) => {
        input.classList.remove("is-invalid");
        input.removeAttribute("aria-invalid");
      });
    };

    const markInvalidField = (input) => {
      if (!input) return;
      input.classList.add("is-invalid");
      input.setAttribute("aria-invalid", "true");
    };

    const getFactFormatError = (value) => {
      const rows = String(value || "").split(/\n+/);
      for (let index = 0; index < rows.length; index += 1) {
        const row = rows[index].trim();
        if (!row) continue;
        if (!row.includes("｜")) {
          return `条件概要第 ${index + 1} 行格式不正确，请使用「项目｜内容」。`;
        }
        const [label, ...valueParts] = row.split("｜");
        if (!label.trim() || !valueParts.join("｜").trim()) {
          return `条件概要第 ${index + 1} 行缺少项目或内容。`;
        }
      }
      return "";
    };

    const validateEditorForm = () => {
      clearInvalidFields();
      if (!activeCase) {
        return {valid: false, message: "请先从左侧选择一个案件。"};
      }

      const errors = [];
      const title = titleInput.value.trim();
      const summary = summaryInput.value.trim();
      const selectedType = typeInput.value;
      const tags = parseTags(tagsInput.value);
      const factError = getFactFormatError(factsInput.value);

      if (!selectedType) {
        errors.push({input: typeInput, message: "请选择展示分组，保存后会显示在对应的右侧列表中。"});
      }
      if (title.length > 80) {
        errors.push({input: titleInput, message: "案件标题请控制在 80 个字以内。"});
      }
      if ((selectedType === "priority" || selectedType === "focus") && !summary) {
        errors.push({input: summaryInput, message: "重点推荐或注力案件需要填写案件概要。"});
      }
      if (summary.length > 500) {
        errors.push({input: summaryInput, message: "案件概要请控制在 500 个字以内。"});
      }
      if (unitPriceInput.value.trim().length > 40) {
        errors.push({input: unitPriceInput, message: "单价内容过长，请控制在 40 个字以内。"});
      }
      if (tags.length > 8) {
        errors.push({input: tagsInput, message: "关键词最多填写 8 个。"});
      }
      if (factError) {
        errors.push({input: factsInput, message: factError});
      }

      if (!errors.length) return {valid: true};
      const firstError = errors[0];
      markInvalidField(firstError.input);
      firstError.input.focus({preventScroll: true});
      firstError.input.scrollIntoView({behavior: "smooth", block: "center"});
      return {valid: false, message: firstError.message};
    };

    const formatFacts = (facts) => (facts || [])
      .map((fact) => `${fact.label || ""}｜${fact.value || ""}`)
      .join("\n");

    const formatUpdatedAt = (value) => {
      const date = new Date(value || "");
      if (Number.isNaN(date.getTime())) return "";
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}.${m}.${d}`;
    };

    const formatDateParam = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    const currentFilterDate = () => {
      if (filters.range === "all") return "";
      const date = new Date();
      if (filters.range === "yesterday") {
        date.setDate(date.getDate() - 1);
      }
      return formatDateParam(date);
    };

    const normalizeDetailText = (text) => String(text || "")
      .replace(/\r\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();

    const sourceKeywordPattern = [
      "Spring Boot", "JavaScript", "TypeScript", "PostgreSQL", "Salesforce",
      "DynamoDB", "RabbitMQ", "Amazon MQ", "AWS Step Functions", "AWS SDK",
      "Spring", "Java", "Python", "Django", "PHP", "Laravel", "React", "Vue",
      "Angular", "Node", "AWS", "Azure", "GCP", "SQL", "MySQL", "Oracle",
      "Linux", "Windows", "SAP", "SQS", "MQ", "PMO", "PM", "SE", "PL"
    ]
      .sort((a, b) => b.length - a.length)
      .map((keyword) => keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
      .join("|");

    const renderSourceDetail = (value) => {
      const escaped = escapeHtml(value || "--");
      const keywordRe = new RegExp(`(^|[^A-Za-z0-9])(${sourceKeywordPattern})(?=[^A-Za-z0-9]|$)`, "gi");
      return escaped.replace(keywordRe, (match, prefix, keyword) => (
        `${prefix}<mark class="skill-highlight">${keyword}</mark>`
      ));
    };

    const mapProjectToCase = (item) => {
      const detail = item.detail || "";
      const normalized = normalizeDetailText(detail);
      const sourceId = String(item.id || "");
      const saved = displayCases.find((displayItem) => getSourceId(displayItem) === sourceId) || {};
      return {
        id: sourceId,
        sourceId,
        type: saved.type || "",
        title: saved.title || "",
        sourceTitle: item.title || "未命名案件",
        date: item.date || "",
        status: saved.status || "",
        updatedAt: saved.updatedAt || formatUpdatedAt(item.date),
        summary: saved.summary || "",
        unitPrice: saved.unitPrice || "",
        location: saved.location || "",
        startAt: saved.startAt || "",
        interview: saved.interview || "",
        facts: [...(saved.facts || [])],
        tags: [...(saved.tags || [])],
        sourceDetail: normalized,
        sourceAddress: item.address || ""
      };
    };

    const syncActiveCase = () => {
      if (!activeCase) return;
      const index = cases.findIndex((item) => item.id === activeCase.id);
      if (index >= 0) cases[index] = {...activeCase};
    };

    const renderList = () => {
      if (!cases.length) {
        caseList.innerHTML = '<div class="exhibit-empty">暂无系统案件</div>';
        return;
      }
      const activeSourceId = getSourceId(activeCase);
      caseList.innerHTML = cases.map((item) => `
        <button class="exhibit-item ${activeSourceId && getSourceId(item) === activeSourceId ? "is-active" : ""}" type="button" data-id="${escapeHtml(item.id)}">
          <strong>${escapeHtml(item.sourceTitle || "未命名案件")}</strong>
          <span class="exhibit-item-time">${escapeHtml(window.formatMonthDayTime(item.date, ""))}</span>
        </button>
      `).join("");
    };

    const updatePaginationUI = () => {
      casePageSummary.textContent = `共 ${totalCount} 件 · 第 ${currentPage} / ${totalPages} 页`;
      window.renderPagination(casePagination, casePaginationPages, currentPage, totalPages);
    };

    const fillForm = () => {
      const item = activeCase || {};
      const isManual = item.__isManual === true || isManualSourceId(getSourceId(item));
      clearInvalidFields();
      setEditorMessage("");
      titleInput.value = item.title || "";
      summaryInput.value = item.summary || "";
      typeInput.value = item.type || "";
      statusInput.value = item.status || "";
      unitPriceInput.value = item.unitPrice || "";
      locationInput.value = item.location || "";
      startAtInput.value = item.startAt || "";
      interviewInput.value = item.interview || "";
      tagsInput.value = (item.tags || []).join(" / ");
      factsInput.value = formatFacts(item.facts);
      sourceTitle.textContent = isManual ? "" : (item.sourceTitle || "--");
      sourceDetail.innerHTML = isManual ? "" : renderSourceDetail(item.sourceDetail);
      saveExhibitBtn.disabled = !activeCase;
      updateDisplay();
    };

    const readForm = () => {
      if (!activeCase) return;
      activeCase = {
        ...activeCase,
        title: titleInput.value.trim(),
        summary: summaryInput.value.trim(),
        type: typeInput.value,
        status: statusInput.value.trim(),
        unitPrice: unitPriceInput.value.trim(),
        location: locationInput.value.trim(),
        startAt: startAtInput.value.trim(),
        interview: interviewInput.value.trim(),
        tags: parseTags(tagsInput.value),
        facts: parseFacts(factsInput.value)
      };
    };

    const renderDisplayCard = (item) => {
      const displayKey = ensureDisplayKey(item);
      const activeDisplayKey = activeCase ? ensureDisplayKey(activeCase) : "";
      return `
      <article class="display-card ${displayKey && displayKey === activeDisplayKey ? "is-active" : ""}" draggable="true" data-display-key="${escapeHtml(displayKey)}" data-display-type="${escapeHtml(item.type || "")}" role="button" tabindex="0" aria-label="编辑${escapeHtml(item.title || item.sourceTitle || "未命名案件")}">
        <span class="display-card-drag" aria-hidden="true">⋮⋮</span>
        <h4>${escapeHtml(item.title || item.sourceTitle || "未命名案件")}</h4>
        <button class="display-card-remove" type="button" data-remove-display="${escapeHtml(displayKey)}" aria-label="删除${escapeHtml(item.title || item.sourceTitle || "未命名案件")}">删除</button>
      </article>
    `;
    };

    const renderDisplayGroup = (type, title) => {
      const items = displayCases.filter((item) => item.type === type);
      return `
        <section class="display-group">
          <div class="display-group-head">
            <h3>${escapeHtml(title)}</h3>
            <span>${items.length} 件</span>
          </div>
          ${items.length ? items.map((item) => renderDisplayCard(item)).join("") : '<div class="display-empty">暂无展示数据</div>'}
        </section>
      `;
    };

    const renderDisplayList = () => {
      displayList.innerHTML = [
        renderDisplayGroup("priority", "重点推荐案件"),
        renderDisplayGroup("focus", "注力案件"),
        renderDisplayGroup("summary", "简易展示列表")
      ].join("");
    };

    const updateDisplay = () => {
      readForm();
      syncActiveCase();
      renderList();
      renderDisplayList();
    };

    const saveActiveToDisplayList = () => {
      if (!activeCase) return false;
      const validation = validateEditorForm();
      if (!validation.valid) {
        setEditorMessage("");
        return false;
      }
      readForm();
      const sourceId = getSourceId(activeCase);
      const displayKey = ensureDisplayKey(activeCase);
      const savedCase = {
        ...activeCase,
        sourceId,
        id: sourceId,
        __displayKey: displayKey,
        facts: [...(activeCase.facts || [])],
        tags: [...(activeCase.tags || [])]
      };
      const index = displayCases.findIndex((item) => ensureDisplayKey(item) === displayKey);
      if (index >= 0) {
        displayCases[index] = savedCase;
      } else {
        displayCases.push(savedCase);
      }
      syncActiveCase();
      renderList();
      renderDisplayList();
      return true;
    };

    const removeDisplayCase = async (displayKey) => {
      const index = displayCases.findIndex((item) => ensureDisplayKey(item) === displayKey);
      if (index < 0) return;
      const [removed] = displayCases.splice(index, 1);
      renderDisplayList();
      try {
        const sourceId = getSourceId(removed);
        if (sourceId) {
          await deleteDisplayCaseOnServer(sourceId);
        } else {
          await persistDisplayCases();
        }
        setEditorMessage("已从服务器 CSV 删除。", "success");
      } catch (err) {
        displayCases.splice(index, 0, removed);
        renderDisplayList();
        setEditorMessage(err.message || "展示 CSV 删除失败", "error");
      }
    };

    const clearDisplayDragState = () => {
      displayList.querySelectorAll(".display-card.is-dragging, .display-card.is-drop-before, .display-card.is-drop-after").forEach((card) => {
        card.classList.remove("is-dragging", "is-drop-before", "is-drop-after");
      });
    };

    const findDisplayCardElement = (displayKey) => (
      Array.from(displayList.querySelectorAll("[data-display-key]"))
        .find((card) => card.dataset.displayKey === displayKey) || null
    );

    const getDropPosition = (event, card) => {
      const rect = card.getBoundingClientRect();
      return event.clientY < rect.top + rect.height / 2 ? "before" : "after";
    };

    const canDropOnDisplayCard = (card) => {
      if (!draggedDisplayKey || !card) return false;
      if (card.dataset.displayKey === draggedDisplayKey) return false;
      const dragged = displayCases.find((item) => ensureDisplayKey(item) === draggedDisplayKey);
      if (!dragged) return false;
      return card.dataset.displayType === dragged.type;
    };

    const moveDisplayCase = (dragKey, targetKey, position) => {
      const sourceIndex = displayCases.findIndex((item) => ensureDisplayKey(item) === dragKey);
      const targetIndex = displayCases.findIndex((item) => ensureDisplayKey(item) === targetKey);
      if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return false;
      if (displayCases[sourceIndex].type !== displayCases[targetIndex].type) return false;

      const [moved] = displayCases.splice(sourceIndex, 1);
      const nextTargetIndex = displayCases.findIndex((item) => ensureDisplayKey(item) === targetKey);
      const insertIndex = position === "before" ? nextTargetIndex : nextTargetIndex + 1;
      displayCases.splice(insertIndex, 0, moved);
      return true;
    };

    const persistDisplayOrder = async (previousDisplayCases) => {
      try {
        await persistDisplayCases();
        setEditorMessage("排序已保存到服务器 CSV。", "success");
      } catch (err) {
        displayCases = previousDisplayCases;
        renderDisplayList();
        setEditorMessage(err.message || "展示 CSV 排序保存失败", "error");
      }
    };

    const createManualCase = () => {
      const sourceId = createManualSourceId();
      activeCase = {
        id: sourceId,
        sourceId,
        __displayKey: sourceId,
        __isManual: true,
        type: "",
        title: "",
        sourceTitle: "",
        date: "",
        status: "",
        updatedAt: formatUpdatedAt(new Date().toISOString()),
        summary: "",
        unitPrice: "",
        location: "",
        startAt: "",
        interview: "",
        facts: [],
        tags: [],
        sourceDetail: "",
        sourceAddress: ""
      };
      renderList();
      fillForm();
    };

    const selectSystemCase = (selected) => {
      activeCase = {
        ...selected,
        facts: [...(selected.facts || [])],
        tags: [...(selected.tags || [])]
      };
      renderList();
      fillForm();
    };

    const selectDisplayCase = (displayKey) => {
      readForm();
      syncActiveCase();
      const selected = displayCases.find((item) => ensureDisplayKey(item) === displayKey);
      if (!selected) return;
      const sourceId = getSourceId(selected);
      const isManual = isManualSourceId(sourceId);
      const linkedSystemCase = isManual ? null : cases.find((item) => getSourceId(item) === sourceId);
      activeCase = {
        ...(linkedSystemCase || {}),
        ...selected,
        id: sourceId,
        sourceId,
        __displayKey: ensureDisplayKey(selected),
        __isManual: isManual,
        sourceTitle: selected.sourceTitle || (linkedSystemCase && linkedSystemCase.sourceTitle) || selected.title || "未命名案件",
        sourceDetail: selected.sourceDetail || (linkedSystemCase && linkedSystemCase.sourceDetail) || "",
        sourceAddress: selected.sourceAddress || (linkedSystemCase && linkedSystemCase.sourceAddress) || "",
        facts: [...(selected.facts || [])],
        tags: [...(selected.tags || [])]
      };
      renderList();
      fillForm();
    };

    const setLoading = () => {
      caseList.innerHTML = '<div class="exhibit-empty">加载系统案件中...</div>';
      updatePaginationUI();
    };

    const setLoadError = (message) => {
      caseList.innerHTML = `<div class="exhibit-empty">${escapeHtml(message || "案件列表加载失败")}</div>`;
      updatePaginationUI();
    };

    const loadSystemCases = async (page = 1) => {
      const requestSeq = ++caseRequestSeq;
      currentPage = page;
      setLoading();
      try {
        const params = new URLSearchParams();
        const date = currentFilterDate();
        if (date) params.set("date", date);
        params.set("page", String(currentPage));
        params.set("page_size", String(CASE_PAGE_SIZE));
        const payload = await window.requestJson(window.buildUrl(`${caseExhibitApiBase}/api/mail-projects`, params), {method: "GET"}, {
          fallbackMessage: "案件列表加载失败"
        });
        if (requestSeq !== caseRequestSeq) return;
        const items = (payload.data && payload.data.items) || [];
        const meta = payload.meta || {};
        currentPage = Number.isFinite(meta.page) ? meta.page : currentPage;
        totalCount = Number.isFinite(meta.total) ? meta.total : items.length;
        totalPages = Number.isFinite(meta.total_pages) ? Math.max(1, meta.total_pages) : 1;
        hasNextPage = currentPage < totalPages;
        cases = items.map(mapProjectToCase);
        activeCase = cases.length
          ? {...cases[0], facts: [...(cases[0].facts || [])], tags: [...(cases[0].tags || [])]}
          : null;
        renderList();
        updatePaginationUI();
        fillForm();
      } catch (err) {
        if (requestSeq !== caseRequestSeq) return;
        cases = [];
        activeCase = null;
        totalCount = 0;
        totalPages = 1;
        hasNextPage = false;
        fillForm();
        setLoadError(err.message);
      }
    };

    caseList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      readForm();
      syncActiveCase();
      const selected = cases.find((item) => item.id === button.dataset.id);
      if (!selected) return;
      selectSystemCase(selected);
    });

    displayList.addEventListener("dragstart", (event) => {
      const card = event.target.closest("[data-display-key]");
      if (!card || event.target.closest("[data-remove-display]")) {
        event.preventDefault();
        return;
      }
      draggedDisplayKey = card.dataset.displayKey || "";
      card.classList.add("is-dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedDisplayKey);
    });

    displayList.addEventListener("dragover", (event) => {
      const card = event.target.closest("[data-display-key]");
      clearDisplayDragState();
      const draggedCard = draggedDisplayKey ? findDisplayCardElement(draggedDisplayKey) : null;
      if (draggedCard) draggedCard.classList.add("is-dragging");
      if (!canDropOnDisplayCard(card)) return;
      event.preventDefault();
      dragDropPosition = getDropPosition(event, card);
      card.classList.add(dragDropPosition === "before" ? "is-drop-before" : "is-drop-after");
      event.dataTransfer.dropEffect = "move";
    });

    displayList.addEventListener("dragleave", (event) => {
      if (displayList.contains(event.relatedTarget)) return;
      clearDisplayDragState();
    });

    displayList.addEventListener("drop", (event) => {
      const card = event.target.closest("[data-display-key]");
      if (!canDropOnDisplayCard(card)) return;
      event.preventDefault();
      const previousDisplayCases = displayCases.map((item) => ({
        ...item,
        facts: [...(item.facts || [])],
        tags: [...(item.tags || [])]
      }));
      const moved = moveDisplayCase(draggedDisplayKey, card.dataset.displayKey, dragDropPosition);
      draggedDisplayKey = "";
      clearDisplayDragState();
      suppressDisplayClick = moved;
      if (!moved) return;
      renderDisplayList();
      persistDisplayOrder(previousDisplayCases);
    });

    displayList.addEventListener("dragend", () => {
      draggedDisplayKey = "";
      clearDisplayDragState();
      window.setTimeout(() => {
        suppressDisplayClick = false;
      }, 0);
    });

    displayList.addEventListener("click", (event) => {
      if (suppressDisplayClick) {
        suppressDisplayClick = false;
        return;
      }
      const button = event.target.closest("[data-remove-display]");
      if (button) {
        event.stopPropagation();
        removeDisplayCase(button.dataset.removeDisplay);
        return;
      }
      const card = event.target.closest("[data-display-key]");
      if (!card) return;
      selectDisplayCase(card.dataset.displayKey);
    });

    displayList.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      if (event.target.closest("[data-remove-display]")) return;
      const card = event.target.closest("[data-display-key]");
      if (!card) return;
      event.preventDefault();
      selectDisplayCase(card.dataset.displayKey);
    });

    addManualDisplayBtn.addEventListener("click", () => {
      readForm();
      syncActiveCase();
      createManualCase();
    });

    const handleEditorChange = (event) => {
      const target = event.target;
      if (target && target.classList) {
        target.classList.remove("is-invalid");
        target.removeAttribute("aria-invalid");
      }
      setEditorMessage("");
      updateDisplay();
    };

    editorForm.addEventListener("input", handleEditorChange);
    editorForm.addEventListener("change", handleEditorChange);

    saveExhibitBtn.addEventListener("click", async () => {
      if (!saveActiveToDisplayList()) return;
      const originalText = saveExhibitBtn.textContent;
      saveExhibitBtn.textContent = "保存中...";
      saveExhibitBtn.disabled = true;
      try {
        await persistDisplayCases();
        saveExhibitBtn.textContent = "已保存";
        setEditorMessage("已保存到服务器 CSV。", "success");
      } catch (err) {
        saveExhibitBtn.textContent = originalText;
        saveExhibitBtn.disabled = !activeCase;
        setEditorMessage(err.message || "展示 CSV 保存失败", "error");
        return;
      }
      window.setTimeout(() => {
        saveExhibitBtn.textContent = originalText;
        saveExhibitBtn.disabled = !activeCase;
      }, 1200);
    });

    dateButtons.forEach((button) => {
      button.addEventListener("click", () => {
        dateButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        filters.range = button.dataset.range || "today";
        loadSystemCases(1);
      });
    });

    window.bindPagination(casePagination, (value) => {
      if (value === "prev") {
        if (currentPage > 1) loadSystemCases(currentPage - 1);
        return;
      }
      if (value === "next") {
        if (hasNextPage) loadSystemCases(currentPage + 1);
        return;
      }
      const page = Number(value);
      if (Number.isFinite(page) && page >= 1 && page !== currentPage) {
        loadSystemCases(page);
      }
    });

    loadDisplayCasesFromCsv().finally(() => loadSystemCases());
  </script>
</body>
</html>
