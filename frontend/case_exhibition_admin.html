<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title>案件展示</title>
  <style>
    body {
      background: transparent;
    }

    .exhibit-page {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      padding: 8px 6px;
    }

    .exhibit-shell {
      min-height: 0;
      display: grid;
      grid-template-columns: 380px minmax(420px, 1fr) 380px;
      gap: 8px;
    }

    .exhibit-panel {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .exhibit-panel-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .exhibit-panel-head h2 {
      margin: 0;
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
    }

    .exhibit-page-link {
      color: #1c7bff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .exhibit-page-link:hover {
      color: #0f5fd7;
    }

    .exhibit-filters {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .exhibit-list,
    .exhibit-editor {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .exhibit-list {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .exhibit-filters .c-chip-row {
      flex-wrap: nowrap;
      gap: 6px;
    }

    .exhibit-filters .c-chip {
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .exhibit-pagination {
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
    }

    .exhibit-pagination .pagination-summary {
      flex: 1 0 100%;
      margin: 0;
      text-align: center;
    }

    .exhibit-item {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      display: grid;
      gap: 8px;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .exhibit-item-time {
      justify-self: end;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .exhibit-item:hover,
    .exhibit-item.is-active {
      border-color: #1d4ed8;
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.18), 0 12px 24px rgba(31, 53, 90, 0.12);
      transform: translateY(-1px);
    }

    .exhibit-item.is-active::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: #1d4ed8;
    }

    .exhibit-item strong {
      font-size: 14px;
      line-height: 1.35;
    }

    .exhibit-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .exhibit-status {
      width: fit-content;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      background: #eef2ff;
      color: #1d4ed8;
    }

    .exhibit-status.is-draft {
      background: rgba(245, 158, 11, 0.14);
      color: #b45309;
    }

    .exhibit-status.is-offline {
      background: rgba(100, 116, 139, 0.14);
      color: #475569;
    }

    .exhibit-status.is-focus,
    .exhibit-status.is-summary {
      background: #f8fafc;
      color: #334155;
    }

    .exhibit-status.is-priority {
      background: #eef2ff;
      color: #1d4ed8;
    }

    .exhibit-empty {
      padding: 18px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: #f8fafc;
    }

    .exhibit-editor {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 16px;
      background: #f6f8fb;
    }

    .exhibit-editor-workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 0.42fr) minmax(420px, 0.58fr);
      background: #f6f8fb;
      overflow: hidden;
    }

    .source-panel {
      min-height: 0;
      overflow: hidden;
      padding: 14px 10px 14px 16px;
      border-right: 1px solid #e3e9f2;
      background: #f6f8fb;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }

    .source-block {
      min-height: 0;
      display: grid;
      gap: 7px;
    }

    .source-block:last-child {
      grid-template-rows: auto minmax(0, 1fr);
    }

    .source-block h3 {
      margin: 0;
      color: #475569;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
    }

    .source-title,
    .source-detail {
      border: 1px solid #dfe7f2;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .source-title {
      max-height: 96px;
      overflow: auto;
      padding: 10px 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .source-detail {
      min-height: 0;
      height: 100%;
      overflow: auto;
      margin: 0;
      padding: 12px;
      font-size: 13px;
    }

    .source-detail .skill-highlight {
      background: #ffe59e;
      color: #8a4b00;
      padding: 0 4px;
      border-radius: 6px;
      box-shadow: 0 0 0 1px #f3c763 inset;
    }

    .exhibit-field {
      display: grid;
      gap: 6px;
    }

    .exhibit-field label {
      color: #475569;
      font-size: 11px;
      font-weight: 800;
    }

    .exhibit-field input,
    .exhibit-field textarea,
    .exhibit-field select {
      width: 100%;
      border: 1px solid #dfe7f2;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 10px 12px;
      outline: none;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
    }

    .exhibit-field input,
    .exhibit-field select {
      height: 44px;
    }

    .exhibit-field textarea {
      resize: vertical;
      min-height: 76px;
      line-height: 1.55;
    }

    .exhibit-field input::placeholder,
    .exhibit-field textarea::placeholder {
      color: #94a3b8;
    }

    .exhibit-field input:focus,
    .exhibit-field textarea:focus,
    .exhibit-field select:focus {
      border-color: rgba(28, 123, 255, 0.45);
      box-shadow: 0 0 0 4px rgba(28, 123, 255, 0.1);
    }

    .exhibit-field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }

    .exhibit-title-row {
      grid-template-columns: minmax(0, 1.7fr) minmax(170px, 0.8fr);
    }

    .exhibit-editor-actions {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .exhibit-save-btn {
      min-width: 112px;
      height: 42px;
      border-radius: 8px;
      font-weight: 800;
    }

    .exhibit-form-message {
      min-width: 0;
      flex: 1 1 auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: right;
    }

    .exhibit-form-message.is-error {
      color: #b42318;
    }

    .exhibit-form-message.is-success {
      color: #166534;
    }

    .exhibit-field input.is-invalid,
    .exhibit-field textarea.is-invalid,
    .exhibit-field select.is-invalid {
      border-color: #f04438;
      box-shadow: 0 0 0 4px rgba(240, 68, 56, 0.1);
    }

    .module-list {
      display: grid;
      gap: 10px;
    }

    .module-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #f8fafc;
    }

    .module-row input {
      width: 16px;
      height: 16px;
    }

    .module-row strong {
      font-size: 13px;
    }

    .module-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .display-list-wrap {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background: #f8fafc;
    }

    .display-group {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .display-group:last-child {
      margin-bottom: 0;
    }

    .display-group-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .display-group-head h3 {
      margin: 0;
      color: #0f172a;
      font-size: 14px;
    }

    .display-group-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .display-card {
      position: relative;
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      min-height: 56px;
      align-items: center;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      box-shadow: none;
    }

    .display-card.is-active {
      border-color: #1d4ed8;
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.18), 0 12px 24px rgba(31, 53, 90, 0.12);
    }

    .display-card.is-active::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: #1d4ed8;
    }

    .display-card h4 {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .display-card-remove {
      width: 44px;
      height: 32px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #b42318;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .display-card-remove:hover,
    .display-card-remove:focus-visible {
      background: #fff1f0;
      outline: none;
    }

    .display-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .display-fact {
      min-width: 0;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8fafc;
    }

    .display-fact span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .display-fact strong {
      display: block;
      margin-top: 4px;
      color: #172033;
      font-size: 12px;
      line-height: 1.35;
    }

    .display-empty {
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1220px) {
      .exhibit-shell {
        grid-template-columns: 340px minmax(360px, 1fr);
      }

      .display-panel {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .exhibit-page {
        height: auto;
        min-height: 100vh;
        padding: 8px;
      }

      .exhibit-shell {
        display: grid;
        grid-template-columns: 1fr;
      }

      .exhibit-panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .exhibit-filters .c-chip-row {
        flex-wrap: wrap;
      }

      .exhibit-field-row,
      .display-facts,
      .exhibit-editor-workspace {
        grid-template-columns: 1fr;
      }

      .source-panel {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <main class="exhibit-page">
    <section class="exhibit-shell">
      <aside class="c-card exhibit-panel">
        <div class="exhibit-panel-head">
          <h2>系统内案件列表</h2>
          <div class="exhibit-filters">
            <div class="c-chip-row">
              <button class="c-chip" data-range="all" type="button">全部</button>
              <button class="c-chip" data-range="yesterday" type="button">昨天</button>
              <button class="c-chip active" data-range="today" type="button">今天</button>
            </div>
          </div>
        </div>
        <div class="exhibit-list" id="caseList"></div>
        <div class="pagination c-pagination exhibit-pagination" id="casePagination">
          <div class="pagination-summary">
            <span id="casePageSummary">第 1 页</span>
          </div>
          <div class="pagination-pages" id="casePaginationPages"></div>
        </div>
      </aside>

      <section class="c-card exhibit-panel">
        <div class="exhibit-panel-head">
          <h2>案件编辑区</h2>
        </div>
        <div class="exhibit-editor-workspace">
          <aside class="source-panel">
            <div class="source-block">
              <h3>原标题</h3>
              <div class="source-title" id="sourceTitle">--</div>
            </div>
            <div class="source-block">
              <h3>案件原文</h3>
              <pre class="source-detail" id="sourceDetail">--</pre>
            </div>
          </aside>
          <form class="exhibit-editor" id="editorForm">
            <div class="exhibit-field-row exhibit-title-row">
              <div class="exhibit-field">
                <label for="titleInput">案件标题</label>
                <input id="titleInput" name="title" autocomplete="off">
              </div>
              <div class="exhibit-field">
                <label for="typeInput">展示分组</label>
                <select id="typeInput" name="type">
                  <option value="">请选择</option>
                  <option value="priority">重点推荐</option>
                  <option value="focus">注力案件</option>
                  <option value="summary">简易列表</option>
                </select>
              </div>
            </div>
            <div class="exhibit-field">
              <label for="summaryInput">案件概要</label>
              <textarea id="summaryInput" name="summary"></textarea>
            </div>
            <div class="exhibit-field-row">
              <div class="exhibit-field">
                <label for="statusInput">募集状态</label>
                <input id="statusInput" name="status" autocomplete="off" placeholder="例：募集中">
              </div>
              <div class="exhibit-field">
                <label for="unitPriceInput">单价</label>
                <input id="unitPriceInput" name="unitPrice" autocomplete="off" placeholder="例：65万〜78万円 / 月">
              </div>
            </div>
            <div class="exhibit-field-row">
              <div class="exhibit-field">
                <label for="locationInput">地点</label>
                <input id="locationInput" name="location" autocomplete="off" placeholder="例：東京 週2出社 + リモート">
              </div>
              <div class="exhibit-field">
                <label for="startAtInput">开始时期</label>
                <input id="startAtInput" name="startAt" autocomplete="off" placeholder="例：2026年8月随時">
              </div>
            </div>
            <div class="exhibit-field-row">
              <div class="exhibit-field">
                <label for="interviewInput">面谈</label>
                <input id="interviewInput" name="interview" autocomplete="off" placeholder="例：1〜2回">
              </div>
              <div class="exhibit-field">
                <label for="tagsInput">关键词</label>
                <input id="tagsInput" name="tags" autocomplete="off" placeholder="PHP/Laravel/MySQL/EC">
              </div>
            </div>
            <div class="exhibit-field">
              <label for="factsInput">条件概要</label>
              <textarea id="factsInput" name="facts" placeholder="契约形态｜準委任&#10;募集人数｜1〜2名&#10;期间｜6か月以上&#10;日本语｜要件确认 N2 以上&#10;商流｜所属または一社先優先&#10;外国籍｜可、業務コミュニケーション必須"></textarea>
            </div>
            <div class="exhibit-editor-actions">
              <div class="exhibit-form-message" id="editorMessage" role="status" aria-live="polite"></div>
              <button class="c-btn c-btn-primary exhibit-save-btn" type="button" id="saveExhibitBtn">保存</button>
            </div>
          </form>
        </div>
      </section>

      <section class="c-card exhibit-panel display-panel">
        <div class="exhibit-panel-head">
          <h2>展示列表数据</h2>
          <a class="exhibit-page-link" href="case_exhibit.html" target="_blank" rel="noopener noreferrer">打开展示页</a>
        </div>
        <div class="display-list-wrap" id="displayList"></div>
      </section>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="error_code.js"></script>
  <script src="common.js"></script>
  <script>
    let cases = [];
    let displayCases = [];

    const typeText = {
      priority: "重点推荐",
      focus: "注力案件",
      summary: "简易列表"
    };

    let activeCase = null;
    const CASE_PAGE_SIZE = 10;
    const filters = {
      range: "today"
    };
    let currentPage = 1;
    let totalPages = 1;
    let totalCount = 0;
    let hasNextPage = false;
    let caseRequestSeq = 0;

    const caseList = document.getElementById("caseList");
    const dateButtons = Array.from(document.querySelectorAll(".c-chip[data-range]"));
    const casePagination = document.getElementById("casePagination");
    const casePaginationPages = document.getElementById("casePaginationPages");
    const casePageSummary = document.getElementById("casePageSummary");
    const displayList = document.getElementById("displayList");
    const editorForm = document.getElementById("editorForm");
    const sourceTitle = document.getElementById("sourceTitle");
    const sourceDetail = document.getElementById("sourceDetail");
    const titleInput = document.getElementById("titleInput");
    const summaryInput = document.getElementById("summaryInput");
    const typeInput = document.getElementById("typeInput");
    const statusInput = document.getElementById("statusInput");
    const unitPriceInput = document.getElementById("unitPriceInput");
    const locationInput = document.getElementById("locationInput");
    const startAtInput = document.getElementById("startAtInput");
    const interviewInput = document.getElementById("interviewInput");
    const tagsInput = document.getElementById("tagsInput");
    const factsInput = document.getElementById("factsInput");
    const saveExhibitBtn = document.getElementById("saveExhibitBtn");
    const editorMessage = document.getElementById("editorMessage");
    const editorInputs = [titleInput, summaryInput, typeInput, statusInput, unitPriceInput, locationInput, startAtInput, interviewInput, tagsInput, factsInput];

    const escapeHtml = (value) => String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const parseTags = (value) => String(value || "")
      .split(/[、,，/]+/)
      .map((tag) => tag.trim())
      .filter(Boolean);

    const parseFacts = (value) => String(value || "")
      .split(/\n+/)
      .map((row) => row.trim())
      .filter(Boolean)
      .map((row) => {
        const parts = row.split("｜");
        return {
          label: (parts.length > 1 ? parts.shift() : "条件").trim(),
          value: (parts.join("｜") || row).trim()
        };
      });

    const setEditorMessage = (message = "", type = "") => {
      editorMessage.textContent = message;
      editorMessage.classList.toggle("is-error", type === "error");
      editorMessage.classList.toggle("is-success", type === "success");
    };

    const clearInvalidFields = () => {
      editorInputs.forEach((input) => {
        input.classList.remove("is-invalid");
        input.removeAttribute("aria-invalid");
      });
    };

    const markInvalidField = (input) => {
      if (!input) return;
      input.classList.add("is-invalid");
      input.setAttribute("aria-invalid", "true");
    };

    const getFactFormatError = (value) => {
      const rows = String(value || "").split(/\n+/);
      for (let index = 0; index < rows.length; index += 1) {
        const row = rows[index].trim();
        if (!row) continue;
        if (!row.includes("｜")) {
          return `条件概要第 ${index + 1} 行格式不正确，请使用「项目｜内容」。`;
        }
        const [label, ...valueParts] = row.split("｜");
        if (!label.trim() || !valueParts.join("｜").trim()) {
          return `条件概要第 ${index + 1} 行缺少项目或内容。`;
        }
      }
      return "";
    };

    const validateEditorForm = () => {
      clearInvalidFields();
      if (!activeCase) {
        return {valid: false, message: "请先从左侧选择一个案件。"};
      }

      const errors = [];
      const title = titleInput.value.trim();
      const summary = summaryInput.value.trim();
      const selectedType = typeInput.value;
      const tags = parseTags(tagsInput.value);
      const factError = getFactFormatError(factsInput.value);

      if (!selectedType) {
        errors.push({input: typeInput, message: "请选择展示分组，保存后会显示在对应的右侧列表中。"});
      }
      if (title.length > 80) {
        errors.push({input: titleInput, message: "案件标题请控制在 80 个字以内。"});
      }
      if ((selectedType === "priority" || selectedType === "focus") && !summary) {
        errors.push({input: summaryInput, message: "重点推荐或注力案件需要填写案件概要。"});
      }
      if (summary.length > 500) {
        errors.push({input: summaryInput, message: "案件概要请控制在 500 个字以内。"});
      }
      if (unitPriceInput.value.trim().length > 40) {
        errors.push({input: unitPriceInput, message: "单价内容过长，请控制在 40 个字以内。"});
      }
      if (tags.length > 8) {
        errors.push({input: tagsInput, message: "关键词最多填写 8 个。"});
      }
      if (factError) {
        errors.push({input: factsInput, message: factError});
      }

      if (!errors.length) return {valid: true};
      const firstError = errors[0];
      markInvalidField(firstError.input);
      firstError.input.focus({preventScroll: true});
      firstError.input.scrollIntoView({behavior: "smooth", block: "center"});
      return {valid: false, message: firstError.message};
    };

    const formatFacts = (facts) => (facts || [])
      .map((fact) => `${fact.label || ""}｜${fact.value || ""}`)
      .join("\n");

    const formatSourceNo = (id) => {
      const text = String(id || "").trim();
      return text ? `MS-${text}` : "";
    };

    const formatUpdatedAt = (value) => {
      const date = new Date(value || "");
      if (Number.isNaN(date.getTime())) return "";
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}.${m}.${d}`;
    };

    const formatDateParam = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    const currentFilterDate = () => {
      if (filters.range === "all") return "";
      const date = new Date();
      if (filters.range === "yesterday") {
        date.setDate(date.getDate() - 1);
      }
      return formatDateParam(date);
    };

    const firstMatch = (text, patterns) => {
      for (const pattern of patterns) {
        const matched = text.match(pattern);
        if (matched && matched[1]) return matched[1].trim();
      }
      return "";
    };

    const normalizeDetailText = (text) => String(text || "")
      .replace(/\r\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();

    const sourceKeywordPattern = [
      "Spring Boot", "JavaScript", "TypeScript", "PostgreSQL", "Salesforce",
      "DynamoDB", "RabbitMQ", "Amazon MQ", "AWS Step Functions", "AWS SDK",
      "Spring", "Java", "Python", "Django", "PHP", "Laravel", "React", "Vue",
      "Angular", "Node", "AWS", "Azure", "GCP", "SQL", "MySQL", "Oracle",
      "Linux", "Windows", "SAP", "SQS", "MQ", "PMO", "PM", "SE", "PL"
    ]
      .sort((a, b) => b.length - a.length)
      .map((keyword) => keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
      .join("|");

    const renderSourceDetail = (value) => {
      const escaped = escapeHtml(value || "--");
      const keywordRe = new RegExp(`(^|[^A-Za-z0-9])(${sourceKeywordPattern})(?=[^A-Za-z0-9]|$)`, "gi");
      return escaped.replace(keywordRe, (match, prefix, keyword) => (
        `${prefix}<mark class="skill-highlight">${keyword}</mark>`
      ));
    };

    const buildSummary = (detail) => {
      const normalized = normalizeDetailText(detail);
      if (!normalized) return "";
      const lines = normalized
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean)
        .filter((line) => !/^(お世話|いつも|以上|よろしく|-{2,}|={2,})/.test(line));
      return (lines[0] || normalized).slice(0, 180);
    };

    const extractFacts = (detail) => {
      const text = normalizeDetailText(detail);
      const fields = [
        ["契約形態", [/契約(?:形態)?\s*[：:]\s*([^\n]+)/, /雇用形態\s*[：:]\s*([^\n]+)/]],
        ["募集人数", [/募集(?:人数|枠)?\s*[：:]\s*([^\n]+)/, /人数\s*[：:]\s*([^\n]+)/]],
        ["期間", [/(?:期間|案件期間)\s*[：:]\s*([^\n]+)/]],
        ["日本語", [/日本語\s*[：:]\s*([^\n]+)/, /語学\s*[：:]\s*([^\n]+)/]],
        ["外国籍", [/外国籍\s*[：:]\s*([^\n]+)/]],
        ["商流", [/商流\s*[：:]\s*([^\n]+)/]]
      ];
      return fields
        .map(([label, patterns]) => ({label, value: firstMatch(text, patterns)}))
        .filter((item) => item.value);
    };

    const extractTags = (item) => {
      const text = `${item.title || ""}\n${item.detail || ""}`;
      const keywords = [
        "Java", "Spring", "Python", "Django", "PHP", "Laravel", "JavaScript", "TypeScript",
        "React", "Vue", "Angular", "Node", "AWS", "Azure", "GCP", "SQL", "MySQL", "PostgreSQL",
        "Oracle", "Linux", "Windows", "SAP", "Salesforce", "PM", "PMO", "SE", "PL"
      ];
      const found = [];
      keywords.forEach((keyword) => {
        const re = new RegExp(`(^|[^A-Za-z0-9])${keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^A-Za-z0-9]|$)`, "i");
        if (re.test(text) && !found.includes(keyword)) found.push(keyword);
      });
      return found.slice(0, 6);
    };

    const getSourceId = (item) => String((item && (item.sourceId || item.id)) || "");

    const mapProjectToCase = (item, index) => {
      const detail = item.detail || "";
      const normalized = normalizeDetailText(detail);
      const sourceId = String(item.id || "");
      return {
        id: sourceId,
        sourceId,
        sourceNo: formatSourceNo(item.id),
        type: "",
        title: "",
        sourceTitle: item.title || "未命名案件",
        date: item.date || "",
        status: "",
        updatedAt: formatUpdatedAt(item.date),
        summary: "",
        unitPrice: "",
        location: "",
        startAt: "",
        interview: "",
        facts: [],
        tags: [],
        sourceDetail: normalized,
        sourceAddress: item.address || ""
      };
    };

    const syncActiveCase = () => {
      if (!activeCase) return;
      const index = cases.findIndex((item) => item.id === activeCase.id);
      if (index >= 0) cases[index] = {...activeCase};
    };

    const renderList = () => {
      if (!cases.length) {
        caseList.innerHTML = '<div class="exhibit-empty">暂无系统案件</div>';
        return;
      }
      const activeSourceId = getSourceId(activeCase);
      caseList.innerHTML = cases.map((item) => `
        <button class="exhibit-item ${activeSourceId && getSourceId(item) === activeSourceId ? "is-active" : ""}" type="button" data-id="${escapeHtml(item.id)}">
          <strong>${escapeHtml(item.sourceTitle || "未命名案件")}</strong>
          <span class="exhibit-item-time">${escapeHtml(window.formatMonthDayTime(item.date, ""))}</span>
        </button>
      `).join("");
    };

    const updatePaginationUI = () => {
      casePageSummary.textContent = `共 ${totalCount} 件 · 第 ${currentPage} / ${totalPages} 页`;
      window.renderPagination(casePagination, casePaginationPages, currentPage, totalPages);
    };

    const fillForm = () => {
      const item = activeCase || {};
      clearInvalidFields();
      setEditorMessage("");
      titleInput.value = item.title || "";
      summaryInput.value = item.summary || "";
      typeInput.value = item.type || "";
      statusInput.value = item.status || "";
      unitPriceInput.value = item.unitPrice || "";
      locationInput.value = item.location || "";
      startAtInput.value = item.startAt || "";
      interviewInput.value = item.interview || "";
      tagsInput.value = (item.tags || []).join(" / ");
      factsInput.value = formatFacts(item.facts);
      sourceTitle.textContent = item.sourceTitle || "--";
      sourceDetail.innerHTML = renderSourceDetail(item.sourceDetail);
      saveExhibitBtn.disabled = !activeCase;
      updateDisplay();
    };

    const readForm = () => {
      if (!activeCase) return;
      activeCase = {
        ...activeCase,
        title: titleInput.value.trim(),
        summary: summaryInput.value.trim(),
        type: typeInput.value,
        status: statusInput.value.trim(),
        unitPrice: unitPriceInput.value.trim(),
        location: locationInput.value.trim(),
        startAt: startAtInput.value.trim(),
        interview: interviewInput.value.trim(),
        tags: parseTags(tagsInput.value),
        facts: parseFacts(factsInput.value)
      };
    };

    const renderFactGrid = (item) => {
      const facts = item.facts || [];
      if (!facts.length) {
        return "";
      }
      return `
        <div class="display-facts">
          ${facts.map((fact) => `
            <div class="display-fact">
              <span>${escapeHtml(fact.label)}</span>
              <strong>${escapeHtml(fact.value)}</strong>
            </div>
          `).join("")}
        </div>
      `;
    };

    const renderDisplayCard = (item) => `
      <article class="display-card ${getSourceId(activeCase) && getSourceId(item) === getSourceId(activeCase) ? "is-active" : ""}" data-source-id="${escapeHtml(getSourceId(item))}">
        <h4>${escapeHtml(item.title || item.sourceTitle || "未命名案件")}</h4>
        <button class="display-card-remove" type="button" data-remove-display="${escapeHtml(getSourceId(item))}" aria-label="删除${escapeHtml(item.title || item.sourceTitle || "未命名案件")}">删除</button>
      </article>
    `;

    const renderDisplayGroup = (type, title, compact = false) => {
      const items = displayCases.filter((item) => item.type === type);
      return `
        <section class="display-group">
          <div class="display-group-head">
            <h3>${escapeHtml(title)}</h3>
            <span>${items.length} 件</span>
          </div>
          ${items.length ? items.map((item) => renderDisplayCard(item, compact)).join("") : '<div class="display-empty">暂无展示数据</div>'}
        </section>
      `;
    };

    const renderDisplayList = () => {
      displayList.innerHTML = [
        renderDisplayGroup("priority", "重点推荐案件"),
        renderDisplayGroup("focus", "注力案件"),
        renderDisplayGroup("summary", "简易展示列表", true)
      ].join("");
    };

    const updateDisplay = () => {
      readForm();
      syncActiveCase();
      renderList();
      renderDisplayList();
    };

    const saveActiveToDisplayList = () => {
      if (!activeCase) return false;
      const validation = validateEditorForm();
      if (!validation.valid) {
        setEditorMessage("");
        return false;
      }
      readForm();
      const sourceId = getSourceId(activeCase);
      const savedCase = {
        ...activeCase,
        sourceId,
        facts: [...(activeCase.facts || [])],
        tags: [...(activeCase.tags || [])]
      };
      const index = displayCases.findIndex((item) => getSourceId(item) === sourceId);
      if (index >= 0) {
        displayCases[index] = savedCase;
      } else {
        displayCases.push(savedCase);
      }
      syncActiveCase();
      renderList();
      renderDisplayList();
      return true;
    };

    const removeDisplayCase = (id) => {
      const index = displayCases.findIndex((item) => getSourceId(item) === id);
      if (index < 0) return;
      displayCases.splice(index, 1);
      renderDisplayList();
    };

    const setLoading = () => {
      caseList.innerHTML = '<div class="exhibit-empty">加载系统案件中...</div>';
      updatePaginationUI();
    };

    const setLoadError = (message) => {
      caseList.innerHTML = `<div class="exhibit-empty">${escapeHtml(message || "案件列表加载失败")}</div>`;
      updatePaginationUI();
    };

    const loadSystemCases = async (page = 1) => {
      const requestSeq = ++caseRequestSeq;
      currentPage = page;
      setLoading();
      try {
        const params = new URLSearchParams();
        const date = currentFilterDate();
        if (date) params.set("date", date);
        params.set("page", String(currentPage));
        params.set("page_size", String(CASE_PAGE_SIZE));
        const payload = await window.requestJson(window.buildUrl("/api/mail-projects", params), {method: "GET"}, {
          fallbackMessage: "案件列表加载失败"
        });
        if (requestSeq !== caseRequestSeq) return;
        const items = (payload.data && payload.data.items) || [];
        const meta = payload.meta || {};
        currentPage = Number.isFinite(meta.page) ? meta.page : currentPage;
        totalCount = Number.isFinite(meta.total) ? meta.total : items.length;
        totalPages = Number.isFinite(meta.total_pages) ? Math.max(1, meta.total_pages) : 1;
        hasNextPage = currentPage < totalPages;
        cases = items.map(mapProjectToCase);
        activeCase = cases.length
          ? {...cases[0], facts: [...(cases[0].facts || [])], tags: [...(cases[0].tags || [])]}
          : null;
        renderList();
        updatePaginationUI();
        fillForm();
      } catch (err) {
        if (requestSeq !== caseRequestSeq) return;
        cases = [];
        activeCase = null;
        totalCount = 0;
        totalPages = 1;
        hasNextPage = false;
        fillForm();
        setLoadError(err.message);
      }
    };

    caseList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      readForm();
      syncActiveCase();
      const selected = cases.find((item) => item.id === button.dataset.id);
      if (!selected) return;
      activeCase = {
        ...selected,
        facts: [...(selected.facts || [])],
        tags: [...(selected.tags || [])]
      };
      renderList();
      fillForm();
    });

    displayList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-display]");
      if (!button) return;
      removeDisplayCase(button.dataset.removeDisplay);
    });

    const handleEditorChange = (event) => {
      const target = event.target;
      if (target && target.classList) {
        target.classList.remove("is-invalid");
        target.removeAttribute("aria-invalid");
      }
      setEditorMessage("");
      updateDisplay();
    };

    editorForm.addEventListener("input", handleEditorChange);
    editorForm.addEventListener("change", handleEditorChange);

    saveExhibitBtn.addEventListener("click", () => {
      if (!saveActiveToDisplayList()) return;
      const originalText = saveExhibitBtn.textContent;
      saveExhibitBtn.textContent = "已保存";
      saveExhibitBtn.disabled = true;
      setEditorMessage("已保存到右侧展示列表。", "success");
      window.setTimeout(() => {
        saveExhibitBtn.textContent = originalText;
        saveExhibitBtn.disabled = !activeCase;
      }, 1200);
    });

    dateButtons.forEach((button) => {
      button.addEventListener("click", () => {
        dateButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        filters.range = button.dataset.range || "today";
        loadSystemCases(1);
      });
    });

    window.bindPagination(casePagination, (value) => {
      if (value === "prev") {
        if (currentPage > 1) loadSystemCases(currentPage - 1);
        return;
      }
      if (value === "next") {
        if (hasNextPage) loadSystemCases(currentPage + 1);
        return;
      }
      const page = Number(value);
      if (Number.isFinite(page) && page >= 1 && page !== currentPage) {
        loadSystemCases(page);
      }
    });

    loadSystemCases();
  </script>
</body>
</html>
