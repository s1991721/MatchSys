<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="customer.title">客户管理</title>
</head>
<body class="c-form-page">
<div class="page">
    <section class="c-card">
        <div class="filters c-filter-panel">
            <div class="filter-grid c-filter-grid-wide">
                <label>
                    <span data-i18n="customer.filter.company">公司名称</span>
                    <input id="filter-company" type="text" placeholder="请输入公司名称"
                           data-i18n-placeholder="customer.filter.company_placeholder"/>
                </label>
                <label>
                    <span data-i18n="common.field.owner">负责人</span>
                    <select id="filter-owner"></select>
                </label>
            </div>
            <div class="filter-actions c-filter-actions-bar">
                <div class="filter-actions-left c-filter-actions-left">
                    <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" id="btn-add" type="button"
                            data-i18n="customer.action.add">+
                        新增客户
                    </button>
                    <button class="c-btn c-btn-secondary c-btn-lg" id="btn-bulk-email" type="button"
                            data-i18n="customer.action.bulk_email">群发邮件
                    </button>
                </div>
                <div class="filter-actions-right c-filter-actions-right c-filter-actions-group">
                    <button class="c-btn c-btn-primary" id="btn-search" type="button">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                             stroke-width="2">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="M20 20l-3.5-3.5"></path>
                        </svg>
                        <span data-i18n="common.search">搜索</span>
                    </button>
                    <button class="c-btn c-btn-warn" id="btn-reset" type="button" data-i18n="common.reset">重置</button>
                </div>
            </div>
        </div>
        <div class="table-actions c-table-actions"></div>
        <div class="table-wrapper c-table-wrapper">
            <table class="c-table c-table-hover c-table-center">
                <thead>
                <tr>
                    <th class="c-checkbox-col">
                        <input id="select-all-customers" type="checkbox" aria-label="选择全部"/>
                    </th>
                    <th data-i18n="customer.table.company">公司名称</th>
                    <th data-i18n="customer.table.address">公司地址</th>
                    <th data-i18n="common.field.note">备注</th>
                    <th data-i18n="customer.table.contact">联系人</th>
                    <th data-i18n="common.field.position">职位</th>
                    <th data-i18n="common.field.email">邮箱</th>
                    <th data-i18n="customer.table.phone">电话</th>
                    <th data-i18n="common.field.owner">负责人</th>
                    <th data-i18n="common.field.created_at">创建时间</th>
                    <th class="c-actions-col" data-i18n="common.field.actions">操作</th>
                </tr>
                </thead>
                <tbody id="customer-body"></tbody>
            </table>
        </div>
        <div class="pagination c-pagination" id="customer-pagination">
            <div class="pagination-summary">
                <span id="page-summary">共 0 条 当前显示第 1 页</span>
            </div>
            <div class="pagination-pages" id="customer-pagination-pages"></div>
        </div>
    </section>
</div>
<dialog class="c-dialog" id="edit-dialog">
    <div class="c-dialog-header">
        <h3 id="dialog-title">编辑客户</h3>
        <button class="c-dialog-close" type="button" aria-label="关闭" data-i18n-aria="common.close" data-dialog-close>
            ×
        </button>
    </div>
    <div class="c-dialog-body">
        <div class="form-grid">
            <div class="form-field full customer-card-upload" id="card-upload-section">
                <div class="customer-card-upload-head">
                    <p class="c-panel-title" data-i18n="customer.card.title">名片上传</p>
                    <p class="hint" data-i18n="customer.card.desc">上传名片图片后，可识别并自动填充联系人信息。</p>
                </div>
                <label class="c-field">
                    <span data-i18n="customer.card.file">名片图片</span>
                    <input id="edit-card-image" type="file" accept="image/*"/>
                </label>
                <div id="card-preview-section" hidden>
                    <div class="customer-card-upload-actions">
                        <button class="c-btn c-btn-secondary c-btn-sm" id="btn-card-ocr-fill" type="button"
                                data-i18n="customer.card.action.fill">识别并填充
                        </button>
                        <span class="hint" id="card-ocr-hint"
                              data-i18n="customer.card.hint">支持 JPG / PNG / WEBP。</span>
                    </div>
                    <div class="customer-card-preview">
                        <img id="card-preview-image" alt="名片预览" hidden/>
                        <div class="customer-card-preview-empty" id="card-preview-empty"
                             data-i18n="customer.card.preview_empty">
                            暂无预览
                        </div>
                    </div>
                </div>
            </div>
            <label class="c-field">
                <span data-i18n="customer.table.company">公司名称</span>
                <input id="edit-company" type="text"/>
            </label>
            <label class="c-field">
                <span data-i18n="customer.table.address">公司地址</span>
                <input id="edit-address" type="text"/>
            </label>
            <label class="c-field">
                <span>〒</span>
                <input id="edit-postcode" type="text"/>
            </label>
            <label class="c-field">
                <span>公司邮箱</span>
                <input id="edit-company-email" type="email"/>
            </label>
            <label class="c-field">
                <span data-i18n="customer.field.contract">契约</span>
                <input id="edit-contract" type="file"/>
                <span class="hint" id="contract-hint" data-i18n="customer.contract.empty">未上传</span>
            </label>
            <label class="c-field">
                <span data-i18n="common.field.note">备注</span>
                <textarea id="edit-remark"></textarea>
            </label>
            <label class="c-field">
                <span data-i18n="common.field.owner">负责人</span>
                <select id="edit-owner"></select>
            </label>
            <div class="form-field full">
                <div class="c-card c-card-compact">
                    <p class="c-panel-title" data-i18n="customer.contact.group1">联系人1</p>
                    <div class="form-grid">
                        <label class="c-field">
                            <span data-i18n="customer.contact.name1">联系人1姓名</span>
                            <input id="edit-contact1-name" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.position1">联系人1职位</span>
                            <input id="edit-contact1-position" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.phone1">联系人1电话</span>
                            <input id="edit-contact1-phone" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.email1">联系人1邮箱</span>
                            <input id="edit-contact1-email" type="email"/>
                        </label>
                    </div>
                </div>
            </div>
            <div class="form-field full">
                <div class="c-card c-card-compact">
                    <p class="c-panel-title" data-i18n="customer.contact.group2">联系人2</p>
                    <div class="form-grid">
                        <label class="c-field">
                            <span data-i18n="customer.contact.name2">联系人2姓名</span>
                            <input id="edit-contact2-name" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.position2">联系人2职位</span>
                            <input id="edit-contact2-position" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.phone2">联系人2电话</span>
                            <input id="edit-contact2-phone" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.email2">联系人2邮箱</span>
                            <input id="edit-contact2-email" type="email"/>
                        </label>
                    </div>
                </div>
            </div>
            <div class="form-field full">
                <div class="c-card c-card-compact">
                    <p class="c-panel-title" data-i18n="customer.contact.group3">联系人3</p>
                    <div class="form-grid">
                        <label class="c-field">
                            <span data-i18n="customer.contact.name3">联系人3姓名</span>
                            <input id="edit-contact3-name" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.position3">联系人3职位</span>
                            <input id="edit-contact3-position" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.phone3">联系人3电话</span>
                            <input id="edit-contact3-phone" type="text"/>
                        </label>
                        <label class="c-field">
                            <span data-i18n="customer.contact.email3">联系人3邮箱</span>
                            <input id="edit-contact3-email" type="email"/>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="c-dialog-actions">
        <button class="c-btn c-btn-secondary" type="button" data-dialog-close data-i18n="common.cancel">取消</button>
        <button class="c-btn c-btn-primary" id="dialog-save" type="button" data-i18n="common.save">保存</button>
    </div>
</dialog>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
    const i18n = window.I18N;
    if (i18n) {
        i18n.init();
        i18n.apply();
    }
    const t = (key) => (i18n ? i18n.t(key) : key);
    const format = (key, vars) => (i18n ? i18n.format(key, vars) : key);
    const escapeHtml = window.escapeHtml;

    const tableBody = document.getElementById("customer-body");
    const filterCompany = document.getElementById("filter-company");
    const filterOwner = document.getElementById("filter-owner");
    const addButton = document.getElementById("btn-add");
    const searchButton = document.getElementById("btn-search");
    const resetButton = document.getElementById("btn-reset");
    const bulkEmailButton = document.getElementById("btn-bulk-email");
    const pagination = document.getElementById("customer-pagination");
    const paginationPages = document.getElementById("customer-pagination-pages");
    const pageSummary = document.getElementById("page-summary");
    const selectAllCheckbox = document.getElementById("select-all-customers");
    const editDialog = document.getElementById("edit-dialog");
    const dialogTitle = document.getElementById("dialog-title");
    const dialogSave = document.getElementById("dialog-save");
    const contractHint = document.getElementById("contract-hint");
    const cardUploadSection = document.getElementById("card-upload-section");
    const cardPreviewSection = document.getElementById("card-preview-section");
    const cardImageInput = document.getElementById("edit-card-image");
    const cardPreviewImage = document.getElementById("card-preview-image");
    const cardPreviewEmpty = document.getElementById("card-preview-empty");
    const cardOcrHint = document.getElementById("card-ocr-hint");
    const cardOcrFillButton = document.getElementById("btn-card-ocr-fill");
    const editFields = {
        company: document.getElementById("edit-company"),
        address: document.getElementById("edit-address"),
        postcode: document.getElementById("edit-postcode"),
        companyEmail: document.getElementById("edit-company-email"),
        contract: document.getElementById("edit-contract"),
        remark: document.getElementById("edit-remark"),
        owner: document.getElementById("edit-owner"),
        contact1Name: document.getElementById("edit-contact1-name"),
        contact1Position: document.getElementById("edit-contact1-position"),
        contact1Phone: document.getElementById("edit-contact1-phone"),
        contact1Email: document.getElementById("edit-contact1-email"),
        contact2Name: document.getElementById("edit-contact2-name"),
        contact2Position: document.getElementById("edit-contact2-position"),
        contact2Phone: document.getElementById("edit-contact2-phone"),
        contact2Email: document.getElementById("edit-contact2-email"),
        contact3Name: document.getElementById("edit-contact3-name"),
        contact3Position: document.getElementById("edit-contact3-position"),
        contact3Phone: document.getElementById("edit-contact3-phone"),
        contact3Email: document.getElementById("edit-contact3-email"),
    };
    let currentEditId = null;
    let cachedItems = [];
    let currentContract = "";
    let currentPage = 1;
    let pageSize = 10;
    let totalPages = 1;
    let selectedCustomerIds = new Set();
    let cardPreviewObjectUrl = "";
    let ownerOptionsCache = null;
    let ownerOptionsRequest = null;

    tableBody.addEventListener("click", (event) => {
        const target = event.target.closest("button[data-action]");
        if (!target) return;
        const id = target.dataset.id;
        const item = cachedItems.find((entry) => String(entry.id) === String(id));
        const action = target.dataset.action;
        if (action === "edit" && item) {
            openEditDialog(item);
            return;
        }
        if (action === "delete" && item) {
            deleteCustomer(item);
        }
    });

    tableBody.addEventListener("change", (event) => {
        const checkbox = event.target;
        if (!checkbox.matches(".row-select")) return;
        const id = checkbox.dataset.id;
        if (!id) return;
        if (checkbox.checked) {
            selectedCustomerIds.add(String(id));
        } else {
            selectedCustomerIds.delete(String(id));
        }
        syncSelectAllState();
        updateBulkButtonState();
    });

    selectAllCheckbox.addEventListener("change", () => {
        const rowCheckboxes = Array.from(tableBody.querySelectorAll(".row-select"));
        rowCheckboxes.forEach((input) => {
            input.checked = selectAllCheckbox.checked;
            const id = input.dataset.id;
            if (!id) return;
            if (selectAllCheckbox.checked) {
                selectedCustomerIds.add(String(id));
            } else {
                selectedCustomerIds.delete(String(id));
            }
        });
        syncSelectAllState();
        updateBulkButtonState();
    });

    addButton.addEventListener("click", () => {
        openEditDialog(null);
    });

    bulkEmailButton.addEventListener("click", () => {
        if (selectedCustomerIds.size === 0) return;
        try {
            window.MatchSys.clearStoredKey("bulkMailPrefill");
            const contextPayload = {
                selected_ids: Array.from(selectedCustomerIds),
                source: "customer",
                updatedAt: Date.now(),
            };
            window.MatchSys.writeJSONToSessionStorage("bulkMailContext", contextPayload);
        } catch (error) {
            console.error("save bulk mail context failed", error);
        }
        window.navigateAppRoute("bulk_email.html");
    });

    searchButton.addEventListener("click", () => {
        currentPage = 1;
        fetchCustomers();
    });

    resetButton.addEventListener("click", () => {
        filterCompany.value = "";
        filterOwner.value = "";
        currentPage = 1;
        fetchCustomers();
    });

    window.bindPagination(pagination, (value) => {
        if (value === "prev") {
            currentPage = Math.max(1, currentPage - 1);
        } else if (value === "next") {
            currentPage = Math.min(totalPages, currentPage + 1);
        } else {
            const targetPage = Number(value);
            if (!Number.isNaN(targetPage)) currentPage = targetPage;
        }
        fetchCustomers();
    });

    editFields.contract.addEventListener("change", () => {
        const file = editFields.contract.files[0];
        contractHint.textContent = file
            ? format("customer.contract.pending", {name: file.name})
            : (currentContract ? format("customer.contract.uploaded", {name: currentContract}) : t("customer.contract.empty"));
    });

    cardImageInput.addEventListener("change", () => {
        const file = cardImageInput.files && cardImageInput.files[0];
        if (cardPreviewObjectUrl) {
            URL.revokeObjectURL(cardPreviewObjectUrl);
            cardPreviewObjectUrl = "";
        }
        if (!file) {
            if (cardPreviewImage) {
                cardPreviewImage.hidden = true;
                cardPreviewImage.removeAttribute("src");
            }
            if (cardPreviewEmpty) cardPreviewEmpty.hidden = false;
            if (cardPreviewSection) cardPreviewSection.hidden = true;
            setCardHintText("customer.card.hint", "支持 JPG / PNG / WEBP。");
            return;
        }
        if (cardPreviewSection) cardPreviewSection.hidden = false;
        cardPreviewObjectUrl = URL.createObjectURL(file);
        if (cardPreviewImage) {
            cardPreviewImage.src = cardPreviewObjectUrl;
            cardPreviewImage.hidden = false;
        }
        if (cardPreviewEmpty) cardPreviewEmpty.hidden = true;
        setCardHintFormat("common.selected_name", {name: file.name}, `已选择：${file.name}`);
    });

    cardOcrFillButton.addEventListener("click", async () => {
        const file = cardImageInput && cardImageInput.files && cardImageInput.files[0];
        if (!file) {
            alert(t("customer.card.alert.file_required"));
            return;
        }
        cardOcrFillButton.disabled = true;
        const normalText = t("customer.card.action.fill");
        const processingText = t("customer.card.action.processing");
        cardOcrFillButton.textContent = processingText === "customer.card.action.processing" ? "识别中..." : processingText;
        setCardHintText("customer.card.processing", "正在识别，请稍候...");

        const formData = new FormData();
        formData.append("file", file);

        window.requestJson("/api/customers/card-ocr", {
            headers: {},
            body: formData,
        })
            .then(async (payload) => {
                if (!payload.success) {
                    throw new Error(payload.message || t("customer.card.alert.ocr_failed"));
                }
                const result = payload.data?.result || {};
                const companyName = String(result.company || "").trim();
                if (!companyName) {
                    applyCardResult(result);
                    setCardHintText("customer.card.success", "识别成功，已自动填充。");
                    return;
                }

                const existingCustomer = await findCompanyMatch(companyName);
                if (!existingCustomer) {
                    applyCardResult(result);
                    setCardHintText("customer.card.success", "识别成功，已自动填充。");
                    return;
                }

                const targetSlot = findFirstEmptyContactSlot(existingCustomer);
                if (!targetSlot) {
                    currentEditId = existingCustomer.id;
                    dialogTitle.textContent = t("customer.dialog.edit");
                    if (cardUploadSection) cardUploadSection.hidden = true;
                    applyCustomerToEditForm(existingCustomer);
                    setCardHintFormat(
                        "customer.card.company_contacts_full_with_name",
                        {company: existingCustomer.company_name || companyName},
                        "公司联系人已满，请编辑后再添加。"
                    );
                    alert(
                        format("customer.card.alert.contacts_full_with_name", {
                            company: existingCustomer.company_name || companyName,
                        })
                    );
                    return;
                }

                const updatePayload = buildCustomerPayloadFromItem(existingCustomer);
                fillContactSlotByCardResult(updatePayload, targetSlot, result);
                currentEditId = existingCustomer.id;
                dialogTitle.textContent = t("customer.dialog.edit");
                if (cardUploadSection) cardUploadSection.hidden = true;
                applyCustomerToEditForm(updatePayload);

                setCardHintFormat(
                    "customer.card.company_matched_appended",
                    {company: existingCustomer.company_name || companyName, slot: targetSlot},
                    `已填入现有公司联系人${targetSlot}，请点击保存。`
                );
                alert(
                    format("customer.card.alert.company_matched_appended", {
                        company: existingCustomer.company_name || companyName,
                        slot: targetSlot,
                    })
                );
            })
            .catch((error) => {
                setCardHintText("customer.card.failed", "识别失败，请重试。");
                alert(error.message || t("customer.card.alert.ocr_failed"));
            })
            .finally(() => {
                cardOcrFillButton.disabled = false;
                cardOcrFillButton.textContent = normalText === "customer.card.action.fill" ? "识别并填充" : normalText;
            });
    });

    dialogSave.addEventListener("click", () => {
        const contractFile = editFields.contract.files[0];
        const owner = readOwnerSelect(editFields.owner);
        const payload = {
            company_name: editFields.company.value.trim(),
            company_address: joinPostcodeAndAddress(editFields.postcode.value, editFields.address.value),
            company_email: editFields.companyEmail.value.trim(),
            remark: editFields.remark.value.trim(),
            contact1_name: editFields.contact1Name.value.trim(),
            contact1_position: editFields.contact1Position.value.trim(),
            contact1_email: editFields.contact1Email.value.trim(),
            contact1_phone: editFields.contact1Phone.value.trim(),
            contact2_name: editFields.contact2Name.value.trim(),
            contact2_position: editFields.contact2Position.value.trim(),
            contact2_email: editFields.contact2Email.value.trim(),
            contact2_phone: editFields.contact2Phone.value.trim(),
            contact3_name: editFields.contact3Name.value.trim(),
            contact3_position: editFields.contact3Position.value.trim(),
            contact3_email: editFields.contact3Email.value.trim(),
            contact3_phone: editFields.contact3Phone.value.trim(),
            person_in_charge: owner.name,
        };

        if (!payload.company_name) {
            alert(t("customer.alert.company_required"));
            return;
        }

        const url = currentEditId ? `/api/customers/${currentEditId}` : "/api/customers";
        const method = currentEditId ? "PUT" : "POST";
        window.requestJson(url, {
            method,
            body: JSON.stringify(payload),
        })
            .then((payload) => {
                if (!payload.success) {
                    throw new Error(payload.message || t("common.save_failed"));
                }
                const savedId = currentEditId || payload.data?.item?.id;
                if (contractFile && savedId) {
                    return uploadContract(savedId, contractFile);
                }
                return null;
            })
            .then(() => {
                closeDialog(editDialog);
                fetchCustomers();
            })
            .catch((error) => {
                alert(error.message || t("common.save_failed_retry"));
            });
    });

    window.initDialogCloseBehavior({
        dialogs: [editDialog],
        onClose: (dialog) => {
            closeDialog(dialog);
            return false;
        }
    });

    const uploadContract = (customerId, file) => {
        const formData = new FormData();
        formData.append("file", file);
        return window.requestJson(`/api/customers/${customerId}/contract`, {
            headers: {},
            body: formData,
        })
            .then((payload) => {
                if (!payload.success) {
                    throw new Error(payload.message || t("customer.contract.failed"));
                }
                currentContract = payload.data?.path || file.name;
                contractHint.textContent = format("customer.contract.uploaded", {name: currentContract});
                return payload;
            });
    };

    const setCardHintText = (key, fallback) => {
        if (!cardOcrHint) return;
        const value = t(key);
        cardOcrHint.textContent = value === key ? fallback : value;
    };

    const setCardHintFormat = (key, vars, fallback) => {
        if (!cardOcrHint) return;
        const value = format(key, vars);
        cardOcrHint.textContent = value === key ? fallback : value;
    };

    const resetCardPreview = () => {
        if (cardPreviewObjectUrl) {
            URL.revokeObjectURL(cardPreviewObjectUrl);
            cardPreviewObjectUrl = "";
        }
        if (cardImageInput) cardImageInput.value = "";
        if (cardPreviewImage) {
            cardPreviewImage.hidden = true;
            cardPreviewImage.removeAttribute("src");
        }
        if (cardPreviewEmpty) {
            cardPreviewEmpty.hidden = false;
        }
        if (cardPreviewSection) cardPreviewSection.hidden = true;
        setCardHintText("customer.card.hint", "支持 JPG / PNG / WEBP。");
    };

    const applyCardResult = (result) => {
        if (!result || typeof result !== "object") return;
        if (result.company) editFields.company.value = result.company;
        if (result.address) editFields.address.value = result.address;
        if (result.name) editFields.contact1Name.value = result.name;
        if (result.title) editFields.contact1Position.value = result.title;
        if (result.email) editFields.contact1Email.value = result.email;
        if (result.mobile || result.tel) editFields.contact1Phone.value = result.mobile || result.tel;
    };

    const normalizeCompanyName = (name) => {
        return String(name || "")
            .replace(/[\s\u3000]+/g, "")
            .toLowerCase();
    };

    const findCompanyMatch = async (companyName) => {
        const normalized = normalizeCompanyName(companyName);
        if (!normalized) return null;

        const pageSize = 100;
        let page = 1;
        let totalPageCount = 1;

        while (page <= totalPageCount) {
            const params = window.createParams([
                ["company_name", String(companyName || "").trim()],
                ["page", String(page)],
                ["page_size", String(pageSize)],
            ]);
            const url = window.buildUrl("/api/customers", params);
            const payload = await window.requestJson(url, {method: "GET"});
            if (!payload.success) return null;

            const result = payload.data || {};
            const meta = payload.meta || {};
            const items = Array.isArray(result.items) ? result.items : [];

            const hit = items.find((item) => {
                return normalizeCompanyName(item.company_name) === normalized;
            });
            if (hit) return hit;

            totalPageCount = Number(meta.total_pages) || 1;
            page += 1;
        }

        return null;
    };

    const findFirstEmptyContactSlot = (item) => {
        const slots = [1, 2, 3];
        for (const slot of slots) {
            const name = String(item?.[`contact${slot}_name`] || "").trim();
            const email = String(item?.[`contact${slot}_email`] || "").trim();
            const phone = String(item?.[`contact${slot}_phone`] || "").trim();
            const isEmpty = !name && !email && !phone;
            if (isEmpty) return slot;
        }
        return null;
    };

    const buildCustomerPayloadFromItem = (item) => {
        return {
            company_name: String(item?.company_name || "").trim(),
            company_address: String(item?.company_address || "").trim(),
            company_email: String(item?.company_email || "").trim(),
            contract: String(item?.contract || "").trim(),
            remark: String(item?.remark || "").trim(),
            contact1_name: String(item?.contact1_name || "").trim(),
            contact1_position: String(item?.contact1_position || "").trim(),
            contact1_email: String(item?.contact1_email || "").trim(),
            contact1_phone: String(item?.contact1_phone || "").trim(),
            contact2_name: String(item?.contact2_name || "").trim(),
            contact2_position: String(item?.contact2_position || "").trim(),
            contact2_email: String(item?.contact2_email || "").trim(),
            contact2_phone: String(item?.contact2_phone || "").trim(),
            contact3_name: String(item?.contact3_name || "").trim(),
            contact3_position: String(item?.contact3_position || "").trim(),
            contact3_email: String(item?.contact3_email || "").trim(),
            contact3_phone: String(item?.contact3_phone || "").trim(),
            person_in_charge: String(item?.person_in_charge || "").trim(),
        };
    };

    const fillContactSlotByCardResult = (payload, slot, result) => {
        if (!payload || !slot || !result) return;
        const phone = String(result.mobile || result.tel || "").trim();
        payload[`contact${slot}_name`] = String(result.name || "").trim();
        payload[`contact${slot}_position`] = String(result.title || "").trim();
        payload[`contact${slot}_email`] = String(result.email || "").trim();
        payload[`contact${slot}_phone`] = phone;
    };

    const splitPostcodeAndAddress = (value) => {
        const text = String(value || "").trim();
        if (!text) return {postcode: "", address: ""};
        const match = text.match(/^〒?\s*([0-9]{3}-?[0-9]{4})\s*(.*)$/);
        if (!match) return {postcode: "", address: text};
        return {
            postcode: match[1],
            address: String(match[2] || "").trim(),
        };
    };

    const joinPostcodeAndAddress = (postcode, address) => {
        const cleanPostcode = String(postcode || "").trim();
        const cleanAddress = String(address || "").trim();
        if (!cleanPostcode) return cleanAddress;
        if (!cleanAddress) return `〒${cleanPostcode}`;
        return `〒${cleanPostcode} ${cleanAddress}`;
    };

    const applyCustomerToEditForm = (item) => {
        const addressParts = splitPostcodeAndAddress(item?.company_address || "");
        editFields.company.value = item?.company_name || "";
        editFields.address.value = addressParts.address;
        editFields.postcode.value = addressParts.postcode;
        editFields.companyEmail.value = item?.company_email || "";
        editFields.contract.value = "";
        currentContract = item?.contract || "";
        contractHint.textContent = currentContract
            ? format("customer.contract.uploaded", {name: currentContract})
            : t("customer.contract.empty");
        editFields.remark.value = item?.remark || "";
        setOwnerSelectValue(editFields.owner, item?.person_in_charge || "");
        editFields.contact1Name.value = item?.contact1_name || "";
        editFields.contact1Position.value = item?.contact1_position || "";
        editFields.contact1Phone.value = item?.contact1_phone || "";
        editFields.contact1Email.value = item?.contact1_email || "";
        editFields.contact2Name.value = item?.contact2_name || "";
        editFields.contact2Position.value = item?.contact2_position || "";
        editFields.contact2Phone.value = item?.contact2_phone || "";
        editFields.contact2Email.value = item?.contact2_email || "";
        editFields.contact3Name.value = item?.contact3_name || "";
        editFields.contact3Position.value = item?.contact3_position || "";
        editFields.contact3Phone.value = item?.contact3_phone || "";
        editFields.contact3Email.value = item?.contact3_email || "";
    };

    const openDialog = (dialog) => {
        if (!dialog) return;
        if (typeof dialog.showModal === "function") {
            dialog.showModal();
        } else {
            dialog.setAttribute("open", "true");
        }
    };

    const closeDialog = (dialog) => {
        if (!dialog) return;
        if (typeof dialog.close === "function") {
            dialog.close();
        } else {
            dialog.removeAttribute("open");
        }
        if (dialog === editDialog) {
            currentEditId = null;
            editFields.contract.value = "";
            currentContract = "";
            contractHint.textContent = t("customer.contract.empty");
            resetCardPreview();
            if (cardUploadSection) cardUploadSection.hidden = false;
        }
    };

    const openEditDialog = (item) => {
        currentEditId = item ? item.id : null;
        dialogTitle.textContent = item ? t("customer.dialog.edit") : t("customer.dialog.create");
        if (cardUploadSection) cardUploadSection.hidden = Boolean(item);
        resetCardPreview();
        applyCustomerToEditForm(item);

        openDialog(editDialog);
    };

    const deleteCustomer = (item) => {
        const companyName = item?.company_name || t("customer.bulk.unnamed");
        const message = format("customer.confirm.delete", {name: companyName});
        const fallbackMessage = `确定删除客户「${companyName}」吗？`;
        if (!confirm(message === "customer.confirm.delete" ? fallbackMessage : message)) return;

        window.requestJson(`/api/customers/${encodeURIComponent(item.id)}`, {method: "DELETE"})
            .then((payload) => {
                if (!payload.success) {
                    throw new Error(payload.message || t("customer.alert.delete_failed"));
                }
                selectedCustomerIds.delete(String(item.id));
                fetchCustomers();
            })
            .catch((error) => {
                const fallback = "删除失败，请重试";
                const message = t("customer.alert.delete_failed");
                alert(error.message || (message === "customer.alert.delete_failed" ? fallback : message));
            });
    };

    const updateBulkButtonState = () => {
        const enabled = selectedCustomerIds.size > 0;
        bulkEmailButton.disabled = !enabled;
    };

    const syncSelectAllState = () => {
        const rowCheckboxes = Array.from(tableBody.querySelectorAll(".row-select"));
        const checkedCount = rowCheckboxes.filter((input) => input.checked).length;
        selectAllCheckbox.checked = checkedCount > 0 && checkedCount === rowCheckboxes.length;
        selectAllCheckbox.indeterminate = checkedCount > 0 && checkedCount < rowCheckboxes.length;
    };

    const renderRows = (items, totalCount, page, totalPageCount) => {
        const count = Number.isFinite(totalCount) ? totalCount : items.length;
        totalPages = Number.isFinite(totalPageCount) ? totalPageCount : 1;
        currentPage = Number.isFinite(page) ? page : 1;
        if (window.renderPagination) {
            window.renderPagination(pagination, paginationPages, currentPage, totalPages);
        }
        if (pageSummary) {
            pageSummary.textContent = format("customer.summary", {count, page: currentPage});
        }
        if (!items.length) {
            tableBody.innerHTML = `<tr><td colspan="11" class="c-empty">${escapeHtml(t("common.no_data"))}</td></tr>`;
            if (selectAllCheckbox) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            }
            updateBulkButtonState();
            return;
        }

        tableBody.innerHTML = items
            .map(
                (item) => `
            <tr>
              <td>
                <input class="row-select" type="checkbox" data-id="${escapeHtml(item.id)}" ${selectedCustomerIds.has(String(item.id)) ? "checked" : ""}/>
              </td>
              <td>${escapeHtml(item.company_name || "-")}</td>
              <td>${escapeHtml(item.company_address || "-")}</td>
              <td>${escapeHtml(item.remark || "-")}</td>
              <td>${escapeHtml(item.contact1_name || "-")}</td>
              <td>${escapeHtml(item.contact1_position || "-")}</td>
              <td>${escapeHtml(item.contact1_email || "-")}</td>
              <td>${escapeHtml(item.contact1_phone || "-")}</td>
              <td>${escapeHtml(item.person_in_charge || "-")}</td>
              <td>${escapeHtml(item.created_at || "-")}</td>
              <td>
                <div class="row-actions c-row-actions c-row-actions-nowrap">
                  <button class="c-btn c-btn-secondary c-btn-sm" type="button" data-action="edit" data-id="${escapeHtml(item.id)}">${escapeHtml(t("common.edit"))}</button>
                  <button class="c-btn c-btn-danger c-btn-sm" type="button" data-action="delete" data-id="${escapeHtml(item.id)}">${escapeHtml(t("common.delete"))}</button>
                </div>
              </td>
            </tr>
          `
            )
            .join("");
        syncSelectAllState();
        updateBulkButtonState();
    };

    const fetchCustomers = () => {
        const ownerFilter = readOwnerSelect(filterOwner);
        const params = window.createParams([
            ["company_name", filterCompany.value.trim()],
            ["person_in_charge", ownerFilter.name],
            ["page", String(currentPage)],
            ["page_size", String(pageSize)],
        ]);
        const url = window.buildUrl("/api/customers", params);
        window.requestJson(url, {method: "GET"})
            .then((payload) => {
                if (!payload.success) {
                    cachedItems = [];
                    renderRows([], 0, 1, 1);
                    return;
                }
                const result = payload.data || {};
                const meta = payload.meta || {};
                cachedItems = Array.isArray(result.items) ? result.items : [];
                const total = meta.total;
                const page = meta.page;
                const totalPages = meta.total_pages;
                renderRows(cachedItems, total, page, totalPages);
            })
            .catch(() => {
                cachedItems = [];
                renderRows([], 0, 1, 1);
            });
    };

    const createOption = (value, label = value) => {
        const option = document.createElement("option");
        option.value = String(value ?? "");
        option.textContent = String(label ?? value ?? "");
        return option;
    };

    const readOwnerSelect = (selectEl) => {
        if (!selectEl) return {name: ""};
        const selected = selectEl.options[selectEl.selectedIndex];
        if (!selected || !selected.value) return {name: ""};
        return {
            name: selected.textContent.trim(),
        };
    };

    const setOwnerSelectValue = (selectEl, ownerName) => {
        if (!selectEl) return;
        const name = String(ownerName || "").trim();
        const option = Array.from(selectEl.options).find((entry) => entry.textContent.trim() === name);
        selectEl.value = option ? option.value : "";
    };

    const fetchOwnerOptions = () => {
        if (ownerOptionsCache) return Promise.resolve(ownerOptionsCache);
        if (ownerOptionsRequest) return ownerOptionsRequest;
        const params = window.createParams([["role_id", "2"]]);
        ownerOptionsRequest = window.requestJson(window.buildUrl("/api/user-logins/by-role", params), {method: "GET"})
            .then((payload) => {
                const result = payload.data || {};
                const items = Array.isArray(result.items) ? result.items : [];
                ownerOptionsCache = items;
                return items;
            })
            .catch((error) => {
                ownerOptionsRequest = null;
                throw error;
            });
        return ownerOptionsRequest;
    };

    const renderOwnerOptions = (selectEl, items, {includeAll = false} = {}) => {
        if (!selectEl) return;
        selectEl.innerHTML = "";
        selectEl.appendChild(createOption("", includeAll ? "全部" : ""));
        items.forEach((item) => {
            if (!item || !item.employee_name) return;
            selectEl.appendChild(createOption(item.employee_id || "", item.employee_name));
        });
    };

    const loadOwnerOptions = () => {
        return fetchOwnerOptions()
            .then((items) => {
                renderOwnerOptions(filterOwner, items, {includeAll: true});
                renderOwnerOptions(editFields.owner, items);
                return items;
            })
            .catch(() => {
                renderOwnerOptions(filterOwner, [], {includeAll: true});
                renderOwnerOptions(editFields.owner, []);
                return [];
            });
    };

    loadOwnerOptions()
        .then(() => {
            fetchCustomers();
        })
        .catch(() => {
            fetchCustomers();
        });

    filterOwner.addEventListener("change", () => {
        currentPage = 1;
        fetchCustomers();
    });

    editFields.owner.addEventListener("change", () => {
        const selected = readOwnerSelect(editFields.owner);
        if (!selected.name) {
            editFields.owner.value = "";
        }
    });

</script>
</body>
</html>
