<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="finance.title">财务管理</title>
    <style>
        .finance-page .c-switch-wrap {
            max-width: 100%;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .finance-page .c-switcher-group {
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .finance-content {
            min-height: 240px;
        }
        .finance-view {
            display: grid;
            gap: 16px;
        }
        .finance-view.hidden {
            display: none;
        }
        .finance-section-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }
        .finance-section-title {
            margin: 0;
            font-size: 20px;
            line-height: 1.25;
            color: #0f172a;
        }
        .finance-summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }
        .finance-summary-item {
            min-height: 84px;
            padding: 14px;
            border: 1px solid rgba(148, 163, 184, 0.38);
            border-radius: 8px;
            background: #f8fafc;
        }
        .finance-summary-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }
        .finance-summary-value {
            display: block;
            margin-top: 8px;
            color: #0f172a;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.1;
        }
        .finance-empty-row {
            text-align: center;
            color: #94a3b8;
            padding: 28px 12px;
        }
        .finance-subtabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid rgba(148, 163, 184, 0.32);
            border-radius: 8px;
            background: #f8fafc;
        }
        .finance-subtab {
            min-height: 34px;
            padding: 0 14px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #475569;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .finance-subtab.is-active {
            background: #fff;
            color: #1d4ed8;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
        }
        .finance-subpanel {
            display: grid;
            gap: 16px;
        }
        .finance-subpanel.hidden {
            display: none;
        }
        @media (max-width: 980px) {
            .finance-summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .finance-section-head {
                align-items: stretch;
                flex-direction: column;
            }
        }
        @media (max-width: 640px) {
            .finance-page .c-page-head-grid {
                grid-template-columns: 1fr;
            }
            .finance-page .c-switch-wrap {
                justify-self: stretch;
            }
            .finance-summary-grid,
            .c-inline-filters-grid-3 {
                grid-template-columns: 1fr;
            }
            .finance-section-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body class="order-page finance-page">
<div class="page">
    <div class="c-stack">
        <div class="c-page-head-grid">
            <div class="c-page-head-spacer" aria-hidden="true"></div>
            <div class="c-switch-wrap">
                <div class="c-switcher-group" role="tablist" aria-label="财务视角切换" data-i18n-aria="finance.title">
                    <button class="c-toggle is-active" type="button" data-finance-view="receivables" role="tab" aria-selected="true" data-i18n="finance.tabs.receivables">应收管理</button>
                    <button class="c-toggle" type="button" data-finance-view="payables" role="tab" aria-selected="false" data-i18n="finance.tabs.payables">应付管理</button>
                    <button class="c-toggle" type="button" data-finance-view="reimbursements" role="tab" aria-selected="false" data-i18n="finance.tabs.reimbursements">报销管理</button>
                    <button class="c-toggle" type="button" data-finance-view="payroll" role="tab" aria-selected="false" data-i18n="finance.tabs.payroll">工资计算</button>
                    <button class="c-toggle" type="button" data-finance-view="payments" role="tab" aria-selected="false" data-i18n="finance.tabs.payments">支付记录</button>
                    <button class="c-toggle" type="button" data-finance-view="reports" role="tab" aria-selected="false" data-i18n="finance.tabs.reports">财务报表</button>
                    <button class="c-toggle" type="button" data-finance-view="settings" role="tab" aria-selected="false" data-i18n="finance.tabs.settings">财务设置</button>
                </div>
            </div>
        </div>

        <div id="financeContent" class="finance-content" aria-live="polite"></div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
(function () {
    const viewConfig = {
        receivables: {
            html: "finance/receivables.html",
            init: "receivables",
        },
        payables: {
            html: "finance/payables.html",
            init: "payables",
        },
        reimbursements: {
            html: "finance/reimbursements.html",
            init: "reimbursements",
        },
        payroll: {
            html: "finance/payroll.html",
            init: "payroll",
        },
        payments: {
            html: "finance/payments.html",
            init: "payments",
        },
        reports: {
            html: "finance/reports.html",
            init: "reports",
        },
        settings: {
            html: "finance/settings.html",
            init: "settings",
        },
    };

    const t = (key, fallback) => {
        const i18n = window.I18N;
        return i18n && typeof i18n.t === "function" ? i18n.t(key) : fallback;
    };

    const applyI18n = (root) => {
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(root);
        }
    };

    const renderState = (container, message, isError) => {
        container.innerHTML = `
            <section class="c-card c-card-pad finance-view">
                <div class="${isError ? "c-empty" : "c-muted"}">${window.escapeHtml ? window.escapeHtml(message) : message}</div>
            </section>
        `;
    };

    const runInlineScripts = (root) => {
        Array.from(root.querySelectorAll("script")).forEach((script) => {
            const executable = document.createElement("script");
            Array.from(script.attributes).forEach((attribute) => {
                executable.setAttribute(attribute.name, attribute.value);
            });
            executable.textContent = script.textContent;
            document.body.appendChild(executable);
            executable.remove();
        });
    };

    const initView = (view, panel) => {
        const registry = window.FinanceViews || {};
        const handler = registry[viewConfig[view].init];
        if (handler && typeof handler.init === "function") {
            handler.init(panel);
        }
    };

    const initSubtabs = (root) => {
        if (!root || root.dataset.subtabsInitialized === "true") return;

        const buttons = Array.from(root.querySelectorAll("[data-finance-subtab]"));
        const panels = Array.from(root.querySelectorAll("[data-finance-subpanel]"));
        if (!buttons.length || !panels.length) return;

        const activate = (subtab) => {
            buttons.forEach((button) => {
                const active = button.dataset.financeSubtab === subtab;
                button.classList.toggle("is-active", active);
                button.setAttribute("aria-selected", String(active));
            });
            panels.forEach((panel) => {
                panel.classList.toggle("hidden", panel.dataset.financeSubpanel !== subtab);
            });
        };

        buttons.forEach((button) => {
            button.addEventListener("click", () => activate(button.dataset.financeSubtab));
        });
        activate((buttons.find((button) => button.classList.contains("is-active")) || buttons[0]).dataset.financeSubtab);
        root.dataset.subtabsInitialized = "true";
    };

    document.addEventListener("DOMContentLoaded", () => {
        const buttons = Array.from(document.querySelectorAll("[data-finance-view]"));
        const container = document.getElementById("financeContent");
        const cachedPanels = new Map();
        let activeView = null;
        let requestId = 0;

        const setButtonState = (view) => {
            buttons.forEach((button) => {
                const active = button.dataset.financeView === view;
                button.classList.toggle("is-active", active);
                button.setAttribute("aria-selected", String(active));
            });
        };

        const showCachedPanel = (view) => {
            cachedPanels.forEach((panel, panelView) => {
                panel.classList.toggle("hidden", panelView !== view);
            });
        };

        const setView = async (view) => {
            const config = viewConfig[view];
            if (!config || !container || activeView === view) {
                return;
            }

            const currentRequestId = ++requestId;
            setButtonState(view);

            if (cachedPanels.has(view)) {
                showCachedPanel(view);
                activeView = view;
                return;
            }

            renderState(container, t("common.loading", "加载中..."), false);

            try {
                const response = await fetch(config.html, { credentials: "same-origin" });
                if (!response.ok) {
                    throw new Error(`${response.status} ${response.statusText}`);
                }

                const wrapper = document.createElement("div");
                wrapper.innerHTML = await response.text();
                const panel = wrapper.firstElementChild;
                if (!panel) {
                    throw new Error(t("common.invalid_response", "无效响应"));
                }
                if (currentRequestId !== requestId) {
                    return;
                }

                container.innerHTML = "";
                cachedPanels.forEach((cachedPanel) => container.appendChild(cachedPanel));
                container.appendChild(panel);
                cachedPanels.set(view, panel);
                showCachedPanel(view);
                activeView = view;

                applyI18n(panel);
                initSubtabs(panel);
                runInlineScripts(wrapper);
                initView(view, panel);
            } catch (error) {
                if (currentRequestId !== requestId) {
                    return;
                }
                renderState(container, `${t("common.load_failed", "加载失败")}：${error.message}`, true);
            }
        };

        buttons.forEach((button) => {
            button.addEventListener("click", () => setView(button.dataset.financeView));
        });

        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        applyI18n(document);
        setView("receivables");
    });
}());
</script>
</body>
</html>
