<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title data-i18n="my_salary.title">我的薪资</title>
</head>
<body class="my-salary-page">
<div class="page">
    <div class="page-mid c-stack">
        <section class="c-card c-card-pad">
            <div class="header-card">
                <div>
                    <div class="title c-title-bar c-title-bar-xl" data-i18n="my_salary.title">我的薪资</div>
                    <p class="c-card-subtitle" data-i18n="my_salary.subtitle">查看个人月度薪资、发放状态与明细构成。</p>
                </div>
                <div class="c-filter-actions-group my-salary-toolbar">
                    <label class="c-inline-field" for="salaryMonth">
                        <span data-i18n="my_salary.month">薪资月份</span>
                        <input id="salaryMonth" type="month" aria-label="薪资月份" data-i18n-aria="my_salary.month"/>
                    </label>
                    <button class="c-btn c-btn-secondary" type="button" id="refreshSalaryBtn" data-i18n="common.search">搜索</button>
                </div>
            </div>
        </section>

        <section class="my-salary-summary-grid" aria-label="薪资概览" data-i18n-aria="my_salary.summary">
            <div class="c-card c-card-pad my-salary-summary-item">
                <span class="c-card-subtitle" data-i18n="my_salary.summary.gross">应发工资</span>
                <span class="my-salary-summary-value" id="grossSalary">¥0</span>
                <span class="c-card-subtitle my-salary-summary-note" data-i18n="my_salary.summary.gross_note">基本工资 + 加算</span>
            </div>
            <div class="c-card c-card-pad my-salary-summary-item">
                <span class="c-card-subtitle" data-i18n="my_salary.summary.deduction">扣款合计</span>
                <span class="my-salary-summary-value" id="deductionSalary">¥0</span>
                <span class="c-card-subtitle my-salary-summary-note" data-i18n="my_salary.summary.deduction_note">税金 / 社保 / 其他扣款</span>
            </div>
            <div class="c-card c-card-pad my-salary-summary-item">
                <span class="c-card-subtitle" data-i18n="my_salary.summary.net">实发工资</span>
                <span class="my-salary-summary-value" id="netSalary">¥0</span>
                <span class="c-card-subtitle my-salary-summary-note" data-i18n="my_salary.summary.net_note">本月预计入账金额</span>
            </div>
            <div class="c-card c-card-pad my-salary-summary-item">
                <span class="c-card-subtitle" data-i18n="my_salary.summary.status">发放状态</span>
                <span class="my-salary-summary-value" id="paymentStatus" data-i18n="my_salary.status.pending">待发放</span>
                <span class="c-card-subtitle my-salary-summary-note" id="paymentDate" data-i18n="my_salary.payment_date.empty">发放日未设置</span>
            </div>
        </section>

        <div class="c-split-grid-wide">
            <section class="c-card c-card-pad">
                <div class="c-card-head">
                    <div class="title c-title-bar c-title-bar-lg">
                        <span class="c-ico" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4Zm2 2v12h12V6H6Zm2 2h8v2H8V8Zm0 4h8v2H8v-2Zm0 4h5v2H8v-2Z"/></svg>
                        </span>
                        <span data-i18n="my_salary.section.history">薪资记录</span>
                    </div>
                </div>
                <div class="table-wrap c-table-wrapper">
                    <table class="c-table c-table-hover">
                        <thead>
                        <tr>
                            <th data-i18n="my_salary.table.month">月份</th>
                            <th data-i18n="my_salary.table.gross">应发</th>
                            <th data-i18n="my_salary.table.deduction">扣款</th>
                            <th data-i18n="my_salary.table.net">实发</th>
                            <th data-i18n="my_salary.table.status">状态</th>
                        </tr>
                        </thead>
                        <tbody id="salaryHistoryBody">
                        <tr><td class="c-empty my-salary-empty-row" colspan="5" data-i18n="my_salary.empty">暂无薪资数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="c-card c-card-pad">
                <div class="c-card-head">
                    <div class="title c-title-bar c-title-bar-lg">
                        <span class="c-ico c-ico-success" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 5.8 3.2L12 10.7 6.2 7.5 12 4.3ZM5 9.2l6 3.3v6.8l-6-3.3V9.2Zm14 6.8-6 3.3v-6.8l6-3.3V16Z"/></svg>
                        </span>
                        <span data-i18n="my_salary.section.breakdown">本月构成</span>
                    </div>
                </div>
                <div class="table-wrap c-table-wrapper">
                    <table class="c-table">
                        <tbody>
                        <tr><th data-i18n="my_salary.item.base">基本工资</th><td id="baseSalary">¥0</td></tr>
                        <tr><th data-i18n="my_salary.item.overtime">加班 / 加算</th><td id="extraSalary">¥0</td></tr>
                        <tr><th data-i18n="my_salary.item.tax">税金</th><td id="taxSalary">¥0</td></tr>
                        <tr><th data-i18n="my_salary.item.social">社保 / 年金</th><td id="socialSalary">¥0</td></tr>
                        <tr><th data-i18n="my_salary.item.other">其他扣款</th><td id="otherSalary">¥0</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="../i18n.js"></script>
<script src="../common.js"></script>
<script>
(function () {
    const i18n = window.I18N;
    if (window.MatchSys && typeof window.MatchSys.applyI18n === "function") window.MatchSys.applyI18n();

    const monthInput = document.getElementById("salaryMonth");
    const refreshBtn = document.getElementById("refreshSalaryBtn");
    const historyBody = document.getElementById("salaryHistoryBody");
    const t = (key, fallback) => i18n && typeof i18n.t === "function" ? i18n.t(key) : fallback;

    const formatMonth = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        return `${year}-${month}`;
    };

    const setEmptyState = () => {
        const empty = t("my_salary.empty", "暂无薪资数据");
        historyBody.innerHTML = `<tr><td class="c-empty my-salary-empty-row" colspan="5">${window.escapeHtml(empty)}</td></tr>`;
    };

    const refresh = () => {
        document.getElementById("grossSalary").textContent = "¥0";
        document.getElementById("deductionSalary").textContent = "¥0";
        document.getElementById("netSalary").textContent = "¥0";
        document.getElementById("paymentStatus").textContent = t("my_salary.status.pending", "待发放");
        document.getElementById("paymentDate").textContent = t("my_salary.payment_date.empty", "发放日未设置");
        ["baseSalary", "extraSalary", "taxSalary", "socialSalary", "otherSalary"].forEach((id) => {
            document.getElementById(id).textContent = "¥0";
        });
        setEmptyState();
    };

    if (monthInput) {
        monthInput.value = formatMonth(new Date());
        monthInput.addEventListener("change", refresh);
    }
    if (refreshBtn) {
        refreshBtn.addEventListener("click", refresh);
    }
    refresh();
}());
</script>
</body>
</html>
