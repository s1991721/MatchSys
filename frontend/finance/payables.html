<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title>应付列表</title>
</head>
<body class="order-page finance-page finance-module-page">
<div class="page finance-module-page-shell">
    <section class="c-card c-card-pad finance-view" data-finance-panel="payables">

    <div class="finance-section-head">
        <div>
            <h2 class="finance-section-title" data-i18n="finance.payables.title">应付管理</h2>
            <p class="c-card-subtitle" data-i18n="finance.payables.subtitle">管理 BP、外注、工资、报销、税金等待支付款项与付款计划。</p>
        </div>
        <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" type="button" data-i18n="finance.action.add_payable">新增应付</button>
    </div>
    <div class="finance-subtabs" role="tablist" aria-label="应付管理子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="list">应付列表</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="schedule">付款计划</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="confirm">支付确认</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="vendor">对象对账</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="aging">应付 Aging</button>
    </div>
        <div class="finance-subframe-shell">
            <iframe id="financeSubFrame" class="finance-subframe" src="payables/list.html" title="应付列表"></iframe>
        </div>
    </section>
</div>

<script src="../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
        const routes = {
        list: { src: "payables/list.html", title: "应付列表" },
        schedule: { src: "payables/schedule.html", title: "付款计划" },
        confirm: { src: "payables/confirm.html", title: "支付确认" },
        vendor: { src: "payables/vendor.html", title: "对象对账" },
        aging: { src: "payables/aging.html", title: "应付 Aging" }
        };
        const buttons = Array.from(document.querySelectorAll("[data-finance-subtab]"));
        const frame = document.getElementById("financeSubFrame");
        const currentLang = () => window.I18N && typeof window.I18N.getLang === "function" ? window.I18N.getLang() : "zh-CN";
        const syncFrameLang = () => {
            if (!frame || !frame.contentWindow) return;
            try { frame.contentWindow.postMessage({ type: "i18n:change", lang: currentLang() }, "*"); } catch (e) {}
        };
        const setSubtab = (key) => {
            const route = routes[key];
            if (!route || !frame) return;
            buttons.forEach((button) => {
                const active = button.dataset.financeSubtab === key;
                button.classList.toggle("is-active", active);
                button.setAttribute("aria-selected", String(active));
            });
            if (!frame.getAttribute("src") || !frame.getAttribute("src").endsWith(route.src)) {
                frame.setAttribute("src", route.src);
            }
            frame.setAttribute("title", route.title);
        };
        buttons.forEach((button) => {
            button.addEventListener("click", () => setSubtab(button.dataset.financeSubtab));
        });
        if (frame) {
            frame.addEventListener("load", syncFrameLang);
        }
        window.addEventListener("i18n:change", syncFrameLang);
        setSubtab("list");
    });
}());
</script>
</body>
</html>
