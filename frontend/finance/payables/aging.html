<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>应付 Aging</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="payables.aging">
        <div class="finance-summary-grid">
            <div class="finance-summary-item"><span class="finance-summary-label">未到期</span><span class="finance-summary-value">¥0</span></div>
            <div class="finance-summary-item"><span class="finance-summary-label">逾期 1-30 天</span><span class="finance-summary-value">¥0</span></div>
            <div class="finance-summary-item"><span class="finance-summary-label">逾期 31-60 天</span><span class="finance-summary-value">¥0</span></div>
            <div class="finance-summary-item"><span class="finance-summary-label">逾期 60 天以上</span><span class="finance-summary-value">¥0</span></div>
        </div>
    
</div>

<script src="../../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
    });
}());
</script>
</body>
</html>
