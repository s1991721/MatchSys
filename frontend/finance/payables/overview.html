<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>应付概览</title>
    <style>
        .payable-overview-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
            gap: 16px;
        }
        .payable-overview-panel {
            border: 1px solid rgba(148, 163, 184, 0.36);
            border-radius: 8px;
            background: #fff;
            padding: 16px;
        }
        .payable-overview-title {
            margin: 0 0 14px;
            color: #0f172a;
            font-size: 15px;
            font-weight: 800;
        }
        .payable-month-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }
        .payable-month-card {
            min-height: 86px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
        }
        .payable-month-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }
        .payable-month-value {
            display: block;
            margin-top: 8px;
            color: #0f172a;
            font-size: 22px;
            font-weight: 900;
            line-height: 1.1;
        }
        .payable-month-list {
            display: grid;
            gap: 10px;
        }
        .payable-month-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            background: #f8fafc;
            color: #1f2937;
            font-weight: 800;
        }
        .payable-month-amount {
            color: #b91c1c;
        }
        .payable-overview-note {
            margin-top: 12px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }
        @media (max-width: 900px) {
            .payable-overview-grid,
            .payable-month-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="payables.overview">
    <div class="payable-overview-grid">
        <section class="payable-overview-panel">
            <h3 class="payable-overview-title">本月汇总</h3>
            <div class="payable-month-grid">
                <div class="payable-month-card">
                    <span class="payable-month-label">本月应付</span>
                    <span class="payable-month-value">¥0</span>
                </div>
                <div class="payable-month-card">
                    <span class="payable-month-label">已付金额</span>
                    <span class="payable-month-value">¥0</span>
                </div>
                <div class="payable-month-card">
                    <span class="payable-month-label">未付金额</span>
                    <span class="payable-month-value">¥0</span>
                </div>
            </div>
            <p class="payable-overview-note">本月应付汇总</p>
        </section>

        <section class="payable-overview-panel">
            <h3 class="payable-overview-title">历史未平账月份</h3>
            <div class="payable-month-list">
                <div class="payable-month-item" role="status">
                    <span>暂无历史未平账月份</span>
                    <span class="payable-month-amount">¥0</span>
                </div>
            </div>
            <p class="payable-overview-note">应付数据接口接入后，可在此按月份查看未平账数据。</p>
        </section>
    </div>
</div>

<script src="../../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", applyI18n);
}());
</script>
</body>
</html>
