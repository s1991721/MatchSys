<section class="c-card c-card-pad finance-view" data-finance-panel="payroll">
    <div class="finance-section-head">
        <div>
            <h2 class="finance-section-title" data-i18n="finance.payroll.title">工资计算</h2>
            <p class="c-card-subtitle" data-i18n="finance.payroll.subtitle">按月份汇总考勤、契约单价、扣款与最终发放金额。</p>
        </div>
        <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" type="button" data-i18n="finance.action.calculate_payroll">计算工资</button>
    </div>
    <div class="finance-subtabs" role="tablist" aria-label="工资计算子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="monthly">月度工资</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="calculate">工资计算</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="attendance">考勤关联</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="adjustments">扣款/加算</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="payment">工资发放</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="detail">工资明细</button>
    </div>
    <div class="finance-subpanel" data-finance-subpanel="monthly">
    <div class="table-wrap c-table-wrapper">
        <table class="c-table c-table-hover">
            <thead><tr><th>月份</th><th>员工</th><th>出勤日数</th><th>基本工资</th><th>扣款</th><th>发放金额</th><th>状态</th><th class="c-actions-col">操作</th></tr></thead>
            <tbody><tr><td class="finance-empty-row" colspan="8" data-i18n="finance.empty">暂无数据</td></tr></tbody>
        </table>
    </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="calculate">
        <div class="c-inline-filters">
            <div class="c-inline-filters-grid-3">
                <div class="c-inline-field"><span>计算月份</span><input type="month"></div>
                <div class="c-inline-field"><span>对象范围</span><select><option>全部员工</option><option>社员</option><option>契约员工</option></select></div>
                <div class="c-inline-field"><span>状态</span><select><option>未计算</option><option>重新计算</option></select></div>
            </div>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="attendance">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>月份</th><th>员工</th><th>出勤日数</th><th>缺勤</th><th>加班</th><th>关联状态</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="6">暂无考勤关联数据</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="adjustments">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>员工</th><th>项目</th><th>类型</th><th>金额</th><th>适用月份</th><th>备注</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="6">暂无扣款/加算</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="payment">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>月份</th><th>员工</th><th>发放金额</th><th>预定发放日</th><th>发放状态</th><th class="c-actions-col">操作</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="6">暂无工资发放数据</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="detail">
        <div class="c-empty">选择员工后查看工资明细</div>
    </div>
</section>
