<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title>工资计算</title>
</head>
<body class="order-page finance-page finance-module-page">
<div class="page finance-module-page-shell">
    <section class="c-card c-card-pad finance-view" data-finance-panel="payroll">

        <div class="finance-subtabs" role="tablist" aria-label="工资计算子功能" data-i18n-aria="payroll.tabs.aria">
            <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="basic" data-i18n="payroll.tabs.basic">基本工资</button>
            <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="monthly" data-i18n="payroll.tabs.monthly">月度计算</button>
            <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="annuity" data-i18n="payroll.tabs.annuity">年金保险基数设置</button>
            <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="withholdingTax" data-i18n="payroll.tabs.withholding_tax">源泉徴収税額表</button>
            <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="employmentInsurance" data-i18n="payroll.tabs.employment_insurance">雇佣保险</button>
            <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="basicItemSettings" data-i18n="payroll.tabs.basic_item_settings">基础项目设置</button>
        </div>
        <div class="finance-subframe-shell">
            <iframe id="financeSubFrame" class="finance-subframe" src="payroll/basic-info.html" title="基本工资"></iframe>
        </div>
    </section>
</div>

<script src="../i18n.js"></script>
<script src="finance-common.js"></script>
<script src="../common.js"></script>
<script>
(function () {
    FinanceUI.onReady(() => {
        const routes = {
            basic: { src: "payroll/basic-info.html", titleKey: "payroll.tabs.basic", fallbackTitle: "基本工资" },
            monthly: { src: "payroll/monthly-calculation.html", titleKey: "payroll.tabs.monthly", fallbackTitle: "月度计算" },
            annuity: { src: "settings/annuity.html", titleKey: "payroll.tabs.annuity", fallbackTitle: "年金保险基数设置" },
            withholdingTax: { src: "payroll/withholding-tax-table.html", titleKey: "payroll.tabs.withholding_tax", fallbackTitle: "源泉徴収税額表" },
            employmentInsurance: { src: "payroll/employment-insurance.html", titleKey: "payroll.tabs.employment_insurance", fallbackTitle: "雇佣保险" },
            basicItemSettings: { src: "payroll/basic-item-settings.html", titleKey: "payroll.tabs.basic_item_settings", fallbackTitle: "基础项目设置" }
        };
        const pageParams = new URLSearchParams(window.location.search || "");
        const LAST_SUBTAB_KEY = "finance:payroll:last-subtab";
        const STATE_MAX_AGE_MS = 12 * 60 * 60 * 1000;
        const readLastSubtab = () => {
            try {
                const stored = window.MatchSys && typeof window.MatchSys.readJSONFromSessionStorage === "function"
                    ? window.MatchSys.readJSONFromSessionStorage(LAST_SUBTAB_KEY, STATE_MAX_AGE_MS)
                    : null;
                const subtab = stored && typeof stored === "object" ? stored.subtab : "";
                return routes[subtab] ? subtab : "";
            } catch (e) {
                return "";
            }
        };
        const writeLastSubtab = (subtab) => {
            if (!routes[subtab]) return;
            try {
                if (window.MatchSys && typeof window.MatchSys.writeJSONToSessionStorage === "function") {
                    window.MatchSys.writeJSONToSessionStorage(LAST_SUBTAB_KEY, { subtab, updatedAt: Date.now() });
                }
            } catch (e) {}
        };
        const buildFrameSrc = (key, src) => {
            if (key !== "basic") return src;
            const employeeId = pageParams.get("employee_id");
            if (!employeeId) return src;
            const params = new URLSearchParams();
            params.set("employee_id", employeeId);
            const trigger = pageParams.get("trigger");
            if (trigger) params.set("trigger", trigger);
            return `${src}?${params.toString()}`;
        };
        const initialSubtab = routes[pageParams.get("subtab")] ? pageParams.get("subtab") : (readLastSubtab() || "basic");
        FinanceUI.initSubtabFrame({
            initialKey: initialSubtab,
            titleKey: "finance.payroll.title",
            fallbackTitle: "工资计算",
            routes,
            buildFrameSrc: (key, route, params = {}) => {
                if (params.preservePageParams) return buildFrameSrc(key, route.src);
                return route.src;
            },
            initialParams: { preservePageParams: true },
            onSubtabChange: (key) => writeLastSubtab(key)
        });
        document.title = FinanceUI.t("finance.payroll.title", "工资计算");
    });
}());
</script>
</body>
</html>
