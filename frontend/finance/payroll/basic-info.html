<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>基础信息</title>
    <style>
        html,
        body.finance-subpage {
            height: 100%;
            min-height: 0;
        }
        body.finance-subpage {
            overflow: hidden;
        }
        .finance-subpage-content[data-finance-subpage="payroll.basic"] {
            display: block;
            height: 100%;
            min-height: 0;
        }
        .payroll-basic-layout {
            display: grid;
            grid-template-columns: minmax(640px, 1fr) minmax(320px, 34%);
            gap: 18px;
            align-items: stretch;
            height: 100%;
            min-height: 0;
        }
        .payroll-basic-left,
        .payroll-basic-list-panel {
            min-width: 0;
            min-height: 0;
        }
        .payroll-basic-left {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .payroll-basic-detail-panel,
        .payroll-basic-list-panel {
            border-radius: 8px;
        }
        .payroll-basic-search-panel {
            margin-bottom: 18px;
        }
        .payroll-basic-detail-panel {
            min-width: 0;
            padding: 16px;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            border: 1px solid #dbe4f3;
            background: #f5f8fc;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        }
        .payroll-basic-detail-title[hidden] {
            display: none;
        }
        .payroll-basic-detail-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .payroll-basic-detail-form[hidden] {
            display: none;
        }
        .payroll-basic-form-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .payroll-basic-detail-empty {
            min-height: 300px;
            display: grid;
            place-items: center;
            color: #6b7894;
            border: 1px dashed #d8e1ef;
            border-radius: 8px;
            background: #f8fbff;
        }
        .payroll-basic-detail-empty[hidden] {
            display: none;
        }
        .payroll-basic-list-panel {
            min-width: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #fff;
        }
        .payroll-basic-list-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #fff;
            border-radius: 8px;
        }
        .payroll-basic-list-scroll.table-wrap,
        .payroll-basic-list-scroll.c-table-wrapper {
            padding: 0;
            margin: 0;
        }
        .payroll-basic-list-scroll .c-table th,
        .payroll-basic-list-scroll .c-table td {
            padding-left: 8px;
            padding-right: 8px;
        }
        .payroll-basic-list-row {
            cursor: pointer;
            position: relative;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .payroll-basic-list-row.is-active td {
            background: #eaf2ff;
            color: #0f2f6f;
            font-weight: 700;
        }
        .payroll-basic-list-row.is-active td:first-child {
            box-shadow: inset 4px 0 0 #2d7ef7;
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
        }
        .payroll-basic-list-row.is-active td:last-child {
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
        }
        .payroll-basic-list-row:focus-visible {
            outline: 2px solid #2d7ef7;
            outline-offset: -2px;
        }
        .payroll-basic-form-actions {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) auto auto;
            align-items: end;
            gap: 10px;
            margin-top: 14px;
        }
        .payroll-basic-form-actions .payroll-basic-remark-field {
            min-width: 0;
        }
        @media (max-width: 1100px) {
            body.finance-subpage {
                overflow: auto;
            }
            .payroll-basic-layout {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 0;
            }
            .payroll-basic-list-panel {
                order: -1;
            }
            .payroll-basic-list-scroll {
                min-height: 320px;
            }
        }
    </style>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="payroll.basic">
    <div class="payroll-basic-layout">
        <div class="payroll-basic-left">
            <div class="payroll-basic-search-panel">
                <div class="c-inline-filters-grid-3 payroll-basic-filter-row">
                    <label class="c-inline-field"><span data-i18n="payroll.basic.field.employee">员工</span><input id="payrollKeyword" type="text" placeholder="员工姓名" data-i18n-placeholder="payroll.basic.placeholder.employee"></label>
                    <label class="c-inline-field">
                        <span data-i18n="payroll.basic.field.contract_type">契约类型</span>
                        <select id="payrollContractType">
                            <option value="" data-i18n="common.all">全部</option>
                            <option value="0" data-i18n="payroll.basic.contract.regular">正社员</option>
                            <option value="1" data-i18n="payroll.basic.contract.contract">契约社员</option>
                            <option value="2" data-i18n="payroll.basic.contract.freelance">フリーランス</option>
                        </select>
                    </label>
                    <label class="c-inline-field">
                        <span data-i18n="payroll.basic.field.status">状态</span>
                        <select id="payrollStatus">
                            <option value="" data-i18n="common.all">全部</option>
                            <option value="1" data-i18n="payroll.basic.status.valid">有效</option>
                            <option value="0" data-i18n="payroll.basic.status.invalid">无效</option>
                        </select>
                    </label>
                    <div class="c-filter-actions-group payroll-basic-search-action">
                        <button type="button" class="c-btn c-btn-primary" id="payrollSearchBtn" data-i18n="common.search">搜索</button>
                    </div>
                </div>
            </div>
            <div class="payroll-basic-detail-panel personnel-page c-form-page">
                <span id="payrollBasicModalTitle" class="payroll-basic-detail-title" data-i18n="payroll.basic.modal.add" hidden>新增薪资信息</span>
                <div id="payrollBasicEmptyDetail" class="payroll-basic-detail-empty">请选择右侧员工</div>
                <form id="payrollBasicForm" class="payroll-basic-detail-form" hidden>
                <div class="form-grid payroll-basic-form-grid">
                    <label>
                        <span data-i18n="payroll.basic.field.employee">员工</span>
                        <input id="payrollEmployeeName" type="text" readonly>
                    </label>
                    <label>
                        <span data-i18n="payroll.basic.field.contract_type">契约类型</span>
                        <select id="payrollFormContractType">
                            <option value="0" data-i18n="payroll.basic.contract.regular">正社员</option>
                            <option value="1" data-i18n="payroll.basic.contract.contract">契约社员</option>
                            <option value="2" data-i18n="payroll.basic.contract.freelance">フリーランス</option>
                        </select>
                    </label>
                    <label>
                        <span data-i18n="payroll.basic.field.status">状态</span>
                        <select id="payrollFormStatus">
                            <option value="1" data-i18n="payroll.basic.status.valid">有效</option>
                            <option value="0" data-i18n="payroll.basic.status.invalid">无效</option>
                        </select>
                    </label>
                    <label>
                        <span data-i18n="payroll.basic.field.base_salary">基本工资</span>
                        <input id="payrollBaseSalary" type="number" min="0" step="1">
                    </label>
                    <label>
                        <span data-i18n="payroll.basic.field.withholding_tax_type">源泉税区分</span>
                        <select id="payrollWithholdingTaxType">
                            <option value="kou" data-i18n="payroll.basic.withholding_tax_type.kou">甲栏</option>
                            <option value="otsu" data-i18n="payroll.basic.withholding_tax_type.otsu">乙栏</option>
                        </select>
                    </label>
                    <label>
                        <span data-i18n="payroll.basic.field.dependent_count">扶养亲族等人数</span>
                        <input id="payrollDependentCount" type="number" min="0" max="7" step="1">
                    </label>
                    <div class="payroll-basic-adjustments-grid">
                        <div class="payroll-items-panel payroll-basic-adjustment-panel">
                            <div class="payroll-items-header">
                                <span data-i18n="payroll.basic.section.additions">增加项</span>
                            </div>
                            <div class="payroll-items-list" id="payrollAdditionItems"></div>
                        </div>
                        <div class="payroll-items-panel payroll-basic-adjustment-panel">
                            <div class="payroll-items-header">
                                <span data-i18n="payroll.basic.section.non_taxable_additions">非课税增加项</span>
                            </div>
                            <div class="payroll-items-list" id="payrollNonTaxableAdditionItems"></div>
                        </div>
                        <div class="payroll-items-panel payroll-basic-adjustment-panel">
                            <div class="payroll-items-header">
                                <span data-i18n="payroll.basic.section.deductions">减少项</span>
                            </div>
                            <div class="payroll-items-list" id="payrollDeductionItems"></div>
                        </div>
                    </div>
                </div>
                <div class="payroll-basic-form-actions">
                    <label class="payroll-basic-remark-field">
                        <span data-i18n="payroll.basic.field.remark">备注</span>
                        <input id="payrollRemark" type="text">
                    </label>
                    <button type="button" class="c-btn c-btn-danger payroll-basic-delete-action" id="payrollBasicDelete" data-i18n="common.delete">删除</button>
                    <button type="submit" class="c-btn c-btn-primary" data-i18n="common.save">保存</button>
                </div>
            </form>
            </div>
        </div>
        <div class="payroll-basic-list-panel">
            <div class="payroll-basic-list-scroll table-wrap c-table-wrapper">
                <table class="c-table c-table-hover">
                    <thead>
                    <tr>
                        <th data-i18n="payroll.basic.field.employee">员工</th>
                        <th data-i18n="payroll.basic.field.contract_type">契约类型</th>
                        <th data-i18n="payroll.basic.field.base_salary">基本工资</th>
                        <th data-i18n="payroll.basic.field.status">状态</th>
                    </tr>
                    </thead>
                    <tbody id="payrollBasicBody"><tr><td class="finance-empty-row" colspan="4" data-i18n="common.loading">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="../../i18n.js"></script>
<script>window.__routeNotified = true;</script>
<script src="../../error_code.js"></script>
<script src="../../common.js"></script>
<script>
(function () {
    const contractDefaults = {
        0: "正社员",
        1: "契约社员",
        2: "フリーランス"
    };
    const statusDefaults = {
        0: "无效",
        1: "有效"
    };
    const withholdingTaxTypeDefaults = {
        kou: "甲栏",
        otsu: "乙栏"
    };
    const basicItemSettingsApi = "/api/finance/settings/payroll-basic-items";
    const t = (key, fallback) => {
        if (!window.I18N || typeof window.I18N.t !== "function") return fallback;
        const value = window.I18N.t(key);
        return value && value !== key ? value : fallback;
    };
    const contractLabel = (value) => t(`payroll.basic.contract.${value}`, contractDefaults[value] || "");
    const statusLabel = (value) => t(`payroll.basic.status.${value === 1 ? "valid" : "invalid"}`, statusDefaults[value] || "");
    const withholdingTaxTypeLabel = (value) => t(
        `payroll.basic.withholding_tax_type.${value}`,
        withholdingTaxTypeDefaults[value] || withholdingTaxTypeDefaults.kou
    );
    const h = FinanceUI.escapeHtml;
    const formatMoney = (value) => {
        const number = Number(value || 0);
        if (!Number.isFinite(number)) return "0";
        return number.toLocaleString(window.getAppLocale ? window.getAppLocale() : "zh-CN", {
            maximumFractionDigits: 0
        });
    };
    const parseMoney = (value) => {
        const number = Number(value || 0);
        return Number.isFinite(number) ? number : 0;
    };
    const normalizeItems = (items) => {
        if (!Array.isArray(items)) return [];
        return items.map((item) => ({
            name: String(item?.name || "").trim(),
            amount: String(item?.amount ?? "0").trim() || "0"
        })).filter((item) => item.name || parseMoney(item.amount) !== 0);
    };
    const sumItems = (items) => normalizeItems(items).reduce((total, item) => total + parseMoney(item.amount), 0);

    document.addEventListener("DOMContentLoaded", () => {
        FinanceUI.applyI18n();

        const keywordInput = document.getElementById("payrollKeyword");
        const contractTypeSelect = document.getElementById("payrollContractType");
        const statusSelect = document.getElementById("payrollStatus");
        const searchBtn = document.getElementById("payrollSearchBtn");
        const tbody = document.getElementById("payrollBasicBody");
        const modalTitle = document.getElementById("payrollBasicModalTitle");
        const form = document.getElementById("payrollBasicForm");
        const deleteBtn = document.getElementById("payrollBasicDelete");
        const emptyDetail = document.getElementById("payrollBasicEmptyDetail");
        const additionItems = document.getElementById("payrollAdditionItems");
        const nonTaxableAdditionItems = document.getElementById("payrollNonTaxableAdditionItems");
        const deductionItems = document.getElementById("payrollDeductionItems");
        const fields = {
            employeeName: document.getElementById("payrollEmployeeName"),
            contractType: document.getElementById("payrollFormContractType"),
            baseSalary: document.getElementById("payrollBaseSalary"),
            withholdingTaxType: document.getElementById("payrollWithholdingTaxType"),
            dependentCount: document.getElementById("payrollDependentCount"),
            status: document.getElementById("payrollFormStatus"),
            remark: document.getElementById("payrollRemark")
        };
        let items = [];
        let editingId = null;
        let editingEmployeeId = null;
        let selectedKey = "";

        const normalizeWithholdingTaxInfo = (value = {}) => {
            const type = value.withholding_tax_type === "otsu" ? "otsu" : "kou";
            const count = Number(value.dependent_count ?? 0);
            return {
                withholding_tax_type: type,
                dependent_count: type === "kou" && Number.isInteger(count) && count >= 0
                    ? Math.min(count, 7)
                    : 0
            };
        };

        const applyWithholdingTaxFieldsState = () => {
            const isKou = fields.withholdingTaxType.value === "kou";
            fields.dependentCount.disabled = !isKou;
            fields.dependentCount.required = isKou;
            if (!isKou) fields.dependentCount.value = "0";
        };

        const updateModalTitle = () => {
            modalTitle.textContent = editingId
                ? t("payroll.basic.modal.edit", "编辑薪资信息")
                : t("payroll.basic.modal.add", "新增薪资信息");
        };

        const localizeItemControls = () => {
            form.querySelectorAll(".payroll-item-row").forEach((row) => {
                const amountInput = row.querySelector("[data-field='amount']");
                if (amountInput) amountInput.placeholder = t("payroll.basic.item.amount", "金额");
            });
            form.querySelectorAll(".payroll-item-empty").forEach((empty) => {
                empty.textContent = t("payroll.basic.item.empty", "暂无项目");
            });
        };

        const applyPageI18n = (rerenderRows = true) => {
            if (window.I18N && typeof window.I18N.apply === "function") window.I18N.apply(document);
            document.title = t("payroll.basic.title", "基础信息");
            updateModalTitle();
            localizeItemControls();
            if (rerenderRows) renderRows();
        };

        const createItemRow = (item = {}) => {
            const row = document.createElement("div");
            row.className = "payroll-item-row";
            const nameLabel = document.createElement("span");
            nameLabel.className = "payroll-item-name";
            nameLabel.dataset.field = "name";
            nameLabel.dataset.value = item.name || "";
            nameLabel.textContent = item.name || "";

            const amountInput = document.createElement("input");
            amountInput.type = "number";
            amountInput.min = "0";
            amountInput.step = "1";
            amountInput.dataset.field = "amount";
            amountInput.placeholder = t("payroll.basic.item.amount", "金额");
            amountInput.value = item.amount ?? "0";

            row.append(nameLabel, amountInput);
            return row;
        };

        const renderItemRows = (container, rows) => {
            container.innerHTML = "";
            const normalized = normalizeItems(rows);
            if (!normalized.length) {
                const empty = document.createElement("div");
                empty.className = "payroll-item-empty";
                empty.textContent = t("payroll.basic.item.empty", "暂无项目");
                container.appendChild(empty);
                return;
            }
            normalized.forEach((item) => container.appendChild(createItemRow(item)));
        };

        const collectItems = (container) => Array.from(container.querySelectorAll(".payroll-item-row")).map((row) => ({
            name: row.querySelector("[data-field='name']").dataset.value.trim(),
            amount: row.querySelector("[data-field='amount']").value || "0"
        })).filter((item) => item.name && parseMoney(item.amount) !== 0);

        const fetchBasicItemSettings = async () => {
            const payload = await window.requestJson(basicItemSettingsApi, {method: "GET", cache: "no-store"});
            return payload?.data?.settings || {};
        };

        const mergeItems = (basicItemNames, employeeItems) => {
            const names = Array.isArray(basicItemNames)
                ? basicItemNames.map((name) => String(name || "").trim()).filter(Boolean)
                : [];
            const savedItems = normalizeItems(employeeItems).filter((item) => item.name);
            const consumed = new Set();
            const merged = names.map((name) => {
                const savedIndex = savedItems.findIndex((item, index) => !consumed.has(index) && item.name === name);
                if (savedIndex < 0) return {name, amount: "0"};
                consumed.add(savedIndex);
                return {name, amount: savedItems[savedIndex].amount};
            });
            savedItems.forEach((item, index) => {
                if (!consumed.has(index)) merged.push(item);
            });
            return merged;
        };

        const itemKey = (item) => item?.id ? `payroll:${item.id}` : `employee:${item?.employee_id || ""}`;

        const showEmptyDetail = (message) => {
            form.hidden = true;
            emptyDetail.hidden = false;
            emptyDetail.textContent = message || t("payroll.basic.detail.empty", "请选择右侧员工");
            form.reset();
            fields.withholdingTaxType.value = "kou";
            fields.dependentCount.value = "0";
            applyWithholdingTaxFieldsState();
            renderItemRows(additionItems, []);
            renderItemRows(nonTaxableAdditionItems, []);
            renderItemRows(deductionItems, []);
            editingId = null;
            editingEmployeeId = null;
            selectedKey = "";
            updateModalTitle();
            deleteBtn.hidden = true;
        };

        const refreshSelectedRow = () => {
            tbody.querySelectorAll(".payroll-basic-list-row").forEach((row) => {
                const active = row.dataset.key === selectedKey;
                row.classList.toggle("is-active", active);
                row.setAttribute("aria-selected", String(active));
            });
        };

        const renderRows = () => {
            if (!items.length) {
                tbody.innerHTML = `<tr><td class="finance-empty-row" colspan="4">${h(t("payroll.basic.empty", "暂无基础信息"))}</td></tr>`;
                return;
            }
            tbody.innerHTML = items.map((item) => {
                const contract = contractLabel(Number(item.contract_type)) || item.contract_label || "";
                const status = statusLabel(Number(item.status)) || item.status_label || "";
                const key = itemKey(item);
                return `
                    <tr class="payroll-basic-list-row${key === selectedKey ? " is-active" : ""}" data-action="select" data-key="${h(key)}" tabindex="0" aria-selected="${key === selectedKey ? "true" : "false"}">
                        <td>${h(item.employee_name || item.employee_id)}</td>
                        <td>${h(contract)}</td>
                        <td>${h(formatMoney(item.base_salary))}</td>
                        <td>${h(status)}</td>
                    </tr>
                `;
            }).join("");
            refreshSelectedRow();
        };

        const selectItem = async (item) => {
            if (!item) {
                showEmptyDetail(t("payroll.basic.detail.empty", "请选择右侧员工"));
                renderRows();
                return;
            }
            const settings = await fetchBasicItemSettings();
            selectedKey = itemKey(item);
            editingId = item?.id || null;
            editingEmployeeId = item?.employee_id || null;
            updateModalTitle();
            fields.employeeName.value = item?.employee_name || "";
            fields.contractType.value = String(item?.contract_type ?? 0);
            fields.baseSalary.value = item?.base_salary || "0";
            const withholdingTaxInfo = normalizeWithholdingTaxInfo(item);
            fields.withholdingTaxType.value = withholdingTaxInfo.withholding_tax_type;
            fields.dependentCount.value = String(withholdingTaxInfo.dependent_count);
            applyWithholdingTaxFieldsState();
            renderItemRows(additionItems, mergeItems(settings.increase_items, item?.addition_items));
            renderItemRows(nonTaxableAdditionItems, mergeItems(settings.non_taxable_increase_items, item?.non_taxable_addition_items));
            renderItemRows(deductionItems, mergeItems(settings.decrease_items, item?.deduction_items));
            fields.status.value = String(item?.status ?? 1);
            fields.remark.value = item?.remark || "";
            deleteBtn.hidden = !editingId;
            emptyDetail.hidden = true;
            form.hidden = false;
            refreshSelectedRow();
        };

        const fetchList = async (options = {}) => {
            tbody.innerHTML = `<tr><td class="finance-empty-row" colspan="4">${h(t("common.loading", "加载中..."))}</td></tr>`;
            const params = window.createParams([
                ["keyword", keywordInput.value.trim()],
                ["contract_type", contractTypeSelect.value],
                ["status", statusSelect.value],
                ["page_size", "100"]
            ]);
            const payload = await window.requestJson(window.buildUrl("/api/finance/payroll/basic-info", params), {method: "GET"});
            items = Array.isArray(payload.data?.items) ? payload.data.items : [];
            renderRows();
            if (options.keepSelection) {
                const current = items.find((item) => itemKey(item) === selectedKey);
                if (current) {
                    await selectItem(current);
                    return;
                }
            }
            await selectItem(items[0] || null);
        };

        const fetchEmployee = async (employeeId) => {
            const payload = await window.requestJson(`/api/employees/${encodeURIComponent(employeeId)}`, {method: "GET"});
            return payload.data?.item || {};
        };

        const fetchPayrollByEmployee = async (employeeId) => {
            const params = window.createParams([
                ["employee_id", String(employeeId)],
                ["page_size", "1"]
            ]);
            const payload = await window.requestJson(window.buildUrl("/api/finance/payroll/basic-info", params), {method: "GET"});
            const found = Array.isArray(payload.data?.items) ? payload.data.items : [];
            return found[0] || null;
        };

        const openModal = async (mode, data, employee) => {
            const settings = await fetchBasicItemSettings();
            editingId = mode === "edit" ? data?.id : null;
            editingEmployeeId = data?.employee_id || employee?.id || null;
            selectedKey = itemKey({id: editingId, employee_id: editingEmployeeId});
            updateModalTitle();
            fields.employeeName.value = data?.employee_name || employee?.name || "";
            fields.contractType.value = String(data?.contract_type ?? 0);
            fields.baseSalary.value = data?.base_salary || "0";
            const withholdingTaxInfo = normalizeWithholdingTaxInfo(data);
            fields.withholdingTaxType.value = withholdingTaxInfo.withholding_tax_type;
            fields.dependentCount.value = String(withholdingTaxInfo.dependent_count);
            applyWithholdingTaxFieldsState();
            renderItemRows(additionItems, mergeItems(settings.increase_items, data?.addition_items));
            renderItemRows(nonTaxableAdditionItems, mergeItems(settings.non_taxable_increase_items, data?.non_taxable_addition_items));
            renderItemRows(deductionItems, mergeItems(settings.decrease_items, data?.deduction_items));
            fields.status.value = String(data?.status ?? 1);
            fields.remark.value = data?.remark || "";
            deleteBtn.hidden = !editingId;
            emptyDetail.hidden = true;
            form.hidden = false;
            refreshSelectedRow();
        };

        const buildPayload = () => {
            const additions = collectItems(additionItems);
            const nonTaxableAdditions = collectItems(nonTaxableAdditionItems);
            const deductions = collectItems(deductionItems);
            const withholdingTaxInfo = normalizeWithholdingTaxInfo({
                withholding_tax_type: fields.withholdingTaxType.value,
                dependent_count: fields.dependentCount.value
            });
            return {
                employee_id: editingEmployeeId,
                contract_type: Number(fields.contractType.value),
                base_salary: fields.baseSalary.value || "0",
                withholding_tax_type: withholdingTaxInfo.withholding_tax_type,
                dependent_count: withholdingTaxInfo.dependent_count,
                addition_items: additions,
                non_taxable_addition_items: nonTaxableAdditions,
                deduction_items: deductions,
                status: Number(fields.status.value),
                remark: fields.remark.value.trim()
            };
        };

        const handleEmployeeTrigger = async () => {
            const params = new URLSearchParams(window.location.search || "");
            const employeeId = params.get("employee_id");
            if (!employeeId) return;
            const trigger = params.get("trigger") || "";
            const triggerKey = trigger ? `payroll_basic_trigger_${trigger}` : "";
            if (triggerKey) {
                try {
                    if (sessionStorage.getItem(triggerKey) === "1") return;
                    sessionStorage.setItem(triggerKey, "1");
                } catch {
                }
            }
            const cleanUrl = `${window.location.pathname}`;
            window.history.replaceState({}, document.title, cleanUrl);
            try {
                const existing = await fetchPayrollByEmployee(employeeId);
                if (existing) {
                    keywordInput.value = existing.employee_name || "";
                    contractTypeSelect.value = "";
                    statusSelect.value = "";
                    items = [existing];
                    renderRows();
                    await openModal("edit", existing);
                    return;
                }
                const employee = await fetchEmployee(employeeId);
                const draft = {
                    employee_id: employeeId,
                    employee_name: employee?.name || "",
                    contract_type: 0,
                    base_salary: "0",
                    withholding_tax_type: "kou",
                    dependent_count: 0,
                    addition_items: [],
                    non_taxable_addition_items: [],
                    deduction_items: [],
                    status: 1,
                    remark: ""
                };
                keywordInput.value = draft.employee_name;
                contractTypeSelect.value = "";
                statusSelect.value = "";
                items = [draft];
                renderRows();
                await openModal("add", draft, employee);
            } catch (err) {
                window.alert(err.message || t("payroll.basic.error.load_salary", "薪资信息加载失败"));
            }
        };

        searchBtn.addEventListener("click", () => {
            fetchList().catch((err) => {
                tbody.innerHTML = `<tr><td class="finance-empty-row" colspan="4">${h(t("common.load_failed", "加载失败"))}：${h(err.message)}</td></tr>`;
                showEmptyDetail(t("common.load_failed", "加载失败"));
            });
        });
        tbody.addEventListener("click", async (event) => {
            const row = event.target.closest("tr[data-action='select']");
            if (!row) return;
            const item = items.find((item) => itemKey(item) === row.dataset.key);
            if (!item) return;
            try {
                await selectItem(item);
            } catch (err) {
                window.alert(err.message || t("payroll.basic.error.load_salary", "薪资信息加载失败"));
            }
        });
        tbody.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            const row = event.target.closest("tr[data-action='select']");
            if (!row) return;
            event.preventDefault();
            row.click();
        });
        keywordInput.addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            event.preventDefault();
            searchBtn.click();
        });
        fields.withholdingTaxType.addEventListener("change", applyWithholdingTaxFieldsState);
        deleteBtn.addEventListener("click", async (event) => {
            event.preventDefault();
            event.stopPropagation();
            if (!editingId) return;
            if (!window.confirm(t("payroll.basic.confirm.delete", "确定删除这条薪资信息吗？"))) return;
            try {
                await window.requestJson(`/api/finance/payroll/basic-info/${editingId}`, {
                    method: "DELETE"
                });
                window.alert(t("payroll.basic.message.deleted", "薪资信息已删除。"));
                await fetchList();
            } catch (err) {
                window.alert(err.message || t("common.delete_failed", "删除失败"));
            }
        });
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = buildPayload();
            try {
                const url = editingId ? `/api/finance/payroll/basic-info/${editingId}` : "/api/finance/payroll/basic-info";
                await window.requestJson(url, {
                    method: editingId ? "PUT" : "POST",
                    body: JSON.stringify(payload)
                });
                await fetchList({keepSelection: true});
            } catch (err) {
                window.alert(err.message || t("common.save_failed", "保存失败"));
            }
        });

        applyPageI18n(false);

        fetchList()
            .then(handleEmployeeTrigger)
            .catch((err) => {
                tbody.innerHTML = `<tr><td class="finance-empty-row" colspan="4">${h(t("common.load_failed", "加载失败"))}：${h(err.message)}</td></tr>`;
                showEmptyDetail(t("common.load_failed", "加载失败"));
            });
        window.addEventListener("i18n:change", applyPageI18n);
    });
}());
</script>
</body>
</html>
