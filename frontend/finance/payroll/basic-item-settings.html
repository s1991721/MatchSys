<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title data-i18n="payroll.tabs.basic_item_settings">基础项目设置</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="payroll.basic-item-settings">
    <div class="finance-empty-row" data-i18n="payroll.basic_item_settings.empty">暂无基础项目设置</div>
</div>

<script src="../../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") window.I18N.init();
        if (window.I18N && typeof window.I18N.apply === "function") window.I18N.apply(document);
    };
    document.addEventListener("DOMContentLoaded", applyI18n);
    window.addEventListener("i18n:change", applyI18n);
    window.addEventListener("message", (event) => {
        if (event.data?.type !== "i18n:change" || !event.data.lang) return;
        if (window.I18N && typeof window.I18N.setLang === "function") {
            window.I18N.setLang(event.data.lang);
        }
        applyI18n();
    });
}());
</script>
</body>
</html>
