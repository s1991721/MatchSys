<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>工资计算</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="payroll.calculate">
        <div class="c-inline-filters">
            <div class="c-inline-filters-grid-3">
                <div class="c-inline-field"><span>计算月份</span><input type="month"></div>
                <div class="c-inline-field"><span>对象范围</span><select><option>全部员工</option><option>社员</option><option>契约员工</option></select></div>
                <div class="c-inline-field"><span>状态</span><select><option>未计算</option><option>重新计算</option></select></div>
            </div>
        </div>
    
</div>

<script src="../../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
    });
}());
</script>
</body>
</html>
