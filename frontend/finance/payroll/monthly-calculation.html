<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>月度计算</title>
    <style>
        html,
        body.finance-subpage {
            height: 100%;
            min-height: 0;
        }
        body.finance-subpage {
            overflow: hidden;
        }
        .finance-subpage-content[data-finance-subpage="payroll.monthly"] {
            display: block;
            height: 100%;
            min-height: 0;
        }
        .payroll-monthly-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 34%);
            gap: 18px;
            align-items: stretch;
            height: 100%;
            min-height: 0;
        }
        .payroll-monthly-left,
        .payroll-monthly-right {
            min-width: 0;
            min-height: 0;
        }
        .payroll-monthly-left,
        .payroll-monthly-right {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .payroll-monthly-search-panel,
        .payroll-monthly-actions-panel {
            margin-bottom: 18px;
        }
        .payroll-monthly-search-row {
            display: grid;
            grid-template-columns: minmax(160px, 1fr) minmax(180px, 1fr) auto;
            align-items: center;
            gap: 12px;
        }
        .payroll-monthly-actions-row {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) auto auto;
            align-items: center;
            gap: 12px;
        }
        .payroll-monthly-actions-row .c-btn,
        .payroll-monthly-search-row .c-btn {
            min-height: 44px;
            white-space: nowrap;
        }
        .payroll-monthly-detail-panel {
            box-sizing: border-box;
            min-width: 0;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            border: 1px solid #dbe4f3;
            border-radius: 8px;
            background: #f5f8fc;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            padding: 16px 16px 28px;
        }
        .payroll-monthly-detail-empty {
            min-height: 300px;
            display: grid;
            place-items: center;
            color: #6b7894;
            border: 1px dashed #d8e1ef;
            border-radius: 8px;
            background: #f8fbff;
        }
        .payroll-monthly-detail-empty[hidden],
        .payroll-monthly-detail-title[hidden],
        .payroll-monthly-detail-form[hidden] {
            display: none;
        }
        .payroll-monthly-detail-title {
            display: block;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
        }
        .payroll-monthly-detail-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 40px;
        }
        .payroll-monthly-detail-form::after {
            content: "";
            display: block;
            height: 24px;
            flex: 0 0 24px;
        }
        .payroll-monthly-detail-form .form-grid {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px 12px;
        }
        .payroll-monthly-detail-panel .payroll-monthly-detail-card,
        .payroll-monthly-detail-panel .form-grid > *,
        .payroll-monthly-detail-panel .payroll-monthly-detail-grid > *,
        .payroll-monthly-detail-panel .payroll-calculated-columns > *,
        .payroll-monthly-detail-panel label,
        .payroll-monthly-detail-panel input,
        .payroll-monthly-detail-panel select {
            min-width: 0;
            max-width: 100%;
        }
        .payroll-monthly-detail-panel .payroll-calculated-columns {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
        }
        .payroll-monthly-detail-panel .payroll-calculated-action-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }
        .payroll-monthly-detail-panel .payroll-calculated-table {
            width: 100%;
        }
        .payroll-monthly-detail-panel .payroll-calculated-table-wrap {
            overflow: visible;
            padding-bottom: 12px;
        }
        .payroll-monthly-detail-panel .payroll-calculated-table th,
        .payroll-monthly-detail-panel .payroll-calculated-table td {
            height: 44px;
            vertical-align: middle;
        }
        .payroll-monthly-detail-panel .payroll-calculated-table input {
            box-sizing: border-box;
            min-height: 34px;
        }
        .payroll-monthly-detail-panel .payroll-monthly-adjustment-panel .payroll-item-row {
            grid-template-columns: minmax(0, 1fr) minmax(88px, 120px) auto;
        }
        .payroll-monthly-list-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #fff;
            border-radius: 8px;
        }
        .payroll-monthly-list-scroll.table-wrap,
        .payroll-monthly-list-scroll.c-table-wrapper {
            padding: 0;
            margin: 0;
        }
        .payroll-monthly-list-scroll .c-table th,
        .payroll-monthly-list-scroll .c-table td {
            padding-left: 8px;
            padding-right: 8px;
        }
        .payroll-monthly-list-row {
            cursor: pointer;
            position: relative;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .payroll-monthly-list-row.is-active td {
            background: #eaf2ff;
            color: #0f2f6f;
            font-weight: 700;
        }
        .payroll-monthly-list-row.is-active td:first-child {
            box-shadow: inset 4px 0 0 #2d7ef7;
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
        }
        .payroll-monthly-list-row.is-active td:last-child {
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
        }
        .payroll-monthly-list-row:focus-visible {
            outline: 2px solid #2d7ef7;
            outline-offset: -2px;
        }
        .payroll-monthly-detail-card input.is-modified,
        .payroll-monthly-detail-card select.is-modified {
            border-color: #f59e0b;
            background: #fff7ed;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.12);
        }
        .payroll-monthly-detail-card .payroll-item-row.is-modified {
            border-radius: 8px;
        }
        .personnel-page.payroll-monthly-detail-panel .payroll-monthly-detail-card .modal-actions {
            margin: 0;
            padding: 12px 0 0;
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(160px, 220px) auto auto;
            gap: 12px;
            align-items: end;
        }
        .payroll-monthly-remark-field,
        .payroll-monthly-status-field {
            min-width: 0;
        }
        @media (max-width: 1100px) {
            body.finance-subpage {
                overflow: auto;
            }
            .payroll-monthly-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .payroll-monthly-detail-form .form-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .payroll-monthly-right {
                order: -1;
            }
            .payroll-monthly-list-scroll {
                min-height: 320px;
            }
        }
        @media (max-width: 720px) {
            .payroll-monthly-search-row,
            .payroll-monthly-actions-row,
            .payroll-monthly-detail-form .form-grid {
                grid-template-columns: 1fr;
            }
            .payroll-monthly-detail-panel .payroll-monthly-adjustment-panel .payroll-item-row {
                grid-template-columns: 1fr;
            }
            .personnel-page.payroll-monthly-detail-panel .payroll-monthly-detail-card .modal-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<script>
(function () {
    const statusLabels = {
        0: "未确认",
        1: "已确认",
        2: "已发放"
    };
    let monthlyRows = [];
    let monthlyCalculated = false;
    let selectedMonth = "";
    let editingId = null;
    let selectedPayrollId = null;
    let trackingOriginalValues = false;

    const h = FinanceUI.escapeHtml;
    const formatMoney = (value) => {
        const number = Number(value || 0);
        return number.toLocaleString("ja-JP", {
            style: "currency",
            currency: "JPY",
            maximumFractionDigits: 0
        });
    };
    const parseMoney = (value) => {
        const number = Number(value || 0);
        return Number.isFinite(number) ? number : 0;
    };
    const roundAmount = (value) => String(Math.max(0, Math.round(parseMoney(value))));
    const formatRate = (value) => {
        const raw = String(value ?? "").trim();
        if (!raw || !Number.isFinite(Number(raw))) return "";
        const sign = raw.startsWith("-") ? "-" : "";
        const unsigned = raw.replace(/^[+-]/, "");
        const [integerPart, fractionPart = ""] = unsigned.split(".");
        const digits = `${integerPart}${fractionPart}`.replace(/^0+/, "") || "0";
        const pointIndex = digits.length - fractionPart.length + 2;
        const paddedDigits = pointIndex <= 0
            ? `${"0".repeat(Math.abs(pointIndex))}${digits}`
            : `${digits}${"0".repeat(Math.max(pointIndex - digits.length, 0))}`;
        const splitIndex = Math.max(pointIndex, 0);
        const whole = paddedDigits.slice(0, splitIndex) || "0";
        const decimal = paddedDigits.slice(splitIndex);
        const normalizedWhole = whole.replace(/^0+/, "") || "0";
        const normalizedDecimal = decimal
            .replace(/([1-9])0{8,}[1-9]\d{0,3}$/, "$1")
            .replace(/0+$/, "");
        return `${sign}${normalizedWhole}${normalizedDecimal ? `.${normalizedDecimal}` : ""}%`;
    };
    const normalizeItems = (items) => {
        if (!Array.isArray(items)) return [];
        return items.map((item) => ({
            name: String(item?.name || "").trim(),
            amount: String(item?.amount ?? "0").trim() || "0",
            payroll_calculated: item?.payroll_calculated === true,
            calculation_group: item?.calculation_group || "",
            calculation_key: item?.calculation_key || "",
            calculation_rate: item?.calculation_rate ?? "",
            calculation_base_label: item?.calculation_base_label || ""
        })).filter((item) => item.name || parseMoney(item.amount) !== 0);
    };
    const sumItems = (items) => normalizeItems(items).reduce((total, item) => total + parseMoney(item.amount), 0);
    const keyedItems = (items) => {
        const calculated = {};
        normalizeItems(items).forEach((item) => {
            if (item.payroll_calculated || item.calculation_group) {
                calculated[item.name] = item;
            }
        });
        return calculated;
    };
    const getCurrentMonthValue = () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        return `${year}-${month}`;
    };

    const setEmpty = (tbody, message) => {
        tbody.innerHTML = `<tr><td class="finance-empty-row" colspan="2">${h(message)}</td></tr>`;
    };

    const renderRows = (tbody, rows) => {
        if (!rows.length) {
            setEmpty(tbody, "没有符合条件的月度计算数据");
            return;
        }
        tbody.innerHTML = rows.map((item) => `
            <tr class="payroll-monthly-list-row${String(item.id) === String(selectedPayrollId) ? " is-active" : ""}" tabindex="0" data-id="${h(item.id)}">
                <td>${h(item.employee_name)}</td>
                <td>${h(item.status_label || statusLabels[item.status] || "")}</td>
            </tr>
        `).join("");
    };

    const setLoadingState = () => {
        const monthInput = document.getElementById("payrollMonth");
        const contractTypeSelect = document.getElementById("payrollContractType");
        const keywordInput = document.getElementById("payrollKeyword");
        const searchBtn = document.getElementById("payrollSearchBtn");
        const calculateBtn = document.getElementById("payrollCalculateBtn");
        const addBtn = document.getElementById("payrollAddBtn");
        const tbody = document.getElementById("payrollMonthlyBody");

        contractTypeSelect.disabled = true;
        keywordInput.disabled = true;
        searchBtn.disabled = true;
        calculateBtn.disabled = true;
        addBtn.disabled = true;
        setEmpty(tbody, monthInput.value ? "正在加载中..." : "请先选择月份");
    };

    const applyState = () => {
        const contractTypeSelect = document.getElementById("payrollContractType");
        const keywordInput = document.getElementById("payrollKeyword");
        const searchBtn = document.getElementById("payrollSearchBtn");
        const calculateBtn = document.getElementById("payrollCalculateBtn");
        const addBtn = document.getElementById("payrollAddBtn");
        const tbody = document.getElementById("payrollMonthlyBody");
        const month = selectedMonth;

        if (!month) {
            contractTypeSelect.disabled = true;
            keywordInput.disabled = true;
            searchBtn.disabled = true;
            calculateBtn.disabled = true;
            addBtn.disabled = true;
            contractTypeSelect.value = "";
            keywordInput.value = "";
            closeModal();
            setEmpty(tbody, "请先选择月份");
            return;
        }

        contractTypeSelect.disabled = !monthlyCalculated;
        keywordInput.disabled = !monthlyCalculated;
        searchBtn.disabled = !monthlyCalculated;
        calculateBtn.disabled = monthlyCalculated;
        addBtn.disabled = !monthlyCalculated;

        if (!monthlyCalculated) {
            contractTypeSelect.value = "";
            keywordInput.value = "";
            closeModal();
            setEmpty(tbody, "此月份还没有进行工资计算");
            return;
        }

        renderRows(tbody, monthlyRows);
    };

    const buildQueryParams = () => window.createParams([
        ["month", selectedMonth],
        ["contract_type", document.getElementById("payrollContractType").value],
        ["keyword", document.getElementById("payrollKeyword").value.trim()],
        ["page_size", "100"]
    ]);

    const loadMonthlyRows = async () => {
        if (!selectedMonth) {
            monthlyRows = [];
            monthlyCalculated = false;
            applyState();
            return;
        }
        setLoadingState();
        try {
            const payload = await window.requestJson(
                window.buildUrl("/api/finance/payroll/monthly", buildQueryParams()),
                {method: "GET"},
                {throwOnFailure: true}
            );
            monthlyRows = payload.data?.items || [];
            monthlyCalculated = Boolean(payload.data?.calculated);
            applyState();
        } catch (err) {
            monthlyRows = [];
            monthlyCalculated = false;
            document.getElementById("payrollCalculateBtn").disabled = true;
            document.getElementById("payrollAddBtn").disabled = true;
            closeModal();
            setEmpty(document.getElementById("payrollMonthlyBody"), `加载失败：${err.message}`);
        }
    };

    const createItemRow = (item = {}) => {
        const row = document.createElement("div");
        row.className = "payroll-item-row";

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.dataset.field = "name";
        nameInput.placeholder = "项目名";
        nameInput.value = item.name || "";

        const amountInput = document.createElement("input");
        amountInput.type = "number";
        amountInput.min = "0";
        amountInput.step = "1";
        amountInput.dataset.field = "amount";
        amountInput.placeholder = "金额";
        amountInput.value = item.amount ?? "0";

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "c-btn c-btn-danger c-btn-sm";
        removeBtn.dataset.action = "remove-payroll-item";
        removeBtn.textContent = "删除";

        row.append(nameInput, amountInput, removeBtn);
        return row;
    };

    const renderItemRows = (container, rows) => {
        container.innerHTML = "";
        const normalized = normalizeItems(rows);
        if (!normalized.length) {
            const empty = document.createElement("div");
            empty.className = "payroll-item-empty";
            empty.textContent = "暂无项目";
            container.appendChild(empty);
            return;
        }
        normalized.forEach((item) => container.appendChild(createItemRow(item)));
    };

    const collectItems = (container) => Array.from(container.querySelectorAll(".payroll-item-row")).map((row) => ({
        name: row.querySelector("[data-field='name']").value.trim(),
        amount: row.querySelector("[data-field='amount']").value || "0"
    })).filter((item) => item.name || parseMoney(item.amount) !== 0);

    const addItemRow = (container) => {
        const empty = container.querySelector(".payroll-item-empty");
        if (empty) empty.remove();
        const row = createItemRow({name: "", amount: "0"});
        container.appendChild(row);
        if (trackingOriginalValues) {
            row.querySelectorAll("input, select").forEach((input) => {
                input.dataset.originalValue = "";
            });
            updateModifiedMarkers();
        }
    };

    const renderCalculatedDeductions = (existing = {}) => {
        const fixedContainer = document.getElementById("payrollFixedDeductions");
        const variableContainer = document.getElementById("payrollVariableDeductions");
        fixedContainer.innerHTML = "";
        variableContainer.innerHTML = "";
        const renderCalculatedRow = (item) => {
            const row = document.createElement("tr");

            const nameCell = document.createElement("td");
            nameCell.textContent = item.name;

            const baseCell = document.createElement("td");
            baseCell.textContent = item.calculation_base_label || "后端计算";

            const rateCell = document.createElement("td");
            rateCell.className = "payroll-calculated-rate";
            rateCell.textContent = formatRate(item.calculation_rate) || "后端计算";

            const amountCell = document.createElement("td");

            const amountInput = document.createElement("input");
            amountInput.type = "number";
            amountInput.min = "0";
            amountInput.step = "1";
            amountInput.dataset.calculatedKey = item.calculation_key || item.name;
            amountInput.dataset.calculatedName = item.name;
            amountInput.dataset.calculationGroup = item.calculation_group || "";
            amountInput.dataset.calculationRate = item.calculation_rate ?? "";
            amountInput.dataset.calculationBaseLabel = item.calculation_base_label || "";
            amountInput.value = item.amount ?? "0";

            amountCell.appendChild(amountInput);
            if (item.calculation_group === "fixed") {
                row.append(nameCell, rateCell, amountCell);
                fixedContainer.appendChild(row);
            } else {
                row.append(nameCell, baseCell, amountCell);
                variableContainer.appendChild(row);
            }
        };
        Object.values(existing)
            .filter((item) => item.calculation_group === "fixed" || item.calculation_group === "variable")
            .forEach(renderCalculatedRow);
    };

    const collectCalculatedDeductionItems = () => Array.from(
        document.querySelectorAll("[data-calculated-key]")
    ).map((input) => {
        const item = {
            name: input.dataset.calculatedName,
            amount: input.value || "0",
            payroll_calculated: true,
            calculation_group: input.dataset.calculationGroup || "",
            calculation_key: input.dataset.calculatedKey || ""
        };
        if (input.dataset.calculationRate) item.calculation_rate = input.dataset.calculationRate;
        if (input.dataset.calculationBaseLabel) item.calculation_base_label = input.dataset.calculationBaseLabel;
        return item;
    });

    const trackOriginalValues = () => {
        const form = document.getElementById("payrollMonthlyForm");
        form.querySelectorAll("input, select").forEach((input) => {
            input.dataset.originalValue = input.value || "";
            input.classList.remove("is-modified");
        });
        form.querySelectorAll(".payroll-item-row, .payroll-summary-item").forEach((item) => {
            item.classList.remove("is-modified");
        });
        trackingOriginalValues = true;
    };

    const setInputModifiedState = (input) => {
        if (!Object.prototype.hasOwnProperty.call(input.dataset, "originalValue")) return false;
        const modified = String(input.value || "") !== String(input.dataset.originalValue || "");
        input.classList.toggle("is-modified", modified);
        return modified;
    };

    const updateModifiedMarkers = () => {
        if (!trackingOriginalValues) return;
        const form = document.getElementById("payrollMonthlyForm");
        form.querySelectorAll("input, select").forEach(setInputModifiedState);
        form.querySelectorAll(".payroll-item-row").forEach((row) => {
            row.classList.toggle("is-modified", Boolean(row.querySelector(".is-modified")));
        });
        [
            ["payrollFormAllowance", "payrollFormAllowanceDisplay"],
            ["payrollFormDeduction", "payrollFormDeductionDisplay"],
            ["payrollFormAutomaticDeduction", "payrollFormAutomaticDeductionDisplay"],
            ["payrollFormNetSalary", "payrollFormNetSalaryDisplay"]
        ].forEach(([inputId, displayId]) => {
            const input = document.getElementById(inputId);
            const display = document.getElementById(displayId);
            if (!input || !display) return;
            const modified = setInputModifiedState(input);
            display.closest(".payroll-summary-item")?.classList.toggle("is-modified", modified);
        });
    };

    const refreshPayrollTotals = () => {
        const baseSalary = parseMoney(document.getElementById("payrollFormBaseSalary").value);
        const additionTotal = sumItems(collectItems(document.getElementById("payrollAdditionItems")));
        const nonTaxableAdditionTotal = sumItems(collectItems(document.getElementById("payrollNonTaxableAdditionItems")));
        const manualDeductionTotal = sumItems(collectItems(document.getElementById("payrollDeductionItems")));
        const calculatedDeductionTotal = sumItems(collectCalculatedDeductionItems());
        const totalAdditions = additionTotal + nonTaxableAdditionTotal;
        const netSalary = baseSalary + totalAdditions - manualDeductionTotal - calculatedDeductionTotal;
        document.getElementById("payrollFormAllowance").value = roundAmount(totalAdditions);
        document.getElementById("payrollFormDeduction").value = roundAmount(manualDeductionTotal);
        document.getElementById("payrollFormAutomaticDeduction").value = roundAmount(calculatedDeductionTotal);
        document.getElementById("payrollFormNetSalary").value = roundAmount(netSalary);
        document.getElementById("payrollFormAllowanceDisplay").textContent = formatMoney(totalAdditions);
        document.getElementById("payrollFormDeductionDisplay").textContent = formatMoney(manualDeductionTotal);
        document.getElementById("payrollFormAutomaticDeductionDisplay").textContent = formatMoney(calculatedDeductionTotal);
        document.getElementById("payrollFormNetSalaryDisplay").textContent = formatMoney(netSalary);
        updateModifiedMarkers();
    };

    const openModal = (mode, item = null) => {
        editingId = mode === "edit" ? item?.id : null;
        selectedPayrollId = editingId;
        const calculated = keyedItems(item?.automatic_deduction_items || []);
        document.getElementById("payrollMonthlyDelete").disabled = !editingId;
        document.getElementById("payrollMonthlyEmptyDetail").hidden = true;
        document.getElementById("payrollMonthlyForm").hidden = false;
        document.getElementById("payrollFormEmployeeId").value = item?.employee_id || "";
        document.getElementById("payrollFormEmployeeId").readOnly = mode === "edit";
        document.getElementById("payrollFormEmployeeName").value = item?.employee_name || "";
        document.getElementById("payrollFormContractType").value = item?.contract_type ?? "0";
        document.getElementById("payrollFormAttendanceDays").value = item?.attendance_days || "0";
        document.getElementById("payrollFormBaseSalary").value = item?.base_salary || "0";
        document.getElementById("payrollFormStatus").value = item?.status ?? "0";
        document.getElementById("payrollFormRemark").value = item?.remark || "";
        renderItemRows(document.getElementById("payrollAdditionItems"), item?.addition_items || []);
        renderItemRows(document.getElementById("payrollNonTaxableAdditionItems"), item?.non_taxable_addition_items || []);
        renderItemRows(document.getElementById("payrollDeductionItems"), item?.deduction_items || []);
        renderCalculatedDeductions(calculated);
        refreshPayrollTotals();
        trackOriginalValues();
        renderRows(document.getElementById("payrollMonthlyBody"), monthlyRows);
    };

    const closeModal = () => {
        const form = document.getElementById("payrollMonthlyForm");
        const emptyDetail = document.getElementById("payrollMonthlyEmptyDetail");
        if (!form || !emptyDetail) return;
        form.hidden = true;
        emptyDetail.hidden = false;
        document.getElementById("payrollMonthlyForm").reset();
        renderItemRows(document.getElementById("payrollAdditionItems"), []);
        renderItemRows(document.getElementById("payrollNonTaxableAdditionItems"), []);
        renderItemRows(document.getElementById("payrollDeductionItems"), []);
        renderCalculatedDeductions();
        trackingOriginalValues = false;
        editingId = null;
        selectedPayrollId = null;
        document.getElementById("payrollMonthlyDelete").disabled = true;
        renderRows(document.getElementById("payrollMonthlyBody"), monthlyRows);
    };

    const collectFormPayload = () => {
        refreshPayrollTotals();
        const additionItems = collectItems(document.getElementById("payrollAdditionItems"));
        const nonTaxableAdditionItems = collectItems(document.getElementById("payrollNonTaxableAdditionItems"));
        const deductionItems = collectItems(document.getElementById("payrollDeductionItems"));
        const automaticDeductionItems = collectCalculatedDeductionItems();
        return {
            month: selectedMonth,
            employee_id: document.getElementById("payrollFormEmployeeId").value,
            employee_name: document.getElementById("payrollFormEmployeeName").value,
            contract_type: document.getElementById("payrollFormContractType").value,
            attendance_days: document.getElementById("payrollFormAttendanceDays").value || "0",
            base_salary: document.getElementById("payrollFormBaseSalary").value || "0",
            allowance_amount: document.getElementById("payrollFormAllowance").value || "0",
            deduction_amount: document.getElementById("payrollFormDeduction").value || "0",
            addition_items: additionItems,
            non_taxable_addition_items: nonTaxableAdditionItems,
            deduction_items: deductionItems,
            automatic_deduction_items: automaticDeductionItems,
            automatic_deduction_amount: document.getElementById("payrollFormAutomaticDeduction").value || "0",
            net_salary: document.getElementById("payrollFormNetSalary").value || "0",
            status: document.getElementById("payrollFormStatus").value,
            remark: document.getElementById("payrollFormRemark").value
        };
    };

    const applyMonthlyItemToForm = (item) => {
        const calculated = keyedItems(item?.automatic_deduction_items || []);
        document.getElementById("payrollFormEmployeeId").value = item?.employee_id || "";
        document.getElementById("payrollFormEmployeeName").value = item?.employee_name || "";
        document.getElementById("payrollFormContractType").value = item?.contract_type ?? "0";
        document.getElementById("payrollFormAttendanceDays").value = item?.attendance_days || "0";
        document.getElementById("payrollFormBaseSalary").value = item?.base_salary || "0";
        document.getElementById("payrollFormStatus").value = item?.status ?? "0";
        document.getElementById("payrollFormRemark").value = item?.remark || "";
        renderItemRows(document.getElementById("payrollAdditionItems"), item?.addition_items || []);
        renderItemRows(document.getElementById("payrollNonTaxableAdditionItems"), item?.non_taxable_addition_items || []);
        renderItemRows(document.getElementById("payrollDeductionItems"), item?.deduction_items || []);
        renderCalculatedDeductions(calculated);
        refreshPayrollTotals();
    };

    document.addEventListener("DOMContentLoaded", () => {
        FinanceUI.applyI18n();

        const monthInput = document.getElementById("payrollMonth");
        const contractTypeSelect = document.getElementById("payrollContractType");
        const keywordInput = document.getElementById("payrollKeyword");
        const searchBtn = document.getElementById("payrollSearchBtn");
        const calculateBtn = document.getElementById("payrollCalculateBtn");
        const addBtn = document.getElementById("payrollAddBtn");
        const form = document.getElementById("payrollMonthlyForm");
        const deleteBtn = document.getElementById("payrollMonthlyDelete");
        const additionItems = document.getElementById("payrollAdditionItems");
        const nonTaxableAdditionItems = document.getElementById("payrollNonTaxableAdditionItems");
        const deductionItems = document.getElementById("payrollDeductionItems");
        const addAdditionItemBtn = document.getElementById("payrollAddAdditionItem");
        const addNonTaxableAdditionItemBtn = document.getElementById("payrollAddNonTaxableAdditionItem");
        const addDeductionItemBtn = document.getElementById("payrollAddDeductionItem");
        const recalculateDeductionsBtn = document.getElementById("payrollRecalculateDeductions");

        const loadSelectedMonth = async () => {
            selectedMonth = monthInput.value;
            await loadMonthlyRows();
        };

        monthInput.addEventListener("change", () => {
            loadSelectedMonth();
        });
        searchBtn.addEventListener("click", loadMonthlyRows);
        contractTypeSelect.addEventListener("change", loadMonthlyRows);
        keywordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") loadMonthlyRows();
        });
        calculateBtn.addEventListener("click", async () => {
            const month = selectedMonth;
            if (!month || monthlyCalculated) return;
            calculateBtn.disabled = true;
            calculateBtn.textContent = "薪资计算中...";
            try {
                const payload = await window.requestJson("/api/finance/payroll/monthly/calculate", {
                    method: "POST",
                    body: JSON.stringify({month})
                }, {throwOnFailure: true});
                if (!payload.data?.created) window.alert("没有可计算的有效薪资基础信息。");
                await loadMonthlyRows();
            } catch (err) {
                window.alert(err.message || "薪资计算失败");
                await loadMonthlyRows();
            } finally {
                calculateBtn.textContent = "一键计算薪资";
            }
        });
        addBtn.addEventListener("click", () => {
            openModal("add");
        });
        deleteBtn.addEventListener("click", async () => {
            if (!editingId) return;
            if (!window.confirm("确定删除这条月度工资数据吗？")) return;
            deleteBtn.disabled = true;
            try {
                await window.requestJson(window.buildUrl(`/api/finance/payroll/monthly/${encodeURIComponent(editingId)}`, window.createParams([
                    ["month", selectedMonth]
                ])), {
                    method: "DELETE"
                }, {throwOnFailure: true});
                closeModal();
                await loadMonthlyRows();
            } catch (err) {
                window.alert(err.message || "删除失败");
                deleteBtn.disabled = !editingId;
            }
        });
        addAdditionItemBtn.addEventListener("click", () => {
            addItemRow(additionItems);
            refreshPayrollTotals();
        });
        addNonTaxableAdditionItemBtn.addEventListener("click", () => {
            addItemRow(nonTaxableAdditionItems);
            refreshPayrollTotals();
        });
        addDeductionItemBtn.addEventListener("click", () => {
            addItemRow(deductionItems);
            refreshPayrollTotals();
        });
        recalculateDeductionsBtn.addEventListener("click", async () => {
            if (!editingId) {
                window.alert("请先保存月度工资后再按公式重算。");
                return;
            }
            recalculateDeductionsBtn.disabled = true;
            try {
                const response = await window.requestJson(`/api/finance/payroll/monthly/${encodeURIComponent(editingId)}/recalculate`, {
                    method: "POST",
                    body: JSON.stringify(collectFormPayload())
                }, {throwOnFailure: true});
                applyMonthlyItemToForm(response.data?.item);
                updateModifiedMarkers();
            } catch (err) {
                window.alert(err.message || "按公式重算失败");
            } finally {
                recalculateDeductionsBtn.disabled = false;
            }
        });
        form.addEventListener("input", (event) => {
            if (event.target.dataset.calculatedKey) {
                refreshPayrollTotals();
                updateModifiedMarkers();
                return;
            }
            if (
                event.target.closest("#payrollAdditionItems") ||
                event.target.closest("#payrollNonTaxableAdditionItems") ||
                event.target.closest("#payrollDeductionItems") ||
                event.target.id === "payrollFormBaseSalary"
            ) {
                refreshPayrollTotals();
            } else {
                updateModifiedMarkers();
            }
        });
        form.addEventListener("change", updateModifiedMarkers);
        form.addEventListener("click", (event) => {
            const btn = event.target.closest("button[data-action='remove-payroll-item']");
            if (!btn) return;
            const container = btn.closest(".payroll-items-list");
            btn.closest(".payroll-item-row")?.remove();
            if (container && !container.querySelector(".payroll-item-row")) {
                renderItemRows(container, []);
            }
            refreshPayrollTotals();
            updateModifiedMarkers();
        });
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = collectFormPayload();
            const url = editingId ? `/api/finance/payroll/monthly/${editingId}` : "/api/finance/payroll/monthly";
            try {
                await window.requestJson(url, {
                    method: editingId ? "PUT" : "POST",
                    body: JSON.stringify(payload)
                }, {throwOnFailure: true});
                closeModal();
                await loadMonthlyRows();
            } catch (err) {
                window.alert(err.message || "保存失败");
            }
        });
        const openSelectedRow = (row) => {
            if (!row) return;
            const target = monthlyRows.find((item) => String(item.id) === String(row.dataset.id));
            if (!target) return;
            openModal("edit", target);
        };
        document.getElementById("payrollMonthlyBody").addEventListener("click", (event) => {
            openSelectedRow(event.target.closest(".payroll-monthly-list-row"));
        });
        document.getElementById("payrollMonthlyBody").addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openSelectedRow(event.target.closest(".payroll-monthly-list-row"));
            }
        });

        monthInput.value = getCurrentMonthValue();
        loadSelectedMonth();
    });
}());
</script>
</body>
</html>
