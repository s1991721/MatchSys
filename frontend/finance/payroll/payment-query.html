<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>发放查询</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="payroll.payment">
    <div class="c-inline-filters">
        <div class="c-inline-filters-grid-3">
            <label class="c-inline-field"><span>发放月份</span><input type="month"></label>
            <label class="c-inline-field"><span>员工</span><input type="text" placeholder="员工姓名"></label>
            <label class="c-inline-field"><span>发放状态</span><select><option>全部</option><option>待发放</option><option>已发放</option></select></label>
        </div>
    </div>
    <div class="table-wrap c-table-wrapper">
        <table class="c-table c-table-hover">
            <thead>
            <tr>
                <th>月份</th>
                <th>员工</th>
                <th>应发金额</th>
                <th>扣款合计</th>
                <th>实发金额</th>
                <th>预定发放日</th>
                <th>实际发放日</th>
                <th>发放状态</th>
                <th class="c-actions-col">操作</th>
            </tr>
            </thead>
            <tbody><tr><td class="finance-empty-row" colspan="9">暂无发放记录</td></tr></tbody>
        </table>
    </div>
</div>

<script src="../../i18n.js"></script>
<script>window.__routeNotified = true;</script>
<script src="../../common.js"></script>
<script>
(function () {
    document.addEventListener("DOMContentLoaded", () => {
        if (window.I18N && typeof window.I18N.init === "function") window.I18N.init();
        if (window.I18N && typeof window.I18N.apply === "function") window.I18N.apply(document);
    });
}());
</script>
</body>
</html>
