<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <style>
        .withholding-sheet-wrap .finance-sheet-table thead th {
            top: 0;
            z-index: 12;
        }
        .withholding-sheet-wrap .finance-sheet-table tbody th {
            z-index: 11;
        }
        .withholding-sheet-wrap .finance-sheet-table .finance-sheet-corner {
            z-index: 13;
        }
        .withholding-sheet-wrap .finance-sheet-table th,
        .withholding-sheet-wrap .finance-sheet-table td {
            min-width: 88px;
            text-align: right;
            white-space: nowrap;
        }
        .withholding-sheet-wrap .finance-sheet-table thead th {
            text-align: center;
        }
        .withholding-sheet-wrap .finance-sheet-table td.is-attention {
            background: #fff7ed;
            color: #9a3412;
            font-weight: 800;
        }
    </style>
    <title data-i18n="payroll.tabs.withholding_tax">源泉徴収税額表</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="payroll.withholding-tax">
    <div class="finance-sheet-wrap withholding-sheet-wrap" aria-label="源泉徴収税額表预览区">
        <table class="finance-sheet-table withholding-sheet-table" id="withholdingSheetTable">
            <thead>
                <tr>
                    <th class="finance-sheet-corner"></th>
                    <th>以上</th>
                    <th>未満</th>
                    <th>甲0人</th>
                    <th>甲1人</th>
                    <th>甲2人</th>
                    <th>甲3人</th>
                    <th>甲4人</th>
                    <th>甲5人</th>
                    <th>甲6人</th>
                    <th>甲7人</th>
                    <th>乙</th>
                </tr>
            </thead>
            <tbody id="withholdingPreviewBody">
                <tr>
                    <th>1</th>
                    <td colspan="11" style="position: static; text-align: center; color: #64748b; font-weight: 700;">上传 Excel 后生成预览。</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="finance-sheet-toolbar">
        <div class="finance-sheet-metadata">
            <label class="finance-sheet-meta-field">
                <span>年份</span>
                <input class="c-input" id="withholdingYearInput" type="number" min="1900" max="2100" step="1" placeholder="2026">
            </label>
        </div>
        <div class="finance-sheet-actions">
            <input class="finance-sheet-file" id="withholdingFileInput" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
            <button class="c-btn c-btn-secondary c-btn-sm" type="button" id="withholdingUploadBtn">上传</button>
        </div>
    </div>
</div>

<script src="../../i18n.js"></script>
<script src="../finance-common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../../common.js"></script>
<script>
(function () {
        const applyI18n = () => FinanceUI.applyI18n();
        const settingsApi = "/api/finance/settings/income-tax";
        const MONTHLY_COLUMNS = ["salary_min", "salary_max", "kou_0", "kou_1", "kou_2", "kou_3", "kou_4", "kou_5", "kou_6", "kou_7", "otsu"];

    const isExcelFile = (file) => {
        const name = (file?.name || "").toLowerCase();
        return name.endsWith(".xls") || name.endsWith(".xlsx");
    };

    const normalizeCell = (value) => String(value ?? "")
        .replace(/\s+/g, "")
        .replace(/[　,，]/g, "")
        .trim();

    const formatCell = (value) => String(value ?? "").trim();

    const parseAmount = (value) => {
        const normalized = normalizeCell(value).replace(/[^\d.-]/g, "");
        if (!normalized) return null;
        const number = Number(normalized);
        return Number.isFinite(number) ? number : null;
    };

    const looksLikeDataRow = (row, mapping) => {
        const from = normalizeCell(row[mapping.from]);
        const to = normalizeCell(row[mapping.to]);
        return from !== "" && to !== "" && /\d/.test(from) && /\d/.test(to);
    };

    const getHeaderText = (rows, rowIndex, columnIndex) => {
        const values = [];
        const start = Math.max(0, rowIndex - 5);
        for (let i = start; i <= rowIndex; i += 1) {
            const value = normalizeCell(rows[i]?.[columnIndex]);
            if (value && !values.includes(value)) values.push(value);
        }
        return values.join("");
    };

    const findColumn = (rows, rowIndex, matcher, usedColumns = new Set()) => {
        const width = Math.max(...rows.slice(0, Math.min(rows.length, rowIndex + 1)).map((row) => row.length), 0);
        for (let columnIndex = 0; columnIndex < width; columnIndex += 1) {
            if (usedColumns.has(columnIndex)) continue;
            if (matcher(getHeaderText(rows, rowIndex, columnIndex), columnIndex)) return columnIndex;
        }
        return -1;
    };

    const detectColumnMapping = (rows) => {
        const limit = Math.min(rows.length, 80);
        for (let rowIndex = 0; rowIndex < limit; rowIndex += 1) {
            const usedColumns = new Set();
            const from = findColumn(rows, rowIndex, (text) => /以上/.test(text), usedColumns);
            if (from < 0) continue;
            usedColumns.add(from);
            const to = findColumn(rows, rowIndex, (text) => /未満|未满/.test(text), usedColumns);
            if (to < 0) continue;
            usedColumns.add(to);

            const dependents = [];
            for (let count = 0; count <= 7; count += 1) {
                const columnIndex = findColumn(rows, rowIndex, (text) => {
                    const hasCount = new RegExp(`(^|[^0-9])${count}(人|名)?($|[^0-9])`).test(text);
                    return hasCount && (/甲/.test(text) || !/乙/.test(text));
                }, usedColumns);
                if (columnIndex >= 0) {
                    usedColumns.add(columnIndex);
                    dependents.push(columnIndex);
                }
            }
            const otsu = findColumn(rows, rowIndex, (text) => /乙/.test(text), usedColumns);
                if (dependents.length === 8 && otsu >= 0) {
                    return { headerRowIndex: rowIndex, from, to, dependents, otsu };
                }
            }
            return null;
        };

    const buildFixedRule = (row, mapping) => ({
        salary_min: parseAmount(row[mapping.from]),
        salary_max: parseAmount(row[mapping.to]),
        display: {
            salary_min: formatCell(row[mapping.from]),
            salary_max: formatCell(row[mapping.to]),
        },
        ko: Array.from({ length: 8 }, (_, index) => ({
            dependents: index,
            amount: parseAmount(row[mapping.dependents[index]]),
            display_amount: formatCell(row[mapping.dependents[index]])
        })),
        otsu: {
            amount: parseAmount(row[mapping.otsu]),
            display_amount: formatCell(row[mapping.otsu])
        }
    });

    const parseWorkbookFixedRules = (workbook) => {
        for (const sheetName of workbook.SheetNames) {
            const sheet = workbook.Sheets[sheetName];
            const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false, blankrows: false });
            const mapping = detectColumnMapping(rows);
            if (!mapping) continue;
            const fixedRules = [];
            for (let rowIndex = mapping.headerRowIndex + 1; rowIndex < rows.length; rowIndex += 1) {
                const row = rows[rowIndex] || [];
                if (!looksLikeDataRow(row, mapping)) continue;
                fixedRules.push(buildFixedRule(row, mapping));
            }
            if (fixedRules.length) return fixedRules;
        }
        return [];
    };

        const getRulePreviewCells = (rule) => [
            rule.display.salary_min,
            rule.display.salary_max,
            ...rule.ko.map((item) => item.display_amount),
            rule.otsu.display_amount
        ];

        const formatAmount = (value) => {
            const number = Number(value);
            if (!Number.isFinite(number)) return "";
            return number.toLocaleString("ja-JP");
        };

        const toStoredInteger = (value, fieldName) => {
            const number = Number(value);
            if (!Number.isFinite(number) || number < 0 || !Number.isInteger(number)) {
                throw new Error(`${fieldName} 必须是非负整数。`);
            }
            return number;
        };

        const buildSettingsRows = (fixedRules) => {
            if (!Array.isArray(fixedRules) || !fixedRules.length) {
                throw new Error("没有可保存的月額表数据。");
            }
            return fixedRules.map((rule, index) => {
                const rowNumber = index + 1;
                const row = {
                    row_order: rowNumber,
                    salary_min: toStoredInteger(rule.salary_min, `第${rowNumber}行 salary_min`),
                    salary_max: toStoredInteger(rule.salary_max, `第${rowNumber}行 salary_max`),
                };
                if (row.salary_max <= row.salary_min) {
                    throw new Error(`第${rowNumber}行工资区间无效。`);
                }
                for (let dependentCount = 0; dependentCount <= 7; dependentCount += 1) {
                    row[`kou_${dependentCount}`] = toStoredInteger(
                        rule.ko?.[dependentCount]?.amount,
                        `第${rowNumber}行 kou_${dependentCount}`
                    );
                }
                row.otsu = toStoredInteger(rule.otsu?.amount, `第${rowNumber}行 otsu`);
                return row;
            });
        };

        const buildSettingsPayload = (fixedRules, yearInput) => {
            const year = Number(yearInput?.value);
            if (!Number.isInteger(year) || year < 1900 || year > 2100) {
                throw new Error("请输入有效年份。");
            }
            const monthlyRows = buildSettingsRows(fixedRules);
            return {
                metadata: {
                    year,
                    table_type: "monthly",
                    columns: MONTHLY_COLUMNS,
                    row_count: monthlyRows.length
                },
                monthly_rows: monthlyRows
            };
        };

        const toPreviewRules = (settings) => {
            const rows = Array.isArray(settings?.monthly_rows) ? settings.monthly_rows : [];
            return rows.map((row) => ({
                salary_min: Number(row.salary_min),
                salary_max: Number(row.salary_max),
                display: {
                    salary_min: formatAmount(row.salary_min),
                    salary_max: formatAmount(row.salary_max),
                },
                ko: Array.from({ length: 8 }, (_, index) => ({
                    dependents: index,
                    amount: Number(row[`kou_${index}`]),
                    display_amount: formatAmount(row[`kou_${index}`])
                })),
                otsu: {
                    amount: Number(row.otsu),
                    display_amount: formatAmount(row.otsu)
                }
            }));
        };

        const renderPreview = (fixedRules, previewBody) => {
            previewBody.innerHTML = "";
        if (!fixedRules.length) {
            const tr = document.createElement("tr");
            tr.innerHTML = '<th>1</th><td colspan="11" style="position: static; text-align: center; color: #64748b; font-weight: 700;">未识别到可预览的数据。</td>';
            previewBody.appendChild(tr);
            return;
        }
        fixedRules.forEach((rule, rowIndex) => {
            const tr = document.createElement("tr");
            const th = document.createElement("th");
            th.textContent = String(rowIndex + 1);
            tr.appendChild(th);
            getRulePreviewCells(rule).forEach((value) => {
                const td = document.createElement("td");
                td.textContent = value || "-";
                if (!value || /特殊|確認|确认|計算|算出/.test(value)) td.classList.add("is-attention");
                tr.appendChild(td);
            });
            previewBody.appendChild(tr);
            });
        };

        const loadSettings = async (previewBody, yearInput) => {
            try {
                const payload = await window.requestJson(settingsApi, { method: "GET", cache: "no-store" });
                const settings = payload?.data?.settings;
                if (!settings || typeof settings !== "object") return;
                if (yearInput && settings.metadata?.year) {
                    yearInput.value = String(settings.metadata.year);
                }
                const fixedRules = toPreviewRules(settings);
                window.withholdingTaxFixedRules = fixedRules;
                renderPreview(fixedRules, previewBody);
            } catch (err) {
                window.alert(err.message || "源泉徴収税額表加载失败。");
            }
        };

        const saveSettings = async (fixedRules, yearInput, uploadButton) => {
            const originalText = uploadButton.textContent;
            uploadButton.disabled = true;
            uploadButton.textContent = "保存中...";
            try {
                const settings = buildSettingsPayload(fixedRules, yearInput);
                const payload = await window.requestJson(settingsApi, {
                    method: "POST",
                    body: JSON.stringify({ settings }),
                });
                window.withholdingTaxFixedRules = toPreviewRules(payload?.data?.settings || settings);
                uploadButton.textContent = "已保存";
                window.setTimeout(() => {
                    uploadButton.textContent = originalText || "上传";
                }, 1200);
            } catch (err) {
                uploadButton.textContent = originalText || "上传";
                throw err;
            } finally {
                uploadButton.disabled = false;
            }
        };

    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();

	        const fileInput = document.getElementById("withholdingFileInput");
	        const uploadButton = document.getElementById("withholdingUploadBtn");
	        const previewBody = document.getElementById("withholdingPreviewBody");
	        const yearInput = document.getElementById("withholdingYearInput");
	        let pendingFixedRules = null;

        if (yearInput && !yearInput.value) {
            yearInput.value = String(new Date().getFullYear());
        }

	        const updateFileInfo = async (file) => {
	            if (!file) return;
	            if (!isExcelFile(file)) {
	                window.alert("请选择 .xls 或 .xlsx 文件。");
	                fileInput.value = "";
	                return;
            }
            if (!window.XLSX) {
                window.alert("Excel 解析库加载失败，请检查网络后重试。");
                return;
	            }
	            uploadButton.disabled = true;
	            uploadButton.textContent = "解析中...";
	                try {
	                    const buffer = await file.arrayBuffer();
	                    const workbook = window.XLSX.read(buffer, { type: "array" });
	                    const fixedRules = parseWorkbookFixedRules(workbook);
	                    pendingFixedRules = fixedRules;
	                    renderPreview(fixedRules, previewBody);
	                } catch (err) {
	                    pendingFixedRules = null;
	                    window.alert(err.message || "Excel 预览解析失败。");
	                } finally {
	                    if (uploadButton.disabled) uploadButton.disabled = false;
	                    if (uploadButton.textContent === "解析中...") {
	                        uploadButton.textContent = "上传";
	                    }
	                }
	            };

	        uploadButton?.addEventListener("click", async () => {
	            if (!pendingFixedRules) {
	                fileInput?.click();
	                return;
	            }
	            try {
	                await saveSettings(pendingFixedRules, yearInput, uploadButton);
	                window.withholdingTaxFixedRules = pendingFixedRules;
	                pendingFixedRules = null;
	                fileInput.value = "";
	            } catch (err) {
	                window.alert(err.message || "保存失败。");
	            }
	        });
	        fileInput?.addEventListener("change", () => updateFileInfo(fileInput.files && fileInput.files[0]));
	        loadSettings(previewBody, yearInput);
	    });

    window.addEventListener("i18n:change", applyI18n);
}());
</script>
</body>
</html>
