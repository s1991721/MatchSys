<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title>应收列表</title>
</head>
<body class="order-page finance-page finance-module-page">
<div class="page finance-module-page-shell">
    <section class="c-card c-card-pad finance-view" data-finance-panel="receivables">

    <div class="finance-subtabs" role="tablist" aria-label="应收管理子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="overview">应收概览</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="list">应收列表</button>
    </div>
        <div class="finance-subframe-shell">
            <iframe id="financeSubFrame" class="finance-subframe" src="receivables/overview.html" title="应收概览"></iframe>
        </div>
    </section>
</div>

<script src="../i18n.js"></script>
<script src="finance-common.js"></script>
<script src="../common.js"></script>
<script>
FinanceUI.onReady(() => {
    const tabs = FinanceUI.initSubtabFrame({
        initialKey: "overview",
        routes: {
            overview: { src: "receivables/overview.html", title: "应收概览" },
            list: { src: "receivables/list.html", title: "应收列表" }
        }
    });
        window.addEventListener("message", (event) => {
            const data = event.data || {};
            if (!data || data.type !== "receivables:open-list") return;
            tabs.setSubtab("list", { month: data.month || "" });
        });
});
</script>
</body>
</html>
