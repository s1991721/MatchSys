<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>应收列表</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="receivables.list">
    <div class="finance-summary-grid">
        <div class="finance-summary-item"><span class="finance-summary-label">本月应收</span><span class="finance-summary-value">¥0</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">未收金额</span><span class="finance-summary-value">¥0</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">逾期金额</span><span class="finance-summary-value">¥0</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">待确认入金</span><span class="finance-summary-value">0</span></div>
    </div>
    <div class="c-inline-filters">
        <div class="c-inline-filters-grid-3">
            <div class="c-inline-field"><span data-i18n="finance.filter.month">月份</span><input type="month"></div>
            <div class="c-inline-field"><span data-i18n="finance.filter.keyword">关键字</span><input type="text" placeholder="客户 / 员工 / 单号" data-i18n-placeholder="finance.placeholder.keyword"></div>
            <div class="c-inline-field"><span data-i18n="finance.filter.status">状态</span><select><option>全部</option><option>待确认</option><option>已到账</option><option>逾期</option></select></div>
        </div>
        <div class="c-filter-actions-bar">
            <div></div>
            <div class="c-filter-actions-right c-filter-actions-group">
                <button class="c-btn c-btn-primary" type="button" data-i18n="common.search">搜索</button>
                <button class="c-btn c-btn-warn" type="button" data-i18n="common.reset">重置</button>
            </div>
        </div>
    </div>
    <div class="table-wrap c-table-wrapper">
        <table class="c-table c-table-hover">
            <thead><tr><th>请求书号</th><th>客户</th><th>应收金额</th><th>未收金额</th><th>预定到账日</th><th>账龄</th><th>状态</th><th class="c-actions-col">操作</th></tr></thead>
            <tbody><tr><td class="finance-empty-row" colspan="8" data-i18n="finance.empty">暂无数据</td></tr></tbody>
        </table>
    </div>
    
</div>

<script src="../../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
    });
}());
</script>
</body>
</html>
