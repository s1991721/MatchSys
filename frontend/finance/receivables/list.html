<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="../../favicon-48.png" type="image/png" sizes="48x48">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>应收列表</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="receivables.list">
    <div class="c-inline-filters">
        <div class="c-inline-filters-grid-3 finance-filter-grid">
            <div class="c-inline-field"><span>月份</span><input type="month" id="filterMonth"></div>
            <div class="c-inline-field">
                <span>来源</span>
                <select id="filterSource">
                    <option value="">全部</option>
                    <option value="request">请求书</option>
                    <option value="manual">手动</option>
                </select>
            </div>
            <div class="c-inline-field">
                <span>状态</span>
                <select id="filterStatus">
                    <option value="">全部</option>
                    <option value="0">未收</option>
                    <option value="1">部分入金</option>
                    <option value="2">已收</option>
                    <option value="3">逾期</option>
                    <option value="5">异常</option>
                    <option value="6">核销</option>
                </select>
            </div>
            <div class="finance-filter-actions">
                <button class="c-btn c-btn-success" type="button" id="addReceivableBtn">新增应收</button>
                <button class="c-btn c-btn-primary" type="button" id="searchBtn">搜索</button>
            </div>
        </div>
    </div>

    <div class="table-wrap c-table-wrapper">
        <table class="c-table c-table-hover finance-ledger-table">
            <thead>
            <tr>
                <th></th>
                <th>来源</th>
                <th>请求书号</th>
                <th>客户</th>
                <th>应收金额</th>
                <th>已收金额</th>
                <th>未收金额</th>
                <th>预定到账日</th>
                <th>账龄</th>
                <th>状态</th>
                <th class="c-actions-col">操作</th>
            </tr>
            </thead>
            <tbody id="receivableTableBody">
            <tr><td class="finance-empty-row" colspan="11">暂无数据</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination c-pagination" id="receivablePagination">
        <div class="pagination-summary" id="receivablePaginationSummary">共 0 条 · 第 1/1 页</div>
        <div class="pagination-pages" id="receivablePaginationPages"></div>
    </div>
</div>

<dialog class="c-dialog" id="receivableDialog" aria-labelledby="receivableDialogTitle">
    <div class="c-dialog-header">
        <h3 id="receivableDialogTitle">新增应收</h3>
        <button class="c-dialog-close" type="button" aria-label="关闭" data-dialog-close>×</button>
    </div>
    <div class="c-dialog-body">
        <form class="finance-form-grid" id="receivableForm">
            <input type="hidden" id="receivableId">
            <input type="hidden" id="receivableCustomerId">
            <div class="c-inline-field c-inline-field-full">
                <span>客户名称</span>
                <input type="text" id="receivableCustomerName" placeholder="客户名称" list="receivableCustomerList" autocomplete="off" required>
                <datalist id="receivableCustomerList"></datalist>
            </div>
            <div class="c-inline-field"><span>应收金额</span><input type="number" id="receivableAmount" min="0" step="0.01" required></div>
            <div class="c-inline-field"><span>到账日</span><input type="date" id="receivableDueDate"></div>
            <div class="c-inline-field">
                <span>财务处理</span>
                <select id="receivableStatus">
                    <option value="0">正常</option>
                    <option value="1">异常</option>
                    <option value="2">核销</option>
                </select>
            </div>
            <div class="c-inline-field c-inline-field-full"><span>备注</span><textarea id="receivableRemark" rows="3"></textarea></div>
        </form>
    </div>
    <div class="c-dialog-actions">
        <button class="c-btn c-btn-secondary" type="button" data-dialog-close>取消</button>
        <button class="c-btn c-btn-primary" type="button" id="saveReceivableBtn">保存</button>
    </div>
</dialog>

<dialog class="c-dialog" id="receiptDialog" aria-labelledby="receiptDialogTitle">
    <div class="c-dialog-header">
        <h3 id="receiptDialogTitle">新增入金</h3>
        <button class="c-dialog-close" type="button" aria-label="关闭" data-dialog-close>×</button>
    </div>
    <div class="c-dialog-body">
        <div class="finance-dialog-summary">
            <div class="finance-dialog-summary-item"><span class="finance-dialog-summary-label">应收对象</span><span class="finance-dialog-summary-value" id="receiptSummaryCustomer">-</span></div>
            <div class="finance-dialog-summary-item"><span class="finance-dialog-summary-label">未收金额</span><span class="finance-dialog-summary-value" id="receiptSummaryOutstanding">¥0</span></div>
            <div class="finance-dialog-summary-item"><span class="finance-dialog-summary-label">请求书号</span><span class="finance-dialog-summary-value" id="receiptSummaryRequestNo">-</span></div>
        </div>
        <form class="finance-form-grid" id="receiptForm">
            <input type="hidden" id="receiptReceivableId">
            <input type="hidden" id="receiptId">
            <div class="c-inline-field"><span>付款方</span><input type="text" id="receiptPayerName" placeholder="银行流水付款人"></div>
            <div class="c-inline-field"><span>银行流水号</span><input type="text" id="receiptBankTransactionNo"></div>
            <div class="c-inline-field"><span>入金金额</span><input type="number" id="receiptAmount" min="0" step="0.01" required></div>
            <div class="c-inline-field"><span>入金日</span><input type="date" id="receiptDate" required></div>
            <div class="c-inline-field c-inline-field-full"><span>备注</span><textarea id="receiptRemark" rows="3"></textarea></div>
        </form>
    </div>
    <div class="c-dialog-actions">
        <button class="c-btn c-btn-secondary" type="button" data-dialog-close>取消</button>
        <button class="c-btn c-btn-primary" type="button" id="saveReceiptBtn">保存</button>
    </div>
</dialog>

<script src="../../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../../common.js"></script>
<script>
(function () {
    const statusLabels = {
        0: "未收",
        1: "部分入金",
        2: "已收",
        3: "逾期",
        5: "异常",
        6: "核销",
    };
    const financeStatusToDisplayStatus = {
        1: 5,
        2: 6,
    };
    const statusClasses = {
        0: "finance-status-open",
        1: "finance-status-partial",
        2: "finance-status-paid",
        3: "finance-status-overdue",
        5: "finance-status-exception",
        6: "finance-status-writeoff",
    };
    const PAGE_SIZE = 10;
    let expandedId = null;
    let currentPage = 1;
    let totalItems = 0;
    let totalPages = 1;
    let receivables = [];
    let isLoading = false;
    let tableErrorMessage = "";
    const receiptsCache = new Map();
    const receiptsLoading = new Set();

    const $ = (selector) => document.querySelector(selector);
    const tableBody = $("#receivableTableBody");
    const receivableDialog = $("#receivableDialog");
    const receiptDialog = $("#receiptDialog");
    const pagination = $("#receivablePagination");
    const paginationPages = $("#receivablePaginationPages");
    const paginationSummary = $("#receivablePaginationSummary");
    const receivableCustomerMap = new Map();
    const toNumber = (value) => {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : 0;
    };
    const money = (value) => `¥${Math.round(toNumber(value)).toLocaleString("ja-JP")}`;
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
    }[char]));
    const today = () => new Date().toISOString().slice(0, 10);
    const debounce = (fn, delay = 250) => {
        let timer = null;
        return (...args) => {
            window.clearTimeout(timer);
            timer = window.setTimeout(() => fn(...args), delay);
        };
    };
    const confirmedTotal = (item) => toNumber(item.received_amount);
    const outstandingAmount = (item) => toNumber(item.outstanding_amount);
    const sourceType = (item) => item.source_type || (item.pay_request_id ? "request" : "manual");
    const sourceLabel = (item) => item.source_label || (item.pay_request_id ? "请求书" : "手动");
    const ageText = (item) => {
        if (!item.due_date || outstandingAmount(item) <= 0) return "-";
        const todayDate = new Date(`${today()}T00:00:00`);
        const dueDate = new Date(`${item.due_date}T00:00:00`);
        const days = Math.floor((todayDate - dueDate) / 86400000);
        if (days <= 0) return "未到期";
        return `${days}天`;
    };
    const computedStatus = (item) => {
        if (item.display_status !== undefined && item.display_status !== null) return Number(item.display_status);
        const status = Number(item.finance_status);
        return financeStatusToDisplayStatus[status] || 0;
    };
    const refreshCachedReceivable = (item) => {
        if (!item || item.id === undefined || item.id === null) return;
        receivables = receivables.map((row) => String(row.id) === String(item.id) ? item : row);
    };
    const setTableMessage = (message) => {
        tableBody.innerHTML = `<tr><td class="finance-empty-row" colspan="11">${escapeHtml(message)}</td></tr>`;
    };
    const renderReceiptRows = (item) => {
        const key = String(item.id);
        if (receiptsLoading.has(key)) {
            return `<tr><td class="finance-empty-row" colspan="7">加载中...</td></tr>`;
        }
        const receipts = receiptsCache.get(key) || [];
        if (!receipts.length) {
            return `<tr><td class="finance-empty-row" colspan="7">暂无入金明细</td></tr>`;
        }
        return receipts.map((receipt) => `
            <tr>
                <td>${escapeHtml(receipt.id)}</td>
                <td>${escapeHtml(receipt.receipt_date || "-")}</td>
                <td>${escapeHtml(money(receipt.receipt_amount))}</td>
                <td>${escapeHtml(receipt.payer_name || "-")}</td>
                <td>${escapeHtml(receipt.bank_transaction_no || "-")}</td>
                <td>${escapeHtml(receipt.remark || "-")}</td>
                <td class="c-actions-col">
                    <button class="c-btn c-btn-secondary c-btn-sm" type="button" data-action="edit-receipt" data-receivable-id="${escapeHtml(item.id)}" data-receipt-id="${escapeHtml(receipt.id)}">编辑</button>
                    <button class="c-btn c-btn-danger c-btn-sm" type="button" data-action="delete-receipt" data-receivable-id="${escapeHtml(item.id)}" data-receipt-id="${escapeHtml(receipt.id)}">删除</button>
                </td>
            </tr>
        `).join("");
    };
    const renderTable = () => {
        if (paginationSummary) {
            paginationSummary.textContent = `共 ${totalItems} 条 · 第 ${currentPage}/${totalPages} 页`;
        }
        if (pagination && window.renderPagination) {
            window.renderPagination(pagination, paginationPages, currentPage, totalPages);
        }
        if (isLoading) {
            setTableMessage("加载中...");
            return;
        }
        if (tableErrorMessage) {
            setTableMessage(tableErrorMessage);
            return;
        }
        if (!receivables.length) {
            setTableMessage("暂无数据");
            return;
        }
        tableBody.innerHTML = receivables.map((item) => {
            const status = computedStatus(item);
            const expanded = String(expandedId) === String(item.id);
            return `
                <tr data-id="${escapeHtml(item.id)}">
                    <td><button class="c-btn c-btn-lite c-btn-sm finance-expand-btn" type="button" data-action="toggle" data-id="${escapeHtml(item.id)}" aria-label="展开入金明细">${expanded ? "−" : "+"}</button></td>
                    <td><span class="finance-source ${sourceType(item) === "manual" ? "finance-source-manual" : ""}">${sourceLabel(item)}</span></td>
                    <td>${escapeHtml(item.request_no || "-")}</td>
                    <td class="finance-name-cell">${escapeHtml(item.customer_name || "-")}</td>
                    <td>${escapeHtml(money(item.receivable_amount))}</td>
                    <td>${escapeHtml(money(confirmedTotal(item)))}</td>
                    <td>${escapeHtml(money(outstandingAmount(item)))}</td>
                    <td>${escapeHtml(item.due_date || "-")}</td>
                    <td>${escapeHtml(ageText(item))}</td>
                    <td><span class="finance-status ${statusClasses[status] || ""}">${escapeHtml(statusLabels[status] || "-")}</span></td>
                    <td class="c-actions-col">
                        <button class="c-btn c-btn-secondary c-btn-sm" type="button" data-action="edit-receivable" data-id="${escapeHtml(item.id)}">编辑</button>
                        <button class="c-btn c-btn-primary c-btn-sm" type="button" data-action="add-receipt" data-id="${escapeHtml(item.id)}">新增入金</button>
                    </td>
                </tr>
                ${expanded ? `
                    <tr class="finance-detail-row">
                        <td colspan="11">
                            <div class="finance-detail-panel">
                                <div class="finance-detail-head">
                                    <span>入金明细</span>
                                    <span>已入金 ${escapeHtml(money(confirmedTotal(item)))}</span>
                                </div>
                                <div class="finance-detail-table">
                                    <table class="c-table c-table-compact">
                                        <thead><tr><th>ID</th><th>入金日</th><th>金额</th><th>付款方</th><th>银行流水号</th><th>备注</th><th class="c-actions-col">操作</th></tr></thead>
                                        <tbody>${renderReceiptRows(item)}</tbody>
                                    </table>
                                </div>
                            </div>
                        </td>
                    </tr>
                ` : ""}
            `;
        }).join("");
    };
    const fetchReceivables = async () => {
        isLoading = true;
        renderTable();
        const params = window.createParams([
            ["month", $("#filterMonth").value],
            ["source", $("#filterSource").value],
            ["status", $("#filterStatus").value],
            ["page", String(currentPage)],
            ["page_size", String(PAGE_SIZE)],
        ]);
        try {
            const payload = await window.requestJson(window.buildUrl("/api/finance/receivables", params), { method: "GET" });
            receivables = Array.isArray(payload.data?.items) ? payload.data.items : [];
            totalItems = Number(payload.meta?.total || 0);
            currentPage = Number(payload.meta?.page || currentPage || 1);
            totalPages = Math.max(Number(payload.meta?.total_pages || 1), 1);
            tableErrorMessage = "";
        } catch (err) {
            receivables = [];
            totalItems = 0;
            totalPages = 1;
            tableErrorMessage = `加载失败：${err.message || "未知错误"}`;
            throw err;
        } finally {
            isLoading = false;
            renderTable();
        }
    };
    const loadReceipts = async (item, force = false) => {
        const key = String(item.id);
        if (!force && receiptsCache.has(key)) return receiptsCache.get(key);
        receiptsLoading.add(key);
        renderTable();
        try {
            const payload = await window.requestJson(`/api/finance/receivables/${encodeURIComponent(item.id)}/receipts`, { method: "GET" });
            const receipts = Array.isArray(payload.data?.items) ? payload.data.items : [];
            receiptsCache.set(key, receipts);
            return receipts;
        } catch (err) {
            receiptsCache.set(key, []);
            window.alert(err.message || "入金明细加载失败");
            return [];
        } finally {
            receiptsLoading.delete(key);
            renderTable();
        }
    };
    const renderCustomerOptions = (items) => {
        const list = $("#receivableCustomerList");
        receivableCustomerMap.clear();
        list.innerHTML = "";
        items.forEach((item) => {
            if (!item || !item.company_name) return;
            receivableCustomerMap.set(item.company_name, item.id);
            const option = document.createElement("option");
            option.value = item.company_name;
            list.appendChild(option);
        });
    };
    const fetchCustomerOptions = async (useDefault = false) => {
        const input = $("#receivableCustomerName");
        const keyword = input.value.trim();
        if (!keyword && !useDefault) {
            renderCustomerOptions([]);
            return;
        }
        const params = window.createParams([
            ["company_name", keyword],
            ["page", "1"],
            ["page_size", "5"],
        ]);
        try {
            const payload = await window.requestJson(window.buildUrl("/api/customers", params), { method: "GET" });
            const items = Array.isArray(payload.data?.items) ? payload.data.items : [];
            renderCustomerOptions(items);
        } catch (err) {
            renderCustomerOptions([]);
        }
    };
    const syncSelectedCustomerId = () => {
        const name = $("#receivableCustomerName").value.trim();
        const id = receivableCustomerMap.get(name) || "";
        $("#receivableCustomerId").value = id ? String(id) : "";
    };
    const openDialog = (dialog) => {
        if (dialog && typeof dialog.showModal === "function") dialog.showModal();
    };
    const openReceivableDialog = (item = null) => {
        $("#receivableDialogTitle").textContent = item ? "编辑应收" : "新增应收";
        $("#receivableId").value = item ? item.id : "";
        $("#receivableCustomerId").value = item && item.customer_id ? item.customer_id : "";
        $("#receivableCustomerName").value = item ? item.customer_name || "" : "";
        $("#receivableAmount").value = item ? item.receivable_amount : "";
        $("#receivableDueDate").value = item ? item.due_date || "" : "";
        $("#receivableStatus").value = item ? String(item.finance_status) : "0";
        $("#receivableRemark").value = item ? item.remark || "" : "";
        openDialog(receivableDialog);
    };
    const openReceiptDialog = (item, receipt = null) => {
        $("#receiptDialogTitle").textContent = receipt ? "编辑入金" : "新增入金";
        $("#receiptReceivableId").value = item.id;
        $("#receiptId").value = receipt ? receipt.id : "";
        $("#receiptSummaryCustomer").textContent = item.customer_name || "-";
        $("#receiptSummaryOutstanding").textContent = money(outstandingAmount(item));
        $("#receiptSummaryRequestNo").textContent = item.request_no || "-";
        $("#receiptPayerName").value = receipt ? receipt.payer_name || "" : item.customer_name || "";
        $("#receiptBankTransactionNo").value = receipt ? receipt.bank_transaction_no || "" : "";
        $("#receiptAmount").value = receipt ? receipt.receipt_amount : outstandingAmount(item);
        $("#receiptDate").value = receipt ? receipt.receipt_date || "" : today();
        $("#receiptRemark").value = receipt ? receipt.remark || "" : "";
        openDialog(receiptDialog);
    };
    const saveReceivable = async () => {
        syncSelectedCustomerId();
        const customerName = $("#receivableCustomerName").value.trim();
        const amount = toNumber($("#receivableAmount").value);
        if (!customerName) {
            window.alert("请输入客户名称");
            return;
        }
        if (amount <= 0) {
            window.alert("请输入有效的应收金额");
            return;
        }
        const id = Number($("#receivableId").value);
        const payload = {
            customer_id: $("#receivableCustomerId").value ? Number($("#receivableCustomerId").value) : null,
            customer_name: customerName,
            receivable_amount: String(amount),
            due_date: $("#receivableDueDate").value || "",
            finance_status: Number($("#receivableStatus").value),
            remark: $("#receivableRemark").value.trim(),
        };
        try {
            const response = await window.requestJson(id ? `/api/finance/receivables/${encodeURIComponent(id)}` : "/api/finance/receivables", {
                method: id ? "PUT" : "POST",
                body: JSON.stringify(payload),
            });
            if (id) {
                refreshCachedReceivable(response.data?.item);
            } else {
                currentPage = 1;
            }
            receivableDialog.close();
            await fetchReceivables();
        } catch (err) {
            window.alert(err.message || "保存失败");
        }
    };
    const saveReceipt = async () => {
        const receivableId = Number($("#receiptReceivableId").value);
        const amount = toNumber($("#receiptAmount").value);
        const item = receivables.find((target) => target.id === receivableId);
        if (!item) return;
        if (amount <= 0) {
            window.alert("请输入有效的入金金额");
            return;
        }
        if (!$("#receiptDate").value) {
            window.alert("请选择入金日");
            return;
        }
        const receiptId = Number($("#receiptId").value);
        const payload = {
            customer_id: item.customer_id || null,
            payer_name: $("#receiptPayerName").value.trim(),
            bank_transaction_no: $("#receiptBankTransactionNo").value.trim(),
            receipt_amount: String(amount),
            receipt_date: $("#receiptDate").value,
            remark: $("#receiptRemark").value.trim(),
        };
        try {
            const response = await window.requestJson(
                receiptId
                    ? `/api/finance/receipts/${encodeURIComponent(receiptId)}`
                    : `/api/finance/receivables/${encodeURIComponent(receivableId)}/receipts`,
                {
                    method: receiptId ? "PUT" : "POST",
                    body: JSON.stringify(payload),
                }
            );
            refreshCachedReceivable(response.data?.receivable);
            receiptsCache.delete(String(receivableId));
            expandedId = receivableId;
            receiptDialog.close();
            renderTable();
            await loadReceipts(item, true);
        } catch (err) {
            window.alert(err.message || "保存失败");
        }
    };
    const deleteReceipt = async (item, receiptId) => {
        if (!window.confirm("确定删除这条入金记录吗？")) return;
        try {
            const response = await window.requestJson(`/api/finance/receipts/${encodeURIComponent(receiptId)}`, { method: "DELETE" });
            refreshCachedReceivable(response.data?.receivable);
            receiptsCache.delete(String(item.id));
            expandedId = item.id;
            renderTable();
            await loadReceipts(item, true);
        } catch (err) {
            window.alert(err.message || "删除失败");
        }
    };
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
        const initialMonth = new URLSearchParams(window.location.search || "").get("month") || today().slice(0, 7);
        $("#filterMonth").value = initialMonth;
        if (window.initDialogCloseBehavior) {
            window.initDialogCloseBehavior({ dialogs: [receivableDialog, receiptDialog] });
        }
        const debouncedFetchCustomerOptions = debounce(() => fetchCustomerOptions());
        $("#receivableCustomerName").addEventListener("focus", () => fetchCustomerOptions(true));
        $("#receivableCustomerName").addEventListener("input", () => {
            $("#receivableCustomerId").value = "";
            debouncedFetchCustomerOptions();
        });
        $("#receivableCustomerName").addEventListener("change", syncSelectedCustomerId);
        $("#addReceivableBtn").addEventListener("click", () => openReceivableDialog());
        $("#saveReceivableBtn").addEventListener("click", saveReceivable);
        $("#saveReceiptBtn").addEventListener("click", saveReceipt);
        $("#searchBtn").addEventListener("click", () => {
            currentPage = 1;
            fetchReceivables().catch(() => {});
        });
        ["#filterMonth", "#filterSource", "#filterStatus"].forEach((selector) => {
            $(selector).addEventListener("input", () => {
                currentPage = 1;
                fetchReceivables().catch(() => {});
            });
            $(selector).addEventListener("change", () => {
                currentPage = 1;
                fetchReceivables().catch(() => {});
            });
        });
        if (pagination && window.bindPagination) {
            window.bindPagination(pagination, (value) => {
                if (value === "prev") {
                    currentPage = Math.max(currentPage - 1, 1);
                } else if (value === "next") {
                    currentPage = Math.min(currentPage + 1, totalPages);
                } else {
                    currentPage = Math.min(Math.max(Number(value) || 1, 1), totalPages);
                }
                fetchReceivables().catch(() => {});
            });
        }
        tableBody.addEventListener("click", async (event) => {
            const button = event.target.closest("[data-action]");
            if (!button) return;
            const action = button.dataset.action;
            const item = receivables.find((target) => target.id === Number(button.dataset.id || button.dataset.receivableId));
            if (action === "toggle" && item) {
                expandedId = String(expandedId) === String(item.id) ? null : item.id;
                renderTable();
                if (expandedId) await loadReceipts(item);
            }
            if (action === "edit-receivable" && item) {
                openReceivableDialog(item);
            }
            if (action === "add-receipt" && item) {
                openReceiptDialog(item);
            }
            if (action === "edit-receipt" && item) {
                const receipts = receiptsCache.get(String(item.id)) || await loadReceipts(item);
                const receipt = receipts.find((target) => String(target.id) === String(button.dataset.receiptId));
                if (receipt) openReceiptDialog(item, receipt);
            }
            if (action === "delete-receipt" && item) {
                await deleteReceipt(item, button.dataset.receiptId);
            }
        });
        fetchReceivables().catch(() => {});
    });
}());
</script>
</body>
</html>
