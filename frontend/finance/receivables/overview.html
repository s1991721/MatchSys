<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>应收概览</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="receivables.overview">
    <div class="finance-overview-grid">
        <section class="finance-overview-panel">
            <h3 class="finance-overview-title">本月汇总</h3>
            <div class="finance-month-grid">
                <div class="finance-month-card">
                    <span class="finance-month-label">本月应收</span>
                    <span class="finance-month-value" id="overviewReceivableAmount">¥0</span>
                </div>
                <div class="finance-month-card">
                    <span class="finance-month-label">已收金额</span>
                    <span class="finance-month-value" id="overviewReceivedAmount">¥0</span>
                </div>
                <div class="finance-month-card">
                    <span class="finance-month-label">未收金额</span>
                    <span class="finance-month-value" id="overviewOutstandingAmount">¥0</span>
                </div>
            </div>
            <p class="finance-overview-note" id="overviewStatusText">加载中...</p>
        </section>

        <section class="finance-overview-panel">
            <h3 class="finance-overview-title">历史未平账月份</h3>
            <div class="finance-month-list" id="unbalancedMonthList"></div>
            <p class="finance-overview-note">点击月份后切换到应收列表，并按该月份筛选未平账数据。</p>
        </section>
    </div>
</div>

<script src="../../i18n.js"></script>
<script src="../finance-common.js"></script>
<script src="../../common.js"></script>
<script>
(function () {
    const $ = (selector) => document.querySelector(selector);
    const toNumber = (value) => {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : 0;
    };
    const money = (value) => `¥${Math.round(toNumber(value)).toLocaleString("ja-JP")}`;
    const escapeHtml = FinanceUI.escapeHtml;
    const applyI18n = () => FinanceUI.applyI18n();
    const openMonth = (month) => {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: "receivables:open-list", month }, "*");
                return;
            }
        } catch (e) {}
        window.location.href = `list.html?month=${encodeURIComponent(month)}`;
    };
    const renderUnbalancedMonths = (items) => {
        const list = $("#unbalancedMonthList");
        if (!items.length) {
            list.innerHTML = `<div class="finance-month-item" role="status"><span>暂无历史未平账月份</span><span class="finance-month-amount">¥0</span></div>`;
            return;
        }
        list.innerHTML = items.map((item) => `
            <button class="finance-month-item" type="button" data-month="${escapeHtml(item.month)}">
                <span>${escapeHtml(item.month)} · ${escapeHtml(item.count || 0)}条</span>
                <span class="finance-month-amount">${escapeHtml(money(item.outstanding_amount))}</span>
            </button>
        `).join("");
    };
    const fetchOverview = async () => {
        const params = window.createParams([
            ["month", new URLSearchParams(window.location.search || "").get("month") || ""],
        ]);
        const payload = await window.requestJson(window.buildUrl("/api/finance/receivables/overview", params), { method: "GET" });
        const summary = payload.data?.summary || {};
        $("#overviewReceivableAmount").textContent = money(summary.receivable_amount);
        $("#overviewReceivedAmount").textContent = money(summary.received_amount);
        $("#overviewOutstandingAmount").textContent = money(summary.outstanding_amount);
        $("#overviewStatusText").textContent = `${payload.data?.month || ""} 汇总`;
        renderUnbalancedMonths(Array.isArray(payload.data?.unbalanced_months) ? payload.data.unbalanced_months : []);
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
        $("#unbalancedMonthList").addEventListener("click", (event) => {
            const button = event.target.closest("[data-month]");
            if (!button) return;
            openMonth(button.dataset.month || "");
        });
        fetchOverview().catch((err) => {
            $("#overviewStatusText").textContent = `加载失败：${err.message || "未知错误"}`;
            renderUnbalancedMonths([]);
        });
    });
}());
</script>
</body>
</html>
