<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title>报销申请</title>
</head>
<body class="order-page finance-page finance-module-page">
<div class="page finance-module-page-shell">
    <section class="c-card c-card-pad finance-view" data-finance-panel="reimbursements">

    <div class="finance-section-head">
        <div>
            <h2 class="finance-section-title" data-i18n="finance.reimbursements.title">报销管理</h2>
            <p class="c-card-subtitle" data-i18n="finance.reimbursements.subtitle">管理员工报销申请、凭证、审核状态与付款进度。</p>
        </div>
        <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" type="button" data-i18n="finance.action.add_reimbursement">新增报销</button>
    </div>
    <div class="finance-subtabs" role="tablist" aria-label="报销管理子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="requests">报销申请</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="approval">审核处理</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="receipts">凭证管理</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="payment">报销付款</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="stats">报销统计</button>
    </div>
        <div class="finance-subframe-shell">
            <iframe id="financeSubFrame" class="finance-subframe" src="reimbursements/requests.html" title="报销申请"></iframe>
        </div>
    </section>
</div>

<script src="../i18n.js"></script>
<script src="finance-common.js"></script>
<script src="../common.js"></script>
<script>
FinanceUI.onReady(() => {
    FinanceUI.initSubtabFrame({
        initialKey: "requests",
        routes: {
            requests: { src: "reimbursements/requests.html", title: "报销申请" },
            approval: { src: "reimbursements/approval.html", title: "审核处理" },
            receipts: { src: "reimbursements/receipts.html", title: "凭证管理" },
            payment: { src: "reimbursements/payment.html", title: "报销付款" },
            stats: { src: "reimbursements/stats.html", title: "报销统计" }
        }
    });
});
</script>
</body>
</html>
