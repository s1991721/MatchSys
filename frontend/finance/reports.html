<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title>月度收支</title>
</head>
<body class="order-page finance-page finance-module-page">
<div class="page finance-module-page-shell">
    <section class="c-card c-card-pad finance-view" data-finance-panel="reports">

    <div class="finance-section-head">
        <div>
            <h2 class="finance-section-title" data-i18n="finance.reports.title">财务报表</h2>
            <p class="c-card-subtitle" data-i18n="finance.reports.subtitle">查看月度收支、应收应付与利润概览。</p>
        </div>
        <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" type="button" data-i18n="finance.action.export_report">导出报表</button>
    </div>
    <div class="finance-subtabs" role="tablist" aria-label="财务报表子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="monthly">月度收支</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="balance">应收应付</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="profit">利润分析</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="cashflow">现金流</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="exports">导出中心</button>
    </div>
        <div class="finance-subframe-shell">
            <iframe id="financeSubFrame" class="finance-subframe" src="reports/monthly.html" title="月度收支"></iframe>
        </div>
    </section>
</div>

<script src="../i18n.js"></script>
<script src="finance-common.js"></script>
<script src="../common.js"></script>
<script>
FinanceUI.onReady(() => {
    FinanceUI.initSubtabFrame({
        initialKey: "monthly",
        routes: {
            monthly: { src: "reports/monthly.html", title: "月度收支" },
            balance: { src: "reports/balance.html", title: "应收应付" },
            profit: { src: "reports/profit.html", title: "利润分析" },
            cashflow: { src: "reports/cashflow.html", title: "现金流" },
            exports: { src: "reports/exports.html", title: "导出中心" }
        }
    });
});
</script>
</body>
</html>
