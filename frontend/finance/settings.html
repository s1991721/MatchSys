<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title>税率设置</title>
</head>
<body class="order-page finance-page finance-module-page">
<div class="page finance-module-page-shell">
    <section class="c-card c-card-pad finance-view" data-finance-panel="settings">

    <div class="finance-section-head">
        <div>
            <h2 class="finance-section-title" data-i18n="finance.settings.title">财务设置</h2>
            <p class="c-card-subtitle" data-i18n="finance.settings.subtitle">维护税率、费用科目、付款条件、银行账户与财务规则。</p>
        </div>
        <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" type="button" data-i18n="finance.action.save_settings">保存设置</button>
    </div>
    <div class="finance-subtabs" role="tablist" aria-label="财务设置子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="tax">税率设置</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="accounts">费用科目</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="terms">付款条件</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="banks">银行账户</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="payroll">工资规则</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="numbering">编号规则</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="reminders">提醒规则</button>
    </div>
        <div class="finance-subframe-shell">
            <iframe id="financeSubFrame" class="finance-subframe" src="settings/tax.html" title="税率设置"></iframe>
        </div>
    </section>
</div>

<script src="../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
        const routes = {
        tax: { src: "settings/tax.html", title: "税率设置" },
        accounts: { src: "settings/accounts.html", title: "费用科目" },
        terms: { src: "settings/terms.html", title: "付款条件" },
        banks: { src: "settings/banks.html", title: "银行账户" },
        payroll: { src: "settings/payroll.html", title: "工资规则" },
        numbering: { src: "settings/numbering.html", title: "编号规则" },
        reminders: { src: "settings/reminders.html", title: "提醒规则" }
        };
        const buttons = Array.from(document.querySelectorAll("[data-finance-subtab]"));
        const frame = document.getElementById("financeSubFrame");
        const currentLang = () => window.I18N && typeof window.I18N.getLang === "function" ? window.I18N.getLang() : "zh-CN";
        const syncFrameLang = () => {
            if (!frame || !frame.contentWindow) return;
            try { frame.contentWindow.postMessage({ type: "i18n:change", lang: currentLang() }, "*"); } catch (e) {}
        };
        const setSubtab = (key) => {
            const route = routes[key];
            if (!route || !frame) return;
            buttons.forEach((button) => {
                const active = button.dataset.financeSubtab === key;
                button.classList.toggle("is-active", active);
                button.setAttribute("aria-selected", String(active));
            });
            if (!frame.getAttribute("src") || !frame.getAttribute("src").endsWith(route.src)) {
                frame.setAttribute("src", route.src);
            }
            frame.setAttribute("title", route.title);
        };
        buttons.forEach((button) => {
            button.addEventListener("click", () => setSubtab(button.dataset.financeSubtab));
        });
        if (frame) {
            frame.addEventListener("load", syncFrameLang);
        }
        window.addEventListener("i18n:change", syncFrameLang);
        setSubtab("tax");
    });
}());
</script>
</body>
</html>
