<section class="c-card c-card-pad finance-view" data-finance-panel="settings">
    <div class="finance-section-head">
        <div>
            <h2 class="finance-section-title" data-i18n="finance.settings.title">财务设置</h2>
            <p class="c-card-subtitle" data-i18n="finance.settings.subtitle">维护税率、费用科目、付款条件、银行账户与财务规则。</p>
        </div>
        <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" type="button" data-i18n="finance.action.save_settings">保存设置</button>
    </div>
    <div class="finance-subtabs" role="tablist" aria-label="财务设置子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="tax">税率设置</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="accounts">费用科目</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="terms">付款条件</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="banks">银行账户</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="payroll">工资规则</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="numbering">编号规则</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="reminders">提醒规则</button>
    </div>
    <div class="finance-subpanel" data-finance-subpanel="tax">
    <div class="finance-summary-grid">
        <div class="finance-summary-item"><span class="finance-summary-label">税率</span><span class="finance-summary-value">10%</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">费用科目</span><span class="finance-summary-value">0</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">银行账户</span><span class="finance-summary-value">0</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">付款条件</span><span class="finance-summary-value">0</span></div>
    </div>
    <div class="table-wrap c-table-wrapper">
        <table class="c-table c-table-hover">
            <thead><tr><th>设置类别</th><th>项目</th><th>当前值</th><th>说明</th><th class="c-actions-col">操作</th></tr></thead>
            <tbody>
                <tr><td>税率</td><td>消费税</td><td>10%</td><td>请求书与报表默认税率</td><td class="c-actions-col"><button class="c-btn c-btn-secondary c-btn-sm" type="button">编辑</button></td></tr>
                <tr><td>付款条件</td><td>默认结算日</td><td>月末締め翌月末払い</td><td>应收/应付预定日期计算</td><td class="c-actions-col"><button class="c-btn c-btn-secondary c-btn-sm" type="button">编辑</button></td></tr>
                <tr><td>银行账户</td><td>默认入金账户</td><td>-</td><td>入金确认和支付记录使用</td><td class="c-actions-col"><button class="c-btn c-btn-secondary c-btn-sm" type="button">编辑</button></td></tr>
            </tbody>
        </table>
    </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="accounts">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>科目代码</th><th>科目名称</th><th>适用模块</th><th>状态</th><th class="c-actions-col">操作</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="5">暂无费用科目</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="terms">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>条件名称</th><th>締日</th><th>支付/入金日</th><th>说明</th><th class="c-actions-col">操作</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="5">暂无付款条件</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="banks">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>银行名</th><th>支店</th><th>账户类型</th><th>账号</th><th>用途</th><th class="c-actions-col">操作</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="6">暂无银行账户</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="payroll">
        <div class="c-empty">工资规则将在工资计算模块确定后补充</div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="numbering">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>业务类型</th><th>前缀</th><th>日期格式</th><th>流水位数</th><th>示例</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="5">暂无编号规则</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="finance-subpanel hidden" data-finance-subpanel="reminders">
        <div class="table-wrap c-table-wrapper">
            <table class="c-table c-table-hover">
                <thead><tr><th>提醒类型</th><th>触发条件</th><th>通知对象</th><th>状态</th><th class="c-actions-col">操作</th></tr></thead>
                <tbody><tr><td class="finance-empty-row" colspan="5">暂无提醒规则</td></tr></tbody>
            </table>
        </div>
    </div>
</section>
