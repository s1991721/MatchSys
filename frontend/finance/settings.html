<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../components.css">
    <title>财务设置</title>
</head>
<body class="order-page finance-page finance-module-page">
<div class="page finance-module-page-shell">
    <section class="c-card c-card-pad finance-view" data-finance-panel="settings">

    <div class="finance-subtabs" role="tablist" aria-label="财务设置子功能">
        <button class="finance-subtab is-active" type="button" role="tab" aria-selected="true" data-finance-subtab="employment">雇用保险</button>
        <button class="finance-subtab" type="button" role="tab" aria-selected="false" data-finance-subtab="incomeTax">所得税</button>
    </div>
        <div class="finance-subframe-shell">
            <iframe id="financeSubFrame" class="finance-subframe" src="settings/employment.html" title="雇用保险"></iframe>
        </div>
    </section>
</div>

<script src="../i18n.js"></script>
<script src="finance-common.js"></script>
<script src="../common.js"></script>
<script>
FinanceUI.onReady(() => {
    FinanceUI.initSubtabFrame({
        initialKey: "employment",
        routes: {
            employment: { src: "settings/employment.html", title: "雇用保险" },
            incomeTax: { src: "settings/income-tax.html", title: "所得税" }
        }
    });
});
</script>
</body>
</html>
