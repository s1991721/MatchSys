<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../components.css">
    <title>税率设置</title>
</head>
<body class="order-page finance-subpage">
<div class="finance-subpage-content" data-finance-subpage="settings.tax">
    <div class="finance-summary-grid">
        <div class="finance-summary-item"><span class="finance-summary-label">税率</span><span class="finance-summary-value">10%</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">费用科目</span><span class="finance-summary-value">0</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">银行账户</span><span class="finance-summary-value">0</span></div>
        <div class="finance-summary-item"><span class="finance-summary-label">付款条件</span><span class="finance-summary-value">0</span></div>
    </div>
    <div class="table-wrap c-table-wrapper">
        <table class="c-table c-table-hover">
            <thead><tr><th>设置类别</th><th>项目</th><th>当前值</th><th>说明</th><th class="c-actions-col">操作</th></tr></thead>
            <tbody>
                <tr><td>税率</td><td>消费税</td><td>10%</td><td>请求书与报表默认税率</td><td class="c-actions-col"><button class="c-btn c-btn-secondary c-btn-sm" type="button">编辑</button></td></tr>
                <tr><td>付款条件</td><td>默认结算日</td><td>月末締め翌月末払い</td><td>应收/应付预定日期计算</td><td class="c-actions-col"><button class="c-btn c-btn-secondary c-btn-sm" type="button">编辑</button></td></tr>
                <tr><td>银行账户</td><td>默认入金账户</td><td>-</td><td>入金确认和支付记录使用</td><td class="c-actions-col"><button class="c-btn c-btn-secondary c-btn-sm" type="button">编辑</button></td></tr>
            </tbody>
        </table>
    </div>
    
</div>

<script src="../../i18n.js"></script>
<script>
(function () {
    const route = (window.location.pathname || "").replace(/^\/+/, "");
    if (!route.startsWith("finance/") || route === "finance/my_salary.html") return;
    window.__routeNotified = true;
    try {
        if (!window.top || window.top === window) return;
        const topHash = ((window.top.location && window.top.location.hash) || "")
            .replace(/^#/, "")
            .split("?")[0]
            .split("#")[0];
        if (topHash === route) {
            window.top.location.hash = "finance.html";
        }
    } catch (e) {}
}());
</script>
<script src="../../common.js"></script>
<script>
(function () {
    const applyI18n = () => {
        if (window.I18N && typeof window.I18N.init === "function") {
            window.I18N.init();
        }
        if (window.I18N && typeof window.I18N.apply === "function") {
            window.I18N.apply(document);
        }
    };
    document.addEventListener("DOMContentLoaded", () => {
        applyI18n();
    });
}());
</script>
</body>
</html>
