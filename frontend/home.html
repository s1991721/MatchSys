<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon-48.png" type="image/png" sizes="48x48">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title data-i18n="menu.1.name">主页</title>
</head>
<body class="home-page">
  <section class="container">
    <!-- Stat cards -->
    <section class="stats">
      <div class="c-card">
        <div class="stat">
          <div>
            <div class="label" data-i18n="home.stats.week_match">本周match数</div>
            <div class="value" id="week-match-count">0</div>
            <div class="delta" id="week-match-delta">
              <span class="delta-indicator">-</span>
              <span class="delta-percent">-</span>
              <span class="pill" data-i18n="home.vs_last_week">vs 上周</span>
            </div>
          </div>
        </div>
      </div>

      <div class="c-card">
        <div class="stat">
          <div>
            <div class="label" data-i18n="home.stats.today_match">今天match数</div>
            <div class="value" id="today-match-count">0</div>
            <div class="delta" id="today-match-delta">
              <span class="delta-indicator">-</span>
              <span class="delta-percent">-</span>
              <span class="pill" data-i18n="home.vs_yesterday">vs 昨天</span>
            </div>
          </div>
        </div>
      </div>

      <div class="c-card">
        <div class="stat">
          <div>
            <div class="label" data-i18n="home.stats.month_entry">本月入场人数</div>
            <div class="value" id="month-entry-count">0</div>
            <div class="delta" id="month-entry-delta">
              <span class="delta-indicator">-</span>
              <span class="delta-percent">-</span>
              <span class="pill" data-i18n="home.vs_last_month">vs 上月</span>
            </div>
          </div>
        </div>
      </div>

      <div class="c-card">
        <div class="stat">
          <div>
            <div class="label" data-i18n="home.stats.two_weeks">当前求案件人数</div>
            <div class="value" id="two-weeks-count">0</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Middle grid -->
    <section class="grid">
      <!-- Chart card -->
      <div class="c-card">
        <div class="c-card-header">
          <div class="h">
            <span class="dot"></span>
            <h2 data-i18n="home.trend">注文统计</h2>
          </div>
          <div class="tools">
            <button class="tool" title="下载" data-i18n-title="home.download">⤓</button>
            <button class="tool" title="更多" data-i18n-title="home.more">⋯</button>
          </div>
        </div>

        <div class="chart">
          <div class="legend">
            <div class="lg"><i class="b"></i> <span data-i18n="home.legend.entry">发注数</span></div>
            <div class="lg"><i class="p"></i> <span data-i18n="home.legend.exit">受注数</span></div>
          </div>

          <!-- SVG 折线图（按月统计） -->
          <svg id="order-chart" viewBox="0 0 900 320" aria-label="line chart">
            <g opacity=".55">
              <line x1="60" y1="50" x2="860" y2="50" stroke="#e5e7eb"/>
              <line x1="60" y1="110" x2="860" y2="110" stroke="#e5e7eb"/>
              <line x1="60" y1="170" x2="860" y2="170" stroke="#e5e7eb"/>
              <line x1="60" y1="230" x2="860" y2="230" stroke="#e5e7eb"/>
              <line x1="60" y1="290" x2="860" y2="290" stroke="#e5e7eb"/>
            </g>
            <path id="order-line-purchase" fill="none" stroke="#2f6fec" stroke-width="5" stroke-linecap="round"/>
            <path id="order-line-sales" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
            <g id="order-points-purchase"></g>
            <g id="order-points-sales"></g>
            <g id="order-values-purchase" fill="#2f6fec" font-size="12" font-weight="800"></g>
            <g id="order-values-sales" fill="#7c3aed" font-size="12" font-weight="800"></g>
            <g id="order-axis-labels" fill="#6b7686" font-size="14" font-weight="800"></g>
          </svg>
        </div>
      </div>

      <!-- Task list -->
      <div class="c-card">
        <div class="c-card-header">
          <div class="h">
            <span class="dot dot-purple"></span>
            <h2>
              <span data-i18n="home.monthly_sales">当月营业技术者</span>
              （<span id="monthly-sales-count">0</span>名）
            </h2>
          </div>
        </div>

        <div class="list" id="monthly-sales-list"></div>
      </div>
    </section>

    <!-- Bottom grid -->
    <section class="grid2">
      <!-- Progress -->
      <div class="c-card">
        <div class="c-card-header">
          <div class="h">
            <span class="dot dot-green"></span>
            <h2 data-i18n="home.entry_month">入场预定</h2>
          </div>
        </div>

        <div class="progress" id="entry-progress-list"></div>
      </div>

      <!-- Activity -->
      <div class="c-card">
        <div class="c-card-header">
          <div class="h">
            <span class="dot dot-orange"></span>
            <h2>
              <span data-i18n="home.next_month_sales">下月营业技术者</span>
              （<span id="next-month-sales-count">0</span>名）
            </h2>
          </div>
        </div>

        <div class="activity" id="next-month-sales-list"></div>
      </div>
    </section>
  </section>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    if (window.I18N) {
      window.I18N.init();
      window.I18N.apply();
    }
  </script>
  <script>
    const formatCount = (value) => {
      if (typeof value !== "number") return "-";
      return value.toLocaleString("en-US");
    };

    const formatPercent = (value) => {
      if (typeof value !== "number") return "-";
      return `${Math.abs(value).toFixed(1)}%`;
    };

    const updateDelta = (deltaEl, direction, deltaPercent) => {
      if (!deltaEl) return;
      const indicator = deltaEl.querySelector(".delta-indicator");
      const percent = deltaEl.querySelector(".delta-percent");

      deltaEl.classList.remove("up", "down");
      if (direction === "up") {
        deltaEl.classList.add("up");
        if (indicator) indicator.textContent = "▲";
      } else if (direction === "down") {
        deltaEl.classList.add("down");
        if (indicator) indicator.textContent = "▼";
      } else if (indicator) {
        indicator.textContent = "-";
      }

      if (percent) {
        percent.textContent = formatPercent(deltaPercent);
      }
    };

    const updateWeekMatchStats = (payload) => {
      const countEl = document.getElementById("week-match-count");
      const deltaEl = document.getElementById("week-match-delta");
      if (!countEl || !deltaEl) return;

      countEl.textContent = formatCount(payload?.week_count);
      updateDelta(deltaEl, payload?.week_direction || "flat", payload?.week_delta_percent);
    };

    const updateTodayMatchStats = (payload) => {
      const countEl = document.getElementById("today-match-count");
      const deltaEl = document.getElementById("today-match-delta");
      if (!countEl || !deltaEl) return;

      countEl.textContent = formatCount(payload?.today_count);
      updateDelta(deltaEl, payload?.day_direction || "flat", payload?.day_delta_percent);
    };

    const updateMonthEntryStats = (payload) => {
      const countEl = document.getElementById("month-entry-count");
      const deltaEl = document.getElementById("month-entry-delta");
      if (!countEl || !deltaEl) return;

      countEl.textContent = formatCount(payload?.month_entry_count);
      updateDelta(deltaEl, payload?.month_direction || "flat", payload?.month_delta_percent);
    };

    const updateTwoWeeksStats = (payload) => {
      const countEl = document.getElementById("two-weeks-count");
      if (!countEl) return;
      countEl.textContent = formatCount(payload?.two_weeks_count);
    };

    const createMonthlySalesRow = (item) => {
      const row = document.createElement("div");
      row.className = "row";

      const left = document.createElement("div");
      left.className = "left";
      const check = document.createElement("div");
      check.className = "check";
      const nameWrap = document.createElement("div");
      nameWrap.className = "name-wrap";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = item?.name || "-";
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = item?.remark || "-";
      nameWrap.appendChild(name);
      nameWrap.appendChild(sub);
      left.appendChild(check);
      left.appendChild(nameWrap);

      const button = document.createElement("button");
      button.className = "c-btn c-btn-sm";
      const status = Number(item?.business_status);
      if (status === 0) {
        button.classList.add("c-btn-success");
        button.textContent = "营业中 →";
      } else if (status === 1) {
        button.classList.add("c-btn-primary");
        button.textContent = "1/2 →";
      } else {
        button.classList.add("c-btn-warn");
        button.textContent = "结果等待 →";
      }

      row.appendChild(left);
      row.appendChild(button);
      return row;
    };

    const updateMonthlySalesTechs = (payload) => {
      const listEl = document.getElementById("monthly-sales-list");
      const countEl = document.getElementById("monthly-sales-count");
      if (!listEl || !countEl) return;

      const items = Array.isArray(payload?.monthly_sales_techs)
        ? payload.monthly_sales_techs
        : [];

      listEl.innerHTML = "";
      items.forEach((item) => {
        listEl.appendChild(createMonthlySalesRow(item));
      });
      countEl.textContent = items.length;
    };

    const createNextMonthSalesRow = (item) => {
      const row = document.createElement("div");
      row.className = "a";

      const who = document.createElement("div");
      who.className = "who";
      const face = document.createElement("div");
      face.className = "face";
      const txt = document.createElement("div");
      txt.className = "txt";
      const name = document.createElement("b");
      name.textContent = item?.name || "-";
      const sub = document.createElement("small");
      sub.textContent = item?.spot_contract_deadline || "-";
      txt.appendChild(name);
      txt.appendChild(sub);
      who.appendChild(face);
      who.appendChild(txt);

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = "";

      row.appendChild(who);
      row.appendChild(time);
      return row;
    };

    const updateNextMonthSalesTechs = (payload) => {
      const listEl = document.getElementById("next-month-sales-list");
      const listCount = document.getElementById("next-month-sales-count");
      if (!listEl || !listCount) return;

      const items = Array.isArray(payload?.next_month_sales_techs)
        ? payload.next_month_sales_techs
        : [];

      listEl.innerHTML = "";
      items.forEach((item) => {
        listEl.appendChild(createNextMonthSalesRow(item));
      });
      listCount.textContent = items.length;
    };

    const entryPalette = [
      { bar: "var(--blue)", icon: "rgba(47,111,236,.18)" },
      { bar: "var(--purple)", icon: "rgba(124,58,237,.18)" },
      { bar: "var(--green)", icon: "rgba(22,163,74,.18)" },
      { bar: "var(--orange)", icon: "rgba(245,158,11,.18)" },
    ];

    const createEntryProgressRow = (item, index) => {
      const row = document.createElement("div");
      row.className = "pitem";

      const palette = entryPalette[index % entryPalette.length];
      const meta = document.createElement("div");
      meta.className = "meta";
      const icon = document.createElement("span");
      icon.className = "ico";
      icon.style.background = palette.icon;
      const name = document.createElement("b");
      name.textContent = item?.technician_name || "-";
      const sub = document.createElement("small");
      sub.textContent = item?.customer_name || "-";
      meta.appendChild(icon);
      meta.appendChild(name);
      meta.appendChild(sub);

      const bar = document.createElement("div");
      bar.className = "bar";
      const percent = Math.max(0, Math.min(100, Number(item?.progress) || 0));
      bar.setAttribute("aria-label", `${percent}%`);
      const barSpan = document.createElement("span");
      barSpan.style.width = `${percent}%`;
      barSpan.style.background = palette.bar;
      bar.appendChild(barSpan);

      const time = document.createElement("small");
      time.textContent = item?.period_start || "-";

      row.appendChild(meta);
      row.appendChild(bar);
      row.appendChild(time);
      return row;
    };

    const updateEntryProgress = (payload) => {
      const listEl = document.getElementById("entry-progress-list");
      if (!listEl) return;
      const items = Array.isArray(payload?.entry_items) ? payload.entry_items : [];
      listEl.innerHTML = "";
      items.forEach((item, index) => {
        listEl.appendChild(createEntryProgressRow(item, index));
      });
    };

    const updateOrderChart = (payload) => {
      const svg = document.getElementById("order-chart");
      if (!svg) return;

      const labels = Array.isArray(payload?.order_month_labels)
        ? payload.order_month_labels
        : [];
      const purchase = Array.isArray(payload?.order_purchase_counts)
        ? payload.order_purchase_counts
        : [];
      const sales = Array.isArray(payload?.order_sales_counts)
        ? payload.order_sales_counts
        : [];
      const pointCount = Math.max(labels.length, purchase.length, sales.length);
      if (!pointCount) return;

      const left = 60;
      const right = 860;
      const top = 60;
      const bottom = 270;
      const step = pointCount > 1 ? (right - left) / (pointCount - 1) : 0;
      const maxValue = Math.max(
        1,
        ...purchase.map(Number),
        ...sales.map(Number),
      );

      const toY = (value) => {
        const ratio = Number(value) / maxValue;
        return bottom - ratio * (bottom - top);
      };

      const buildPath = (values) => {
        return values
          .map((value, index) => {
            const x = left + step * index;
            const y = toY(value);
            return `${index === 0 ? "M" : "L"}${x} ${y}`;
          })
          .join(" ");
      };

      const purchaseLine = document.getElementById("order-line-purchase");
      const salesLine = document.getElementById("order-line-sales");
      if (purchaseLine) purchaseLine.setAttribute("d", buildPath(purchase));
      if (salesLine) salesLine.setAttribute("d", buildPath(sales));

      const purchasePoints = document.getElementById("order-points-purchase");
      const salesPoints = document.getElementById("order-points-sales");
      const purchaseValues = document.getElementById("order-values-purchase");
      const salesValues = document.getElementById("order-values-sales");
      const axisLabels = document.getElementById("order-axis-labels");

      if (purchasePoints) purchasePoints.innerHTML = "";
      if (salesPoints) salesPoints.innerHTML = "";
      if (purchaseValues) purchaseValues.innerHTML = "";
      if (salesValues) salesValues.innerHTML = "";
      if (axisLabels) axisLabels.innerHTML = "";

      labels.forEach((label, index) => {
        const x = left + step * index;
        const purchaseY = toY(purchase[index] || 0);
        const salesY = toY(sales[index] || 0);

        if (purchasePoints) {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", purchaseY);
          circle.setAttribute("r", "5");
          circle.setAttribute("fill", "#2f6fec");
          purchasePoints.appendChild(circle);
        }

        if (salesPoints) {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", salesY);
          circle.setAttribute("r", "5");
          circle.setAttribute("fill", "#7c3aed");
          salesPoints.appendChild(circle);
        }

        if (purchaseValues) {
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", x);
          text.setAttribute("y", purchaseY - 10);
          text.setAttribute("text-anchor", "middle");
          text.textContent = String(purchase[index] ?? 0);
          purchaseValues.appendChild(text);
        }

        if (salesValues) {
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", x);
          text.setAttribute("y", salesY + 18);
          text.setAttribute("text-anchor", "middle");
          text.textContent = String(sales[index] ?? 0);
          salesValues.appendChild(text);
        }

        if (axisLabels) {
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", x);
          text.setAttribute("y", "310");
          text.setAttribute("text-anchor", "middle");
          text.textContent = label;
          axisLabels.appendChild(text);
        }
      });
    };

    const loadWeekMatchStats = async () => {
      try {
        const payload = await window.requestJson("/api/home/stats", { method: "GET" });
        const data = payload && (payload.data || {});
        if (payload && (payload.status === "ok" || payload.success === true)) {
          updateWeekMatchStats(data);
          updateTodayMatchStats(data);
          updateMonthEntryStats(data);
          updateTwoWeeksStats(data);
          updateMonthlySalesTechs(data);
          updateNextMonthSalesTechs(data);
          updateEntryProgress(data);
          updateOrderChart(data);
        }
      } catch (error) {
        console.error("Failed to load home stats", error);
      }
    };

    loadWeekMatchStats();
  </script>
</body>
</html>
