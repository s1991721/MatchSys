  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("collapseBtn");
      const nav = document.getElementById("nav");
      const frame = document.getElementById("mainFrame");
      const topDate = document.getElementById("topDate");
      const sendTaskBtn = document.getElementById("sendTaskBtn");
      const sendTaskBadge = document.getElementById("sendTaskBadge");
      const sendTaskPopover = document.getElementById("sendTaskPopover");
      const sendTaskList = document.getElementById("sendTaskList");
      const sendTaskTotalLabel = document.getElementById("sendTaskTotalLabel");
      const sendTaskViewAll = document.getElementById("sendTaskViewAll");
      const sendTaskPopoverFoot = document.getElementById("sendTaskPopoverFoot");
      const noticeBtn = document.getElementById("noticeBtn");
      const noticeBadge = document.getElementById("noticeBadge");
      const noticeDialog = document.getElementById("noticeDialog");
      const pageSubtitle = document.getElementById("pageSubtitle");
      const noticeRoute = "my_mail.html";
      const sendTaskRoute = "sendtask.html";
      const sendHistoryRoute = "songxinhistory.html";
      const KEY = "chat_sidebar_collapsed";
      const LANG_KEY = "app_lang";
      const MENU_KEY = "app_menu_list";
      const EMPLOYEE_NAME_KEY = "app_employee_name";
      const EMPLOYEE_POSITION_KEY = "app_employee_position_name";
      const sessionMenuList = "";
      const langButtons = Array.from(document.querySelectorAll(".lang-switch [data-lang]"));
      const i18n = window.I18N;
      const employeeNameText = document.getElementById("employeeNameText");
      const employeeNameLabel = document.getElementById("employeeNameLabel");
      const employeePositionLabel = document.getElementById("employeePositionLabel");
      const systemVersionText = document.getElementById("systemVersionText");
      const systemExpiryStatus = document.getElementById("systemExpiryStatus");
      const systemExpiryDate = systemExpiryStatus ? systemExpiryStatus.querySelector(".system-expiry-date") : null;
      const systemExpiryLabel = systemExpiryStatus ? systemExpiryStatus.querySelector(".system-expiry-label") : null;
      let sendTaskTotal = 0;
      let isLoadingSendTasks = false;

      const renderSendTaskTotal = () => {
        if (!sendTaskTotalLabel) return;
        sendTaskTotalLabel.textContent = i18n
          ? i18n.format("send_task.popover.total", { count: sendTaskTotal })
          : `共${sendTaskTotal}个任务`;
      };
      const activationSettingsApi = "/api/sys-settings/activation";
      let activationExpiryRaw = "";
      let activationSystemVersion = "";

      const t = (key, fallback) => (
        i18n && typeof i18n.t === "function" ? i18n.t(key) : (fallback || key)
      );

      const format = (key, vars, fallback) => (
        i18n && typeof i18n.format === "function" ? i18n.format(key, vars) : (fallback || key)
      );

      const loadEmployeeMeta = () => {
        let name = "";
        let position = "";
        try {
          name = localStorage.getItem(EMPLOYEE_NAME_KEY) || "";
          position = localStorage.getItem(EMPLOYEE_POSITION_KEY) || "";
        } catch (e) {}
        if (employeeNameText) employeeNameText.textContent = name;
        if (employeeNameLabel) employeeNameLabel.textContent = name;
        if (employeePositionLabel) employeePositionLabel.textContent = position;
      };

      const setCollapsed = (collapsed) => {
        document.body.classList.toggle("sidebar-collapsed", collapsed);
        if (btn) btn.setAttribute("aria-expanded", String(!collapsed));
        try { localStorage.setItem(KEY, collapsed ? "1" : "0"); } catch (e) {}
      };

      const formatTopDate = (lang) => {
        const d = new Date();
        if (lang === "ja") {
          const jp = ["日", "月", "火", "水", "木", "金", "土"];
          return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${jp[d.getDay()]}）`;
        }
        const zh = ["日", "一", "二", "三", "四", "五", "六"];
        return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（周${zh[d.getDay()]}）`;
      };

      const formatDateOnly = (raw) => window.formatLocaleDate(raw, "");

      const parseExpiryDate = (raw) => {
        if (!raw) return null;
        const safeRaw = String(raw).trim();
        if (!safeRaw) return null;
        const datePart = safeRaw.split("T")[0];
        const match = datePart.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (match) {
          const year = Number(match[1]);
          const month = Number(match[2]) - 1;
          const day = Number(match[3]);
          return new Date(year, month, day);
        }
        const parsed = new Date(safeRaw);
        if (Number.isNaN(parsed.getTime())) return null;
        return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
      };

      const isExpiryWithinDays = (raw, days) => {
        const expiryDate = parseExpiryDate(raw);
        if (!expiryDate) return false;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffDays = Math.floor((expiryDate.getTime() - today.getTime()) / 86400000);
        return diffDays <= days;
      };

      const renderSystemVersion = () => {
        if (!systemVersionText) return;
        systemVersionText.textContent = activationSystemVersion || "--";
      };

      const renderSystemExpiryStatus = () => {
        if (!systemExpiryStatus || !systemExpiryDate || !systemExpiryLabel) return;
        systemExpiryLabel.textContent = t("index.system_validity_label", "系统有效期");
        systemExpiryStatus.classList.remove("is-expiry-warning");
        if (!activationExpiryRaw) {
          systemExpiryDate.textContent = t("index.system_validity_empty_value", "未设置");
          return;
        }
        systemExpiryDate.textContent = formatDateOnly(activationExpiryRaw);
        if (isExpiryWithinDays(activationExpiryRaw, 30)) {
          systemExpiryStatus.classList.add("is-expiry-warning");
        }
      };

      const loadSystemExpiryStatus = async () => {
        if (!systemExpiryStatus) return;
        try {
          const payload = await window.requestJson(activationSettingsApi, {
            method: "GET",
            cache: "no-store",
          });
          if (!payload || payload.success === false) {
            activationExpiryRaw = "";
            activationSystemVersion = "";
            renderSystemVersion();
            renderSystemExpiryStatus();
            return;
          }
          const settings = payload.data && payload.data.settings ? payload.data.settings : {};
          activationExpiryRaw = settings.expires_at || "";
          activationSystemVersion = settings.system_version || "";
          renderSystemVersion();
          renderSystemExpiryStatus();
        } catch (e) {
          activationExpiryRaw = "";
          activationSystemVersion = "";
          renderSystemVersion();
          renderSystemExpiryStatus();
        }
      };

      const syncFrameLang = (lang) => {
        if (!frame) return;
        try {
          if (frame.contentWindow && frame.contentWindow.I18N) {
            frame.contentWindow.I18N.setLang(lang);
            frame.contentWindow.I18N.apply();
          }
        } catch (e) {}
        if (frame.contentWindow) {
          try {
            frame.contentWindow.postMessage({ type: "i18n:change", lang }, "*");
          } catch (e) {}
        }
      };

      const applyLang = (lang) => {
        const safeLang = i18n ? i18n.setLang(lang) : lang;
        langButtons.forEach((button) => {
          const isActive = button.dataset.lang === safeLang;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });
        if (i18n && typeof i18n.apply === "function") {
          i18n.apply();
        }
        renderSystemExpiryStatus();
        renderSendTaskTotal();
        if (topDate) topDate.textContent = formatTopDate(safeLang);
        setSubtitle(resolveFromHash() || "home.html");
        syncFrameLang(safeLang);
      };

      const initLang = () => {
        const urlParams = new URLSearchParams(window.location.search || "");
        const urlLang = urlParams.get("lang");
        const current = i18n ? i18n.init() : "zh-CN";
        if (urlLang) {
          applyLang(urlLang);
          urlParams.delete("lang");
          const cleanUrl = `${window.location.pathname}${urlParams.toString() ? `?${urlParams}` : ""}${window.location.hash || ""}`;
          window.history.replaceState(null, "", cleanUrl);
          return;
        }
        applyLang(current);
      };

      langButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const lang = button.dataset.lang || "zh-CN";
          try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
          applyLang(lang);
        });
      });

      const openNoticeDialog = () => {
        if (!noticeDialog) return;
        if (typeof noticeDialog.showModal === "function") {
          noticeDialog.showModal();
        } else {
          noticeDialog.setAttribute("open", "open");
        }
      };

      const setNoticeBadge = (count) => {
        if (!noticeBadge) return;
        const safeCount = Number.isFinite(count) ? Math.max(0, Math.floor(count)) : 0;
        if (safeCount <= 0) {
          noticeBadge.textContent = "";
          noticeBadge.hidden = true;
          return;
        }
        // 大于 99 时按常见通知样式显示 99+，避免角标撑破。
        noticeBadge.textContent = safeCount > 99 ? "99+" : String(safeCount);
        noticeBadge.hidden = false;
      };
      const applyTopbarBadges = (data) => {
        const badges = data && data.badges ? data.badges : {};
        setSendTaskBadge(Number((badges.send_tasks && badges.send_tasks.count) || 0));
        setNoticeBadge(Number((badges.my_mails && badges.my_mails.count) || 0));
      };
      const readNoticeBadgeCount = () => {
        if (!noticeBadge || noticeBadge.hidden) return 0;
        const raw = (noticeBadge.textContent || "").trim();
        if (!raw) return 0;
        if (raw === "99+") return 99;
        const parsed = Number(raw);
        return Number.isFinite(parsed) ? Math.max(0, Math.floor(parsed)) : 0;
      };
      const markNoticeRead = () => {
        setNoticeBadge(Math.max(0, readNoticeBadgeCount() - 1));
      };

      const setSendTaskBadge = (count) => {
        if (!sendTaskBadge) return;
        const safeCount = Number.isFinite(count) ? Math.max(0, Math.floor(count)) : 0;
        sendTaskBadge.textContent = safeCount > 99 ? "99+" : String(safeCount);
        sendTaskBadge.hidden = safeCount <= 0;
      };

      const renderSendTasks = (items) => {
        if (!sendTaskList) return;
        if (!items.length) {
          sendTaskList.innerHTML = '<div class="send-task-empty" data-i18n="send_task.popover.empty">暂无发送任务</div>';
        } else {
          sendTaskList.innerHTML = items.slice(0, 3).map((item) => `
            <div class="send-task-item">
              <div class="send-task-content">
                <strong title="${window.escapeHtml(item.title || "")}">${window.escapeHtml(item.title || "--")}</strong>
                <span>${window.escapeHtml(item.time || "--")}</span>
              </div>
              <button class="send-task-detail" type="button" data-task-id="${window.escapeHtml(item.id || "")}"
                data-i18n="send_task.popover.detail">查看详情</button>
            </div>
          `).join("");
        }
        if (i18n) i18n.apply(sendTaskList);
      };

      const loadSendTasks = async () => {
        if (!sendTaskList || isLoadingSendTasks) return;
        isLoadingSendTasks = true;
        sendTaskList.innerHTML = '<div class="send-task-empty" data-i18n="common.loading">加载中...</div>';
        if (i18n) i18n.apply(sendTaskList);
        try {
          const payload = await window.requestJson("/api/send-tasks", { method: "GET" });
          const items = payload && payload.data && Array.isArray(payload.data.items) ? payload.data.items : [];
          const total = payload && payload.meta && Number.isFinite(payload.meta.total)
            ? payload.meta.total
            : items.length;
          sendTaskTotal = total;
          setSendTaskBadge(total);
          renderSendTasks(items);
          renderSendTaskTotal();
        } catch (error) {
          sendTaskTotal = 0;
          renderSendTaskTotal();
          sendTaskList.innerHTML = '<div class="send-task-empty" data-i18n="common.load_failed">加载失败</div>';
          if (i18n) i18n.apply(sendTaskList);
        } finally {
          isLoadingSendTasks = false;
        }
      };

      const closeSendTaskPopover = () => {
        if (!sendTaskPopover || !sendTaskBtn) return;
        sendTaskPopover.hidden = true;
        sendTaskBtn.setAttribute("aria-expanded", "false");
      };

      const readCollapsed = () => {
        try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; }
      };

      loadEmployeeMeta();

      if (btn) {
        setCollapsed(readCollapsed());
        btn.addEventListener("click", () => {
          setCollapsed(!document.body.classList.contains("sidebar-collapsed"));
        });
      }


      if (noticeBtn) {
        // 顶部消息图标直接切换功能页，保持与左侧菜单一致的路由行为。
        noticeBtn.addEventListener("click", () => {
          if (location.hash !== "#" + noticeRoute) {
            location.hash = noticeRoute;
          } else {
            applyRoute(noticeRoute);
          }
        });
      }
      if (sendTaskBtn) {
        sendTaskBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          const shouldOpen = sendTaskPopover && sendTaskPopover.hidden;
          if (sendTaskPopover) sendTaskPopover.hidden = !shouldOpen;
          sendTaskBtn.setAttribute("aria-expanded", String(Boolean(shouldOpen)));
          if (shouldOpen) loadSendTasks();
        });
      }
      if (sendTaskPopover) {
        sendTaskPopover.addEventListener("click", (event) => event.stopPropagation());
      }
      const navigateToSendHistory = () => {
        if (!isAllowedRoute(sendHistoryRoute)) return;
        closeSendTaskPopover();
        if (location.hash !== "#" + sendHistoryRoute) {
          location.hash = sendHistoryRoute;
        } else {
          applyRoute(sendHistoryRoute);
        }
      };
      if (sendTaskViewAll) {
        sendTaskViewAll.addEventListener("click", navigateToSendHistory);
      }
      if (sendTaskList) {
        sendTaskList.addEventListener("click", (event) => {
          const detailButton = event.target.closest(".send-task-detail");
          if (!detailButton) return;
          const taskId = detailButton.dataset.taskId || "";
          closeSendTaskPopover();
          const route = `${sendTaskRoute}?id=${encodeURIComponent(taskId)}`;
          if (location.hash !== "#" + route) location.hash = route;
          else applyRoute(route);
        });
      }
      document.addEventListener("click", closeSendTaskPopover);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSendTaskPopover();
      });
      if (window.initDialogCloseBehavior) {
        window.initDialogCloseBehavior({
          dialogs: [noticeDialog]
        });
      }

      const links = nav ? Array.from(nav.querySelectorAll("a[data-src]")) : [];
      const normalizeAppRoute = (value) => {
        const raw = String(value || "").trim().replace(/^#/, "");
        if (!raw) return "";
        if (window.MatchSys && typeof window.MatchSys.normalizeAppRoute === "function") {
          return window.MatchSys.normalizeAppRoute(raw);
        }
        return raw.replace(/^\//, "");
      };
      const normalizeMenuItem = (value) => normalizeAppRoute(value || "")
        .split("?")[0]
        .split("#")[0]
        .trim();
      const readMenuList = () => {
        let stored = null;
        try {
          stored = window.MatchSys.readJSONFromLocalStorage(MENU_KEY);
        } catch (e) {
          stored = null;
        }
        if (!stored && sessionMenuList) {
          stored = { menuList: sessionMenuList, updatedAt: Date.now() };
          try { window.MatchSys.writeJSONToLocalStorage(MENU_KEY, stored); } catch (e) {}
        }
        const rawValue = stored && typeof stored === "object" && "menuList" in stored
          ? stored.menuList
          : stored;
        if (Array.isArray(rawValue)) return rawValue;
        if (rawValue === "*") return "*";
        let raw = rawValue == null ? "" : String(rawValue);
        if (!raw) return [];
        if (raw === "*") return "*";
        try {
          const parsed = JSON.parse(raw);
          if (parsed === "*") return "*";
          if (Array.isArray(parsed)) return parsed;
          if (typeof parsed === "string") {
            const nested = parsed.trim();
            if (nested === "*") return "*";
            if (nested.startsWith("[") && nested.endsWith("]")) {
              try {
                const nestedParsed = JSON.parse(nested);
                if (Array.isArray(nestedParsed)) return nestedParsed;
              } catch (e) {}
            }
            return nested ? [nested] : [];
          }
        } catch (e) {}
        const trimmed = raw.trim();
        if (trimmed.startsWith("[") && trimmed.endsWith("]")) {
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed)) return parsed;
          } catch (e) {}
        }
        return trimmed ? [trimmed] : [];
      };
      const buildAllowedMenuSet = () => {
        const menuList = readMenuList();
        if (menuList === "*") return null;
        if (Array.isArray(menuList) && menuList.includes("*")) return null;
        return new Set(menuList.map(normalizeMenuItem).filter(Boolean));
      };
      const allowedMenuSet = buildAllowedMenuSet();
      const fallbackRoute = "profile.html";
      const bulkMailRoute = "bulk_email.html";
      const workflowRoutes = new Set([bulkMailRoute, sendTaskRoute, "songxin.html", "bpsongxin.html"]);
      const isAllowedRoute = (src) => {
        if (!allowedMenuSet) return true;
        const normalized = normalizeMenuItem(src);
        if (normalized === fallbackRoute) return true;
        // 个人信息页快捷入口不依赖左侧菜单节点。
        if (normalized === "myattendance.html" || normalized === "finance/my_salary.html") return true;
        // “我的邮件”通过顶部入口访问，不依赖左侧菜单权限列表。
        if (normalized === noticeRoute) return true;
        if (workflowRoutes.has(normalized)) return true;
        return allowedMenuSet.has(normalized);
      };
      if (sendTaskPopoverFoot) {
        sendTaskPopoverFoot.hidden = !isAllowedRoute(sendHistoryRoute);
      }
      const applyMenuFilter = () => {
        if (!allowedMenuSet) return;
        links.forEach((link) => {
          const src = normalizeMenuItem(link.getAttribute("data-src"));
          const isHome = src === "home.html";
          const allowed = isHome || allowedMenuSet.has(src);
          const item = link.closest("li");
          if (item) {
            item.style.display = allowed ? "" : "none";
          }
          link.setAttribute("aria-hidden", String(!allowed));
        });
      };

      const setActive = (src) => {
        const route = normalizeMenuItem(src);
        for (const a of links) {
          a.classList.toggle("active", (a.getAttribute("data-src") || "") === route);
        }
      };

      const setSubtitle = (src) => {
        if (!pageSubtitle) return;
        const route = normalizeMenuItem(src);
        const match = links.find((a) => (a.getAttribute("data-src") || "") === route);
        let label = match
          ? (match.getAttribute("data-title") || match.getAttribute("title") || match.textContent).trim()
          : (i18n ? i18n.t("nav.home") : "主页");
        if (!match && route === noticeRoute) {
          label = "我的邮件";
        }
        if (!match && route === bulkMailRoute) {
          label = i18n ? i18n.t("customer.bulk.title") : "群发邮件";
        }
        if (!match && route === "myattendance.html") {
          label = i18n ? i18n.t("nav.my_attendance") : "我的考勤";
        }
        if (!match && route === sendTaskRoute) {
          label = i18n ? i18n.t("sendtask.title") : "发送任务";
        }
        if (!match && route === "finance/my_salary.html") {
          label = i18n ? i18n.t("nav.my_salary") : "我的薪资";
        }
        if (!match && (route === "songxin.html" || route === "bpsongxin.html")) {
          label = i18n ? i18n.t("songxin.title") : "送信页";
        }
        pageSubtitle.textContent = `· ${label}`;
        return label;
      };

      const broadcastLang = () => {
        const lang = i18n ? i18n.getLang() : "zh-CN";
        syncFrameLang(lang);
      };

      const applyRoute = (src) => {
        const route = normalizeAppRoute(src);
        if (!route) return;
        setActive(route);
        const label = setSubtitle(route);
        if (normalizeAppRoute(frame.getAttribute("src") || "") !== route) {
          frame.src = route;
          frame.setAttribute("title", label || route);
        }
      };

      const resolveFromHash = () => {
        const raw = normalizeAppRoute(location.hash || "");
        if (!raw) return null;
        return raw || null;
      };

      const syncFromHash = () => {
        let src = resolveFromHash() || fallbackRoute;
        if (!isAllowedRoute(src)) {
          src = fallbackRoute;
          if (location.hash !== "#" + src) {
            location.hash = src;
            return;
          }
        }
        applyRoute(src);
      };

      const handleRouteClick = (event) => {
        if (!nav) return;
        const target = event.target && event.target.closest ? event.target.closest("a[data-src]") : null;
        if (!target) return;
        if (!(nav.contains(target) || target.classList.contains("avatar"))) return;
        event.preventDefault();
        const src = normalizeAppRoute(target.getAttribute("data-src"));
        if (!src) return;
        if (location.hash !== "#" + src) {
          location.hash = src;
        } else {
          applyRoute(src);
        }
      };

      initLang();
      applyMenuFilter();

      if (nav) {
        nav.addEventListener("click", handleRouteClick);
      }
      document.addEventListener("click", handleRouteClick);
      // 使用 common.js 统一轮询，每 5 分钟刷新一次顶部角标。
      const topbarBadgePolling = window.startTopbarBadgePolling
        ? window.startTopbarBadgePolling({
          intervalMs: 5 * 60 * 1000,
          onData: applyTopbarBadges,
        })
        : null;
      window.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.type === "route:change") {
          const src = normalizeAppRoute(data.src || "");
          if (!src || !isAllowedRoute(src)) return;
          if (location.hash !== "#" + src) {
            location.hash = src;
          } else {
            applyRoute(src);
          }
          return;
        }
        if (data.type === "mail:mark-read") {
          markNoticeRead();
          return;
        }
        if (data.type === "topbar-badges:refresh") {
          const sendTasksCount = Number(data.send_tasks_count);
          if (Number.isFinite(sendTasksCount) && sendTasksCount > 0) {
            setSendTaskBadge(sendTasksCount);
            return;
          }
          if (typeof window.refreshTopbarBadges === "function") {
            window.refreshTopbarBadges();
          }
        }
      });
      window.addEventListener("hashchange", syncFromHash);
      if (frame) {
        syncFromHash();
        frame.addEventListener("load", broadcastLang);
      }
      loadSystemExpiryStatus();
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          if (topbarBadgePolling && typeof topbarBadgePolling.tick === "function") {
            topbarBadgePolling.tick();
          }
          loadSystemExpiryStatus();
        }
      });
    });
  </script>
</body>
</html>
