<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="login.title">系统登录 - IT营业管理系统</title>
</head>
<body class="c-form-page c-center-page">
<div class="login-card c-card c-card-pad c-auth-card">
    <div class="login-lang">
        <div class="c-switcher-group lang-switch" role="group" aria-label="语言切换">
            <button class="c-toggle" type="button" data-lang="zh-CN" aria-pressed="true">中文</button>
            <button class="c-toggle" type="button" data-lang="ja" aria-pressed="false">日本語</button>
        </div>
    </div>
    <div>
        <h1 class="brand-title c-brand-title" data-i18n="brand.title">IT营业管理系统</h1>
        <p class="brand-subtitle c-brand-subtitle" data-i18n="brand.subtitle">IT Business Management System</p>
    </div>

    <form id="loginForm" method="post" action="javascript:void(0);">
        <div id="errorBox" class="error-box hidden"></div>
        <div class="form-grid form-grid-single">
            <div class="form-field">
                <label data-i18n="common.field.account">账号</label>
                <input id="userName" type="text" name="user_name" required>
            </div>
            <div class="form-field">
                <label data-i18n="login.password">密码</label>
                <input id="password" type="password" name="password" required>
            </div>
        </div>
        <div id="activationBox" class="hidden activation-panel">
            <div class="activation-header">
                <span class="activation-title" data-i18n="login.activation">激活码</span>
                <span class="activation-note" data-i18n="login.activation_hint">请输入激活码</span>
            </div>
            <div class="form-grid form-grid-single">
                <div class="form-field">
                    <input id="activationCode" type="text" autocomplete="off" data-i18n-placeholder="login.activation_hint" placeholder="请输入激活码">
                    <div id="activationMessage" class="hint"></div>
                </div>
            </div>
            <div class="form-actions">
                <button id="activationSubmit" type="button" class="c-btn c-btn-secondary c-btn-block" data-i18n="login.activation_submit">
                    提交激活码
                </button>
            </div>
        </div>
        <div class="form-actions">
            <button id="submitBtn" type="submit" class="c-btn c-btn-primary c-btn-block" data-i18n="login.submit">
                登 录
            </button>
        </div>
    </form>
</div>
<script src="./i18n.js"></script>
<script src="./common.js"></script>
<script>
    if (window.top && window.top !== window) {
        window.top.location.href = window.location.href;
    }
    const API_BASE = "";
    const LOGIN_ENDPOINT = `${API_BASE}/api/login`;
    const ACTIVATION_ENDPOINT = `${API_BASE}/api/activation`;
    const ACTIVATION_STATUS_ENDPOINT = `${API_BASE}/api/activation/status`;
    const LANG_KEY = "app_lang";
    const ROLE_KEY = "app_role_id";
    const MENU_KEY = "app_menu_list";
    const EMPLOYEE_ID_KEY = "app_employee_id";
    const EMPLOYEE_NAME_KEY = "app_employee_name";
    const EMPLOYEE_POSITION_KEY = "app_employee_position_name";

    const getI18n = () => window.I18N || null;
    const t = (key) => {
        const i18n = getI18n();
        return i18n ? i18n.t(key) : key;
    };

    const start = () => {
        const langButtons = Array.from(document.querySelectorAll(".lang-switch [data-lang]"));
        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("errorBox");
        const submitBtn = document.getElementById("submitBtn");
        const activationBox = document.getElementById("activationBox");
        const activationInput = document.getElementById("activationCode");
        const activationSubmit = document.getElementById("activationSubmit");
        const activationMessage = document.getElementById("activationMessage");

        const storeLang = (lang) => {
            try {
                localStorage.setItem(LANG_KEY, lang);
            } catch (e) {
            }
        };

        let submitStateKey = "login.submit";
        const updateSubmitText = (key) => {
            if (!submitBtn) return;
            submitStateKey = key || submitStateKey;
            submitBtn.setAttribute("data-i18n", submitStateKey);
            submitBtn.textContent = t(submitStateKey);
        };

        const applyLang = (lang) => {
            const i18n = getI18n();
            const safeLang = i18n ? i18n.setLang(lang) : lang;
            storeLang(safeLang);
            langButtons.forEach((button) => {
                const isActive = button.dataset.lang === safeLang;
                button.classList.toggle("is-active", isActive);
                button.setAttribute("aria-pressed", String(isActive));
            });
            if (i18n && typeof i18n.apply === "function") {
                i18n.apply();
            }
            updateSubmitText(submitStateKey);
        };

        const initLang = () => {
            const i18n = getI18n();
            const current = i18n ? i18n.init() : "zh-CN";
            applyLang(current);
        };

        langButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const lang = button.dataset.lang || "zh-CN";
                applyLang(lang);
            });
        });

        const updateActivationMessage = (message, isError) => {
            if (!activationMessage) return;
            activationMessage.textContent = message;
            activationMessage.style.color = isError ? "var(--danger)" : "var(--muted)";
        };

        const showActivationBox = () => {
            if (activationBox) {
                activationBox.classList.remove("hidden");
            }
        };

        const shouldShowActivation = () => {
            const params = new URLSearchParams(window.location.search);
            return params.get("activation") === "1";
        };

        const checkActivationStatus = async () => {
            try {
                const res = await fetch(ACTIVATION_STATUS_ENDPOINT, { credentials: "include" });
                const data = await res.json();
                const payload = normalizeApiResponse(data);
                if (payload && payload.data && payload.data.valid === false) {
                    showActivationBox();
                }
            } catch (e) {
            }
        };

        if (activationSubmit) {
            activationSubmit.addEventListener("click", async () => {
                if (!activationInput) return;
                const code = activationInput.value.trim();
                if (!code) {
                    updateActivationMessage(t("login.activation_hint"), true);
                    return;
                }
                activationSubmit.disabled = true;
                updateActivationMessage("");
                try {
                    const res = await fetch(ACTIVATION_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        credentials: "include",
                        body: JSON.stringify({ code }),
                    });
                    const data = await res.json();
                    const payload = normalizeApiResponse(data);
                    if (!res.ok || !payload.success) {
                        throw new Error(t("login.activation_failed"));
                    }
                    updateActivationMessage(t("login.activation_success"), false);
                    const url = new URL(window.location.href);
                    url.searchParams.delete("activation");
                    window.location.href = url.toString();
                } catch (err) {
                    updateActivationMessage(t("login.activation_failed"), true);
                } finally {
                    activationSubmit.disabled = false;
                }
            });
        }

        if (form) {
            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                if (errorBox) {
                    errorBox.classList.add("hidden");
                    errorBox.textContent = "";
                }
                if (submitBtn) submitBtn.disabled = true;
                updateSubmitText("login.submitting");

                try {
                    const res = await fetch(LOGIN_ENDPOINT, {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify({
                            user_name: document.getElementById("userName").value.trim(),
                            password: document.getElementById("password").value,
                        }),
                    });
                    const data = await res.json();
                    const payload = normalizeApiResponse(data);
                    if (!res.ok || !payload.success) {
                        const apiMessage = (payload && payload.message) || "";
                        if (res.status === 403 || apiMessage === "Activation required") {
                            showActivationBox();
                            if (errorBox) {
                                errorBox.textContent = t("login.activation_failed");
                                errorBox.classList.remove("hidden");
                            }
                            return;
                        }
                        throw new Error(t("login.failed"));
                    }
                    const loginData = payload.data || {};
                    const roleId = loginData.role_id ?? loginData.roleId ?? "";
                    const employeeId = loginData.employee_id ?? loginData.employeeId ?? "";
                    const employeeName = loginData.employee_name ?? loginData.employeeName ?? loginData.name ?? loginData.user_name ?? loginData.userName ?? "";
                    const employeePositionName = loginData.employee_position_name ?? loginData.employeePositionName ?? loginData.position_name ?? loginData.positionName ?? "";
                    let menuList = loginData.menu_list ?? loginData.menuList ?? "";
                    if (menuList === "*") {
                        menuList = ["*"];
                    } else if (Array.isArray(menuList)) {
                        if (menuList.includes("*")) {
                            menuList = ["*"];
                        }
                    } else if (typeof menuList === "string") {
                        try {
                            const parsed = JSON.parse(menuList);
                            if (parsed === "*") {
                                menuList = ["*"];
                            } else if (Array.isArray(parsed)) {
                                menuList = parsed.includes("*") ? ["*"] : parsed;
                            }
                        } catch (e) {
                        }
                    }
                    try {
                        if (roleId !== "" && roleId !== null && roleId !== undefined) {
                            localStorage.setItem(ROLE_KEY, String(roleId));
                        } else {
                            localStorage.removeItem(ROLE_KEY);
                        }
                        if (menuList !== "" && menuList !== null && menuList !== undefined) {
                            if (Array.isArray(menuList)) {
                                localStorage.setItem(MENU_KEY, JSON.stringify(menuList));
                            } else {
                                localStorage.setItem(MENU_KEY, String(menuList));
                            }
                        } else {
                            localStorage.removeItem(MENU_KEY);
                        }
                        if (employeeId !== "" && employeeId !== null && employeeId !== undefined) {
                            localStorage.setItem(EMPLOYEE_ID_KEY, String(employeeId));
                        } else {
                            localStorage.removeItem(EMPLOYEE_ID_KEY);
                        }
                        if (employeeName !== "" && employeeName !== null && employeeName !== undefined) {
                            localStorage.setItem(EMPLOYEE_NAME_KEY, String(employeeName));
                        } else {
                            localStorage.removeItem(EMPLOYEE_NAME_KEY);
                        }
                        if (employeePositionName !== "" && employeePositionName !== null && employeePositionName !== undefined) {
                            localStorage.setItem(EMPLOYEE_POSITION_KEY, String(employeePositionName));
                        } else {
                            localStorage.removeItem(EMPLOYEE_POSITION_KEY);
                        }
                    } catch (e) {
                    }
                    const target = "index.html".replace(/^\//, "");
                    const next = new URL(target, window.location.href);
                    let currentLang = "zh-CN";
                    try {
                        currentLang = localStorage.getItem(LANG_KEY) || currentLang;
                    } catch (e) {
                    }
                    const i18n = getI18n();
                    if (i18n && i18n.getLang) {
                        currentLang = i18n.getLang() || currentLang;
                    }
                    if (currentLang) {
                        next.searchParams.set("lang", currentLang);
                    }
                    window.location.href = next.toString();
                } catch (err) {
                    if (errorBox) {
                    errorBox.textContent = t("login.failed");
                        errorBox.classList.remove("hidden");
                    }
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                    updateSubmitText("login.submit");
                }
            });
        }

        initLang();
        updateSubmitText("login.submit");
        if (shouldShowActivation()) {
            showActivationBox();
        } else {
            checkActivationStatus();
        }
    };

    start();
</script>
</body>
</html>
