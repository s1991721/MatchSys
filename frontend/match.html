<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">

    <meta charset="UTF-8">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="match.title">Match</title>
</head>
<body>
<div class="page page-wide c-stack match-page">
    <div class="c-page-head-grid">
        <div class="c-page-head-spacer" aria-hidden="true"></div>
        <div class="c-switch-wrap order-page">
            <div class="c-switcher-group" role="tablist" aria-label="模式切换" data-i18n-aria="match.view_switch">
                <button class="c-toggle is-active" type="button" role="tab" aria-selected="true" data-view="people"
                        data-i18n="match.tab.people">找案件
                </button>
                <button class="c-toggle" type="button" role="tab" aria-selected="false" data-view="cases"
                        data-i18n="match.tab.cases">找人
                </button>
            </div>
        </div>
        <div class="c-page-head-spacer" aria-hidden="true"></div>
    </div>

    <div class="content-grid">
        <div class="match-sticky-column">
            <section class="c-card c-card-pad match-view" data-view="people">
                <h2 class="title c-panel-title" data-i18n="match.form.people_title">技术者信息</h2>
                <div class="form-grid form-grid-spaced">
                    <div class="form-field">
                        <label for="nation" data-i18n="common.field.nationality">国籍</label>
                        <select id="nation">
                            <option value="" data-i18n="common.select">请选择</option>
                            <option value="0" data-i18n="common.field.nationality.jp">日本籍</option>
                            <option value="1" data-i18n="common.field.nationality.other">外国籍</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="age" data-i18n="common.field.age">年龄</label>
                        <input id="age" type="number" placeholder="例如：32"
                               data-i18n-placeholder="common.field.age_placeholder">
                    </div>
                    <div class="form-field">
                        <label for="price" data-i18n="common.field.amount">金额</label>
                        <input id="price" type="text" placeholder="例如：￥50,000"
                               data-i18n-placeholder="common.field.amount_placeholder">
                    </div>
                    <div class="form-field">
                        <label for="resume-file" data-i18n="match.form.resume">技术者简历</label>
                        <input id="resume-file" type="file" name="ssFile"
                               accept=".pdf,.doc,.docx,.jpg,.png,.jpeg,.xls,.xlsx"/>
                        <div id="resume-source" class="hint" hidden></div>
                    </div>
                    <div class="form-field full">
                        <label for="intro" data-i18n="common.field.intro">介绍文</label>
                        <textarea id="intro" rows="10" placeholder="请输入人员介绍、技能或补充说明。"
                                  data-i18n-placeholder="common.field.intro_placeholder"></textarea>
                    </div>
                </div>
                <div class="c-filter-actions-bar">
                    <div class="c-filter-actions-left"></div>
                    <div class="c-filter-actions-right">
                        <button class="c-btn c-btn-ghost js-reset" type="button" data-i18n="common.clear">清空</button>
                        <button class="c-btn c-btn-primary js-search" type="button" data-i18n="common.search">搜索
                        </button>
                    </div>
                </div>
            </section>

            <section class="c-card c-card-pad match-view hidden" data-view="cases">
                <h2 class="title c-panel-title" data-i18n="match.form.case_title">案件信息</h2>
                <div class="form-grid form-grid-single form-grid-spaced">
                    <div class="form-field">
                        <label for="case-info" data-i18n="match.form.case_info">案件信息</label>
                        <textarea id="case-info" rows="10" placeholder="请输入案件信息。"
                                  data-i18n-placeholder="match.form.case_info_placeholder"></textarea>
                    </div>
                </div>
                <div class="c-filter-actions-bar">
                    <div class="c-filter-actions-left"></div>
                    <div class="c-filter-actions-right">
                        <button class="c-btn c-btn-ghost js-reset" type="button" data-i18n="common.clear">清空</button>
                        <button class="c-btn c-btn-primary js-search" type="button" data-i18n="common.search">搜索
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <section class="c-card c-card-pad">
            <div class="c-stack">
                <div>
                    <h2 class="title c-panel-title" id="list-title" data-i18n="match.jobs">案件列表</h2>
                    <div class="filters c-filter-grid">
                        <div class="filter-group c-filter-group">
                            <span class="filter-label c-filter-label" data-i18n="common.field.time">时间</span>
                            <div class="chip-row c-chip-row">
                                <button class="chip c-chip active" data-range="all" type="button"
                                        data-i18n="common.all">全部
                                </button>
                                <button class="chip c-chip" data-range="today" type="button"
                                        data-i18n="common.range.today">今天
                                </button>
                                <button class="chip c-chip" data-range="yesterday" type="button"
                                        data-i18n="common.range.yesterday">昨天
                                </button>
                            </div>
                        </div>
                        <div class="filter-group c-filter-group sender-group">
                            <span class="filter-label c-filter-label" data-i18n="match.sender">发件人</span>
                            <input id="sender-input" class="input c-input" type="search" placeholder="搜索发件人"
                                   data-i18n-placeholder="match.sender_placeholder">
                        </div>
                    </div>
                    <ul id="case-list" class="list c-list match-list">
                    </ul>
                </div>

                <div>
                    <div class="title c-panel-title detail-title-row">
                        <span id="detail-title" data-i18n="match.case_detail">案件详情</span>
                        <div class="mail-feedback-control detail-feedback-control" id="detail-feedback-control">
                            <button class="mail-feedback-btn" type="button" id="detail-feedback-btn"
                                    data-detail-feedback-toggle="1" data-i18n-title="match.feedback.trigger"
                                    data-i18n-aria="match.feedback.trigger" title="提交错误" aria-label="提交错误">
                                !
                            </button>
                            <div class="mail-feedback-popover" id="detail-feedback-popover">
                                <div class="mail-feedback-title" data-i18n="match.detail_feedback.title">识别内容错误</div>
                                <label class="mail-feedback-option">
                                    <input type="radio" name="detail-feedback-category" value="keyword_missing">
                                    <span data-i18n="match.detail_feedback.option.keyword_missing">识别关键词缺失</span>
                                </label>
                                <label class="mail-feedback-option">
                                    <input type="radio" name="detail-feedback-category" value="country_wrong">
                                    <span data-i18n="match.detail_feedback.option.country_wrong">识别国籍错误</span>
                                </label>
                                <div class="mail-feedback-actions">
                                    <button class="c-btn c-btn-ghost c-btn-sm" type="button" data-detail-feedback-cancel="1"
                                            data-i18n="common.cancel">取消</button>
                                    <button class="c-btn c-btn-primary c-btn-sm" type="button"
                                            data-detail-feedback-submit="1" data-i18n="match.feedback.submit">提交</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="case-detail" class="detail">
                        这是案件1的详细说明……ABCDEFG1234567890不想超出屏幕会自动换行。
                    </div>
                    <div class="c-page-subtitle songxinhistory-section-title"
                         data-i18n="songxinhistory.detail.attachments">附件
                    </div>
                    <div id="detail-attachments" class="c-chip-row songxinhistory-attachments">
                        <div class="songxin-empty-tip" data-i18n="common.empty.attachments">暂无附件</div>
                    </div>
                    <div class="detail-actions">
                        <button class="c-btn c-btn-primary" type="button" id="send-btn" data-i18n="match.send">送信
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
    const i18n = window.I18N;
    const t = (key, fallback) => (i18n ? i18n.t(key) : (fallback || key));

    const list = document.getElementById('case-list');
    const detail = document.getElementById('case-detail');
    const detailAttachments = document.getElementById('detail-attachments');
    const senderInput = document.getElementById('sender-input');
    const dateButtons = Array.from(document.querySelectorAll('.chip[data-range]'));
    const viewButtons = Array.from(document.querySelectorAll('.c-toggle[data-view]'));
    const views = Array.from(document.querySelectorAll('.match-view'));
    const resetButtons = Array.from(document.querySelectorAll('.js-reset'));
    const searchButtons = Array.from(document.querySelectorAll('.js-search'));
    const listTitle = document.getElementById('list-title');
    const detailTitle = document.getElementById('detail-title');
    const detailFeedbackControl = document.getElementById('detail-feedback-control');
    const detailFeedbackButton = document.getElementById('detail-feedback-btn');
    const nationSelect = document.getElementById('nation');
    const ageInput = document.getElementById('age');
    const priceInput = document.getElementById('price');
    const resumeFileInput = document.getElementById('resume-file');
    const resumeSource = document.getElementById('resume-source');
    const introInput = document.getElementById('intro');
    const caseInfoInput = document.getElementById('case-info');
    const sendBtn = document.getElementById('send-btn');
    const pageStateKey = 'match_page_state';
    const resumeState = {
        prefill: null,
        manualFile: null
    };
    const filters = {
        range: 'all'
    };
    const viewInputs = {
        people: ['nation', 'age', 'price', 'intro'],
        cases: ['case-info']
    };
    let senderTimer = null;
    let openFeedbackId = '';
    let detailFeedbackOpen = false;
    let currentItems = [];
    const detailFeedbackSubmitted = {
        people: new Set(),
        cases: new Set()
    };
    const detailFeedbackWrongTypes = {
        country_wrong: 2,
        keyword_missing: 3
    };
    const sanitize = window.escapeHtml;

    viewButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            openFeedbackId = '';
            setDetailFeedbackOpen(false);
            setView(btn.dataset.view);
            fetchCases();
        });
    });

    resumeFileInput.addEventListener('change', () => {
        const file = resumeFileInput.files && resumeFileInput.files[0] ? resumeFileInput.files[0] : null;
        resumeState.manualFile = file;
        renderResumeSource();
    });

    const clearActiveResume = () => {
        const activeResume = getActiveResume();
        if (!activeResume) return;
        if (activeResume.source === 'manual') {
            resumeState.manualFile = null;
            if (resumeFileInput) {
                resumeFileInput.value = '';
            }
        } else {
            resumeState.prefill = null;
        }
        renderResumeSource();
    };

    resumeSource.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action="remove-resume"]');
        if (!target) return;
        clearActiveResume();
    });

    resetButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const view = getActiveView();
            const ids = viewInputs[view];
            const elements = ids.map(id => document.getElementById(id)).filter(Boolean);
            elements.forEach(el => {
                el.value = '';
            });
            if (view === 'people' && resumeFileInput) {
                resumeFileInput.value = '';
                resumeState.manualFile = null;
                renderResumeSource();
            }
            if (elements[0]) {
                elements[0].focus();
            }
            fetchCases();
        });
    });

    searchButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            fetchCases();
        });
    });

    dateButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            dateButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filters.range = btn.dataset.range;
            openFeedbackId = '';
            setDetailFeedbackOpen(false);
            fetchCases();
        });
    });

    senderInput.addEventListener('input', () => {
        if (senderTimer) {
            window.clearTimeout(senderTimer);
        }
        senderTimer = window.setTimeout(() => {
            fetchCases();
        }, 400);
    });

    const readMatchedSkills = (item) => {
        const raw = item?.dataset?.matchedSkills;
        if (!raw) return [];
        try {
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed.map((v) => String(v)) : [];
        } catch {
            return [];
        }
    };

    const parseDatasetJSON = (el, key) => {
        if (!el || !el.dataset) return null;
        const raw = el.dataset[key];
        if (!raw) return null;
        try {
            return JSON.parse(raw);
        } catch {
            return null;
        }
    };

    const buildAttachmentUrl = (file = {}) => {
        const messageId = encodeURIComponent(String(file.message_id || '').trim());
        const attachmentId = encodeURIComponent(String(file.attachment_id || '').trim());
        if (!messageId || !attachmentId) return '';
        const params = new URLSearchParams();
        const mimeType = String(file.mime_type || '').toLowerCase();
        if (mimeType === 'application/pdf' || mimeType.startsWith('image/')) {
            params.set('disposition', 'inline');
        }
        const query = params.toString();
        return `/api/gmail/messages/${messageId}/attachments/${attachmentId}${query ? `?${query}` : ''}`;
    };

    const renderAttachments = (files = []) => {
        if (!detailAttachments) return;
        if (!Array.isArray(files) || !files.length) {
            detailAttachments.innerHTML = `<div class="songxin-empty-tip">${t('common.empty.attachments')}</div>`;
            return;
        }
        const items = files
            .filter(file => file && file.filename && file.attachment_id && file.message_id)
            .map((file) => {
                const url = buildAttachmentUrl(file);
                const name = sanitize(String(file.filename || 'attachment'));
                return `<a class="c-chip" href="${sanitize(url)}" target="_blank" rel="noopener noreferrer">${name}</a>`;
            });
        detailAttachments.innerHTML = items.length
            ? items.join('')
            : `<div class="songxin-empty-tip">${t('common.empty.attachments')}</div>`;
    };

    list.addEventListener('click', async (e) => {
        const toggleBtn = e.target.closest('[data-feedback-toggle]');
        if (toggleBtn) {
            e.stopPropagation();
            const itemId = String(toggleBtn.dataset.itemId || '');
            openFeedbackId = openFeedbackId === itemId ? '' : itemId;
            renderList(currentItems, {preserveSelection: true});
            return;
        }

        const cancelBtn = e.target.closest('[data-feedback-cancel]');
        if (cancelBtn) {
            e.stopPropagation();
            openFeedbackId = '';
            renderList(currentItems, {preserveSelection: true});
            return;
        }

        const submitBtn = e.target.closest('[data-feedback-submit]');
        if (submitBtn) {
            e.stopPropagation();
            const wrapper = submitBtn.closest('.mail-feedback-control');
            const item = submitBtn.closest('.item');
            const itemId = String(item?.dataset?.id || '');
            const selected = wrapper?.querySelector('input[type="radio"]:checked')?.value || '';
            if (!selected) {
                alert(t('match.feedback.select_expected'));
                return;
            }
            try {
                await window.requestJson('/api/wrong-mails', {
                    body: JSON.stringify({
                        id: itemId,
                        wrong_label: getCurrentWrongLabel(),
                        correct_label: Number(selected)
                    })
                }, {
                    throwOnFailure: true,
                    fallbackMessage: t("common.load_failed")
                });
                removeItemFromCurrentList(itemId);
            } catch (err) {
                alert(`${t("common.load_failed")}：${err.message}`);
            }
            return;
        }

        const item = e.target.closest('.item');
        if (!item) return;
        list.querySelectorAll('.item').forEach(li => li.classList.remove('active'));
        item.classList.add('active');
        renderDetail(detail, item.dataset.detail || '', readMatchedSkills(item));
        renderAttachments(parseDatasetJSON(item, 'files') || []);
        setDetailFeedbackOpen(false);
        updateDetailFeedbackState();
    });

    const getActiveView = () => {
        const active = document.querySelector('.match-view:not(.hidden)');
        return active ? active.dataset.view : 'people';
    };

    const readFileAsBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const result = reader.result || '';
            const base64 = typeof result === 'string' && result.includes(',')
                ? result.split(',').pop()
                : result;
            resolve(base64);
        };
        reader.onerror = () => reject(reader.error || new Error('file read failed'));
        reader.readAsDataURL(file);
    });

    const readPageState = () => ({
        view: getActiveView(),
        range: filters.range || 'all',
        nation: nationSelect ? nationSelect.value : '',
        age: ageInput ? ageInput.value : '',
        price: priceInput ? priceInput.value : '',
        intro: introInput ? introInput.value : '',
        caseInfo: caseInfoInput ? caseInfoInput.value : '',
        sender: senderInput ? senderInput.value : '',
        resumePrefill: resumeState.prefill || null,
        updatedAt: Date.now()
    });

    const persistPageState = () => {
        try {
            window.MatchSys.writeJSONToSessionStorage(pageStateKey, readPageState());
        } catch (error) {
        }
    };

    sendBtn.addEventListener('click', async () => {
        try {
            const activeItem = list?.querySelector('.item.active');
            if (!activeItem) {
                alert(t('match.send_tip'));
                return;
            }

            const view = getActiveView();
            const itemData = parseDatasetJSON(activeItem, 'item') || {};
            const itemTitle = itemData.title || activeItem.querySelector('.item-title')?.textContent.trim() || '';
            const itemAddress = itemData.address || '';
            const itemDetail = itemData.detail || activeItem.dataset.detail || '';
            const itemDate = itemData.date || activeItem.querySelector('.item-time')?.textContent.trim() || '';

            let jobPayload = {};
            let personPayload = {};
            let mailType = 2;
            let resumeAttachment = null;

            if (view === 'people') {
                const nationLabel = nationSelect ? nationSelect.options[nationSelect.selectedIndex]?.textContent.trim() : '';

                jobPayload = {
                    id: itemData.id || activeItem.dataset.id || '',
                    title: itemTitle,
                    address: itemAddress,
                    cc: itemData.cc || '',
                    detail: itemDetail,
                    time: itemDate
                };

                personPayload = {
                    country: nationSelect ? nationSelect.value.trim() : '',
                    country_label: nationLabel || '',
                    age: ageInput ? ageInput.value.trim() : '',
                    price: priceInput ? priceInput.value.trim() : '',
                    intro: introInput ? introInput.value.trim() : '',
                };

                const activeResume = getActiveResume();
                if (activeResume) {
                    if (activeResume.source === 'manual' && activeResume.file) {
                        resumeAttachment = {
                            source: 'manual',
                            filename: activeResume.file.name || 'resume',
                            content_type: activeResume.file.type || 'application/octet-stream',
                            size: activeResume.file.size || 0,
                            base64: await readFileAsBase64(activeResume.file)
                        };
                    } else {
                        resumeAttachment = {
                            source: 'people',
                            filename: activeResume.name || 'resume',
                            url: activeResume.url || '',
                            path: activeResume.path || '',
                            content_type: 'application/octet-stream'
                        };
                    }
                }

                mailType = 1;
            } else {
                const rawCaseInfo = caseInfoInput ? caseInfoInput.value.trim() : '';

                jobPayload = {
                    detail: rawCaseInfo,
                };

                personPayload = {
                    id: itemData.id || activeItem.dataset.id || '',
                    name: itemTitle,
                    subject: itemTitle,
                    address: itemAddress,
                    cc: itemData.cc || '',
                    detail: itemDetail,
                    time: itemDate
                };

                mailType = 2;
            }

            const payload = {
                job: jobPayload,
                person: personPayload,
                resume_attachment: resumeAttachment,
                mail_type: mailType,
                updatedAt: Date.now()
            };

            persistPageState();
            window.MatchSys.writeJSONToLocalStorage('matchSelection', payload);
        } catch (err) {
            console.error(t('match.cache_failed') || '保存失败', err);
            alert(err?.message || t('match.cache_failed'));
            return;
        }

        window.navigateAppRoute('songxin.html?from=match');
    });

    if (i18n) {
        i18n.init();
        i18n.apply();
    }

    if (window && window.addEventListener) {
        window.addEventListener("i18n:change", () => {
            if (i18n) {
                i18n.apply();
            }
            renderResumeSource();
            updateDetailFeedbackState();
        });
    }

    const escapeRegExp = (str = '') => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    const stripCssNoise = (text = '') => {
        if (!text) return '';
        const firstGap = text.indexOf('\n\n');
        const hasBraces = text.slice(0, Math.max(firstGap, 120)).includes('{');
        if (firstGap >= 0 && hasBraces) {
            return text.slice(firstGap + 2);
        }
        return text;
    };

    const renderDetail = (target, text = '', highlights = []) => {
        if (!target) return;
        const cleaned = stripCssNoise(text || '');
        const normalized = cleaned
            .replace(/\r\n/g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
        const escapedHighlights = (Array.isArray(highlights) ? highlights : [])
            .filter(Boolean)
            .map(v => sanitize(String(v)))
            .map(escapeRegExp);
        const highlightRegex = escapedHighlights.length
            ? new RegExp(`(${escapedHighlights.join('|')})`, 'gi')
            : null;
        const applyHighlight = (val) =>
            highlightRegex ? val.replace(highlightRegex, '<mark class="skill-highlight">$1</mark>') : val;
        const html = sanitize(normalized)
            .split(/\n{2,}/)
            .filter(Boolean)
            .map(block => `<p>${applyHighlight(block.replace(/\n/g, '<br>'))}</p>`)
            .join('');
        target.innerHTML = html || `<p class="match-empty-inline">${t('match.empty')}</p>`;
    };

    const getCurrentWrongLabel = () => getActiveView() === 'cases' ? 1 : 0;

    const getCurrentFeedbackOptions = () => getActiveView() === 'cases'
        ? [
            {value: 0, label: t('match.feedback.option.project')},
            {value: -1, label: t('match.feedback.option.other')}
        ]
        : [
            {value: 1, label: t('match.feedback.option.technician')},
            {value: -1, label: t('match.feedback.option.other')}
        ];

    const getActiveItemId = () => String(list?.querySelector('.item.active')?.dataset?.id || '');

    const setDetailFeedbackOpen = (isOpen) => {
        detailFeedbackOpen = Boolean(isOpen);
        detailFeedbackControl?.classList.toggle('is-open', detailFeedbackOpen);
        detailFeedbackControl?.querySelector('.mail-feedback-popover')?.classList.toggle('is-visible', detailFeedbackOpen);
        if (detailFeedbackOpen) {
            scheduleFeedbackControlPlacement(detailFeedbackControl);
        }
    };

    const updateDetailFeedbackState = () => {
        const view = getActiveView();
        const activeId = getActiveItemId();
        const isSubmitted = Boolean(activeId && detailFeedbackSubmitted[view]?.has(activeId));
        detailFeedbackButton?.classList.toggle('is-submitted', isSubmitted);
        if (detailFeedbackButton) {
            const label = isSubmitted ? t('match.detail_feedback.submitted') : t('match.feedback.trigger');
            detailFeedbackButton.title = label;
            detailFeedbackButton.setAttribute('aria-label', label);
        }
    };

    const submitDetailFeedback = async () => {
        const itemId = getActiveItemId();
        if (!itemId) {
            alert(getActiveView() === 'cases' ? t('match.empty_person_detail') : t('match.empty_job_detail'));
            return;
        }

        const selected = detailFeedbackControl?.querySelector('input[type="radio"]:checked')?.value || '';
        const wrongType = detailFeedbackWrongTypes[selected];
        if (!wrongType) {
            alert(t('match.detail_feedback.select_reason'));
            return;
        }

        try {
            await window.requestJson('/api/wrong-mails-detail', {
                body: JSON.stringify({
                    id: itemId,
                    wrong_label: getCurrentWrongLabel(),
                    wrong_type: wrongType
                })
            }, {
                throwOnFailure: true,
                fallbackMessage: t("common.load_failed")
            });
            detailFeedbackSubmitted[getActiveView()].add(itemId);
            detailFeedbackControl?.querySelectorAll('input[type="radio"]').forEach((input) => {
                input.checked = false;
            });
            setDetailFeedbackOpen(false);
            updateDetailFeedbackState();
        } catch (err) {
            alert(`${t("common.load_failed")}：${err.message}`);
        }
    };

    const removeItemFromCurrentList = (itemId) => {
        currentItems = currentItems.filter((item) => String(item.id) !== String(itemId));
        openFeedbackId = '';
        setDetailFeedbackOpen(false);
        renderList(currentItems);
    };

    const renderList = (items, options = {}) => {
        const preserveSelection = options.preserveSelection === true;
        const previousActiveId = preserveSelection ? getActiveItemId() : '';
        currentItems = Array.isArray(items) ? items : [];
        list.innerHTML = '';
        const view = getActiveView();

        if (!currentItems.length) {
            const empty = document.createElement('li');
            empty.className = 'empty';
            empty.textContent = view === 'cases' ? t('match.empty_people') : t('match.empty_jobs');
            list.appendChild(empty);
            renderDetail(detail, view === 'cases' ? t('match.empty_person_detail') : t('match.empty_job_detail'));
            renderAttachments([]);
            updateDetailFeedbackState();
            return;
        }

        currentItems.forEach((item, index) => {
            const li = document.createElement('li');
            const itemId = item.id || '';
            const isActive = preserveSelection
                ? String(itemId) === String(previousActiveId)
                : index === 0;
            li.className = 'item' + (isActive ? ' active' : '');
            li.dataset.detail = item.detail;
            li.dataset.id = itemId;
            li.dataset.item = JSON.stringify(item);
            li.dataset.files = JSON.stringify(item.files || []);
            if (item.matched_skills && Array.isArray(item.matched_skills)) {
                li.dataset.matchedSkills = JSON.stringify(item.matched_skills);
            }

            const main = document.createElement('div');
            main.className = 'item-main';

            const title = document.createElement('div');
            title.className = 'item-title';
            title.textContent = item.title;

            const desc = document.createElement('div');
            desc.className = 'item-desc';
            desc.textContent = item.address || '';

            const time = document.createElement('div');
            time.className = 'item-time';
            time.textContent = window.formatDate(item.date);

            const feedbackControl = document.createElement('div');
            feedbackControl.className = `mail-feedback-control${openFeedbackId === String(itemId) ? ' is-open' : ''}`;

            const feedbackButton = document.createElement('button');
            feedbackButton.type = 'button';
            feedbackButton.className = 'mail-feedback-btn';
            feedbackButton.dataset.feedbackToggle = '1';
            feedbackButton.dataset.itemId = itemId;
            feedbackButton.title = t('match.feedback.trigger');
            feedbackButton.setAttribute('aria-label', feedbackButton.title);
            feedbackButton.innerHTML = '!';

            const feedbackDesc = view === 'cases'
                ? t('match.feedback.person_desc')
                : t('match.feedback.desc');
            const feedbackOptions = getCurrentFeedbackOptions()
                .map((option) => `
                    <label class="mail-feedback-option">
                        <input type="radio" name="feedback-category-${sanitize(String(itemId))}" value="${option.value}">
                        <span>${sanitize(option.label)}</span>
                    </label>
                `)
                .join('');

            const feedbackPopover = document.createElement('div');
            feedbackPopover.className = `mail-feedback-popover${openFeedbackId === String(itemId) ? ' is-visible' : ''}`;
            feedbackPopover.innerHTML = `
                <div class="mail-feedback-title">${sanitize(t('match.feedback.title'))}</div>
                <div class="mail-feedback-desc">${sanitize(feedbackDesc)}</div>
                ${feedbackOptions}
                <div class="mail-feedback-actions">
                    <button class="c-btn c-btn-ghost c-btn-sm" type="button" data-feedback-cancel="1">${sanitize(t('common.cancel'))}</button>
                    <button class="c-btn c-btn-primary c-btn-sm" type="button" data-feedback-submit="1">${sanitize(t('match.feedback.submit'))}</button>
                </div>
            `;

            main.appendChild(title);
            main.appendChild(desc);
            li.appendChild(main);
            feedbackControl.appendChild(time);
            feedbackControl.appendChild(feedbackButton);
            feedbackControl.appendChild(feedbackPopover);
            li.appendChild(feedbackControl);
            list.appendChild(li);
        });

        const active = list.querySelector('.item.active') || list.querySelector('.item');
        if (active) {
            active.classList.add('active');
            renderDetail(detail, active.dataset.detail || '', readMatchedSkills(active));
            renderAttachments(parseDatasetJSON(active, 'files') || []);
        }
        updateDetailFeedbackState();
        scheduleFeedbackPlacement(list);
    };

    const setLoading = (message) => {
        list.innerHTML = '';
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = message;
        list.appendChild(empty);
        renderDetail(detail, '');
        renderAttachments([]);
        updateDetailFeedbackState();
    };

    const scheduleFeedbackControlPlacement = (control, boundaryEl = null) => {
        if (!control) return;
        const popover = control.querySelector('.mail-feedback-popover.is-visible');
        if (!popover) return;

        control.classList.remove('is-dropup');
        const button = control.querySelector('.mail-feedback-btn');
        if (!button) return;

        const buttonRect = button.getBoundingClientRect();
        const popoverRect = popover.getBoundingClientRect();
        const viewportGap = 12;
        const requiredSpace = popoverRect.height + 12;
        const boundaryRect = boundaryEl?.getBoundingClientRect?.();
        const availableBelow = boundaryRect
            ? boundaryRect.bottom - buttonRect.bottom
            : window.innerHeight - buttonRect.bottom;
        const availableAbove = boundaryRect
            ? buttonRect.top - boundaryRect.top
            : buttonRect.top;

        if (requiredSpace > availableBelow && availableAbove > availableBelow) {
            control.classList.add('is-dropup');
        }

        const popoverWidth = Math.min(280, window.innerWidth - viewportGap * 2);
        const left = Math.max(
            viewportGap,
            Math.min(buttonRect.right - popoverWidth, window.innerWidth - popoverWidth - viewportGap)
        );
        const placeAbove = control.classList.contains('is-dropup');
        const top = placeAbove
            ? Math.max(viewportGap, buttonRect.top - popoverRect.height - 8)
            : Math.min(buttonRect.bottom + 8, window.innerHeight - popoverRect.height - viewportGap);

        popover.style.left = `${left}px`;
        popover.style.top = `${top}px`;
        popover.style.width = `${popoverWidth}px`;
    };

    const scheduleFeedbackPlacement = (listEl) => {
        if (!listEl) return;
        requestAnimationFrame(() => {
            const visibleControls = Array.from(listEl.querySelectorAll('.mail-feedback-control'))
                .filter((control) => control.querySelector('.mail-feedback-popover.is-visible'));
            visibleControls.forEach((control) => {
                scheduleFeedbackControlPlacement(control, listEl);
            });
        });
    };

    list.addEventListener('scroll', () => {
        scheduleFeedbackPlacement(list);
    });

    list.addEventListener('wheel', (event) => {
        if (!event.target.closest('.mail-feedback-popover')) return;
        event.preventDefault();
        list.scrollTop += event.deltaY;
        scheduleFeedbackPlacement(list);
    }, {passive: false});

    document.addEventListener('click', (event) => {
        const detailToggle = event.target.closest('[data-detail-feedback-toggle]');
        if (detailToggle) {
            event.stopPropagation();
            if (!getActiveItemId()) {
                alert(getActiveView() === 'cases' ? t('match.empty_person_detail') : t('match.empty_job_detail'));
                return;
            }
            setDetailFeedbackOpen(!detailFeedbackOpen);
            return;
        }

        const detailCancel = event.target.closest('[data-detail-feedback-cancel]');
        if (detailCancel) {
            event.stopPropagation();
            setDetailFeedbackOpen(false);
            return;
        }

        const detailSubmit = event.target.closest('[data-detail-feedback-submit]');
        if (detailSubmit) {
            event.stopPropagation();
            submitDetailFeedback();
            return;
        }

        if (!event.target.closest('.mail-feedback-control')) {
            if (openFeedbackId) {
                openFeedbackId = '';
                renderList(currentItems, {preserveSelection: true});
            }
            if (detailFeedbackOpen) {
                setDetailFeedbackOpen(false);
            }
        }
    });

    window.addEventListener('resize', () => {
        scheduleFeedbackPlacement(list);
        if (detailFeedbackOpen) {
            scheduleFeedbackControlPlacement(detailFeedbackControl);
        }
    });

    const fetchCases = async () => {
        const view = getActiveView();
        const introText = view === 'cases'
            ? (caseInfoInput ? caseInfoInput.value.trim() : '')
            : (introInput ? introInput.value.trim() : '');
        const payload = {
            intro: introText,
            date_range: filters.range || 'all',
            sender: senderInput ? senderInput.value.trim() : ''
        };
        if (view === 'people') {
            payload.country = nationSelect ? nationSelect.value.trim() : '';
        }
        setLoading(t('common.loading'));
        try {
            const endpoint = view === 'cases'
                ? '/api/mail-technicians/search'
                : '/api/mail-projects/search';
            const result = await window.requestJson(endpoint, {
                body: JSON.stringify(payload)
            }, {
                throwOnFailure: true,
                fallbackMessage: t("common.load_failed")
            });

            const items = Array.isArray(result.data?.items) ? result.data.items : [];
            renderList(items);
        } catch (err) {
            console.error('fetch cases failed', err);
            setLoading(t('common.load_failed'));
        }
    };

    const setView = (view) => {
        views.forEach(section => {
            section.classList.toggle('hidden', section.dataset.view !== view);
        });
        viewButtons.forEach(btn => {
            const isActive = btn.dataset.view === view;
            btn.classList.toggle('is-active', isActive);
            btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        listTitle.textContent = view === 'cases' ? t('match.people') : t('match.jobs');
        detailTitle.textContent = view === 'cases' ? t('match.person_detail') : t('match.case_detail');
        updateDetailFeedbackState();
    };

    const applyPageState = () => {
        let payload = window.MatchSys.readJSONFromSessionStorage(pageStateKey);

        if (!payload) return;

        if (nationSelect) nationSelect.value = payload.nation || '';
        if (ageInput) ageInput.value = payload.age || '';
        if (priceInput) priceInput.value = payload.price || '';
        if (introInput) introInput.value = payload.intro || '';
        if (caseInfoInput) caseInfoInput.value = payload.caseInfo || '';
        if (senderInput) senderInput.value = payload.sender || '';
        resumeState.prefill = payload.resumePrefill || null;
        filters.range = payload.range || 'all';
        dateButtons.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.range === filters.range);
        });
        if (!dateButtons.some(btn => btn.dataset.range === filters.range)) {
            filters.range = 'all';
            dateButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.range === 'all');
            });
        }
        setView(payload.view === 'cases' ? 'cases' : 'people');
    };

    const getActiveResume = () => {
        if (resumeState.manualFile) {
            return {
                source: 'manual',
                name: resumeState.manualFile.name,
                file: resumeState.manualFile
            };
        }
        return resumeState.prefill || null;
    };

    const renderResumeSource = () => {
        const activeResume = getActiveResume();
        if (!activeResume) {
            resumeSource.hidden = true;
            resumeSource.innerHTML = '';
            return;
        }
        resumeSource.hidden = false;
        if (activeResume.source === 'manual') {
            resumeSource.innerHTML = `${sanitize(t('match.resume.manual_active').replace('{name}', activeResume.name || ''))} <button type="button" class="c-btn-link" data-action="remove-resume">${t('common.remove')}</button>`;
            return;
        }
        const safeName = sanitize(String(activeResume.name || 'resume'));
        const safeUrl = sanitize(String(activeResume.url || ''));
        if (safeUrl) {
            resumeSource.innerHTML = `${t('match.resume.prefill_active').replace('{name}', safeName)} <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${t('common.preview')}</a> <button type="button" class="c-btn-link" data-action="remove-resume">${t('common.remove')}</button>`;
            return;
        }
        resumeSource.innerHTML = `${sanitize(t('match.resume.prefill_active').replace('{name}', activeResume.name || ''))} <button type="button" class="c-btn-link" data-action="remove-resume">${t('common.remove')}</button>`;
    };

    const applyPrefill = () => {
        let payload = window.MatchSys.readJSONFromLocalStorage('match_prefill');

        if (nationSelect) {
            let nationalityValue = '';
            if (payload.nationality === 0 || payload.nationality === '0' || payload.nationality === '日本') {
                nationalityValue = '0';
            } else if (payload.nationality === 1 || payload.nationality === '1' || payload.nationality === '其他') {
                nationalityValue = '1';
            }
            nationSelect.value = nationalityValue;
        }
        if (ageInput) ageInput.value = payload.age ?? '';
        if (priceInput) priceInput.value = payload.price ?? '';
        if (introInput) introInput.value = payload.intro || '';
        resumeState.prefill = payload.resume && typeof payload.resume === 'object' ? payload.resume : null;
        try {
            window.MatchSys.clearStoredKey('match_prefill');
        } catch (error) {
        }
        renderResumeSource();
    };

    const init = () => {
        let payload = window.MatchSys.readJSONFromLocalStorage('match_prefill');
        if (payload) {
            setView('people');
            applyPrefill();
            return
        }
        payload = window.MatchSys.readJSONFromLocalStorage(pageStateKey);
        if (payload) {
            applyPageState();
        }
    }

    init();
    fetchCases();
</script>
</body>
</html>
