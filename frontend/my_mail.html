<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的邮件</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    :root {
      --mail-border: #e1e8f3;
      --mail-muted: #6f7b8f;
      --mail-bg: #f5f8ff;
      --mail-accent: #1d4ed8;
    }

    body {
      margin: 0;
      background: var(--mail-bg);
      color: #1f2937;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .mail-page {
      display: grid;
      grid-template-columns: 3fr 7fr;
      gap: 14px;
      height: 100vh;
      padding: 14px;
      box-sizing: border-box;
    }

    .mail-panel {
      background: #fff;
      border: 1px solid var(--mail-border);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(26, 47, 94, 0.06);
      min-height: 0;
    }

    .mail-list {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .mail-list-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--mail-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .mail-list-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .mail-list-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .list-refresh-icon {
      width: 40px;
      min-width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }

    .mailbox {
      color: var(--mail-muted);
      font-size: 12px;
      text-align: right;
      word-break: break-all;
    }

    .mail-items {
      overflow: auto;
      padding: 0;
      margin: 0;
      list-style: none;
      flex: 1;
    }

    .mail-filters {
      padding: 10px 14px 12px;
      border-bottom: 1px solid #eef3fb;
    }

    /* 复用系统筛选面板视觉风格，并保持“我的邮件”筛选区单行显示。 */
    .mail-filters.c-filter-panel {
      background: radial-gradient(circle at top, rgba(28, 123, 255, 0.08), transparent 70%);
    }

    .mail-filters .filter-grid {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .mail-filters .filter-group {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mail-filters .filter-group.filter-date {
      flex: 0 0 146px;
    }

    .mail-filters .filter-label {
      font-size: 12px;
      color: #5b6b86;
      line-height: 1;
    }

    .mail-filters .c-input {
      height: 36px;
    }

    .mail-filters .filter-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .mail-item {
      border-bottom: 1px solid #eef3fb;
      padding: 12px 14px;
      cursor: pointer;
      display: grid;
      gap: 4px;
    }

    .mail-item.is-skeleton {
      cursor: default;
      pointer-events: none;
    }

    .mail-skeleton-line {
      height: 12px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, rgba(241, 245, 249, 0.95) 25%, rgba(226, 232, 240, 0.95) 37%, rgba(241, 245, 249, 0.95) 63%);
      background-size: 400% 100%;
      animation: mailShimmer 1.2s ease-in-out infinite;
    }

    .mail-skeleton-line.subject {
      width: 58%;
      height: 14px;
    }

    .mail-skeleton-line.date {
      width: 88px;
      height: 12px;
      margin-left: auto;
    }

    .mail-skeleton-line.from {
      width: 72%;
    }

    .mail-item:hover {
      background: #f3f7ff;
    }

    .mail-item.active {
      background: #e8f0ff;
      border-left: 3px solid var(--mail-accent);
      padding-left: 11px;
    }

    .mail-item-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .mail-item-subject {
      font-size: 14px;
      font-weight: 700;
      color: #101828;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mail-item-date {
      font-size: 12px;
      color: var(--mail-muted);
      white-space: nowrap;
    }

    .mail-item-from {
      font-size: 12px;
      color: #475467;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mail-unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      margin-right: 6px;
    }

    .mail-right {
      display: grid;
      grid-template-rows: 1fr 0;
      gap: 14px;
      min-height: 0;
    }

    .mail-right.reply-expanded {
      grid-template-rows: 1fr 460px;
    }

    .mail-right.reply-collapsed .mail-reply {
      display: none;
    }

    .mail-view {
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .mail-view-head {
      border-bottom: 1px solid var(--mail-border);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .mail-view-meta {
      color: var(--mail-muted);
      font-size: 13px;
    }

    .mail-view-body {
      white-space: pre-wrap;
      overflow: auto;
      line-height: 1.6;
      font-size: 14px;
      flex: 1;
    }

    .mail-view-body.is-loading {
      color: var(--mail-muted);
      background:
        linear-gradient(90deg, rgba(241, 245, 249, 0.9) 25%, rgba(226, 232, 240, 0.95) 37%, rgba(241, 245, 249, 0.9) 63%);
      background-size: 400% 100%;
      animation: mailShimmer 1.2s ease-in-out infinite;
      border-radius: 8px;
      padding: 12px;
      min-height: 240px;
    }

    @keyframes mailShimmer {
      0% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0 50%;
      }
    }

    .mail-view-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--mail-border);
    }

    .mail-reply {
      padding: 14px;
      display: grid;
      grid-template-rows: auto 44px 44px 1fr auto;
      gap: 10px;
      min-height: 0;
    }

    .mail-reply h3 {
      margin: 0;
      font-size: 16px;
    }

    .mail-input,
    .mail-textarea {
      width: 100%;
      border: 1px solid #c9d6ea;
      border-radius: 8px;
      padding: 8px 10px;
      box-sizing: border-box;
      font: inherit;
      background: #fff;
    }

    /* 收件人/主题固定单行高度，避免被父级拉伸成大块区域。 */
    .mail-input {
      height: 44px;
      line-height: 26px;
    }

    .mail-textarea {
      resize: none;
      min-height: 0;
      height: 100%;
      min-height: 220px;
      line-height: 1.5;
    }

    .mail-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      align-items: center;
    }

    .mail-status {
      margin-right: auto;
      color: var(--mail-muted);
      font-size: 12px;
    }

    .mail-empty {
      color: var(--mail-muted);
      font-size: 14px;
      padding: 16px;
    }

    @media (max-width: 980px) {
      .mail-page {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 1fr;
      }

      .mail-right.reply-expanded {
        grid-template-rows: 1fr 340px;
      }

      /* 小屏允许筛选项换行，避免输入框被压缩不可用。 */
      .mail-filters .filter-grid {
        flex-wrap: wrap;
      }

      .mail-filters .filter-group,
      .mail-filters .filter-group.filter-date {
        flex: 1 1 100%;
      }

      .mail-filters .filter-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="mail-page">
    <section class="mail-panel mail-list">
      <div class="mail-list-head">
        <h2>我的邮件</h2>
        <div class="mail-list-tools">
          <div class="mailbox" id="mailboxText"></div>
          <button
            class="c-btn c-btn-secondary list-refresh-icon"
            type="button"
            id="listRefreshBtn"
            aria-label="刷新"
            title="刷新"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 5a7 7 0 0 1 6.3 3.9h-2.1a1 1 0 0 0 0 2H21a1 1 0 0 0 1-1V5.2a1 1 0 1 0-2 0v1.6A9 9 0 1 0 21 12a1 1 0 1 0-2 0 7 7 0 1 1-7-7z"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="mail-filters filters c-filter-panel">
        <div class="filter-grid">
          <label class="filter-group">
            <span class="filter-label">关键字</span>
            <input class="c-input" id="filterKeyword" type="text" placeholder="关键字（主题）" />
          </label>
          <label class="filter-group filter-date">
            <span class="filter-label">送信日期</span>
            <input class="c-input" id="filterSendDate" type="date" />
          </label>
          <div class="filter-actions c-filter-actions-right c-filter-actions-group">
            <button class="c-btn c-btn-primary" type="button" id="searchBtn">查询</button>
          </div>
        </div>
      </div>
      <ul class="mail-items" id="mailItems"></ul>
      <div class="pagination c-pagination" id="mail-pagination">
        <div class="pagination-summary" id="mail-pagination-summary">共 0 条 · 第 1/1 页</div>
        <div class="pagination-pages" id="mail-pagination-pages"></div>
      </div>
    </section>

    <section class="mail-right reply-collapsed" id="mailRight">
      <article class="mail-panel mail-view">
        <header class="mail-view-head">
          <div class="mail-view-meta" id="mailMeta"></div>
        </header>
        <div class="mail-view-body" id="mailBody"></div>
        <div class="mail-view-actions">
          <button class="c-btn c-btn-secondary" type="button" id="replyActionBtn">回复</button>
          <button class="c-btn c-btn-secondary" type="button" id="forwardActionBtn">转发</button>
        </div>
      </article>

      <article class="mail-panel mail-reply">
        <h3 id="composeTitle">回复邮件</h3>
        <input class="mail-input" id="replyTo" type="email" placeholder="收件人邮箱" />
        <input class="mail-input" id="forwardRecipientInput" type="text" placeholder="输入公司名称或邮箱" list="forwardRecipientOptions" style="display:none;" />
        <datalist id="forwardRecipientOptions"></datalist>
        <input class="mail-input" id="replySubject" type="text" placeholder="邮件主题" />
        <textarea class="mail-textarea" id="replyBody" placeholder="请输入回复内容"></textarea>
        <div class="mail-actions">
          <span class="mail-status" id="replyStatus"></span>
          <button class="c-btn c-btn-primary" type="button" id="sendBtn">送信</button>
        </div>
      </article>
    </section>
  </div>

  <script src="common.js"></script>
  <script>
    (function () {
      const mailItems = document.getElementById("mailItems");
      const mailRight = document.getElementById("mailRight");
      const listRefreshBtn = document.getElementById("listRefreshBtn");
      const filterKeyword = document.getElementById("filterKeyword");
      const filterSendDate = document.getElementById("filterSendDate");
      const searchBtn = document.getElementById("searchBtn");
      const pagination = document.getElementById("mail-pagination");
      const paginationPages = document.getElementById("mail-pagination-pages");
      const paginationSummary = document.getElementById("mail-pagination-summary");
      const mailboxText = document.getElementById("mailboxText");
      const mailMeta = document.getElementById("mailMeta");
      const mailBody = document.getElementById("mailBody");
      const replyActionBtn = document.getElementById("replyActionBtn");
      const forwardActionBtn = document.getElementById("forwardActionBtn");
      const replyPanel = document.querySelector(".mail-reply");
      const composeTitle = document.getElementById("composeTitle");
      const replyTo = document.getElementById("replyTo");
      const forwardRecipientInput = document.getElementById("forwardRecipientInput");
      const forwardRecipientOptions = document.getElementById("forwardRecipientOptions");
      const replySubject = document.getElementById("replySubject");
      const replyBody = document.getElementById("replyBody");
      const replyStatus = document.getElementById("replyStatus");
      const sendBtn = document.getElementById("sendBtn");

      let listItems = [];
      let activeMail = null;
      let listNoticeMessage = "";
      let isReplyExpanded = false;
      let composeMode = "reply";
      let forwardSearchTimer = null;
      let forwardSearchSeq = 0;
      let forwardSuggestionMap = {};
      let detailCache = {};
      let detailRequestSeq = 0;
      let listRequestSeq = 0;
      let isListLoading = false;
      let currentFilters = {
        keyword: "",
        send_date: "",
      };
      let currentPage = 1;
      let totalPages = 1;
      let totalCount = 0;

      const setStatus = (text, isError) => {
        replyStatus.textContent = text || "";
        replyStatus.style.color = isError ? "#dc2626" : "#6f7b8f";
      };

      const escapeHtml = (value) => {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      };

      const buildForwardRecipientOptions = (customers) => {
        const options = [];
        (customers || []).forEach((item) => {
          const companyName = (item.company_name || "").trim() || "未命名客户";
          [
            { name: item.contact1_name, email: item.contact1_email, index: 1 },
            { name: item.contact2_name, email: item.contact2_email, index: 2 },
            { name: item.contact3_name, email: item.contact3_email, index: 3 },
          ].forEach((entry) => {
            const email = (entry.email || "").trim();
            if (!email) return;
            const name = (entry.name || "").trim();
            const labelName = name || `联系人${entry.index}`;
            options.push({
              email,
              label: `${companyName} - ${labelName} <${email}>`,
            });
          });
        });
        options.sort((a, b) => a.label.localeCompare(b.label, "zh-Hans-CN"));
        return options;
      };

      const renderForwardRecipients = (items) => {
        if (!forwardRecipientOptions) return;
        forwardSuggestionMap = {};
        if (!items || !items.length) {
          forwardRecipientOptions.innerHTML = "";
          return;
        }
        const optionsHtml = items
          .map((item) => {
            const optionValue = `${item.label}`;
            forwardSuggestionMap[optionValue] = item.email;
            return `<option value="${escapeHtml(optionValue)}"></option>`;
          })
          .join("");
        forwardRecipientOptions.innerHTML = optionsHtml;
      };

      const searchForwardRecipients = async (keyword) => {
        let page = 1;
        let totalPagesLocal = 1;
        const customers = [];
        do {
          const params = new URLSearchParams({
            page: String(page),
            page_size: "100",
            company_name: keyword,
          });
          const res = await fetchWithAuth(`/api/customers?${params.toString()}`, { method: "GET" });
          const payload = await res.json();
          if (!payload || payload.success === false) {
            throw new Error((payload && payload.message) || "读取客户联系人失败");
          }
          const pageItems = (((payload.data || {}).items) || []);
          customers.push(...pageItems);
          const meta = payload.meta || {};
          totalPagesLocal = Number(meta.total_pages || 1) || 1;
          page += 1;
        } while (page <= totalPagesLocal);
        return buildForwardRecipientOptions(customers);
      };

      const setComposerMode = (mode) => {
        composeMode = mode === "forward" ? "forward" : "reply";
        if (!replyTo || !forwardRecipientInput) return;
        const isForward = composeMode === "forward";
        if (composeTitle) {
          composeTitle.textContent = isForward ? "转发邮件" : "回复邮件";
        }
        replyTo.style.display = isForward ? "none" : "";
        forwardRecipientInput.style.display = isForward ? "" : "none";
      };

      const renderList = () => {
        if (!mailItems) return;
        if (isListLoading) {
          mailItems.innerHTML = Array.from({ length: 6 }).map(() => `
            <li class="mail-item is-skeleton" aria-hidden="true">
              <div class="mail-item-top">
                <span class="mail-skeleton-line subject"></span>
                <span class="mail-skeleton-line date"></span>
              </div>
              <div class="mail-skeleton-line from"></div>
            </li>
          `).join("");
          return;
        }
        if (!listItems.length) {
          const emptyText = listNoticeMessage || "暂无邮件";
          mailItems.innerHTML = `<li class="mail-empty">${escapeHtml(emptyText)}</li>`;
          return;
        }
        mailItems.innerHTML = listItems.map((item) => {
          const unreadDot = item.unread ? '<span class="mail-unread-dot"></span>' : "";
          return `
            <li class="mail-item ${activeMail && activeMail.id === item.id ? "active" : ""}" data-id="${escapeHtml(item.id)}">
              <div class="mail-item-top">
                <span class="mail-item-subject">${unreadDot}${escapeHtml(item.subject || "(无标题)")}</span>
                <span class="mail-item-date">${escapeHtml(item.date || "")}</span>
              </div>
              <div class="mail-item-from">${escapeHtml(item.from || item.from_email || "")}</div>
            </li>
          `;
        }).join("");
      };

      const setActiveListItem = (mailId) => {
        const matched = listItems.find((item) => String(item.id) === String(mailId));
        if (!matched) return null;
        activeMail = {
          ...(activeMail || {}),
          ...matched,
        };
        renderList();
        return activeMail;
      };

      const setListLoading = (loading, trigger) => {
        isListLoading = Boolean(loading);
        renderList();
        if (searchBtn) {
          searchBtn.disabled = isListLoading;
          searchBtn.textContent = isListLoading && trigger === "search" ? "查询中..." : "查询";
        }
        if (listRefreshBtn) {
          listRefreshBtn.disabled = isListLoading;
          listRefreshBtn.style.opacity = isListLoading ? "0.65" : "";
          listRefreshBtn.style.pointerEvents = isListLoading ? "none" : "";
        }
      };

      const showDetailLoading = (mail) => {
        const subjectText = (mail && mail.subject) || "(无标题)";
        const fromText = (mail && (mail.from || mail.from_email)) || "";
        const dateText = (mail && mail.date) || "";
        mailMeta.textContent = `主题: ${subjectText} | 发件人: ${fromText} | 时间: ${dateText}`;
        mailBody.textContent = "正在加载邮件内容...";
        mailBody.classList.add("is-loading");
      };

      // 回复区默认折叠，仅在用户需要时展开，减少首屏占用。
      const setReplyExpanded = (expanded) => {
        isReplyExpanded = Boolean(expanded);
        if (!mailRight) return;
        mailRight.classList.toggle("reply-expanded", isReplyExpanded);
        mailRight.classList.toggle("reply-collapsed", !isReplyExpanded);
        // 显式控制显示，避免仅依赖 class 切换导致某些情况下未正确渲染。
        if (replyPanel) {
          replyPanel.style.display = isReplyExpanded ? "grid" : "none";
        }
      };

      const openComposer = (mode) => {
        setComposerMode(mode);
        setReplyExpanded(true);
        if (replyPanel && typeof replyPanel.scrollIntoView === "function") {
          replyPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
        if (mode === "reply") {
          if (!activeMail) {
            setStatus("未选中邮件，请手动填写收件人和主题。", true);
            replyTo.focus();
            return;
          }
          const toEmail = activeMail.from_email || "";
          replyTo.value = toEmail;
          replySubject.value = activeMail.subject && !/^\s*Re:/i.test(activeMail.subject)
            ? `Re: ${activeMail.subject}`
            : (activeMail.subject || "");
          replyBody.focus();
          return;
        }
        if (mode === "forward") {
          if (!activeMail) {
            setStatus("未选中邮件，无法自动转发原文。", true);
            if (forwardRecipientInput) forwardRecipientInput.focus();
            return;
          }
          if (forwardRecipientInput) forwardRecipientInput.value = "";
          renderForwardRecipients([]);
          replySubject.value = "转发邮件";
          const source = activeMail.body || "";
          replyBody.value = source
            ? `\n\n---------- 转发邮件 ----------\n${source}`
            : "";
          setStatus("请输入公司名称查询联系人，或直接输入邮箱", false);
          if (forwardRecipientInput) forwardRecipientInput.focus();
        }
      };

      const fillDetail = (detail) => {
        activeMail = detail || null;
        mailBody.classList.remove("is-loading");
        if (!detail) {
          // 顶部信息栏用于说明当前状态，避免出现“只有一条横线”的空白感。
          mailMeta.textContent = "请在左侧选择邮件后查看详情";
          mailBody.textContent = "";
          replyTo.value = "";
          if (forwardRecipientInput) forwardRecipientInput.value = "";
          replySubject.value = "";
          replyBody.value = "";
          renderList();
          return;
        }

        const subjectText = detail.subject || "(无标题)";
        mailMeta.textContent = `主题: ${subjectText} | 发件人: ${detail.from || ""} | 时间: ${detail.date || ""}`;
        mailBody.textContent = detail.body || "";

        const toEmail = detail.from_email || "";
        replyTo.value = toEmail;
        if (forwardRecipientInput) forwardRecipientInput.value = "";
        replySubject.value = detail.subject && !/^\s*Re:/i.test(detail.subject)
          ? `Re: ${detail.subject}`
          : (detail.subject || "");
        replyBody.value = "";

        renderList();
      };

      const loadDetail = async (mailId) => {
        const currentSeq = ++detailRequestSeq;
        const selected = setActiveListItem(mailId);
        showDetailLoading(selected);
        if (detailCache[mailId]) {
          fillDetail(detailCache[mailId]);
          setStatus("", false);
          return;
        }
        try {
          setStatus("加载邮件内容...", false);
          const res = await fetchWithAuth(`/api/my-mails/${encodeURIComponent(mailId)}`, { method: "GET" });
          const payload = await res.json();
          if (!payload || payload.success === false) {
            throw new Error((payload && payload.message) || "读取邮件失败");
          }
          if (currentSeq !== detailRequestSeq) return;
          const detail = payload.data || null;
          if (detail) {
            detailCache[mailId] = detail;
          }
          fillDetail(detail);
          setStatus("", false);
        } catch (error) {
          if (currentSeq !== detailRequestSeq) return;
          mailBody.classList.remove("is-loading");
          mailBody.textContent = "";
          setStatus(error.message || "读取邮件失败", true);
        }
      };

      const hasFilters = () => (
        Boolean((currentFilters.keyword || "").trim())
        || Boolean((currentFilters.send_date || "").trim())
      );

      const loadList = async (forceRefresh = false) => {
        const currentSeq = ++listRequestSeq;
        try {
          setStatus("加载邮件列表...", false);
          setListLoading(true, forceRefresh ? "refresh" : "search");
          if (forceRefresh) {
            await fetchWithAuth("/api/my-mails/sync", {
              method: "POST",
              body: JSON.stringify({}),
            });
          }

          const params = new URLSearchParams({ page: String(currentPage), page_size: "30" });
          if (hasFilters()) {
            if (currentFilters.keyword) params.set("keyword", currentFilters.keyword);
            if (currentFilters.send_date) params.set("send_date", currentFilters.send_date);
          }
          const endpoint = hasFilters() ? "/api/my-mails/query" : "/api/my-mails";
          const res = await fetchWithAuth(`${endpoint}?${params.toString()}`, { method: "GET" });
          const payload = await res.json();
          if (!payload || payload.success === false) {
            throw new Error((payload && payload.message) || "读取邮件列表失败");
          }
          if (currentSeq !== listRequestSeq) return;
          const data = payload.data || {};
          const meta = payload.meta || {};
          totalPages = Number(meta.total_pages || 1) || 1;
          totalCount = Number(meta.total || 0) || 0;
          currentPage = Number(meta.page || currentPage) || 1;
          listItems = Array.isArray(data.items) ? data.items : [];
          listNoticeMessage = "";
          detailCache = {};
          mailboxText.textContent = data.mailbox_email ? `邮箱: ${data.mailbox_email}` : "";
          if (paginationSummary) {
            paginationSummary.textContent = `共 ${totalCount} 条 · 第 ${currentPage}/${totalPages} 页`;
          }
          if (pagination && window.renderPagination) {
            window.renderPagination(pagination, paginationPages, currentPage, totalPages);
          }

          renderList();

          if (listItems.length) {
            // 优先保持当前选中邮件；不存在时选中首封，确保收件人/标题默认值持续可用。
            const activeId = activeMail && activeMail.id ? String(activeMail.id) : "";
            const matched = listItems.find((item) => String(item.id) === activeId);
            const target = matched || listItems[0];
            loadDetail(target.id);
          } else {
            fillDetail(null);
          }
          setStatus("", false);
        } catch (error) {
          if (currentSeq !== listRequestSeq) return;
          listItems = [];
          totalPages = 1;
          totalCount = 0;
          currentPage = 1;
          detailCache = {};
          const rawMessage = String(
            (error && error.payload && error.payload.message) || error.message || ""
          );
          // 无送信配置时，在列表区域给出明确的配置引导，避免仅看到接口错误文案。
          if (rawMessage === "No send config for current user") {
            listNoticeMessage = "当前登录用户未配置邮箱，请到【系统设置 → 送信配置】新增并绑定当前使用人。";
          } else {
            listNoticeMessage = "读取邮件列表失败，请稍后重试。";
          }
          renderList();
          fillDetail(null);
          setStatus(listNoticeMessage, true);
          if (paginationSummary) {
            paginationSummary.textContent = "共 0 条 · 第 1/1 页";
          }
          if (pagination && window.renderPagination) {
            window.renderPagination(pagination, paginationPages, 1, 1);
          }
        } finally {
          if (currentSeq === listRequestSeq) {
            setListLoading(false, "");
          }
        }
      };

      mailItems.addEventListener("click", (event) => {
        const target = event.target.closest(".mail-item[data-id]");
        if (!target) return;
        const mailId = target.getAttribute("data-id");
        if (!mailId) return;
        loadDetail(mailId);
      });

      // 列表头刷新按钮：不展开回复区也能刷新“我的邮件”列表。
      if (listRefreshBtn) {
        listRefreshBtn.addEventListener("click", () => {
          loadList(true);
        });
      }

      if (searchBtn) {
        searchBtn.addEventListener("click", () => {
          currentPage = 1;
          currentFilters = {
            keyword: (filterKeyword && filterKeyword.value ? filterKeyword.value : "").trim(),
            send_date: (filterSendDate && filterSendDate.value ? filterSendDate.value : "").trim(),
          };
          loadList(false);
        });
      }

      [filterKeyword, filterSendDate].forEach((input) => {
        if (!input) return;
        input.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          if (isListLoading) return;
          currentPage = 1;
          currentFilters = {
            keyword: (filterKeyword && filterKeyword.value ? filterKeyword.value : "").trim(),
            send_date: (filterSendDate && filterSendDate.value ? filterSendDate.value : "").trim(),
          };
          loadList(false);
        });
      });

      if (pagination && window.bindPagination) {
        window.bindPagination(pagination, (value) => {
          if (value === "prev") {
            if (currentPage <= 1) return;
            currentPage -= 1;
            loadList(false);
            return;
          }
          if (value === "next") {
            if (currentPage >= totalPages) return;
            currentPage += 1;
            loadList(false);
            return;
          }
          const pageNum = Number(value);
          if (!Number.isInteger(pageNum) || pageNum < 1 || pageNum > totalPages) return;
          currentPage = pageNum;
          loadList(false);
        });
      }

      // 邮件内容区动作按钮：触发展开回复区，并按动作填充默认内容。
      if (replyActionBtn) {
        replyActionBtn.addEventListener("click", () => {
          openComposer("reply");
        });
      }

      if (forwardActionBtn) {
        forwardActionBtn.addEventListener("click", () => {
          openComposer("forward");
        });
      }

      if (forwardRecipientInput) {
        forwardRecipientInput.addEventListener("input", () => {
          if (composeMode !== "forward") return;
          const keyword = (forwardRecipientInput.value || "").trim();
          const isEmailInput = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(keyword);
          if (forwardSearchTimer) {
            clearTimeout(forwardSearchTimer);
          }
          forwardSearchTimer = setTimeout(async () => {
            if (!keyword || isEmailInput) {
              renderForwardRecipients([]);
              return;
            }
            const currentSeq = ++forwardSearchSeq;
            try {
              setStatus("查询客户联系人中...", false);
              const options = await searchForwardRecipients(keyword);
              if (currentSeq !== forwardSearchSeq) return;
              renderForwardRecipients(options);
              setStatus(options.length ? "" : "未找到匹配客户联系人", !options.length);
            } catch (error) {
              if (currentSeq !== forwardSearchSeq) return;
              renderForwardRecipients([]);
              setStatus(error.message || "读取客户联系人失败", true);
            }
          }, 300);
        });
      }

      sendBtn.addEventListener("click", async () => {
        const forwardInput = ((forwardRecipientInput && forwardRecipientInput.value) || "").trim();
        const forwardMapped = forwardSuggestionMap[forwardInput] || "";
        const forwardManual = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(forwardInput) ? forwardInput : "";
        const to = composeMode === "forward"
          ? (forwardMapped || forwardManual)
          : (replyTo.value || "").trim();
        const subject = (replySubject.value || "").trim();
        const body = (replyBody.value || "").trim();
        if (!to || !body) {
          setStatus("收件人和正文不能为空", true);
          return;
        }

        const payload = {
          to,
          subject: subject || (composeMode === "forward" ? "转发邮件" : "回复邮件"),
          body,
          mail_type: -1,
        };
        // 带上回复链字段，便于对方邮箱客户端识别为同一会话线程。
        if (composeMode === "reply" && activeMail && activeMail.message_id) {
          payload.in_reply_to = activeMail.message_id;
          payload.references = activeMail.references || activeMail.message_id;
        }

        try {
          setStatus("发送中...", false);
          const res = await fetchWithAuth("/api/send-mail", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const result = await res.json();
          if (!result || result.success === false) {
            throw new Error((result && result.message) || "发送失败");
          }
          if (composeMode === "forward" && forwardRecipientInput) {
            forwardRecipientInput.value = "";
            renderForwardRecipients([]);
          }
          replyBody.value = "";
          setStatus("发送成功", false);
        } catch (error) {
          setStatus(error.message || "发送失败", true);
        }
      });

      renderForwardRecipients([]);
      setComposerMode("reply");
      setReplyExpanded(false);
      loadList();
    })();
  </script>
</body>
</html>
