<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title data-i18n="pay.title">请求书管理</title>
</head>
<body class="pay-request-page">
  <div class="page">
    <section class="c-card">
      <div class="filters c-filter-panel">
        <div class="filter-grid c-filter-grid-wide">
          <label class="c-field">
            <span>客户名称</span>
            <input type="text" placeholder="输入客户名称" />
          </label>
          <label class="c-field">
            <span>月份</span>
            <select>
              <option>2024-07</option>
              <option>2024-06</option>
              <option>2024-05</option>
            </select>
          </label>
        </div>
        <div class="filter-actions c-filter-actions-bar">
          <div class="filter-actions-left c-filter-actions-left">
            <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" id="createPayBtn" type="button">+ 新增请求书</button>
          </div>
          <div class="filter-actions-right c-filter-actions-group">
            <button class="c-btn c-btn-primary" type="button">搜索</button>
            <button class="c-btn c-btn-warn" type="button">重置</button>
          </div>
        </div>
      </div>

      <div class="table-actions c-table-actions"></div>

      <div class="table-wrapper c-table-wrapper pay-request-table">
        <table class="c-table c-table-hover c-table-center">
          <thead>
          <tr>
            <th>请求书编号</th>
            <th>客户名称</th>
            <th>总价</th>
            <th>状态</th>
            <th>请求书日期</th>
            <th class="c-actions-col">操作</th>
          </tr>
          </thead>
          <tbody id="payRequestTableBody">
          <tr>
            <td colspan="6" class="empty c-empty">暂无数据</td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="pagination c-pagination">
        <div class="pagination-summary">共 0 条 · 第 1/1 页</div>
        <div class="pagination-pages">
          <button class="c-btn c-btn-sm" type="button">上一页</button>
          <button class="c-btn c-btn-sm is-active" type="button">1</button>
          <button class="c-btn c-btn-sm" type="button">下一页</button>
        </div>
      </div>
    </section>
  </div>

  <dialog class="c-dialog pay-dialog" id="createPayDialog" aria-labelledby="createPayTitle">
    <div class="c-dialog-header">
      <div>
        <h3 id="createPayTitle" data-i18n="pay.dialog.create.title">新建请求书</h3>
        <p class="c-card-subtitle" data-i18n="pay.dialog.create.subtitle">请填写请求书基础信息。</p>
      </div>
      <button class="c-dialog-close" type="button" aria-label="关闭" data-i18n-aria="common.close" data-dialog-close>×</button>
    </div>
    <div class="c-dialog-body">
      <div class="c-modal-form">
        <div class="c-modal-grid">
          <div class="pay-column-group">
            <label class="c-inline-field">
              <span data-i18n="pay.field.request_no">请求书编号</span>
              <input type="text" placeholder="PR-2024-XXX"/>
            </label>
            <label class="c-inline-field">
              <span data-i18n="pay.field.order_no">对应注文书编号</span>
              <input type="text" placeholder="PO-2024-XXX"/>
            </label>
            <label class="c-inline-field">
              <span>状态</span>
              <select id="pay-status-select">
                <option value="pending">待付款</option>
                <option value="paid">已付款</option>
              </select>
            </label>
          </div>
          <div class="pay-column-group">
            <label class="c-inline-field">
              <span data-i18n="pay.field.target">请求对象</span>
              <input id="pay-customer-name" type="text" placeholder="客户名称" data-i18n-placeholder="pay.placeholder.customer" list="pay-customer-list"/>
            </label>
            <datalist id="pay-customer-list"></datalist>
            <input id="pay-customer-id" type="hidden"/>
            <div class="c-inline-field pay-customer-info" id="payCustomerInfo" hidden>
              <div><span data-i18n="pay.customer.name">客户名称</span><strong id="payCustomerName">-</strong></div>
              <div><span data-i18n="pay.customer.address">客户地址</span><strong id="payCustomerAddress">-</strong></div>
            </div>
          </div>
          <div></div>
          <div class="c-inline-field c-inline-field-full pay-detail-section">
            <div class="pay-detail-heading">
              <span data-i18n="pay.field.detail">明细</span>
              <button class="c-btn c-btn-ghost c-btn-sm" type="button" id="detailAddBtn" data-i18n="pay.detail.add">新增明细</button>
            </div>
            <div class="c-table-wrapper pay-detail-table-wrap">
              <table class="c-table c-table-hover pay-detail-table" id="detailTable">
                <thead>
                <tr>
                  <th data-i18n="pay.detail.item">项目</th>
                  <th data-i18n="pay.detail.qty">数量</th>
                  <th data-i18n="pay.detail.price">单价</th>
                  <th data-i18n="pay.detail.subtotal">小计</th>
                  <th data-i18n="common.field.note">备注</th>
                  <th data-i18n="common.field.actions">操作</th>
                </tr>
                </thead>
                <tbody id="detailTableBody"></tbody>
              </table>
            </div>
          </div>
          <div class="c-inline-field c-inline-field-full pay-detail-section">
            <span data-i18n="pay.field.tax_breakdown">税相关</span>
            <div class="c-table-wrapper pay-detail-table-wrap">
              <table class="c-table c-table-hover pay-detail-table" id="taxTable">
                <thead>
                <tr>
                  <th data-i18n="pay.tax.category">区分</th>
                  <th data-i18n="pay.tax.amount_excl">対象額（税抜）</th>
                  <th data-i18n="pay.tax.value">消費税</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                  <td data-i18n="pay.tax.rate_10">10%対象</td>
                  <td><input class="c-input" type="text" placeholder="¥ 0"/></td>
                  <td><input class="c-input" type="text" placeholder="¥ 0"/></td>
                </tr>
                <tr>
                  <td data-i18n="pay.tax.rate_8">8%対象（※）</td>
                  <td><input class="c-input" type="text" placeholder="¥ 0"/></td>
                  <td><input class="c-input" type="text" placeholder="¥ 0"/></td>
                </tr>
                <tr>
                  <td data-i18n="pay.tax.subtotal">小计</td>
                  <td><input class="c-input" type="text" placeholder="¥ 0" disabled data-always-disabled/></td>
                  <td><input class="c-input" type="text" placeholder="¥ 0" disabled data-always-disabled/></td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="pay-bottom-row">
            <div class="pay-account-card">
              <div class="pay-account-title">振込先</div>
              <div class="pay-account-subtitle">○○銀行○○支店</div>
              <div class="pay-account-grid">
                <div class="pay-account-label">□□口座種</div>
                <div class="pay-account-value">普通口座</div>
                <div class="pay-account-label">□□口座番号</div>
                <div class="pay-account-value">1234567</div>
                <div class="pay-account-label">□□口座名義</div>
                <div class="pay-account-value">タナカ イチロウ</div>
              </div>
            </div>

            <div class="pay-side-stack">
              <label class="c-inline-field pay-total-field">
                <span data-i18n="pay.field.total">总价</span>
                <span class="pay-total-display" aria-live="polite">¥ 0</span>
              </label>
              <label class="c-inline-field pay-request-date-field">
                <span>最迟支付日</span>
                <input type="date"/>
              </label>
              <label class="c-inline-field pay-upload-field">
                <span>附件上传</span>
                <input type="file" multiple />
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="c-dialog-actions">
      <button class="c-btn c-btn-secondary" type="button" data-dialog-close data-i18n="common.cancel">取消</button>
      <button class="c-btn c-btn-primary" type="button" id="payDialogSubmitBtn" data-i18n="common.create">开始创建</button>
    </div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    const i18n = window.I18N || null;
    const t = (key, fallback) => (i18n && typeof i18n.t === "function" ? i18n.t(key) : fallback);
    if (i18n) {
      i18n.init();
      i18n.apply();
    }
    const createPayBtn = document.getElementById("createPayBtn");
    const createPayDialog = document.getElementById("createPayDialog");
    const createPayTitle = document.getElementById("createPayTitle");
    const payDialogSubmitBtn = document.getElementById("payDialogSubmitBtn");
    const detailAddBtn = document.getElementById("detailAddBtn");
    const detailTableBody = document.getElementById("detailTableBody");
    const payCustomerNameInput = document.getElementById("pay-customer-name");
    const payCustomerIdInput = document.getElementById("pay-customer-id");
    const payCustomerList = document.getElementById("pay-customer-list");
    const payCustomerInfo = document.getElementById("payCustomerInfo");
    const payCustomerName = document.getElementById("payCustomerName");
    const payCustomerAddress = document.getElementById("payCustomerAddress");
    const payStatusSelect = document.getElementById("pay-status-select");
    const payRequestTable = document.querySelector(".pay-request-table");

    if (window.initDialogCloseBehavior) {
      window.initDialogCloseBehavior({
        dialogs: [createPayDialog]
      });
    }

    const setDialogReadonly = (readonly) => {
      if (!createPayDialog) return;
      const fields = createPayDialog.querySelectorAll("input, select, textarea");
      fields.forEach((field) => {
        if (field.type === "hidden") return;
        if (!readonly && field.hasAttribute("data-always-disabled")) return;
        field.disabled = readonly;
      });
      if (detailAddBtn) detailAddBtn.disabled = readonly;
      if (detailTableBody) {
        detailTableBody.querySelectorAll("button").forEach((btn) => {
          btn.disabled = readonly;
        });
      }
    };

    const setDialogMode = (mode) => {
      if (!createPayDialog) return;
      createPayDialog.dataset.mode = mode;
      if (createPayTitle) {
        createPayTitle.textContent = mode === "edit" ? "编辑请求书" : mode === "view" ? "请求书详情" : "新建请求书";
      }
      if (payDialogSubmitBtn) {
        payDialogSubmitBtn.textContent = mode === "edit" ? "保存修改" : mode === "view" ? "关闭" : "开始创建";
      }
      if (mode === "create" && payStatusSelect) {
        payStatusSelect.value = "pending";
      }
      setDialogReadonly(mode === "view");
    };

    if (createPayBtn && createPayDialog) {
      createPayBtn.addEventListener("click", () => {
        setDialogMode("create");
        createPayDialog.showModal();
      });
    }

    if (payDialogSubmitBtn && createPayDialog) {
      payDialogSubmitBtn.addEventListener("click", () => {
        if (createPayDialog.dataset.mode === "view") {
          createPayDialog.close();
          return;
        }
        createPayDialog.close();
      });
    }

    const buildDetailRow = () => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><input class="c-input" type="text" placeholder="服务/物料"/></td>
        <td><input class="c-input" type="number" min="0" placeholder="1"/></td>
        <td><input class="c-input" type="text" placeholder="¥ 0"/></td>
        <td><input class="c-input" type="text" placeholder="¥ 0" disabled data-always-disabled/></td>
        <td><input class="c-input" type="text" placeholder="备注"/></td>
        <td>
          <button class="c-btn c-btn-ghost c-btn-sm" type="button" data-action="save" data-i18n="pay.detail.save">${t("pay.detail.save", "保存")}</button>
        </td>
      `;
      return row;
    };

    const setRowEditable = (row, editable) => {
      row.querySelectorAll("input").forEach((input, index) => {
        if (index === 3) return;
        input.disabled = !editable;
      });
    };

    const updateRowSubtotal = (row) => {
      const qty = Number(row.querySelectorAll("input")[1].value || 0);
      const priceRaw = row.querySelectorAll("input")[2].value || "";
      const price = Number(String(priceRaw).replace(/[^\d.]/g, "")) || 0;
      row.querySelectorAll("input")[3].value = `¥ ${qty * price}`;
    };

    if (detailTableBody) {
      const initialRow = buildDetailRow();
      setRowEditable(initialRow, true);
      detailTableBody.appendChild(initialRow);
    }

    if (detailAddBtn && detailTableBody) {
      detailAddBtn.addEventListener("click", () => {
        const row = buildDetailRow();
        setRowEditable(row, true);
        detailTableBody.appendChild(row);
      });
    }

    if (detailTableBody) {
      detailTableBody.addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-action]");
        if (!btn) return;
        const row = btn.closest("tr");
        if (!row) return;
        const isEditing = btn.dataset.action === "save";
        setRowEditable(row, !isEditing);
        btn.dataset.action = isEditing ? "edit" : "save";
        btn.textContent = isEditing ? t("common.edit", "编辑") : t("pay.detail.save", "保存");
      });
      detailTableBody.addEventListener("input", (event) => {
        const row = event.target.closest("tr");
        if (!row) return;
        updateRowSubtotal(row);
      });
    }

    const payCustomerMap = new Map();
    const renderPayCustomerOptions = (listEl, map, items) => {
      map.clear();
      listEl.innerHTML = "";
      items.forEach((item) => {
        if (!item || !item.company_name) return;
        map.set(item.company_name, {
          id: item.id,
          address: item.company_address || ""
        });
        const opt = document.createElement("option");
        opt.value = item.company_name;
        listEl.appendChild(opt);
      });
    };

    const fetchPayCustomerOptions = (inputEl, listEl, map) => {
      const keyword = inputEl.value.trim();
      if (!keyword) {
        listEl.innerHTML = "";
        map.clear();
        return;
      }
      const params = window.createParams([
        ["company_name", keyword],
        ["page", "1"],
        ["page_size", "10"],
      ]);
      window.requestJson(window.buildUrl("/api/customers", params), { method: "GET" })
        .then((payload) => {
          const result = payload.data || {};
          const items = Array.isArray(result.items) ? result.items : [];
          renderPayCustomerOptions(listEl, map, items);
        })
        .catch(() => {
          listEl.innerHTML = "";
          map.clear();
        });
    };

    const updatePayCustomerInfo = (name) => {
      const info = payCustomerMap.get(name);
      if (!info) {
        if (payCustomerIdInput) payCustomerIdInput.value = "";
        if (payCustomerInfo) payCustomerInfo.hidden = true;
        if (payCustomerName) payCustomerName.textContent = "-";
        if (payCustomerAddress) payCustomerAddress.textContent = "-";
        return;
      }
      if (payCustomerIdInput) payCustomerIdInput.value = info.id ? String(info.id) : "";
      if (payCustomerName) payCustomerName.textContent = name || "-";
      if (payCustomerAddress) payCustomerAddress.textContent = info.address || "-";
      if (payCustomerInfo) payCustomerInfo.hidden = false;
    };

    if (payCustomerNameInput && payCustomerList) {
      payCustomerNameInput.addEventListener("input", () => {
        fetchPayCustomerOptions(payCustomerNameInput, payCustomerList, payCustomerMap);
        updatePayCustomerInfo("");
      });
      payCustomerNameInput.addEventListener("change", () => {
        updatePayCustomerInfo(payCustomerNameInput.value.trim());
      });
    }

    if (payRequestTable && createPayDialog) {
      payRequestTable.addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-action]");
        if (!btn) return;
        const mode = btn.dataset.action === "edit" ? "edit" : "view";
        setDialogMode(mode);
        createPayDialog.showModal();
      });
    }
  </script>
</body>
</html>
