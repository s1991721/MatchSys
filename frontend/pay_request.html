<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="components.css">
  <title data-i18n="pay.title">请求书管理</title>
  <style>
    .pay-request-page .pay-pdf-main-grid {
      align-items: start;
    }
    .pay-request-page .pay-pdf-left-column,
    .pay-request-page .pay-pdf-right-column {
      display: grid;
      gap: 12px;
    }
    .pay-request-page .pay-pdf-left-column .order-pdf-customer {
      padding-top: 0;
    }
    .pay-request-page .pay-pdf-bank-table {
      width: 100%;
      margin-top: 26px;
    }
    .pay-request-page .pay-pdf-bank-table th {
      width: auto;
      height: 42px;
      font-size: 15px;
      font-weight: 900;
      background: #ffffff;
    }
    .pay-request-page .pay-pdf-bank-table th:first-child,
    .pay-request-page .pay-pdf-bank-table td:first-child {
      width: 34%;
    }
    .pay-request-page .pay-pdf-bank-table td {
      height: 22px;
      text-align: center;
    }
    .pay-request-page .order-pdf-page {
      grid-template-rows: auto auto auto auto auto auto;
    }
    .pay-request-page .order-pdf-detail-block {
      overflow: visible;
    }
    .pay-request-page .order-pdf-detail th,
    .pay-request-page .order-pdf-detail td {
      height: 24px;
      min-height: 24px;
      padding: 3px 5px;
      line-height: 1.25;
    }
    .pay-request-page .order-pdf-detail tbody tr {
      height: 24px;
    }
    .pay-request-page .order-pdf-detail th:nth-child(1) {
      width: 48%;
    }
    .pay-request-page .order-pdf-detail th:nth-child(2) {
      width: 12%;
    }
    .pay-request-page .order-pdf-detail th:nth-child(3) {
      width: 16%;
    }
    .pay-request-page .order-pdf-detail th:nth-child(4) {
      width: 10%;
    }
    .pay-request-page .order-pdf-detail th:nth-child(5) {
      width: 14%;
    }
    .pay-request-page .pay-line-item-row {
      grid-template-columns:
        minmax(130px, 1.35fr)
        minmax(78px, 0.65fr)
        minmax(96px, 0.8fr)
        minmax(96px, 0.8fr)
        minmax(72px, 0.6fr)
        36px;
      gap: 8px;
      padding: 8px;
    }
    .pay-request-page .pay-line-item-row .c-inline-field {
      min-width: 0;
      padding: 9px 10px;
    }
    .pay-request-page .pay-line-item-row .order-issue-item-remove {
      width: 34px;
      height: 34px;
    }
    @media (max-width: 1180px) {
      .pay-request-page .pay-line-item-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="pay-request-page">
  <div class="page">
    <section class="c-card">
      <div class="filters c-filter-panel">
        <div class="filter-grid c-filter-grid-wide">
          <label class="c-field">
            <span>客户名称</span>
            <input id="pay-filter-customer" type="text" placeholder="输入客户名称" list="pay-filter-customer-list" autocomplete="off" />
          </label>
          <datalist id="pay-filter-customer-list"></datalist>
          <label class="c-field">
            <span>月份</span>
            <input id="pay-filter-month" type="month" />
          </label>
        </div>
        <div class="filter-actions c-filter-actions-bar">
          <div class="filter-actions-left c-filter-actions-left">
            <button class="c-btn c-btn-primary c-btn-lg c-btn-strong" id="createPayBtn" type="button">+ 新增请求书</button>
          </div>
          <div class="filter-actions-right c-filter-actions-group">
            <button class="c-btn c-btn-primary" id="paySearchBtn" type="button">搜索</button>
            <button class="c-btn c-btn-warn" id="payResetBtn" type="button">重置</button>
          </div>
        </div>
      </div>

      <div class="table-actions c-table-actions"></div>

      <div class="table-wrapper c-table-wrapper pay-request-table">
        <table class="c-table c-table-hover c-table-center">
          <thead>
          <tr>
            <th>请求书编号</th>
            <th>客户名称</th>
            <th>总价</th>
            <th>状态</th>
            <th>请求书日期</th>
            <th class="c-actions-col">操作</th>
          </tr>
          </thead>
          <tbody id="payRequestTableBody">
          <tr>
            <td colspan="6" class="empty c-empty">暂无数据</td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="pagination c-pagination">
        <div class="pagination-summary">共 0 条 · 第 1/1 页</div>
        <div class="pagination-pages">
          <button class="c-btn c-btn-sm" type="button">上一页</button>
          <button class="c-btn c-btn-sm is-active" type="button">1</button>
          <button class="c-btn c-btn-sm" type="button">下一页</button>
        </div>
      </div>
    </section>
  </div>

  <dialog class="c-dialog order-dialog-wide" id="createPayDialog" aria-labelledby="createPayTitle">
    <div class="c-dialog-header">
      <div>
        <h3 id="createPayTitle" data-i18n="pay.dialog.create.title">新建请求书</h3>
        <p class="c-card-subtitle" data-i18n="pay.dialog.create.subtitle">请填写请求书基础信息。</p>
      </div>
      <button class="c-dialog-close" type="button" aria-label="关闭" data-i18n-aria="common.close" data-dialog-close>×</button>
    </div>
    <div class="c-dialog-body">
      <div class="order-modal-layout">
        <div class="order-editor-panel">
          <div class="c-modal-form">
            <div class="c-modal-grid">
              <label class="c-inline-field">
                <span data-i18n="pay.field.request_no">请求书编号</span>
                <input id="pay-request-no" type="text" placeholder="R_20240527093000"/>
              </label>
              <label class="c-inline-field">
                <span data-i18n="pay.field.target">请求对象</span>
                <input id="pay-customer-name" type="text" placeholder="客户名称" data-i18n-placeholder="pay.placeholder.customer" list="pay-customer-list" autocomplete="off"/>
              </label>
              <datalist id="pay-customer-list"></datalist>
              <input id="pay-customer-id" type="hidden"/>
              <label class="c-inline-field">
                <span data-i18n="pay.field.order_no">对应注文书编号</span>
                <input id="pay-order-no" type="text" placeholder="PO-2024-XXX"/>
              </label>
              <label class="c-inline-field">
                <span>件名</span>
                <input id="pay-subject" type="text" placeholder="件名"/>
              </label>
              <label class="c-inline-field">
                <span>状态</span>
                <select id="pay-status-select">
                  <option value="待付款" selected>待付款</option>
                  <option value="已付款">已付款</option>
                  <option value="已取消">已取消</option>
                </select>
              </label>
              <label class="c-inline-field">
                <span>入金期日</span>
                <input id="pay-request-date" type="date"/>
              </label>
              <div class="order-issue-items">
                <div class="order-issue-items-head">
                  <div class="order-issue-items-title" data-i18n="pay.field.detail">明细</div>
                  <button class="c-btn c-btn-lite c-btn-sm" type="button" id="detailAddBtn" data-i18n="pay.detail.add">＋ 添加</button>
                </div>
                <div class="order-issue-item-list pay-line-items" id="detailTableBody"></div>
              </div>
              <label class="c-inline-field c-inline-field-full c-inline-field-textarea">
                <span>备注</span>
                <textarea id="pay-remark" class="c-input" rows="4" placeholder="填写备注内容"></textarea>
              </label>
            </div>
          </div>
        </div>
        <aside class="order-preview-panel" aria-label="PDF预览">
          <div class="order-preview-canvas">
            <div class="order-pdf-page" id="payPreviewPage">
              <div class="order-pdf-title">請 求 書</div>
              <div class="order-pdf-top pay-pdf-main-grid">
                <div class="pay-pdf-left-column">
                  <div class="order-pdf-customer">
                    <div class="order-pdf-customer-name"><span id="previewCustomerName">-</span></div>
                    <div class="order-pdf-customer-address" id="previewCustomerAddressBlock" hidden>
                      <div id="previewCustomerPostalCode"></div>
                      <div id="previewCustomerAddress"></div>
                    </div>
                    <div class="order-pdf-note">下記の通りご請求申し上げます。</div>
                  </div>
                  <div class="order-pdf-line"><span>件名</span><div class="order-pdf-line-value" id="previewSubject"></div></div>
                  <table class="order-pdf-info pay-pdf-bank-table">
                    <thead>
                    <tr>
                      <th>入金期日</th>
                      <th>振込先</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                      <td id="previewPayDate"></td>
                      <td id="previewBankAccount">-</td>
                    </tr>
                    </tbody>
                  </table>
                </div>
                <div class="pay-pdf-right-column">
                  <table class="order-pdf-info">
                    <tbody>
                    <tr>
                      <th>請求書番号</th>
                      <td id="previewRequestNo">-</td>
                    </tr>
                    <tr>
                      <th>請求日</th>
                      <td id="previewRequestDate">-</td>
                    </tr>
                    </tbody>
                  </table>
                  <div class="order-pdf-company">
                    <div class="order-pdf-company-name" id="previewCompanyName"></div>
                    <div class="order-pdf-line"><span>〒</span><div class="order-pdf-line-value" id="previewCompanyPostalCode"></div></div>
                    <div class="order-pdf-line"><span>住所</span><div class="order-pdf-line-value" id="previewCompanyAddress"></div></div>
                    <div class="order-pdf-line"><span>TEL</span><div class="order-pdf-line-value" id="previewCompanyTel"></div></div>
                    <div class="order-pdf-line"><span>FAX</span><div class="order-pdf-line-value" id="previewCompanyFax"></div></div>
                    <div class="order-pdf-line"><span>Mail</span><div class="order-pdf-line-value" id="previewCompanyMail"></div></div>
                    <div class="order-pdf-line"><span>担当者</span><div class="order-pdf-line-value" id="previewCompanyOwner"></div></div>
                    <div class="order-pdf-stamp-row">
                      <div></div>
                      <div class="order-pdf-stamp-cell">
                        <div class="order-pdf-stamp-label">担当印</div>
                        <div class="order-pdf-stamp" id="previewOwnerSeal"></div>
                      </div>
                      <div class="order-pdf-stamp-cell">
                        <div class="order-pdf-stamp-label">会社印</div>
                        <div class="order-pdf-stamp" id="previewCompanySeal"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="order-pdf-total">
                <div class="order-pdf-total-label">請求金額</div>
                <div class="order-pdf-total-value" id="previewTotal">0円</div>
              </div>
              <div class="order-pdf-detail-block">
                <table class="order-pdf-detail">
                  <thead>
                  <tr>
                    <th>項目</th>
                    <th>数量</th>
                    <th>金額</th>
                    <th>単位</th>
                    <th>税金</th>
                  </tr>
                  </thead>
                  <tbody id="previewDetailBody"></tbody>
                </table>
                <table class="order-pdf-summary">
                  <tbody>
                  <tr><th>小計</th><td id="previewSubtotal">0円</td></tr>
                  <tr><th>税額</th><td id="previewTax">0円</td></tr>
                  <tr><th>合計</th><td id="previewSummaryTotal">0円</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="order-pdf-remark">
                <div class="order-pdf-remark-title">備考</div>
                <div class="order-pdf-remark-content" id="previewRemark"></div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <div class="c-dialog-actions">
      <button class="c-btn c-btn-secondary" type="button" data-dialog-close data-i18n="common.cancel">取消</button>
      <button class="c-btn c-btn-primary" type="button" id="payDialogSubmitBtn" data-i18n="common.create">开始创建</button>
    </div>
  </dialog>

  <dialog class="c-dialog order-dialog-wide order-send-dialog" id="paySendDialog" aria-labelledby="paySendTitle">
    <div class="c-dialog-header">
      <div>
        <h3 id="paySendTitle">发送请求书</h3>
        <p class="c-card-subtitle">确认PDF内容并填写邮件信息。</p>
      </div>
      <button class="c-dialog-close" type="button" aria-label="关闭" data-dialog-close>×</button>
    </div>
    <div class="c-dialog-body">
      <div class="order-send-layout">
        <aside class="order-preview-panel" aria-label="PDF预览">
          <div class="order-preview-canvas">
            <iframe class="order-send-pdf-frame" id="paySendPdfFrame" title="请求书PDF预览" hidden></iframe>
            <div class="order-send-no-pdf" id="paySendNoPdfMessage" hidden>没有PDF</div>
          </div>
        </aside>
        <section class="order-send-panel" aria-label="发送邮件">
          <div class="order-send-form">
            <div class="order-send-head-grid">
              <label class="order-send-field">
                <span>邮件主题</span>
                <input id="pay-send-subject" type="text" placeholder="请输入邮件主题"/>
              </label>
              <label class="order-send-field order-send-type-field">
                <span>送信类型</span>
                <select id="pay-send-type">
                  <option value="-1">其他</option>
                  <option value="0">BP</option>
                  <option value="1">技术者送信</option>
                  <option value="2">案件送信</option>
                  <option value="3">发注</option>
                  <option value="4" selected>请求书</option>
                </select>
              </label>
            </div>
            <div class="order-send-field">
              <span class="order-send-field-head">
                <span>邮件内容</span>
                <button
                  id="pay-send-template-edit"
                  class="songxin-template-trigger order-send-template-trigger"
                  type="button"
                  aria-label="编辑模板信息"
                  title="编辑模板信息"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 2h8l5 5v4.25a1 1 0 1 1-2 0V8h-4V4H6v16h5.25a1 1 0 1 1 0 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm9 3.41V7h1.59L15 5.41zm-2.04 9.33 4.83-4.83 2.12 2.12-4.83 4.83-2.54.42.42-2.54zm6.24-6.24.71-.71a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1 0 1.41l-.71.71-2.12-2.12z"/>
                  </svg>
                </button>
              </span>
              <textarea id="pay-send-body" placeholder="请输入邮件内容"></textarea>
            </div>
            <div class="order-send-bottom-grid">
              <div class="order-send-field">
                <span>上传附件</span>
                <div class="order-send-upload-row" data-file-i18n-skip="1">
                  <input id="pay-send-files" class="songxin-file-input" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.png,.jpeg,.xls,.xlsx"/>
                  <button id="pay-send-files-trigger" class="c-btn c-btn-ghost" type="button">选择文件</button>
                  <span id="pay-send-files-status">未添加附件</span>
                  <span class="order-send-upload-hint">支持多文件，建议单个不超过10MB</span>
                </div>
                <div id="pay-send-attachment-list" class="order-send-attachment-list">暂无附件</div>
              </div>
              <div class="order-send-recipient-stack">
                <label class="order-send-field">
                  <span>收件人</span>
                  <div class="order-send-combobox" id="pay-send-to-combobox">
                    <input id="pay-send-to" type="email" placeholder="name@example.com" autocomplete="off"/>
                    <button class="order-send-combobox-toggle" id="pay-send-to-toggle" type="button" aria-label="展开收件人选项">▾</button>
                    <div class="order-send-combobox-menu" id="pay-send-to-options" hidden></div>
                  </div>
                </label>
                <label class="order-send-field order-send-cc">
                  <span>抄送（可选）</span>
                  <input id="pay-send-cc" type="email" placeholder="cc@example.com"/>
                </label>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div class="c-dialog-actions order-send-actions">
      <button class="c-btn c-btn-secondary" type="button" data-dialog-close>取消</button>
      <button class="c-btn c-btn-primary order-send-submit" type="button" id="paySendSubmit">发送&nbsp; &gt;</button>
    </div>
  </dialog>

  <dialog id="pay-send-template-dialog" class="c-dialog songxin-template-dialog">
    <div class="c-dialog-header">
      <div class="songxin-template-header-text">
        <h3>编辑模板信息</h3>
        <p class="c-card-subtitle songxin-template-subtitle">请求书邮件模板。</p>
      </div>
      <button class="c-dialog-close" type="button" aria-label="关闭" data-dialog-close>×</button>
    </div>
    <div class="c-dialog-body">
      <textarea
        id="pay-send-template-content"
        class="songxin-template-textarea"
        rows="14"
        placeholder="请输入模板信息"
      ></textarea>
    </div>
    <div class="c-dialog-actions">
      <button class="c-btn c-btn-ghost" type="button" data-dialog-close>取消</button>
      <button id="pay-send-template-save" class="c-btn c-btn-primary" type="button">保存</button>
    </div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    const i18n = window.I18N || null;
    const t = (key, fallback) => (i18n && typeof i18n.t === "function" ? i18n.t(key) : fallback);
    if (i18n) {
      i18n.init();
      i18n.apply();
    }

    const createPayBtn = document.getElementById("createPayBtn");
    const createPayDialog = document.getElementById("createPayDialog");
    const createPayTitle = document.getElementById("createPayTitle");
    const payDialogSubmitBtn = document.getElementById("payDialogSubmitBtn");
    const detailAddBtn = document.getElementById("detailAddBtn");
    const detailTableBody = document.getElementById("detailTableBody");
    const payRequestTableBody = document.getElementById("payRequestTableBody");
    const payPagination = document.querySelector(".pay-request-page .c-pagination");
    const payPaginationPages = payPagination ? payPagination.querySelector(".pagination-pages") : null;
    const payPaginationSummary = payPagination ? payPagination.querySelector(".pagination-summary") : null;
    const payFilterCustomerInput = document.getElementById("pay-filter-customer");
    const payFilterCustomerList = document.getElementById("pay-filter-customer-list");
    const payFilterMonthInput = document.getElementById("pay-filter-month");
    const paySearchBtn = document.getElementById("paySearchBtn");
    const payResetBtn = document.getElementById("payResetBtn");
    const paySendDialog = document.getElementById("paySendDialog");
    const paySendSubmit = document.getElementById("paySendSubmit");
    const paySendTemplateEdit = document.getElementById("pay-send-template-edit");
    const paySendTemplateDialog = document.getElementById("pay-send-template-dialog");
    const paySendTemplateContent = document.getElementById("pay-send-template-content");
    const paySendTemplateSave = document.getElementById("pay-send-template-save");
    const paySendPdfFrame = document.getElementById("paySendPdfFrame");
    const paySendNoPdfMessage = document.getElementById("paySendNoPdfMessage");
    const payCustomerNameInput = document.getElementById("pay-customer-name");
    const payCustomerIdInput = document.getElementById("pay-customer-id");
    const payCustomerList = document.getElementById("pay-customer-list");
    const payStatusSelect = document.getElementById("pay-status-select");
    const payRequestTable = document.querySelector(".pay-request-table");
    const payRequestNoInput = document.getElementById("pay-request-no");
    const paySubjectInput = document.getElementById("pay-subject");
    const payRequestDateInput = document.getElementById("pay-request-date");
    const payRemarkInput = document.getElementById("pay-remark");
    const previewRequestDate = document.getElementById("previewRequestDate");
    const previewRequestNo = document.getElementById("previewRequestNo");
    const previewCustomerName = document.getElementById("previewCustomerName");
    const previewCustomerAddressBlock = document.getElementById("previewCustomerAddressBlock");
    const previewCustomerPostalCode = document.getElementById("previewCustomerPostalCode");
    const previewCustomerAddress = document.getElementById("previewCustomerAddress");
    const previewCompanyName = document.getElementById("previewCompanyName");
    const previewCompanyPostalCode = document.getElementById("previewCompanyPostalCode");
    const previewCompanyAddress = document.getElementById("previewCompanyAddress");
    const previewCompanyTel = document.getElementById("previewCompanyTel");
    const previewCompanyFax = document.getElementById("previewCompanyFax");
    const previewCompanyMail = document.getElementById("previewCompanyMail");
    const previewCompanyOwner = document.getElementById("previewCompanyOwner");
    const previewOwnerSeal = document.getElementById("previewOwnerSeal");
    const previewCompanySeal = document.getElementById("previewCompanySeal");
    const previewSubject = document.getElementById("previewSubject");
    const previewSubtotal = document.getElementById("previewSubtotal");
    const previewTax = document.getElementById("previewTax");
    const previewTotal = document.getElementById("previewTotal");
    const previewSummaryTotal = document.getElementById("previewSummaryTotal");
    const previewPayDate = document.getElementById("previewPayDate");
    const previewBankAccount = document.getElementById("previewBankAccount");
    const previewDetailBody = document.getElementById("previewDetailBody");
    const previewRemark = document.getElementById("previewRemark");
    const payPreviewPage = document.getElementById("payPreviewPage");
    const payPreviewCanvas = payPreviewPage ? payPreviewPage.parentElement : null;
    const PDF_PREVIEW_WIDTH = 595;
    const PDF_PREVIEW_HEIGHT = 842;
    const PAY_PAGE_SIZE = 10;
    let payCurrentPage = 1;
    let payCurrentItems = [];
    let payCurrentEditId = null;
    let payCurrentSendItem = null;
    let paySendExtraFiles = [];
    let paySendRecipientOptions = [];
    const paySendTemplateName = "pay_request";
    const paySendTemplateCache = {};
    const paySendFields = {
      subject: document.getElementById("pay-send-subject"),
      type: document.getElementById("pay-send-type"),
      to: document.getElementById("pay-send-to"),
      toCombobox: document.getElementById("pay-send-to-combobox"),
      toToggle: document.getElementById("pay-send-to-toggle"),
      toOptions: document.getElementById("pay-send-to-options"),
      body: document.getElementById("pay-send-body"),
      cc: document.getElementById("pay-send-cc"),
      files: document.getElementById("pay-send-files"),
      filesTrigger: document.getElementById("pay-send-files-trigger"),
      filesStatus: document.getElementById("pay-send-files-status"),
      attachmentList: document.getElementById("pay-send-attachment-list")
    };
    const payCustomerMap = new Map();
    const payFilterCustomerMap = new Map();
    let customerAddressState = {
      customerId: "",
      customerName: "",
      postalCode: "",
      address: "",
      requestId: 0
    };
    let bankAccountState = {
      bank_name: "",
      branch_code: "",
      branch_name: "",
      account_type: "",
      account_number: "",
      account_holder: ""
    };
    let companySealObjectUrl = "";
    let ownerSealObjectUrl = "";
    let companyInfoState = {
      company_name: "",
      postal_code: "",
      address: "",
      tel: "",
      fax: "",
      mail: "",
      sealUrl: ""
    };
    let ownerInfoState = {
      name: "",
      sealUrl: ""
    };

    if (window.initDialogCloseBehavior) {
      window.initDialogCloseBehavior({ dialogs: [createPayDialog, paySendDialog, paySendTemplateDialog] });
    }

    const getDateParts = (date = new Date()) => {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      const hh = String(date.getHours()).padStart(2, "0");
      const mi = String(date.getMinutes()).padStart(2, "0");
      const ss = String(date.getSeconds()).padStart(2, "0");
      return { yyyy, mm, dd, hh, mi, ss };
    };

    const todayText = () => {
      const { yyyy, mm, dd } = getDateParts();
      return `${yyyy}-${mm}-${dd}`;
    };

    const currentMonthText = () => (
      typeof window.getCurrentMonth === "function"
        ? window.getCurrentMonth()
        : todayText().slice(0, 7)
    );

    const buildRequestNo = () => {
      const { yyyy, mm, dd, hh, mi, ss } = getDateParts();
      return `R_${yyyy}${mm}${dd}${hh}${mi}${ss}`;
    };

    const PAY_TAX_RATE = 0.1;
    const formatYen = (value) => `${Number(value || 0).toLocaleString()}円`;
    const parseNumber = (value) => Number(String(value || "").replace(/[^\d.]/g, "")) || 0;
    const debounce = (fn, delay = 250) => {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    };

    const escapeHtml = (value) => (
      window.escapeHtml ? window.escapeHtml(value) : String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
    );

    const formatCurrency = (value) => `¥ ${Number(value || 0).toLocaleString("ja-JP", { maximumFractionDigits: 0 })}`;

    const showPayError = (error, fallback = "处理失败") => {
      const message = error?.message || error?.payload?.message || fallback;
      window.alert(message);
    };

    const setDialogReadonly = (readonly) => {
      if (!createPayDialog) return;
      createPayDialog.querySelectorAll("input, select, textarea").forEach((field) => {
        if (!readonly && field.hasAttribute("data-always-disabled")) return;
        if (field.type !== "hidden") field.disabled = readonly;
      });
      if (detailAddBtn) detailAddBtn.disabled = readonly;
      if (detailTableBody) {
        detailTableBody.querySelectorAll("button").forEach((btn) => {
          btn.disabled = readonly;
        });
      }
    };

    const buildDetailRow = () => {
      const row = document.createElement("div");
      row.className = "order-issue-item-row pay-line-item-row";
      row.innerHTML = `
        <label class="c-inline-field">
          <span>${t("pay.detail.item", "项目")}</span>
          <input type="text" placeholder="项目" data-pay-item-field="item"/>
        </label>
        <label class="c-inline-field">
          <span>${t("pay.detail.qty", "数量")}</span>
          <input type="number" min="0" step="0.01" placeholder="1" data-pay-item-field="qty"/>
        </label>
        <label class="c-inline-field">
          <span>${t("pay.detail.price", "单价")}</span>
          <input type="text" placeholder="¥ 0" data-pay-item-field="price"/>
        </label>
        <label class="c-inline-field">
          <span>税金</span>
          <input type="text" placeholder="¥ 0" data-pay-item-field="tax"/>
        </label>
        <label class="c-inline-field">
          <span>单位</span>
          <input type="text" placeholder="式" data-pay-item-field="unit"/>
        </label>
        <button class="c-btn c-btn-ghost c-btn-sm order-issue-item-remove" type="button" data-action="remove-pay-line" aria-label="删除">×</button>
      `;
      return row;
    };

    const resetLineItems = () => {
      if (!detailTableBody) return;
      detailTableBody.innerHTML = "";
      detailTableBody.appendChild(buildDetailRow());
    };

    const readItemField = (row, field) => row.querySelector(`[data-pay-item-field="${field}"]`)?.value?.trim() || "";
    const getItemInput = (row, field) => row.querySelector(`[data-pay-item-field="${field}"]`);
    const hasManualTax = (row) => row?.dataset?.taxManual === "true";

    const setAutoTaxForRow = (row) => {
      if (!row || hasManualTax(row)) return;
      const priceInput = getItemInput(row, "price");
      const taxInput = getItemInput(row, "tax");
      if (!priceInput || !taxInput) return;
      const qty = parseNumber(readItemField(row, "qty")) || 1;
      const price = parseNumber(priceInput.value);
      const amount = price * qty;
      taxInput.value = amount ? `¥ ${Math.round(amount * PAY_TAX_RATE).toLocaleString()}` : "";
    };

    const collectItems = () => {
      const rows = Array.from(detailTableBody ? detailTableBody.querySelectorAll(".pay-line-item-row") : []);
      return rows.map((row) => {
        const price = parseNumber(readItemField(row, "price"));
        const qty = parseNumber(readItemField(row, "qty")) || 1;
        const amount = price * qty;
        const tax = parseNumber(readItemField(row, "tax"));
        return {
          item: readItemField(row, "item"),
          price,
          qty,
          amount,
          tax,
          unit: readItemField(row, "unit")
        };
      });
    };

    const setItemInputValue = (row, field, value) => {
      const input = getItemInput(row, field);
      if (!input) return;
      if ((field === "price" || field === "tax") && value !== "" && value != null) {
        input.value = `¥ ${Number(value || 0).toLocaleString()}`;
        return;
      }
      input.value = value == null ? "" : String(value);
    };

    const setLineItems = (items) => {
      if (!detailTableBody) return;
      detailTableBody.innerHTML = "";
      const rows = Array.isArray(items) && items.length ? items : [{}];
      rows.forEach((item) => {
        const row = buildDetailRow();
        setItemInputValue(row, "item", item.item || "");
        setItemInputValue(row, "qty", item.qty || "");
        setItemInputValue(row, "price", item.price || "");
        setItemInputValue(row, "tax", item.tax || "");
        setItemInputValue(row, "unit", item.unit || "");
        row.dataset.taxManual = item.tax ? "true" : "";
        detailTableBody.appendChild(row);
      });
    };

    const calculateTotal = (items) => items.reduce((sum, item) => sum + item.amount + item.tax, 0);

    const renderCustomerAddress = () => {
      const hasAddress = Boolean(customerAddressState.postalCode || customerAddressState.address);
      if (previewCustomerAddressBlock) previewCustomerAddressBlock.hidden = !hasAddress;
      if (previewCustomerPostalCode) previewCustomerPostalCode.textContent = customerAddressState.postalCode || "";
      if (previewCustomerAddress) previewCustomerAddress.textContent = customerAddressState.address || "";
      paginatePreview();
    };

    const formatBankAccountLines = (settings) => {
      const bankAndBranch = [
        settings.bank_name,
        settings.branch_name ? `${settings.branch_name}支店` : "",
        settings.branch_code ? `(${settings.branch_code})` : ""
      ].filter(Boolean).join(" ");
      const account = [
        settings.account_type,
        settings.account_number,
        settings.account_holder
      ].filter(Boolean).join(" ");
      return [bankAndBranch, account].filter(Boolean);
    };

    const renderBankAccount = () => {
      if (!previewBankAccount) return;
      const lines = formatBankAccountLines(bankAccountState);
      previewBankAccount.innerHTML = "";
      if (!lines.length) {
        previewBankAccount.textContent = "-";
        paginatePreview();
        return;
      }
      lines.forEach((line) => {
        const div = document.createElement("div");
        div.textContent = line;
        previewBankAccount.appendChild(div);
      });
      paginatePreview();
    };

    const clearCompanySealObjectUrl = () => {
      if (companySealObjectUrl) {
        URL.revokeObjectURL(companySealObjectUrl);
        companySealObjectUrl = "";
      }
    };

    const clearOwnerSealObjectUrl = () => {
      if (ownerSealObjectUrl) {
        URL.revokeObjectURL(ownerSealObjectUrl);
        ownerSealObjectUrl = "";
      }
    };

    const renderCompanyInfo = () => {
      if (previewCompanyName) previewCompanyName.textContent = companyInfoState.company_name || "";
      if (previewCompanyPostalCode) previewCompanyPostalCode.textContent = companyInfoState.postal_code || "";
      if (previewCompanyAddress) previewCompanyAddress.textContent = companyInfoState.address || "";
      if (previewCompanyTel) previewCompanyTel.textContent = companyInfoState.tel || "";
      if (previewCompanyFax) previewCompanyFax.textContent = companyInfoState.fax || "";
      if (previewCompanyMail) previewCompanyMail.textContent = companyInfoState.mail || "";
      if (previewCompanySeal) {
        previewCompanySeal.innerHTML = "";
        if (companyInfoState.sealUrl) {
          const img = document.createElement("img");
          img.src = companyInfoState.sealUrl;
          img.alt = "会社印";
          previewCompanySeal.appendChild(img);
        }
      }
      paginatePreview();
    };

    const renderOwnerInfo = () => {
      if (previewCompanyOwner) previewCompanyOwner.textContent = ownerInfoState.name || "";
      if (previewOwnerSeal) {
        previewOwnerSeal.innerHTML = "";
        if (ownerInfoState.sealUrl) {
          const img = document.createElement("img");
          img.src = ownerInfoState.sealUrl;
          img.alt = "担当印";
          previewOwnerSeal.appendChild(img);
        }
      }
      paginatePreview();
    };

    const preparePreviewPage = (page) => {
      page.removeAttribute("id");
      page.classList.add("is-paginated");
      page.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
      return page;
    };

    const createPreviewPage = () => {
      const page = preparePreviewPage(payPreviewPage.cloneNode(false));
      page.style.width = `${PDF_PREVIEW_WIDTH}px`;
      page.style.height = `${PDF_PREVIEW_HEIGHT}px`;
      page.style.maxWidth = "none";
      page.innerHTML = "";
      return page;
    };

    const getPageContentNodes = () => Array.from(payPreviewPage.children)
      .filter((node) => !node.classList || !node.classList.contains("order-pdf-page-number"));

    const appendPageNumber = (page, index, total) => {
      let node = page.querySelector(".order-pdf-page-number");
      if (!node) {
        node = document.createElement("div");
        node.className = "order-pdf-page-number";
        page.appendChild(node);
      }
      node.textContent = `${index} / ${total}`;
    };

    const pageOverflows = (page) => page.scrollHeight > page.clientHeight + 1;

    const hasPrintableContent = (page) => Array.from(page.children)
      .some((node) => !node.classList || !node.classList.contains("order-pdf-page-number"));

    const appendBlockWithOverflowCheck = (pages, block) => {
      let page = pages[pages.length - 1];
      page.appendChild(block);
      if (!pageOverflows(page) || !hasPrintableContent(page)) return page;
      page.removeChild(block);
      page = createPreviewPage();
      pages.push(page);
      payPreviewCanvas.appendChild(page);
      page.appendChild(block);
      return page;
    };

    const createDetailBlockShell = (sourceBlock, includeHeader = true) => {
      const block = sourceBlock.cloneNode(false);
      const sourceTable = sourceBlock.querySelector(".order-pdf-detail");
      if (sourceTable) {
        const table = sourceTable.cloneNode(false);
        if (includeHeader) {
          const thead = sourceTable.querySelector("thead");
          if (thead) table.appendChild(thead.cloneNode(true));
        }
        const tbody = document.createElement("tbody");
        table.appendChild(tbody);
        block.appendChild(table);
      }
      return block;
    };

    const appendDetailBlockPaginated = (pages, sourceBlock) => {
      const sourceRows = Array.from(sourceBlock.querySelectorAll(".order-pdf-detail tbody tr"));
      const sourceSummary = sourceBlock.querySelector(".order-pdf-summary");
      let page = pages[pages.length - 1];
      let block = createDetailBlockShell(sourceBlock, true);
      page.appendChild(block);

      sourceRows.forEach((sourceRow) => {
        const row = sourceRow.cloneNode(true);
        const tbody = block.querySelector("tbody");
        tbody.appendChild(row);
        if (!pageOverflows(page)) return;
        if (tbody.children.length <= 1) {
          if (page.children.length > 1) {
            page.removeChild(block);
            page = createPreviewPage();
            pages.push(page);
            payPreviewCanvas.appendChild(page);
            block = createDetailBlockShell(sourceBlock, true);
            page.appendChild(block);
            block.querySelector("tbody").appendChild(row);
          }
          return;
        }
        tbody.removeChild(row);
        if (!tbody.children.length && page.contains(block)) page.removeChild(block);
        page = createPreviewPage();
        pages.push(page);
        payPreviewCanvas.appendChild(page);
        block = createDetailBlockShell(sourceBlock, true);
        page.appendChild(block);
        block.querySelector("tbody").appendChild(row);
      });

      if (sourceSummary) {
        const summary = sourceSummary.cloneNode(true);
        block.appendChild(summary);
        if (pageOverflows(page)) {
          block.removeChild(summary);
          page = createPreviewPage();
          pages.push(page);
          payPreviewCanvas.appendChild(page);
          const summaryBlock = sourceBlock.cloneNode(false);
          summaryBlock.appendChild(summary);
          page.appendChild(summaryBlock);
        }
      }
    };

    const paginatePreview = () => {
      if (!payPreviewPage || !payPreviewCanvas) return [];
      const sourceNodes = getPageContentNodes();
      payPreviewCanvas.innerHTML = "";
      const pages = [createPreviewPage()];
      payPreviewCanvas.appendChild(pages[0]);

      sourceNodes.forEach((sourceNode) => {
        if (sourceNode.classList && sourceNode.classList.contains("order-pdf-detail-block")) {
          appendDetailBlockPaginated(pages, sourceNode);
          return;
        }
        appendBlockWithOverflowCheck(pages, sourceNode.cloneNode(true));
      });

      const visiblePages = pages.filter(hasPrintableContent);
      const total = visiblePages.length || 1;
      visiblePages.forEach((page, index) => appendPageNumber(page, index + 1, total));
      return visiblePages;
    };

    const refreshPreviewAfterDialogOpen = () => {
      requestAnimationFrame(() => {
        requestAnimationFrame(updatePreview);
      });
    };

    const fetchCompanySealUrl = async (filename) => {
      clearCompanySealObjectUrl();
      if (!filename) return "";
      try {
        const response = await fetch(`/api/company-info/seal?v=${encodeURIComponent(`${filename}-${Date.now()}`)}`, {
          credentials: "same-origin"
        });
        if (!response.ok) return "";
        const blob = await response.blob();
        if (!blob || !blob.size) return "";
        companySealObjectUrl = URL.createObjectURL(blob);
        return companySealObjectUrl;
      } catch (error) {
        console.warn(error);
        return "";
      }
    };

    const loadCompanyInfo = async () => {
      try {
        const payload = await window.requestJson("/api/company-info", { method: "GET" });
        const settings = payload?.data?.settings || {};
        const sealUrl = await fetchCompanySealUrl(settings.seal_filename || "");
        companyInfoState = {
          company_name: String(settings.company_name || ""),
          postal_code: String(settings.postal_code || ""),
          address: String(settings.address || ""),
          tel: String(settings.tel || ""),
          fax: String(settings.fax || ""),
          mail: String(settings.mail || ""),
          sealUrl
        };
      } catch (error) {
        console.warn(error);
        clearCompanySealObjectUrl();
        companyInfoState = { ...companyInfoState, sealUrl: "" };
      }
      renderCompanyInfo();
    };

    const fetchOwnerSealUrl = async (employeeId) => {
      clearOwnerSealObjectUrl();
      if (!employeeId) return "";
      try {
        const response = await fetch(`/api/employees/${encodeURIComponent(employeeId)}/seal?v=${Date.now()}`, {
          credentials: "same-origin"
        });
        if (!response.ok) return "";
        const blob = await response.blob();
        if (!blob || !blob.size) return "";
        ownerSealObjectUrl = URL.createObjectURL(blob);
        return ownerSealObjectUrl;
      } catch (error) {
        console.warn(error);
        return "";
      }
    };

    const loadOwnerInfo = async () => {
      const employeeId = localStorage.getItem("app_employee_id") || "";
      const employeeName = localStorage.getItem("app_employee_name") || "";
      ownerInfoState = {
        name: employeeName,
        sealUrl: await fetchOwnerSealUrl(employeeId)
      };
      renderOwnerInfo();
    };

    const loadBankAccount = () => {
      window.requestJson("/api/sys-settings/bank-account", { method: "GET" })
        .then((payload) => {
          const settings = payload?.data?.settings || {};
          bankAccountState = {
            bank_name: String(settings.bank_name || ""),
            branch_code: String(settings.branch_code || ""),
            branch_name: String(settings.branch_name || ""),
            account_type: String(settings.account_type || ""),
            account_number: String(settings.account_number || ""),
            account_holder: String(settings.account_holder || "")
          };
          renderBankAccount();
        })
        .catch((error) => {
          console.warn(error);
          renderBankAccount();
        });
    };

    const splitCustomerAddress = (rawAddress) => {
      const value = String(rawAddress || "").trim();
      if (!value) return { postalCode: "", address: "" };
      const match = value.match(/(?:〒\s*)?(\d{3}-?\d{4})/);
      if (!match) return { postalCode: "", address: value };
      return {
        postalCode: `〒${match[1]}`,
        address: value.replace(match[0], "").trim()
      };
    };

    const updateCustomerAddress = async () => {
      const selectedName = payCustomerNameInput?.value?.trim() || "";
      const customerId = String(payCustomerMap.get(selectedName) || payCustomerIdInput?.value || "").trim();
      if (!customerId) {
        customerAddressState = { customerId: "", customerName: "", postalCode: "", address: "", requestId: customerAddressState.requestId + 1 };
        renderCustomerAddress();
        return;
      }
      if (customerAddressState.customerId === customerId && customerAddressState.customerName === selectedName) {
        renderCustomerAddress();
        return;
      }
      const requestId = customerAddressState.requestId + 1;
      customerAddressState = { customerId, customerName: selectedName, postalCode: "", address: "", requestId };
      renderCustomerAddress();
      try {
        const payload = await window.requestJson(`/api/customers/${encodeURIComponent(customerId)}`, { method: "GET" });
        if (customerAddressState.requestId !== requestId) return;
        const customer = payload?.data?.item || {};
        const addressParts = splitCustomerAddress(customer.company_address || "");
        customerAddressState = { customerId, customerName: selectedName, postalCode: addressParts.postalCode, address: addressParts.address, requestId };
      } catch (error) {
        console.warn(error);
        if (customerAddressState.requestId !== requestId) return;
        customerAddressState = { customerId, customerName: selectedName, postalCode: "", address: "", requestId };
      }
      renderCustomerAddress();
    };

    const updatePreview = () => {
      const items = collectItems();
      const subtotal = items.reduce((sum, item) => sum + item.amount, 0);
      const tax = items.reduce((sum, item) => sum + item.tax, 0);
      const total = subtotal + tax;

      if (previewRequestDate) previewRequestDate.textContent = todayText();
      if (previewRequestNo) previewRequestNo.textContent = payRequestNoInput?.value?.trim() || "-";
      if (previewCustomerName) {
        const name = payCustomerNameInput?.value?.trim() || "";
        previewCustomerName.textContent = name ? `${name} 御中` : "御中";
      }
      if (previewSubject) previewSubject.textContent = paySubjectInput?.value?.trim() || "";
      if (previewPayDate) previewPayDate.textContent = payRequestDateInput?.value || "";
      if (previewRemark) previewRemark.textContent = payRemarkInput?.value || "";
      if (previewSubtotal) previewSubtotal.textContent = formatYen(subtotal);
      if (previewTax) previewTax.textContent = formatYen(tax);
      if (previewTotal) previewTotal.textContent = formatYen(total);
      if (previewSummaryTotal) previewSummaryTotal.textContent = formatYen(total);
      if (previewDetailBody) {
        previewDetailBody.innerHTML = "";
        const minRows = 8;
        for (let i = 0; i < Math.max(items.length, minRows); i += 1) {
          const item = items[i] || {};
          const tr = document.createElement("tr");
          const itemCell = document.createElement("td");
          const qtyCell = document.createElement("td");
          const priceCell = document.createElement("td");
          const unitCell = document.createElement("td");
          const taxCell = document.createElement("td");
          itemCell.style.textAlign = "left";
          qtyCell.style.textAlign = "right";
          priceCell.style.textAlign = "right";
          taxCell.style.textAlign = "right";
          itemCell.textContent = item.item || "";
          qtyCell.textContent = item.qty ? Number(item.qty).toLocaleString() : "";
          priceCell.textContent = item.amount ? formatYen(item.amount) : "";
          unitCell.textContent = item.unit || "";
          taxCell.textContent = item.tax ? formatYen(item.tax) : "";
          tr.append(itemCell, qtyCell, priceCell, unitCell, taxCell);
          previewDetailBody.appendChild(tr);
        }
      }
      paginatePreview();
    };

    const resetCreateForm = () => {
      if (payRequestNoInput) payRequestNoInput.value = buildRequestNo();
      if (payCustomerNameInput) payCustomerNameInput.value = "";
      if (payCustomerIdInput) payCustomerIdInput.value = "";
      if (payCustomerList) payCustomerList.innerHTML = "";
      if (payStatusSelect) payStatusSelect.value = "待付款";
      if (paySubjectInput) paySubjectInput.value = "";
      if (payRequestDateInput) payRequestDateInput.value = "";
      if (payRemarkInput) payRemarkInput.value = "";
      payCustomerMap.clear();
      customerAddressState = { customerId: "", customerName: "", postalCode: "", address: "", requestId: customerAddressState.requestId + 1 };
      renderCustomerAddress();
      resetLineItems();
      updatePreview();
    };

    const setDialogMode = (mode) => {
      if (!createPayDialog) return;
      createPayDialog.dataset.mode = mode;
      if (createPayTitle) {
        createPayTitle.textContent = mode === "edit" ? "编辑请求书" : mode === "view" ? "请求书详情" : "新建请求书";
      }
      if (payDialogSubmitBtn) {
        payDialogSubmitBtn.textContent = mode === "edit" ? "保存修改" : mode === "view" ? "关闭" : "开始创建";
      }
      if (mode === "create") resetCreateForm();
      setDialogReadonly(mode === "view");
      if (payStatusSelect) {
        payStatusSelect.disabled = mode === "create" || mode === "view";
      }
    };

    const renderPayCustomerOptions = (listEl, map, items) => {
      map.clear();
      listEl.innerHTML = "";
      items.forEach((item) => {
        if (!item || !item.company_name) return;
        map.set(item.company_name, item.id);
        const opt = document.createElement("option");
        opt.value = item.company_name;
        listEl.appendChild(opt);
      });
    };

    const fetchPayCustomerOptions = (inputEl, listEl, map, options = {}) => {
      const keyword = inputEl.value.trim();
      if (!keyword && options.useDefault !== true) {
        listEl.innerHTML = "";
        map.clear();
        return;
      }
      const params = window.createParams([
        ["company_name", keyword],
        ["page", "1"],
        ["page_size", "5"],
      ]);
      window.requestJson(window.buildUrl("/api/customers", params), { method: "GET" })
        .then((payload) => {
          const result = payload.data || {};
          const items = Array.isArray(result.items) ? result.items : [];
          renderPayCustomerOptions(listEl, map, items);
        })
        .catch(() => {
          listEl.innerHTML = "";
          map.clear();
        });
    };

    const buildPdfFileName = () => {
      const rawNo = payRequestNoInput?.value?.trim() || "";
      const normalized = rawNo.replace(/[\\/:*?"<>|]/g, "_");
      return normalized ? `${normalized}.pdf` : `${buildRequestNo()}.pdf`;
    };

    const readBlobAsBase64 = (blob) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = String(reader.result || "");
        resolve(result.includes(",") ? result.split(",").pop() : result);
      };
      reader.onerror = () => reject(reader.error || new Error("文件读取失败"));
      reader.readAsDataURL(blob);
    });

    const sanitizeMailFilenamePart = (value, fallback) => {
      const normalized = String(value || "")
        .trim()
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\s+/g, "");
      return normalized || fallback;
    };

    const buildPayAttachmentBaseName = (item) => {
      const companyName = sanitizeMailFilenamePart(item?.customer_name, "取引先");
      const requestNo = sanitizeMailFilenamePart(item?.request_no || buildRequestNo(), "請求書番号未設定");
      return `${companyName}御中_請求書_${requestNo}`;
    };

    const buildPaySafePdfName = (item) => `${buildPayAttachmentBaseName(item)}.pdf`;

    const hasStoredPayPdf = (item) => Boolean(item?.id && item?.pdf_file);

    const getStoredPayPdfUrl = (item) => (
      hasStoredPayPdf(item)
        ? `/api/pay-requests/${encodeURIComponent(item.id)}/pdf`
        : ""
    );

    const setPaySendPdfDisplayMode = (item) => {
      const pdfUrl = getStoredPayPdfUrl(item);
      if (paySendPdfFrame) {
        paySendPdfFrame.hidden = !pdfUrl;
        paySendPdfFrame.src = pdfUrl || "about:blank";
      }
      if (paySendNoPdfMessage) paySendNoPdfMessage.hidden = Boolean(pdfUrl);
    };

    const getPaySendPdfBlob = async () => {
      const pdfUrl = getStoredPayPdfUrl(payCurrentSendItem);
      if (!pdfUrl) throw new Error("没有PDF");
      const response = await fetch(pdfUrl, { credentials: "same-origin" });
      if (!response.ok) throw new Error("PDF文件读取失败");
      return response.blob();
    };

    const renderPaySendAttachmentList = () => {
      if (!paySendFields.attachmentList) return;
      if (paySendFields.filesStatus) {
        paySendFields.filesStatus.textContent = paySendExtraFiles.length
          ? `已添加 ${paySendExtraFiles.length} 个附件`
          : "未添加附件";
      }
      const rows = [];
      if (hasStoredPayPdf(payCurrentSendItem)) {
        rows.push(`<div class="order-send-attachment-item"><span>PDF文件：${escapeHtml(buildPaySafePdfName(payCurrentSendItem))}</span></div>`);
      }
      paySendExtraFiles.forEach((file, index) => {
        rows.push(`
          <div class="order-send-attachment-item">
            <span>${escapeHtml(file.name)}</span>
            <button type="button" data-remove-pay-send-file="${index}">删除</button>
          </div>
        `);
      });
      if (!rows.length) {
        paySendFields.attachmentList.textContent = "暂无附件";
        return;
      }
      paySendFields.attachmentList.innerHTML = rows.join("");
    };

    const closePaySendRecipientMenu = () => {
      if (paySendFields.toOptions) paySendFields.toOptions.hidden = true;
    };

    const renderPaySendRecipientOptions = () => {
      if (!paySendFields.toOptions) return;
      paySendFields.toOptions.innerHTML = "";
      paySendRecipientOptions.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "order-send-combobox-option";
        button.dataset.email = option.email;
        button.innerHTML = `
          <span class="order-send-combobox-name">${escapeHtml(option.name || option.email)}</span>
          <span class="order-send-combobox-email">${escapeHtml(option.email)}</span>
        `;
        paySendFields.toOptions.appendChild(button);
      });
    };

    const fetchPaySendRecipient = async (item) => {
      paySendRecipientOptions = [];
      if (paySendFields.to) paySendFields.to.value = "";
      if (paySendFields.toOptions) paySendFields.toOptions.innerHTML = "";
      closePaySendRecipientMenu();
      const customerId = item?.customer_id;
      if (!customerId) return "";
      try {
        const payload = await window.requestJson(`/api/customers/${encodeURIComponent(customerId)}`, { method: "GET" });
        const customer = payload?.data?.item || {};
        const options = [
          { name: customer.contact1_name || "联系人1", email: customer.contact1_email },
          { name: customer.company_name || "公司邮箱", email: customer.company_email },
          { name: customer.contact2_name || "联系人2", email: customer.contact2_email },
          { name: customer.contact3_name || "联系人3", email: customer.contact3_email }
        ].map((option) => ({
          name: String(option.name || "").trim(),
          email: String(option.email || "").trim()
        })).filter((option) => option.email);
        const seenEmails = new Set();
        paySendRecipientOptions = options.filter((option) => {
          if (seenEmails.has(option.email)) return false;
          seenEmails.add(option.email);
          return true;
        });
        renderPaySendRecipientOptions();
        if (paySendFields.to) paySendFields.to.value = paySendRecipientOptions[0]?.email || "";
      } catch (error) {
        console.warn(error);
      }
      return paySendFields.to ? paySendFields.to.value : "";
    };

    const normalizeMultiline = (text) => {
      if (typeof text !== "string") return "";
      let clean = text
        .replace(/\r\n/g, "\n")
        .replace(/\\n/g, "\n")
        .replace(/\t/g, "    ");
      const trimmed = clean.trim();
      if (trimmed.startsWith('"') && trimmed.endsWith('"')) clean = trimmed.slice(1, -1);
      return clean;
    };

    const loadPaySendTemplate = async (forceRefresh = false) => {
      if (!forceRefresh && Object.prototype.hasOwnProperty.call(paySendTemplateCache, paySendTemplateName)) {
        return paySendTemplateCache[paySendTemplateName];
      }
      const payload = await window.requestJson(`/api/mail-templates/${encodeURIComponent(paySendTemplateName)}`, {
        method: "GET"
      }, {
        throwOnFailure: true,
        fallbackMessage: "加载模板失败"
      });
      const template = payload.data && typeof payload.data.template === "string" ? payload.data.template : "";
      paySendTemplateCache[paySendTemplateName] = template;
      return template;
    };

    const renderPaySendTemplate = (template, item) => {
      const companyName = String(item?.customer_name || "").trim() || "取引先";
      return normalizeMultiline(template)
        .split("{company_name}").join(companyName)
        .split("{request_no}").join(String(item?.request_no || "").trim());
    };

    const applyPaySendTemplateToBody = async () => {
      if (!paySendFields.body) return;
      try {
        const template = await loadPaySendTemplate();
        if (!paySendFields.body.value.trim()) {
          paySendFields.body.value = renderPaySendTemplate(template, payCurrentSendItem);
        }
      } catch (error) {
        console.warn("加载请求书邮件模板失败", error);
      }
    };

    const openPaySendTemplateDialog = async () => {
      if (!paySendTemplateDialog || !paySendTemplateContent) return;
      try {
        const template = await loadPaySendTemplate(true);
        paySendTemplateContent.value = normalizeMultiline(template);
        paySendTemplateDialog.showModal();
      } catch (error) {
        console.error("加载模板失败", error);
        alert(error.message || "加载模板失败");
      }
    };

    const savePaySendTemplate = async () => {
      if (!paySendTemplateContent || !paySendTemplateSave) return;
      const originalText = paySendTemplateSave.textContent;
      paySendTemplateSave.disabled = true;
      paySendTemplateSave.textContent = "保存中...";
      try {
        const template = normalizeMultiline(paySendTemplateContent.value);
        await window.requestJson(`/api/mail-templates/${encodeURIComponent(paySendTemplateName)}`, {
          body: JSON.stringify({ template })
        }, {
          throwOnFailure: true,
          fallbackMessage: "保存模板失败"
        });
        paySendTemplateCache[paySendTemplateName] = template;
        if (paySendFields.body) {
          paySendFields.body.value = template;
          paySendFields.body.focus();
        }
        paySendTemplateDialog?.close();
      } catch (error) {
        console.error("保存模板失败", error);
        alert(error.message || "保存模板失败");
      } finally {
        paySendTemplateSave.disabled = false;
        paySendTemplateSave.textContent = originalText || "保存";
      }
    };

    const openPaySendDialog = async (item) => {
      if (!paySendDialog || !item) return;
      payCurrentSendItem = item;
      paySendExtraFiles = [];
      paySendRecipientOptions = [];
      if (paySendFields.subject) paySendFields.subject.value = `【請求書送付】${buildPayAttachmentBaseName(item)}`;
      if (paySendFields.type) paySendFields.type.value = "4";
      if (paySendFields.to) paySendFields.to.value = "";
      if (paySendFields.toOptions) paySendFields.toOptions.innerHTML = "";
      closePaySendRecipientMenu();
      if (paySendFields.body) paySendFields.body.value = "";
      if (paySendFields.cc) paySendFields.cc.value = "";
      if (paySendFields.files) paySendFields.files.value = "";
      renderPaySendAttachmentList();
      setPaySendPdfDisplayMode(item);
      fetchPaySendRecipient(item);
      paySendDialog.showModal();
      applyPaySendTemplateToBody();
    };

    const submitPaySendMail = async () => {
      if (!payCurrentSendItem || !paySendSubmit) return;
      const subject = paySendFields.subject?.value.trim() || "";
      const body = paySendFields.body?.value.trim() || "";
      const recipient = paySendFields.to?.value.trim() || "";
      const mailType = Number(paySendFields.type?.value || 4);
      if (!subject) return alert("请输入邮件主题"), paySendFields.subject?.focus();
      if (!hasStoredPayPdf(payCurrentSendItem)) return alert("没有PDF，无法发送。");
      if (!body) return alert("请输入邮件内容"), paySendFields.body?.focus();
      if (!recipient) return alert("请输入收件人，或先在客户资料中维护邮箱。"), paySendFields.to?.focus();
      const originalText = paySendSubmit.textContent;
      paySendSubmit.disabled = true;
      paySendSubmit.textContent = "发送中...";
      try {
        const pdfBlob = await getPaySendPdfBlob();
        const attachments = [{
          filename: buildPaySafePdfName(payCurrentSendItem),
          content_type: "application/pdf",
          content: await readBlobAsBase64(pdfBlob)
        }];
        const extraAttachments = await Promise.all(paySendExtraFiles.map(async (file) => ({
          filename: file.name,
          content_type: file.type || "application/octet-stream",
          content: await readBlobAsBase64(file)
        })));
        attachments.push(...extraAttachments);
        await window.requestJson("/api/send-mail", {
          body: JSON.stringify({
            to: recipient,
            cc: paySendFields.cc?.value.trim() || "",
            subject,
            body,
            attachments,
            mail_type: Number.isFinite(mailType) ? mailType : 4
          })
        }, {
          throwOnFailure: true,
          fallbackMessage: "发送失败"
        });
        alert("发送成功");
        paySendDialog.close();
        fetchPayRequests();
      } catch (error) {
        console.error("发送邮件失败", error);
        alert(error.message || "发送失败");
      } finally {
        paySendSubmit.disabled = false;
        paySendSubmit.textContent = originalText || "发送 >";
      }
    };

    const exportPreviewPdfBlob = async () => {
      if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
        throw new Error("PDF生成依赖未加载");
      }
      updatePreview();
      const sourcePages = Array.from(payPreviewCanvas?.querySelectorAll(".order-pdf-page") || []);
      if (!sourcePages.length) throw new Error("未找到预览区域");
      const stage = document.createElement("div");
      stage.style.position = "fixed";
      stage.style.left = "-100000px";
      stage.style.top = "0";
      stage.style.zIndex = "-1";
      const clones = sourcePages.map((page) => {
        const clone = page.cloneNode(true);
        clone.style.width = `${PDF_PREVIEW_WIDTH}px`;
        clone.style.height = `${PDF_PREVIEW_HEIGHT}px`;
        clone.style.maxWidth = "none";
        clone.style.background = "#ffffff";
        stage.appendChild(clone);
        return clone;
      });
      document.body.appendChild(stage);
      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "pt", "a4");
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        for (let index = 0; index < clones.length; index += 1) {
          const canvas = await window.html2canvas(clones[index], {
            scale: 2,
            backgroundColor: "#ffffff",
            useCORS: true
          });
          const imgData = canvas.toDataURL("image/png");
          if (index > 0) pdf.addPage();
          pdf.addImage(imgData, "PNG", 0, 0, pageWidth, pageHeight, undefined, "FAST");
        }
        return pdf.output("blob");
      } finally {
        stage.remove();
      }
    };

    const getSelectedCustomerId = () => {
      const name = payCustomerNameInput?.value?.trim() || "";
      return String(payCustomerIdInput?.value || payCustomerMap.get(name) || "").trim();
    };

    const buildPayPayload = () => {
      const items = collectItems().filter((item) => item.item || item.price || item.tax || item.qty || item.unit);
      return {
        request_no: payRequestNoInput?.value?.trim() || "",
        customer_id: getSelectedCustomerId(),
        customer_name: payCustomerNameInput?.value?.trim() || "",
        order_no: document.getElementById("pay-order-no")?.value?.trim() || "",
        subject: paySubjectInput?.value?.trim() || "",
        status: payStatusSelect?.value || "待付款",
        due_date: payRequestDateInput?.value || "",
        details: items,
        total_amount: calculateTotal(items),
        remark: payRemarkInput?.value?.trim() || ""
      };
    };

    const validatePayPayload = (payload) => {
      if (!payload.request_no) return "请填写请求书编号";
      if (!payload.customer_id || !payload.customer_name) return "请选择请求对象";
      if (!payload.details.length) return "请至少填写一条明细";
      return "";
    };

    const buildFormData = (payload, pdfBlob) => {
      const formData = new FormData();
      Object.entries(payload).forEach(([key, value]) => {
        if (Array.isArray(value) || (value && typeof value === "object")) {
          formData.append(key, JSON.stringify(value));
        } else if (value !== null && value !== undefined) {
          formData.append(key, String(value));
        }
      });
      if (pdfBlob) formData.append("pdf_file", pdfBlob, buildPdfFileName());
      return formData;
    };

    const renderPayRows = (items, meta = {}) => {
      const total = Number.isFinite(meta.total) ? meta.total : items.length;
      const page = Number.isFinite(meta.page) ? meta.page : payCurrentPage;
      const totalPages = Number.isFinite(meta.total_pages) ? meta.total_pages : 1;
      payCurrentPage = page;
      if (window.renderPagination) {
        window.renderPagination(payPagination, payPaginationPages, page, totalPages);
      }
      if (payPaginationSummary) {
        payPaginationSummary.textContent = `共 ${total} 条 · 第 ${page}/${Math.max(totalPages, 1)} 页`;
      }
      if (!payRequestTableBody) return;
      if (!items.length) {
        payRequestTableBody.innerHTML = `<tr><td colspan="6" class="empty c-empty">暂无数据</td></tr>`;
        return;
      }
      payRequestTableBody.innerHTML = items.map((item) => `
        <tr data-id="${escapeHtml(item.id)}">
          <td>${escapeHtml(item.request_no || "-")}</td>
          <td>${escapeHtml(item.customer_name || "-")}</td>
          <td>${escapeHtml(formatCurrency(item.total_amount))}</td>
          <td>${escapeHtml(item.status || "-")}</td>
          <td>${escapeHtml(item.created_at || "-")}</td>
          <td class="c-actions-col">
            <button class="c-btn c-btn-primary c-btn-sm" type="button" data-action="edit" data-id="${escapeHtml(item.id)}">编辑</button>
            <button class="c-btn c-btn-success-lite c-btn-sm" type="button" data-action="send" data-id="${escapeHtml(item.id)}">发送</button>
          </td>
        </tr>
      `).join("");
    };

    const fetchPayRequests = () => {
      const params = window.createParams([
        ["customer_name", payFilterCustomerInput?.value?.trim() || ""],
        ["month", payFilterMonthInput?.value || ""],
        ["page", String(payCurrentPage)],
        ["page_size", String(PAY_PAGE_SIZE)]
      ]);
      window.requestJson(window.buildUrl("/api/pay-requests", params), { method: "GET" })
        .then((payload) => {
          if (!payload.success) {
            payCurrentItems = [];
            renderPayRows([], { total: 0, page: 1, total_pages: 1 });
            return;
          }
          payCurrentItems = Array.isArray(payload.data?.items) ? payload.data.items : [];
          renderPayRows(payCurrentItems, payload.meta || {});
        })
        .catch(() => {
          payCurrentItems = [];
          renderPayRows([], { total: 0, page: 1, total_pages: 1 });
        });
    };

    const fillPayForm = (item) => {
      if (!item) return;
      if (payRequestNoInput) payRequestNoInput.value = item.request_no || "";
      if (payCustomerNameInput) payCustomerNameInput.value = item.customer_name || "";
      if (payCustomerIdInput) payCustomerIdInput.value = item.customer_id ? String(item.customer_id) : "";
      const orderNoInput = document.getElementById("pay-order-no");
      if (orderNoInput) orderNoInput.value = item.order_no || "";
      if (paySubjectInput) paySubjectInput.value = item.subject || "";
      if (payStatusSelect) payStatusSelect.value = item.status || "待付款";
      if (payRequestDateInput) payRequestDateInput.value = item.due_date || "";
      if (payRemarkInput) payRemarkInput.value = item.remark || "";
      setLineItems(item.details || []);
      updateCustomerAddress();
      updatePreview();
    };

    const loadPayRequestDetail = async (id) => {
      const payload = await window.requestJson(`/api/pay-requests/${encodeURIComponent(id)}`, { method: "GET" }, { throwOnFailure: true });
      return payload?.data?.item || null;
    };

    const submitPayDialog = async () => {
      if (createPayDialog.dataset.mode === "view") {
        createPayDialog.close();
        return;
      }
      const payload = buildPayPayload();
      const validationMessage = validatePayPayload(payload);
      if (validationMessage) {
        window.alert(validationMessage);
        return;
      }
      const originalText = payDialogSubmitBtn.textContent;
      payDialogSubmitBtn.disabled = true;
      payDialogSubmitBtn.textContent = "保存中...";
      try {
        const pdfBlob = await exportPreviewPdfBlob();
        const isEdit = createPayDialog.dataset.mode === "edit" && payCurrentEditId;
        const url = isEdit
          ? `/api/pay-requests/${encodeURIComponent(payCurrentEditId)}/update`
          : "/api/pay-requests";
        await window.requestJson(url, {
          method: "POST",
          headers: {},
          body: buildFormData(payload, pdfBlob)
        }, { throwOnFailure: true });
        createPayDialog.close();
        fetchPayRequests();
      } catch (error) {
        showPayError(error, "请求书保存失败");
      } finally {
        payDialogSubmitBtn.disabled = false;
        payDialogSubmitBtn.textContent = originalText;
      }
    };

    if (createPayBtn && createPayDialog) {
      createPayBtn.addEventListener("click", () => {
        payCurrentEditId = null;
        setDialogMode("create");
        createPayDialog.showModal();
        refreshPreviewAfterDialogOpen();
      });
    }

    if (payDialogSubmitBtn && createPayDialog) {
      payDialogSubmitBtn.addEventListener("click", submitPayDialog);
    }

    if (detailAddBtn && detailTableBody) {
      detailAddBtn.addEventListener("click", () => {
        const row = buildDetailRow();
        detailTableBody.appendChild(row);
        setAutoTaxForRow(row);
        updatePreview();
      });
    }

    if (detailTableBody) {
      detailTableBody.addEventListener("click", (event) => {
        const btn = event.target.closest('[data-action="remove-pay-line"]');
        if (!btn || detailTableBody.children.length <= 1) return;
        btn.closest(".pay-line-item-row")?.remove();
        updatePreview();
      });
      detailTableBody.addEventListener("input", (event) => {
        const row = event.target.closest(".pay-line-item-row");
        if (row && event.target.matches('[data-pay-item-field="price"], [data-pay-item-field="qty"]')) {
          setAutoTaxForRow(row);
        }
        if (row && event.target.matches('[data-pay-item-field="tax"]')) {
          row.dataset.taxManual = "true";
        }
        updatePreview();
      });
      detailTableBody.addEventListener("change", updatePreview);
    }

    [payRequestNoInput, paySubjectInput, payRequestDateInput, payRemarkInput].forEach((field) => {
      if (!field) return;
      field.addEventListener("input", updatePreview);
      field.addEventListener("change", updatePreview);
    });

    if (payCustomerNameInput && payCustomerList) {
      const debouncedFetchCustomers = debounce(() => fetchPayCustomerOptions(payCustomerNameInput, payCustomerList, payCustomerMap));
      payCustomerNameInput.addEventListener("focus", () => {
        fetchPayCustomerOptions(payCustomerNameInput, payCustomerList, payCustomerMap, { useDefault: true });
      });
      payCustomerNameInput.addEventListener("input", () => {
        if (!payCustomerNameInput.value.trim()) {
          fetchPayCustomerOptions(payCustomerNameInput, payCustomerList, payCustomerMap);
        } else {
          debouncedFetchCustomers();
        }
        if (payCustomerIdInput) payCustomerIdInput.value = "";
        customerAddressState = { customerId: "", customerName: "", postalCode: "", address: "", requestId: customerAddressState.requestId + 1 };
        renderCustomerAddress();
        updatePreview();
      });
      payCustomerNameInput.addEventListener("change", () => {
        const id = payCustomerMap.get(payCustomerNameInput.value.trim()) || "";
        if (payCustomerIdInput) payCustomerIdInput.value = id ? String(id) : "";
        updatePreview();
        updateCustomerAddress();
      });
    }

    if (payFilterCustomerInput && payFilterCustomerList) {
      const debouncedFetchFilterCustomers = debounce(() => fetchPayCustomerOptions(payFilterCustomerInput, payFilterCustomerList, payFilterCustomerMap));
      payFilterCustomerInput.addEventListener("focus", () => {
        fetchPayCustomerOptions(payFilterCustomerInput, payFilterCustomerList, payFilterCustomerMap, { useDefault: true });
      });
      payFilterCustomerInput.addEventListener("input", () => {
        if (!payFilterCustomerInput.value.trim()) {
          fetchPayCustomerOptions(payFilterCustomerInput, payFilterCustomerList, payFilterCustomerMap);
          return;
        }
        debouncedFetchFilterCustomers();
      });
    }

    if (payRequestTable && createPayDialog) {
      payRequestTable.addEventListener("click", async (event) => {
        const btn = event.target.closest("button[data-action]");
        if (!btn) return;
        const action = btn.dataset.action;
        const id = btn.dataset.id || btn.closest("tr")?.dataset?.id || "";
        if (!id) return;
        btn.disabled = true;
        try {
          const item = await loadPayRequestDetail(id);
          if (action === "send") {
            openPaySendDialog(item);
            return;
          }
          fillPayForm(item);
          payCurrentEditId = id;
          setDialogMode("edit");
          createPayDialog.showModal();
          refreshPreviewAfterDialogOpen();
        } catch (error) {
          showPayError(error, "请求书详情加载失败");
        } finally {
          btn.disabled = false;
        }
      });
    }

    if (paySendSubmit) paySendSubmit.addEventListener("click", submitPaySendMail);
    if (paySendTemplateEdit) {
      paySendTemplateEdit.addEventListener("click", (event) => {
        event.preventDefault();
        openPaySendTemplateDialog();
      });
    }
    if (paySendTemplateSave) paySendTemplateSave.addEventListener("click", savePaySendTemplate);
    if (paySendFields.files) {
      paySendFields.files.addEventListener("change", () => {
        const files = paySendFields.files?.files ? Array.from(paySendFields.files.files) : [];
        if (!files.length) return;
        paySendExtraFiles.push(...files);
        paySendFields.files.value = "";
        renderPaySendAttachmentList();
      });
    }
    if (paySendFields.filesTrigger) {
      paySendFields.filesTrigger.addEventListener("click", () => paySendFields.files?.click());
    }
    if (paySendFields.attachmentList) {
      paySendFields.attachmentList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-remove-pay-send-file]");
        if (!button) return;
        const index = Number(button.dataset.removePaySendFile);
        if (!Number.isInteger(index) || index < 0 || index >= paySendExtraFiles.length) return;
        paySendExtraFiles.splice(index, 1);
        renderPaySendAttachmentList();
      });
    }
    if (paySendFields.toToggle) {
      paySendFields.toToggle.addEventListener("click", () => {
        if (!paySendFields.toOptions) return;
        if (paySendFields.toOptions.hidden) {
          if (!paySendRecipientOptions.length) return;
          renderPaySendRecipientOptions();
          paySendFields.toOptions.hidden = false;
        } else {
          closePaySendRecipientMenu();
        }
      });
    }
    if (paySendFields.toOptions) {
      paySendFields.toOptions.addEventListener("click", (event) => {
        const option = event.target.closest(".order-send-combobox-option");
        if (!option) return;
        if (paySendFields.to) {
          paySendFields.to.value = option.dataset.email || option.textContent.trim();
          paySendFields.to.focus();
        }
        closePaySendRecipientMenu();
      });
    }
    document.addEventListener("click", (event) => {
      if (paySendFields.toCombobox && !paySendFields.toCombobox.contains(event.target)) {
        closePaySendRecipientMenu();
      }
    });

    if (paySearchBtn) {
      paySearchBtn.addEventListener("click", () => {
        payCurrentPage = 1;
        fetchPayRequests();
      });
    }

    if (payResetBtn) {
      payResetBtn.addEventListener("click", () => {
        if (payFilterCustomerInput) payFilterCustomerInput.value = "";
        if (payFilterCustomerList) payFilterCustomerList.innerHTML = "";
        payFilterCustomerMap.clear();
        if (payFilterMonthInput) payFilterMonthInput.value = currentMonthText();
        payCurrentPage = 1;
        fetchPayRequests();
      });
    }

    if (payFilterCustomerInput) {
      payFilterCustomerInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        payCurrentPage = 1;
        fetchPayRequests();
      });
    }

    if (window.bindPagination && payPagination) {
      window.bindPagination(payPagination, (page) => {
        if (page === "prev") payCurrentPage = Math.max(1, payCurrentPage - 1);
        else if (page === "next") payCurrentPage += 1;
        else {
          const value = Number(page);
          if (Number.isFinite(value) && value > 0) payCurrentPage = value;
        }
        fetchPayRequests();
      });
    }

    resetCreateForm();
    if (payFilterMonthInput && !payFilterMonthInput.value) {
      payFilterMonthInput.value = currentMonthText();
    }
    loadBankAccount();
    loadCompanyInfo();
    loadOwnerInfo();
    fetchPayRequests();
  </script>
</body>
</html>
