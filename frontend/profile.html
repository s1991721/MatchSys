<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="profile.title">个人信息</title>
</head>
<body class="profile-page">
<div class="page page-gap-compact">
    <div class="header-card c-card c-card-pad">
        <div class="profile-head">
            <div class="avatar" aria-label="用户头像">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor"
                          d="M12 12a4.2 4.2 0 1 0-4.2-4.2A4.2 4.2 0 0 0 12 12zm0 2c-4.8 0-8.7 2.4-8.7 5.4V21h17.4v-1.6C20.7 16.4 16.8 14 12 14z"/>
                </svg>
            </div>
            <div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-meta">
                    <span id="profileDepartment"></span>
                    <span class="dot" aria-hidden="true"></span>
                    <span id="profilePosition"></span>
                </div>
            </div>
        </div>
        <div class="profile-actions">
            <a class="c-btn c-btn-secondary profile-attendance-link" href="myattendance.html" id="profileAttendanceLink" data-i18n-title="nav.my_attendance" title="我的考勤">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v6h-2V9H4v11a1 1 0 0 0 1 1h7v2H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zm14 11.5l-4.2 4.2-2.3-2.3 1.4-1.4.9.9 2.8-2.8 1.4 1.4z"/>
                </svg>
                <span data-i18n="profile.action.my_attendance">我的考勤</span>
            </a>
            <button class="c-btn c-btn-danger" type="button" id="logoutBtn" data-i18n="profile.logout">退出登录</button>
        </div>
    </div>
    <div class="content-grid profile-grid">
        <div class="profile-left c-stack">
        <section class="c-card c-card-pad profile-card">
            <h2 class="c-card-title" data-i18n="profile.section.profile">个人信息</h2>
            <form id="employeeForm" autocomplete="off">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="empName" data-i18n="common.field.name">姓名</label>
                        <input id="empName" name="name" type="text" required/>
                    </div>
                    <div class="form-field">
                        <label for="empGender" data-i18n="profile.field.gender">性别</label>
                        <select id="empGender" name="gender">
                            <option value="" data-i18n="personnel.gender.unset">未设置</option>
                            <option value="1" data-i18n="personnel.gender.male">男</option>
                            <option value="2" data-i18n="personnel.gender.female">女</option>
                            <option value="0" data-i18n="common.status.unknown">未知</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="empBirthday" data-i18n="common.field.birthday">生日</label>
                        <input id="empBirthday" name="birthday" type="date"/>
                    </div>
                    <div class="form-field">
                        <label for="empPhone" data-i18n="common.field.phone">手机</label>
                        <input id="empPhone" name="phone" type="text"/>
                    </div>
                    <div class="form-field">
                        <label for="empEmail" data-i18n="common.field.email">邮箱</label>
                        <input id="empEmail" name="email" type="email"/>
                    </div>
                    <div class="form-field">
                        <label for="empHireDate" data-i18n="common.field.hire_date">入职日期</label>
                        <input id="empHireDate" name="hire_date" type="date" readonly/>
                    </div>
                    <div class="form-field">
                        <label for="empDepartment" data-i18n="common.field.department">部门</label>
                        <input id="empDepartment" name="department_name" type="text" readonly/>
                    </div>
                    <div class="form-field">
                        <label for="empPosition" data-i18n="common.field.position">职位</label>
                        <input id="empPosition" name="position_name" type="text" readonly/>
                    </div>
                    <div class="form-field full">
                        <label for="empAddress" data-i18n="profile.field.address">地址</label>
                        <textarea id="empAddress" name="address"></textarea>
                    </div>
                    <div class="form-field">
                        <label for="empEmergencyName" data-i18n="profile.field.emergency_name">紧急联系人姓名</label>
                        <input id="empEmergencyName" name="emergency_contact_name" type="text"/>
                    </div>
                    <div class="form-field">
                        <label for="empEmergencyPhone" data-i18n="profile.field.emergency_phone">紧急联系人电话</label>
                        <input id="empEmergencyPhone" name="emergency_contact_phone" type="text"/>
                    </div>
                    <div class="form-field">
                        <label for="empEmergencyRelation" data-i18n="profile.field.emergency_relation">紧急联系人关系</label>
                        <input id="empEmergencyRelation" name="emergency_contact_relationship" type="text"/>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="c-btn c-btn-primary" type="submit" data-i18n="profile.action.save_profile">保存信息</button>
                </div>
            </form>
        </section>
        </div>

        <div class="profile-right c-stack">
        <section class="c-card c-card-pad profile-card">
            <h2 class="c-card-title" data-i18n="profile.section.password">修改密码</h2>
            <form id="passwordForm" autocomplete="off">
                <div class="form-grid form-grid-single">
                    <div class="form-field">
                        <label for="oldPassword" data-i18n="profile.field.old_password">当前密码</label>
                        <input id="oldPassword" type="password" required/>
                    </div>
                    <div class="form-field">
                        <label for="newPassword" data-i18n="profile.field.new_password">新密码</label>
                        <input id="newPassword" type="password" required/>
                    </div>
                    <div class="form-field">
                        <label for="confirmPassword" data-i18n="profile.field.confirm_password">确认新密码</label>
                        <input id="confirmPassword" type="password" required/>
                    </div>
                </div>
                <div class="hint" data-i18n="profile.password.hint">密码修改后需要重新登录。</div>
                <div class="form-actions">
                    <button class="c-btn c-btn-primary" type="submit" data-i18n="profile.action.update_password">更新密码</button>
                </div>
            </form>
        </section>

        <section class="c-card c-card-pad profile-card c-upload-card">
            <h2 class="c-card-title" data-i18n="profile.section.seal">个人印章</h2>
            <div class="c-upload-row">
            <div class="c-upload-preview" id="sealPreview">
                <span class="c-empty-text" data-i18n="profile.seal.empty">未上传印章</span>
            </div>
            <div class="c-upload-controls">
            <div class="form-grid form-grid-single">
                <div class="form-field">
                    <label for="sealFile" data-i18n="profile.field.seal">印章文件（PNG）</label>
                    <input id="sealFile" type="file" accept="image/png"/>
                    <div class="hint" id="sealHint" data-i18n="profile.seal.empty">未上传印章</div>
                </div>
            </div>
            <div class="form-actions">
                <button class="c-btn c-btn-primary" type="button" id="sealUploadBtn" data-i18n="profile.action.upload_seal">上传印章</button>
            </div>
            </div>
            </div>
        </section>
        </div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
    const i18n = window.I18N;
    if (i18n) {
        i18n.init();
        i18n.apply();
    }
    const t = (key) => (i18n ? i18n.t(key) : key);
    const API_BASE = "";
    const EMPLOYEE_ID_KEY = "app_employee_id";
    const EMPLOYEE_NAME_KEY = "app_employee_name";
    const EMPLOYEE_POSITION_KEY = "app_employee_position_name";
    let employeeId = "";
    let employeeName = "";
    let employeePosition = "";
    try {
        employeeId = localStorage.getItem(EMPLOYEE_ID_KEY) || "";
        employeeName = localStorage.getItem(EMPLOYEE_NAME_KEY) || "";
        employeePosition = localStorage.getItem(EMPLOYEE_POSITION_KEY) || "";
    } catch (e) {}

    const employeeForm = document.getElementById("employeeForm");
    const passwordForm = document.getElementById("passwordForm");
    const logoutBtn = document.getElementById("logoutBtn");
    const profileAttendanceLink = document.getElementById("profileAttendanceLink");
    const profileName = document.getElementById("profileName");
    const profilePosition = document.getElementById("profilePosition");
    const sealFileInput = document.getElementById("sealFile");
    const sealHint = document.getElementById("sealHint");
    const sealPreview = document.getElementById("sealPreview");
    const sealUploadBtn = document.getElementById("sealUploadBtn");
    let currentSeal = "";
    let selectedSealFile = null;
    let selectedSealObjectUrl = "";

    if (profileName && employeeName) {
        profileName.textContent = employeeName;
    }
    if (profilePosition && employeePosition) {
        profilePosition.textContent = employeePosition;
    }
    if (profileAttendanceLink) {
        profileAttendanceLink.addEventListener("click", (event) => {
            event.preventDefault();
            window.navigateAppRoute("myattendance.html");
        });
    }

    const setReadOnlyWhenFilled = (fieldId, value) => {
        const field = document.getElementById(fieldId);
        if (!field) return;
        const hasValue = value !== null && value !== undefined && String(value).trim() !== "";
        if (hasValue) {
            field.setAttribute("readonly", "readonly");
        } else {
            field.removeAttribute("readonly");
        }
    }

    const setDisabled = (disabled) => {
        employeeForm.querySelectorAll("input, textarea, select, button").forEach((el) => {
            el.disabled = disabled;
        });
        passwordForm.querySelectorAll("input, button").forEach((el) => {
            el.disabled = disabled;
        });
        if (sealFileInput) sealFileInput.disabled = disabled;
        if (sealUploadBtn) sealUploadBtn.disabled = disabled;
        logoutBtn.disabled = disabled;
    }

    const format = (key, values = {}) => {
        let text = t(key);
        Object.keys(values).forEach((name) => {
            text = text.replace(new RegExp(`\\{${name}\\}`, "g"), values[name]);
        });
        return text;
    };

    const clearSelectedSealObjectUrl = () => {
        if (selectedSealObjectUrl) {
            URL.revokeObjectURL(selectedSealObjectUrl);
            selectedSealObjectUrl = "";
        }
    };

    const renderSealPreview = (src) => {
        if (!sealPreview) return;
        sealPreview.innerHTML = "";
        if (!src) {
            const empty = document.createElement("span");
            empty.className = "c-empty-text";
            empty.textContent = t("profile.seal.empty");
            sealPreview.appendChild(empty);
            return;
        }
        const img = document.createElement("img");
        img.src = src;
        img.alt = t("profile.section.seal");
        img.onerror = () => renderSealPreview("");
        sealPreview.appendChild(img);
    };

    const updateSealHint = () => {
        if (!sealHint) return;
        if (selectedSealFile) {
            sealHint.textContent = format("profile.seal.selected_with_name", {name: selectedSealFile.name || ""});
            return;
        }
        const name = (currentSeal || "").split("/").pop();
        sealHint.textContent = name
            ? format("profile.seal.saved_with_name", {name})
            : t("profile.seal.empty");
    };

    const setCurrentSeal = (sealPath, sealUrl) => {
        currentSeal = sealPath || "";
        clearSelectedSealObjectUrl();
        selectedSealFile = null;
        if (sealFileInput) sealFileInput.value = "";
        if (sealUrl) {
            renderSealPreview(`${sealUrl}?v=${encodeURIComponent(`${currentSeal}-${Date.now()}`)}`);
        } else {
            renderSealPreview("");
        }
        updateSealHint();
    };

    const isPngFile = (file) => {
        if (!file) return false;
        const name = String(file.name || "").toLowerCase();
        const type = String(file.type || "").toLowerCase();
        return name.endsWith(".png") && (!type || type === "image/png");
    };

    const loadEmployee = async () => {
        if (!employeeId) {
            alert(t("profile.error.not_logged_in"));
            setDisabled(true);
            return;
        }
        try {
            const payload = await window.requestJson(`${API_BASE}/api/employees/${employeeId}`, {
                method: "GET",
            });
            if (!payload.success) throw new Error(payload.message || t("common.load_failed"));
            const result = payload.data || {};
            const item = result.item || {};
            document.getElementById("empName").value = item.name || "";
            document.getElementById("empGender").value = item.gender ?? "";
            document.getElementById("empBirthday").value = item.birthday || "";
            document.getElementById("empPhone").value = item.phone || "";
            document.getElementById("empEmail").value = item.email || "";
            document.getElementById("empHireDate").value = item.hire_date || "";
            document.getElementById("empDepartment").value = item.department_name || "";
            document.getElementById("empPosition").value = item.position_name || "";
            document.getElementById("empAddress").value = item.address || "";
            document.getElementById("empEmergencyName").value = item.emergency_contact_name || "";
            document.getElementById("empEmergencyPhone").value = item.emergency_contact_phone || "";
            document.getElementById("empEmergencyRelation").value = item.emergency_contact_relationship || "";
            setCurrentSeal(item.seal || "", item.seal_url || "");

            setReadOnlyWhenFilled("empPhone", item.phone);
            setReadOnlyWhenFilled("empEmail", item.email);
            setReadOnlyWhenFilled("empAddress", item.address);
            setReadOnlyWhenFilled("empEmergencyName", item.emergency_contact_name);
            setReadOnlyWhenFilled("empEmergencyPhone", item.emergency_contact_phone);
            setReadOnlyWhenFilled("empEmergencyRelation", item.emergency_contact_relationship);

            document.getElementById("profileName").textContent = item.name || "";
            document.getElementById("profileDepartment").textContent = item.department_name ||"";
            document.getElementById("profilePosition").textContent = item.position_name || "";
            try {
                if (item.name) {
                    localStorage.setItem(EMPLOYEE_NAME_KEY, String(item.name));
                }
                if (item.position_name) {
                    localStorage.setItem(EMPLOYEE_POSITION_KEY, String(item.position_name));
                }
            } catch (e) {}
        } catch (err) {
            alert(err.message || t("common.load_failed"));
        }
    }

    employeeForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!employeeId) return;
        try {
            const genderRaw = document.getElementById("empGender").value;
            const payload = {
                name: document.getElementById("empName").value.trim(),
                gender: genderRaw === "" ? null : Number(genderRaw),
                birthday: document.getElementById("empBirthday").value || "",
                phone: document.getElementById("empPhone").value.trim(),
                email: document.getElementById("empEmail").value.trim(),
                address: document.getElementById("empAddress").value.trim(),
                emergency_contact_name: document.getElementById("empEmergencyName").value.trim(),
                emergency_contact_phone: document.getElementById("empEmergencyPhone").value.trim(),
                emergency_contact_relationship: document.getElementById("empEmergencyRelation").value.trim(),
            };
            const responsePayload = await window.requestJson(`${API_BASE}/api/employees/${employeeId}`, {
                method: "PUT",
                body: JSON.stringify(payload),
            });
            if (!responsePayload.success) {
                throw new Error(responsePayload.message || t("common.save_failed"));
            }
            alert(t("profile.alert.profile_updated"));
            const result = responsePayload.data || {};
            if (result.item) {
                const item = result.item;
                document.getElementById("profileName").textContent = item.name || "";
                document.getElementById("profileDepartment").textContent = item.department_name || "";
                try {
                    if (item.name) {
                        localStorage.setItem(EMPLOYEE_NAME_KEY, String(item.name));
                    }
                    if (item.position_name) {
                        localStorage.setItem(EMPLOYEE_POSITION_KEY, String(item.position_name));
                    }
                } catch (e) {}
                setReadOnlyWhenFilled("empPhone", item.phone);
                setReadOnlyWhenFilled("empEmail", item.email);
                setReadOnlyWhenFilled("empAddress", item.address);
                setReadOnlyWhenFilled("empEmergencyName", item.emergency_contact_name);
                setReadOnlyWhenFilled("empEmergencyPhone", item.emergency_contact_phone);
                setReadOnlyWhenFilled("empEmergencyRelation", item.emergency_contact_relationship);
            } else {
                setReadOnlyWhenFilled("empPhone", payload.phone);
                setReadOnlyWhenFilled("empEmail", payload.email);
                setReadOnlyWhenFilled("empAddress", payload.address);
                setReadOnlyWhenFilled("empEmergencyName", payload.emergency_contact_name);
                setReadOnlyWhenFilled("empEmergencyPhone", payload.emergency_contact_phone);
                setReadOnlyWhenFilled("empEmergencyRelation", payload.emergency_contact_relationship);
            }
        } catch (err) {
            const message = err.message || t("common.save_failed");
            alert(message);
        }
    });

    passwordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!oldPassword || !newPassword) {
            alert(t("profile.alert.password_incomplete"));
            return;
        }
        if (newPassword !== confirmPassword) {
            alert(t("profile.alert.password_mismatch"));
            return;
        }

        try {
            const responsePayload = await window.requestJson(`${API_BASE}/api/change-password`, {
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword,
                }),
            });
            if (!responsePayload.success) {
                throw new Error(responsePayload.message || t("profile.alert.password_failed"));
            }
            alert(t("profile.alert.password_updated"));
            passwordForm.reset();
        } catch (err) {
            const message = err.message || t("profile.alert.password_failed");
            alert(message);
        }
    });

    if (sealFileInput) {
        sealFileInput.addEventListener("change", (event) => {
            const file = event.target.files ? event.target.files[0] : null;
            clearSelectedSealObjectUrl();
            if (!file) {
                selectedSealFile = null;
                if (currentSeal) {
                    renderSealPreview(`${API_BASE}/api/employees/${employeeId}/seal?v=${encodeURIComponent(`${currentSeal}-${Date.now()}`)}`);
                } else {
                    renderSealPreview("");
                }
                updateSealHint();
                return;
            }
            if (!isPngFile(file)) {
                selectedSealFile = null;
                sealFileInput.value = "";
                renderSealPreview(currentSeal ? `${API_BASE}/api/employees/${employeeId}/seal?v=${encodeURIComponent(`${currentSeal}-${Date.now()}`)}` : "");
                updateSealHint();
                alert(t("profile.alert.seal_png_required"));
                return;
            }
            selectedSealFile = file;
            selectedSealObjectUrl = URL.createObjectURL(file);
            renderSealPreview(selectedSealObjectUrl);
            updateSealHint();
        });
    }

    if (sealUploadBtn) {
        sealUploadBtn.addEventListener("click", async () => {
            if (!employeeId) return;
            if (!selectedSealFile) {
                alert(t("profile.alert.seal_required"));
                return;
            }
            if (!isPngFile(selectedSealFile)) {
                alert(t("profile.alert.seal_png_required"));
                return;
            }
            const formData = new FormData();
            formData.append("seal_file", selectedSealFile);
            try {
                sealUploadBtn.disabled = true;
                const payload = await window.requestJson(`${API_BASE}/api/employees/${employeeId}/seal`, {
                    headers: {},
                    body: formData,
                });
                if (!payload.success) throw new Error(payload.message || t("profile.alert.seal_failed"));
                const data = payload.data || {};
                setCurrentSeal(data.seal || "", data.seal_url || "");
                alert(t("profile.alert.seal_uploaded"));
            } catch (err) {
                alert(err.message || t("profile.alert.seal_failed"));
            } finally {
                sealUploadBtn.disabled = false;
            }
        });
    }

    logoutBtn.addEventListener("click", async () => {
        try {
            const responsePayload = await window.requestJson(`${API_BASE}/api/logout`, {});
            if (!responsePayload.success) {
                throw new Error(responsePayload.message || t("profile.alert.logout_failed"));
            }
            const target = "login.html".replace(/^\//, "");
            const nextUrl = new URL(target, window.location.href).toString();
            try {
                localStorage.removeItem(EMPLOYEE_ID_KEY);
                localStorage.removeItem(EMPLOYEE_NAME_KEY);
                localStorage.removeItem(EMPLOYEE_POSITION_KEY);
            } catch (e) {}
            if (window.top && window.top !== window) {
                window.top.location.href = nextUrl;
            } else {
                window.location.href = nextUrl;
            }
        } catch (err) {
            alert(t("profile.alert.logout_failed_retry"));
        }
    });

    loadEmployee();
</script>
</body>
</html>
