<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="./favicon-48.png" type="image/png" sizes="48x48">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="components.css">
    <title data-i18n="songxin.title">送信页</title>
</head>
<body>
<div id="loading-mask" class="songxin-loading-mask" role="status" aria-live="assertive" aria-busy="true" hidden>
    <div class="songxin-loading-box">
        <div class="songxin-loading-main">
            <div class="songxin-spinner" aria-hidden="true"></div>
            <div id="loading-text" data-i18n="songxin.loading.wait_title">正在等待 AI 响应…</div>
        </div>
        <div id="loading-sub" class="songxin-loading-sub" data-i18n="songxin.loading.wait_sub">请稍候，正在处理中…</div>
    </div>
</div>
<div class="page page-wide songxin-page">
    <div id="reply-queue-status" class="songxin-queue-status" hidden>
        <span data-i18n="songxin.queue.label">连续回复</span>
        <strong id="reply-remaining-count"></strong>
    </div>
    <section class="songxin-grid songxin-grid-half">
        <div class="songxin-editor-card c-card c-card-pad">
            <div class="songxin-card-head">
                <div class="c-card-title" data-i18n="songxin.section.editor">内容编辑</div>
                <button
                        id="btn-template-info"
                        class="songxin-template-trigger"
                        type="button"
                        aria-label="编辑模板信息"
                        data-i18n-aria="songxin.template.action.edit"
                        title="编辑模板信息"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 2h8l5 5v4.25a1 1 0 1 1-2 0V8h-4V4H6v16h5.25a1 1 0 1 1 0 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm9 3.41V7h1.59L15 5.41zm-2.04 9.33 4.83-4.83 2.12 2.12-4.83 4.83-2.54.42.42-2.54zm6.24-6.24.71-.71a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1 0 1.41l-.71.71-2.12-2.12z"/>
                    </svg>
                </button>
            </div>
            <textarea id="editor" class="songxin-editor"
                      placeholder="在此编写您要发送的内容，例如项目进度、补充说明或会议纪要等。"
                      aria-label="内容编辑文本域" data-i18n-placeholder="songxin.editor.placeholder"
                      data-i18n-aria="songxin.editor.aria"></textarea>
        </div>

        <div class="c-card c-card-pad songxin-original-card">
            <div class="c-card-title" data-i18n="songxin.original.technician">案件原文</div>
            <textarea id="job-original" class="songxin-editor songxin-editor-readonly" readonly aria-label="案件原文"
                      data-i18n-aria="songxin.original.technician"></textarea>
        </div>
    </section>

    <section class="songxin-grid">
        <div class="c-card c-card-pad">
            <div class="c-card-title" data-i18n="common.preview">预览</div>
            <div id="preview" class="songxin-preview">
                这里会展示即将发送的正文预览，确认排版、换行和关键内容是否完整。ABCDEFG1234567890不想超出屏幕会自动换行。
            </div>
        </div>
        <div class="c-card c-card-pad songxin-form">
            <div class="c-card-title" data-i18n="songxin.section.recipient">收件与附件</div>
            <div class="form-field">
                <label for="email" data-i18n="songxin.field.to">收件人邮箱</label>
                <input id="email" type="email" placeholder="name@example.com">
            </div>
            <div class="form-field">
                <label for="subject" data-i18n="songxin.field.subject">邮件标题</label>
                <textarea id="subject" rows="2" placeholder="请输入邮件标题（未填将使用正文首行）"
                          data-i18n-placeholder="songxin.field.subject_placeholder"></textarea>
            </div>
            <div class="form-field">
                <label for="cc" data-i18n="songxin.field.cc">抄送 (可选)</label>
                <input id="cc" type="text" placeholder="cc@example.com, other@example.com">
            </div>
            <div class="form-field">
                <label for="file-input" data-i18n="songxin.field.attach">上传附件</label>
                <div class="songxin-upload-bar">
                    <input id="file-input" class="songxin-file-input" type="file" multiple>
                    <button id="btn-upload" class="c-btn c-btn-ghost" type="button"
                            data-i18n="songxin.action.select_file">选择文件
                    </button>
                    <span class="songxin-upload-hint"
                          data-i18n="songxin.attach.hint">支持多文件，建议单个不超过10MB</span>
                </div>
                <div id="attachment-list" class="songxin-attachment-list">
                    <div class="songxin-empty-tip" data-i18n="common.empty.attachments">暂无附件</div>
                </div>
            </div>
            <div class="songxin-send-actions">
                <button id="btn-send" class="c-btn c-btn-primary" type="button" aria-label="发送"
                        data-i18n-aria="songxin.action.send">
                    <span id="btn-send-label" data-i18n="songxin.action.send">发送</span>
                    <span aria-hidden="true">➤</span>
                </button>
            </div>
        </div>
    </section>
</div>

<dialog id="template-info-dialog" class="c-dialog songxin-template-dialog">
    <div class="c-dialog-header">
        <div class="songxin-template-header-text">
            <h3 data-i18n="songxin.template.dialog.title">编辑模板信息</h3>
            <p id="template-dialog-subtitle" class="c-card-subtitle songxin-template-subtitle"></p>
        </div>
        <button class="c-dialog-close" type="button" aria-label="关闭" data-i18n-aria="common.close" data-dialog-close>
            ×
        </button>
    </div>
    <div class="c-dialog-body">
            <textarea
                    id="template-content"
                    class="songxin-template-textarea"
                    rows="14"
                    placeholder="请输入模板信息"
                    data-i18n-placeholder="songxin.template.placeholder.content"
            ></textarea>
    </div>
    <div class="c-dialog-actions">
        <button class="c-btn c-btn-ghost" type="button" data-dialog-close data-i18n="common.cancel">取消</button>
        <button id="btn-template-save" class="c-btn c-btn-primary" type="button" data-i18n="common.save">保存</button>
    </div>
</dialog>

<script src="i18n.js"></script>
<script src="error_code.js"></script>
<script src="common.js"></script>
<script>
    const i18n = window.I18N;
    const t = (key) => (i18n ? i18n.t(key) : key);
    const format = (key, vars) => (i18n ? i18n.format(key, vars) : key);
    const editor = document.getElementById('editor');
    const email = document.getElementById('email');
    const subjectInput = document.getElementById('subject');
    const cc = document.getElementById('cc');
    const preview = document.getElementById('preview');
    const sendBtn = document.getElementById('btn-send');
    const sendBtnLabel = document.getElementById('btn-send-label');
    const replyQueueStatus = document.getElementById('reply-queue-status');
    const replyRemainingCount = document.getElementById('reply-remaining-count');
    const uploadBtn = document.getElementById('btn-upload');
    const fileInput = document.getElementById('file-input');
    const attachmentList = document.getElementById('attachment-list');
    const jobOriginal = document.getElementById('job-original');
    const originalTitle = document.querySelector('.songxin-original-card .c-card-title');
    const templateInfoBtn = document.getElementById('btn-template-info');
    const templateInfoDialog = document.getElementById('template-info-dialog');
    const templateDialogSubtitle = document.getElementById('template-dialog-subtitle');
    const templateContentInput = document.getElementById('template-content');
    const templateSaveBtn = document.getElementById('btn-template-save');
    const loadingMask = document.getElementById('loading-mask');
    const loadingText = document.getElementById('loading-text');
    const loadingSub = document.getElementById('loading-sub');
    if (i18n) {
        i18n.init();
        i18n.apply();
    }
    if (window.initDialogCloseBehavior) {
        window.initDialogCloseBehavior({dialogs: [templateInfoDialog]});
    }
    const fetchWithAuth = window.fetchWithAuth;
    const attachments = [];
    const selectionKey = 'matchSelection';
    const matchMailType = 2;
    const queryParams = new URLSearchParams(window.location.search);
    const isMatchFlow = queryParams.get('from') === 'match';
    let sceneParam = 'project';
    let loadingTimer = null;
    let currentSelection = null;
    let replyQueue = [];
    let currentTarget = null;
    let isSending = false;
    const templateCache = {};

    const renderPreview = () => {
        const content = editor.value.trim();

        if (!content) {
            preview.textContent = t('songxin.preview.empty');
            return;
        }

        // 使用 textContent 搭配 pre-line 确保换行正常展示
        preview.textContent = content;
    };

    const getTemplateName = () => sceneParam === 'technician' ? 'technician' : 'anjian';

    const loadTemplate = async (templateName, forceRefresh = false) => {
        if (!forceRefresh && Object.prototype.hasOwnProperty.call(templateCache, templateName)) {
            return templateCache[templateName];
        }
        const payload = await window.requestJson(`/api/mail-templates/${encodeURIComponent(templateName)}`, {
            method: 'GET'
        }, {
            fallbackMessage: t('songxin.error.template_load_failed')
        });
        const template = payload.data && typeof payload.data.template === 'string'
            ? payload.data.template
            : '';
        templateCache[templateName] = template;
        return template;
    };

    const openTemplateDialog = async () => {
        const templateName = getTemplateName();
        setLoading(true, {title: t('songxin.template.loading_title'), subtitle: t('songxin.template.loading_sub')});
        try {
            const template = await loadTemplate(templateName, true);
            templateContentInput.value = normalizeMultiline(template);
            renderTemplateSubtitle();
            templateInfoDialog.showModal();
        } catch (err) {
            console.error('加载模板失败', err);
            alert(t('songxin.template.alert.load_failed'));
        } finally {
            setLoading(false);
        }
    };

    templateInfoBtn.addEventListener('click', openTemplateDialog);

    templateSaveBtn.addEventListener('click', async () => {
        const templateName = getTemplateName();
        setLoading(true, {title: t('songxin.template.saving_title'), subtitle: t('songxin.template.saving_sub')});
        try {
            const template = normalizeMultiline(templateContentInput.value);
            await window.requestJson(`/api/mail-templates/${encodeURIComponent(templateName)}`, {
                body: JSON.stringify({template})
            }, {
                fallbackMessage: t('songxin.error.template_save_failed')
            });
            templateCache[templateName] = template;
            templateInfoDialog.close();
            if (currentSelection && currentTarget) {
                await analyzeByScene(currentTarget);
            }
        } catch (err) {
            console.error('保存模板失败', err);
            alert(t('songxin.template.alert.save_failed'));
        } finally {
            setLoading(false);
            editor.focus();
        }
    });

    editor.addEventListener('input', renderPreview);

    uploadBtn.addEventListener('click', () => fileInput.click());

    const formatSize = (bytes) => {
        if (bytes < 1024) return bytes + 'B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
        return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    };

    fileInput.addEventListener('change', () => {
        const files = Array.from(fileInput.files || []);
        files.forEach(f => attachments.push({
            file: f,
            name: f.name,
            sizeLabel: formatSize(f.size),
            type: f.type || 'application/octet-stream',
            size: f.size
        }));
        fileInput.value = '';
        renderAttachments();
    });

    attachmentList.addEventListener('click', (e) => {
        const idx = e.target.getAttribute('data-remove');
        if (idx === null) return;
        attachments.splice(Number(idx), 1);
        renderAttachments();
    });

    const readAsBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const result = reader.result || '';
            const base64 = typeof result === 'string' && result.includes(',')
                ? result.split(',').pop()
                : result;
            resolve(base64);
        };
        reader.onerror = () => reject(reader.error || new Error(t('songxin.loading.file_failed')));
        reader.readAsDataURL(file);
    });

    sendBtn.addEventListener('click', async () => {
        if (isSending) return;
        const target = email.value.trim();
        if (!target) {
            alert(t('songxin.alert.email_required'));
            email.focus();
            return;
        }
        const content = editor.value.trim();
        if (!content) {
            alert(t('songxin.alert.content_required'));
            editor.focus();
            return;
        }

        const rawMailType = currentSelection?.mail_type;
        const replyMeta = currentTarget || null;
        const mailType = Number.isFinite(Number(rawMailType))
            ? Number(rawMailType)
            : (isMatchFlow ? matchMailType : null);

        isSending = true;
        sendBtn.disabled = true;
        setLoading(true, {title: t('songxin.loading.queue_title'), subtitle: t('songxin.loading.queue_sub')});
        try {
            const attachmentsPayload = await Promise.all(
                attachments.map(async (att) => {
                    if (att.file) {
                        return {
                            filename: att.name,
                            content_type: att.type,
                            content: await readAsBase64(att.file)
                        };
                    }
                    if (att.prefilledBase64) {
                        return {
                            filename: att.name,
                            content_type: att.type,
                            content: att.prefilledBase64
                        };
                    }
                    if (att.url) {
                        const res = await fetchWithAuth(att.url, {method: 'GET'});
                        if (!res.ok) {
                            throw new Error(`HTTP ${res.status}`);
                        }
                        const blob = await res.blob();
                        return {
                            filename: att.name,
                            content_type: blob.type || att.type || 'application/octet-stream',
                            content: await readAsBase64(blob)
                        };
                    }
                    throw new Error(`Missing attachment source: ${att.name || 'attachment'}`);
                })
            );

            const subject = subjectInput.value.trim()
                || (content.split('\n').map((line) => line.trim()).find(Boolean) || t('songxin.subject.default')).slice(0, 60);

            const payload = {
                to: target,
                cc: cc.value.trim(),
                subject,
                body: replyMeta
                    ? window.MatchSys.buildQuotedReplyBody(content, replyMeta)
                    : content,
                attachments: attachmentsPayload
            };
            if (mailType !== null) {
                payload.mail_type = mailType;
            }

            if (replyMeta) {
                if (replyMeta.thread_id) {
                    payload.thread_id = replyMeta.thread_id;
                }
                if (replyMeta.message_id_header) {
                    payload.in_reply_to = replyMeta.message_id_header;
                }
                if (replyMeta.references_header) {
                    payload.references = replyMeta.references_header;
                }
            }

            await window.requestJson('/api/send-mail-task', {
                body: JSON.stringify(payload)
            }, {
                fallbackMessage: t('songxin.error.queue_failed')
            });

            if (isMatchFlow) {
                replyQueue.shift();
                currentTarget = null;
                if (replyQueue.length) {
                    await loadCurrentReply();
                } else {
                    window.navigateAppRoute('match.html');
                }
            } else {
                alert(t('songxin.alert.queued'));
                window.navigateAppRoute('sendtask.html');
            }
        } catch (err) {
            console.error('创建发送任务失败', err);
            alert(format('songxin.alert.queue_failed', {error: err.message || err}));
        } finally {
            isSending = false;
            sendBtn.disabled = false;
            setLoading(false);
        }
    });

    if (window && window.addEventListener) {
        window.addEventListener("i18n:change", () => {
            if (i18n) {
                i18n.apply();
            }
            renderOriginalTitle();
            renderTemplateSubtitle();
            renderAttachments();
            renderPreview();
            updateQueueStatus();
        });
    }

    const readSelection = () => {
        try {
            currentSelection = window.MatchSys.readJSONFromSessionStorage(selectionKey)
                || window.MatchSys.readJSONFromLocalStorage(selectionKey);
            window.MatchSys.clearStoredKey(selectionKey);
        } catch {
            currentSelection = null;
        }
        const mailType = Number(currentSelection?.mail_type);
        sceneParam = mailType === 1 ? 'technician' : 'project';
        return currentSelection;
    };

    const preloadResumeAttachment = () => {
        const selection = currentSelection;
        const resumeAttachment = selection && selection.resume_attachment ? selection.resume_attachment : null;
        if (!resumeAttachment) return;
        const nextItem = {
            source: 'match-resume',
            name: resumeAttachment.filename || 'resume',
            sizeLabel: t('songxin.attach.prefilled'),
            type: resumeAttachment.content_type || 'application/octet-stream',
            size: Number(resumeAttachment.size) || 0,
            url: resumeAttachment.url || ''
        };
        if (resumeAttachment.source === 'manual' && resumeAttachment.base64) {
            nextItem.prefilledBase64 = resumeAttachment.base64;
        }

        attachments.push(nextItem);
    };

    const renderAttachments = () => {
        if (!attachments.length) {
            attachmentList.innerHTML = `<div class="songxin-empty-tip">${t('common.empty.attachments')}</div>`;
            return;
        }

        attachmentList.innerHTML = attachments.map((file, idx) => `
                    <div class="songxin-attachment-item" data-idx="${idx}">
                        <div class="songxin-attachment-name">${window.escapeHtml(file.name)}</div>
                        <div class="songxin-attachment-meta">
                            <span>${window.escapeHtml(file.sizeLabel)}</span>
                            <span class="songxin-remove-link" data-remove="${idx}">${t('common.remove')}</span>
                        </div>
                    </div>
                `).join('');
    };

    const renderOriginalTitle = () => {
        if (!originalTitle) return;
        const key = sceneParam === 'project' ? 'songxin.original.project' : 'songxin.original.technician';
        originalTitle.setAttribute('data-i18n', key);
        originalTitle.textContent = t(key);
        jobOriginal.setAttribute('data-i18n-aria', key);
        jobOriginal.setAttribute('aria-label', t(key));
    };

    const renderTemplateSubtitle = () => {
        templateDialogSubtitle.textContent = sceneParam === 'technician'
            ? t('songxin.template.subtitle.technician')
            : t('songxin.template.subtitle.project');
    };

    const normalizeMultiline = (text) => {
        if (typeof text !== 'string') return '';
        let clean = text
            .replace(/\r\n/g, '\n')
            .replace(/\\n/g, '\n')
            .replace(/\t/g, '    ');
        const trimmed = clean.trim();
        if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
            clean = trimmed.slice(1, -1);
        }
        return clean;
    };

    const getOriginalTextFromSelection = () => {
        return normalizeMultiline(currentTarget?.detail || '');
    };

    const renderOriginal = (text) => {
        const content = (text || '').trim();
        jobOriginal.value = content || '';
        jobOriginal.scrollTop = 0;
    };

    const applyRenderedResult = (result = {}) => {
        const body = normalizeMultiline(result.body || result.data || result.raw || '');

        editor.value = body || t('songxin.preview.unavailable');
        renderPreview();
    };

    const setLoading = (isLoading, options = {}) => {
        const {title = t('songxin.loading.processing'), subtitle = t('songxin.loading.wait_sub')} =
            typeof options === 'string'
                ? {title: options, subtitle: t('songxin.loading.wait_sub')}
                : options;

        if (isLoading) {
            loadingText.textContent = title;
            loadingSub.textContent = subtitle;
            loadingMask.hidden = false;
            loadingMask.style.display = 'none';
            loadingMask.setAttribute('aria-busy', 'true');
            // 避免闪屏：只有超过 200ms 的等待才展示
            clearTimeout(loadingTimer);
            loadingTimer = setTimeout(() => {
                loadingMask.style.display = 'flex';
            }, 200);
            return;
        }
        clearTimeout(loadingTimer);
        loadingMask.hidden = true;
        loadingMask.style.display = 'none';
        loadingMask.setAttribute('aria-busy', 'false');
    };

    const analyzeByScene = async (expectedTarget = currentTarget) => {
        if (!currentSelection || !expectedTarget) return;
        const body = sceneParam === 'project'
            ? (currentSelection.job?.detail || '')
            : (currentSelection.person?.intro || currentSelection.person?.detail || '');
        setLoading(true, {title: t('songxin.loading.analyze_title'), subtitle: t('songxin.loading.analyze_sub')});
        try {
            const endpoint = sceneParam === 'technician'
                ? '/api/extract-technician-detail'
                : '/api/extract-project-detail';
            const payload = await window.requestJson(endpoint, {
                body: JSON.stringify({body})
            }, {
                fallbackMessage: t('songxin.error.analyze_failed')
            });

            if (expectedTarget !== currentTarget) return;
            applyRenderedResult(payload.data || {});
        } catch (err) {
            console.error('调用 extract_qiuren_detail 失败', err);
            alert(t('songxin.alert.ai_unavailable'));
        } finally {
            setLoading(false);
        }
    };

    const updateQueueStatus = () => {
        const remaining = replyQueue.length;
        replyQueueStatus.hidden = !isMatchFlow || remaining === 0;
        replyRemainingCount.textContent = format('songxin.queue.remaining', {count: remaining});
        if (isMatchFlow) {
            sendBtnLabel.removeAttribute('data-i18n');
            sendBtnLabel.textContent = t('songxin.action.send_and_next_item');
            sendBtn.removeAttribute('data-i18n-aria');
            sendBtn.setAttribute('aria-label', t('songxin.action.send_and_next_item'));
        }
    };

    const loadCurrentReply = async () => {
        currentTarget = replyQueue[0] || null;
        if (!currentTarget) {
            window.navigateAppRoute('match.html');
            return;
        }

        editor.value = '';
        email.value = String(currentTarget.address || '').trim();
        cc.value = String(currentTarget.cc || '').trim();
        const targetSubject = String(currentTarget.subject || currentTarget.title || currentTarget.name || '').trim();
        subjectInput.value = targetSubject
            ? (/^Re:/i.test(targetSubject) ? targetSubject : `Re: ${targetSubject}`)
            : '';

        attachments.length = 0;
        fileInput.value = '';
        preloadResumeAttachment();
        renderAttachments();
        renderOriginalTitle();
        renderTemplateSubtitle();
        renderOriginal(getOriginalTextFromSelection());
        renderPreview();
        updateQueueStatus();
        await analyzeByScene(currentTarget);
    };

    const applySelectionFromMatch = async () => {
        readSelection();
        if (!currentSelection) {
            alert(t('songxin.queue.missing'));
            window.navigateAppRoute('match.html');
            return;
        }

        const legacyTarget = sceneParam === 'technician'
            ? currentSelection.job
            : currentSelection.person;
        replyQueue = Array.isArray(currentSelection.targets)
            ? currentSelection.targets.filter(Boolean)
            : (legacyTarget ? [legacyTarget] : []);
        if (!replyQueue.length) {
            alert(t('songxin.queue.missing'));
            window.navigateAppRoute('match.html');
            return;
        }
        await loadCurrentReply();
    };

    if (isMatchFlow) {
        applySelectionFromMatch();
    } else {
        readSelection();
        const standaloneTarget = sceneParam === 'technician'
            ? currentSelection?.job
            : currentSelection?.person;
        replyQueue = standaloneTarget ? [standaloneTarget] : [];
        if (replyQueue.length) {
            loadCurrentReply();
        } else {
            renderAttachments();
            renderOriginalTitle();
            renderTemplateSubtitle();
            renderPreview();
        }
    }

</script>
</body>
</html>
