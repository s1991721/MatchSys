
proxy_cache_path /var/cache/nginx/case_csv
    levels=1:2
    keys_zone=case_csv_cache:10m
    max_size=100m
    inactive=1h
    use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location / {
        root /var/www/home/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /matchSys/case_exhibits.csv {
        proxy_pass http://web:8000/api/case-exhibits-csv?download=1;

        proxy_cache case_csv_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 20m;
        proxy_cache_valid 404 30s;
        proxy_cache_key "$scheme$request_method$host$uri";

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header Cache-Control "public, max-age=1200" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /matchSys/ {
        alias /var/www/matchSys/;
        index login.html;
        try_files $uri $uri/ /matchSys/login.html;
    }

    location = /matchSys {
        return 301 /matchSys/;
    }

    location /api/ {
        proxy_pass http://web:8000;

        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;

    }
}
