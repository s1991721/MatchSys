
proxy_cache_path /var/cache/nginx/case_csv
    levels=1:2
    keys_zone=case_csv_cache:10m
    max_size=100m
    inactive=1h
    use_temp_path=off;

# =========================================================
# HTTPS：正式网站
# =========================================================
server {
    listen 443 ssl;

    server_name aomera.co.jp www.aomera.co.jp;

    # Let's Encrypt 证书
    ssl_certificate     /etc/letsencrypt/live/aomera.co.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aomera.co.jp/privkey.pem;

    # TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AOMERA_SSL:10m;
    ssl_session_tickets off;

    # 上传文件大小限制，可根据需要调整
    client_max_body_size 50m;

    # 不存在的官网页面使用自定义 404 页面。
    error_page 404 /404.html;

    location = /404.html {
        root /var/www/home/;
        internal;
    }

    # 搜索引擎文件使用精确匹配，避免被首页回退规则覆盖。
    location = /robots.txt {
        root /var/www/home/;
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        root /var/www/home/;
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    # -----------------------------------------------------
    # 网站首页
    # -----------------------------------------------------
    location / {
        root /var/www/home/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # -----------------------------------------------------
    # case_exhibits.csv 接口及缓存
    # -----------------------------------------------------
    location = /matchSys/case_exhibits.csv {
        proxy_pass http://web:8000/api/case-exhibits.csv;

        proxy_cache case_csv_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 20m;
        proxy_cache_valid 404 30s;
        proxy_cache_key "$scheme$request_method$host$uri";

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header Cache-Control "public, max-age=1200" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # -----------------------------------------------------
    # MatchSys 前端静态页面
    # -----------------------------------------------------
    # 公开案件页面允许搜索引擎索引，不继承下方的 noindex 响应头。
    location = /matchSys/case_exhibit.html {
        alias /var/www/matchSys/case_exhibit.html;
    }

    location /matchSys/ {
        alias /var/www/matchSys/;
        index login.html;
        try_files $uri $uri/ /matchSys/login.html;

        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 没有结尾斜线时跳转到 /matchSys/
    location = /matchSys {
        return 301 /matchSys/;
    }

    # -----------------------------------------------------
    # 后端 API
    # -----------------------------------------------------
    location /api/ {
        proxy_pass http://web:8000;

        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

}

# =========================================================
# HTTP：保留 Let's Encrypt 验证，其余请求全部跳转到 HTTPS
# =========================================================
server {
    listen 80;
    server_name aomera.co.jp www.aomera.co.jp;

    # Let's Encrypt HTTP-01 域名验证目录
    # 此配置必须一直保留，后续自动续期还会使用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

}
