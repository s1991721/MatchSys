<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>ページが見つかりません | AOMERA株式会社</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      color-scheme: light;
      font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
      color: #243b53;
      background: #f6f8fc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, #eaf1ff 0, transparent 36%),
        radial-gradient(circle at 80% 80%, #e0f2fe 0, transparent 32%),
        #f6f8fc;
    }

    main {
      width: min(620px, 100%);
      padding: 56px 36px;
      text-align: center;
      background: #fff;
      border: 1px solid #dce5f0;
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(16, 42, 67, 0.12);
    }

    .code {
      margin: 0;
      color: #2563eb;
      font-size: clamp(64px, 18vw, 112px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    h1 { margin: 20px 0 12px; font-size: clamp(22px, 5vw, 30px); }
    p { margin: 0 auto 30px; color: #627d98; line-height: 1.8; }

    a {
      display: inline-flex;
      padding: 13px 24px;
      color: #fff;
      background: #2563eb;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除されたか、URLが間違っている可能性があります。</p>
    <a href="/">トップページへ戻る</a>
  </main>
</body>
</html>
